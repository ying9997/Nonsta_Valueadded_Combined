                    {"classificationId": 51, "level1": "系统连接", "level2": "平台同步对接咨询", "content": "系统连接 - 平台同步对接咨询"},
                    {"classificationId": 52, "level1": "系统连接", "level2": "平台权限申请", "content": "系统连接 - 平台权限申请"},
                    {"classificationId": 53, "level1": "系统连接", "level2": "其他", "content": "系统连接 - 其他"}
