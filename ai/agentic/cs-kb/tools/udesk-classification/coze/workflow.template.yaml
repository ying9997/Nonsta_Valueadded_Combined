      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 99.02245580888925
        y: 101.87462952984686
      parameters:
        code: "async function main({params}: Args): Promise<Output> {\n\n    const tenant_access_token = params.tenant_access_token;\n    const table_id = 'tbl3XLmGtZUm658z';\n    const app_token = 'WLG8buT7GaNonvs2KMLc8V5CnEg';\n    const page_size = 200;\n\n    var field_names = [\n        'messages',\n    ];\n\n    const filter = {\n        \"conditions\": [\n            {\n                \"field_name\": \"sys_op_flag\",\n                \"operator\": \"is\",\n                \"value\": [\n                    \"pending\",\n                ],\n            }\n        ],\n        \"conjunction\": \"and\",\n    };\n\n    let response = await search_bitable_records(table_id, app_token, tenant_access_token, filter, field_names, page_size);\n\n\n    var items = [];\n\n    response.data.items.forEach(element => {\n        var item = {\n            \"fields\": {\n                \"messages\": get_value(element.fields, 'messages'),\n            },\n            \"record_id\": element.record_id,\n        };\n        items.push(item);\n    });\n\n    const ret = {\n        \"items\": items,\n        \"len\": items.length,\n    };\n\n    return ret;\n}\n\nasync function search_bitable_records(table_id:string, app_token:string, tenant_access_token:string, filter:any, field_names:any, page_size:number) {\n    const url = `https://open.feishu.cn/open-apis/bitable/v1/apps/${app_token}/tables/${table_id}/records/search?page_size=${page_size}`;\n\n    const headers = {\n        'Authorization': `Bearer ${tenant_access_token}`,\n        'Content-Type': 'application/json',\n    };\n\n    const body = {\n        'filter': filter,\n        'field_names': field_names,\n    };\n\n    const response = await fetch(url, {\n        method: 'POST',\n        headers: headers,\n        body: JSON.stringify(body),\n    });\n\n    const response_body = await response.json();\n\n    return response_body;\n}\n\nfunction get_value(obj, head): string {\n    if (obj.hasOwnProperty(head)) {\n        var obj_dialog = obj[head];\n    \n        if (Array.isArray(obj_dialog)) {\n            var text = '';\n\n            obj_dialog.forEach(element => {\n                if(!element.hasOwnProperty('type')) {\n                    throw new Error(\"格式错误\");\n                }\n\n                var type = element['type'];\n\n                switch(type) {\n                    case 'text':\n                        text += element['text'];\n                        break;\n                    case 'url':\n                        if(element.hasOwnProperty('link')) {\n                            var link = element['link'];\n                            // var text_link = element['text'];\n                            // text += `[${text_link}](${link})`;\n                            text += `${link}`;\n                        } else {\n                            text += element['text'];\n                        }\n                        break;\n                    case 'mention':\n                        if(element.hasOwnProperty('link')) {\n                            var link = element['link'];\n                            text += `${link}`;\n                        } else {\n                            text += element['text'];\n                        }\n                        break;\n                    default:\n                        if (element.hasOwnProperty('text')) {\n                            text += element['text'];\n                        }\n                        break;\n                }\n            \n            });\n            return text;\n        } else if(typeof(obj_dialog)=='number'){\n            return String(obj_dialog);\n        } else if(typeof(obj_dialog)=='string'){\n            return obj_dialog;\n        }\n    }\n    return '';\n}"
