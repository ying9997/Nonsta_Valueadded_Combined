                    4. **费用免责**：以实际账单为准。
                    5. **升级提示**：Pending 异常、危险品/液体、特殊货型 → 人工评估。

                    ---

                    ## 输出格式

                    只输出一个 JSON 对象，顶层仅有 `structured` 与 `analysis`。

