    - id: "163003"
      type: code
      title: build-winit-inbound-detail
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 700
        y: 200
      parameters:
        code: |-
            /**
             * 节点：为 winit.wh.inbound.getOrderDetail 组装插件批处理动作（单入库单）
             * FaaS 单文件闭环，无外部 import。
             */

            const INBOUND_DETAIL_ACTION = "winit.wh.inbound.getOrderDetail";

            async function main({ params }: { params: Record<string, unknown> }) {
              const skipApi = params.skipApi === true;
              const inboundOrderNo = String(params.inboundOrderNo ?? "").trim().toUpperCase();

              if (skipApi || !inboundOrderNo) {
                return {
                  actions: [],
                  actionPlans: [],
                  winitPluginBatchActionsCount: 0,
                  actionName: INBOUND_DETAIL_ACTION,
                  skipApi: true,
                };
              }

              const actionPlans = [{ inputToken: inboundOrderNo, queryBy: "orderNo" as const }];
              const actions = [
                {
                  action: INBOUND_DETAIL_ACTION,
                  data: JSON.stringify({ orderNo: inboundOrderNo }),
                },
              ];

              return {
                actions,
                actionPlans,
                winitPluginBatchActionsCount: actions.length,
                actionName: INBOUND_DETAIL_ACTION,
                skipApi: false,
              };
            }

            if (typeof process !== "undefined" && process.argv[1]?.includes("build-winit-inbound-detail")) {
              const params = JSON.parse(process.argv[2] || "{}");
              main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
            }
        functionID: 3a94r3qcrpp9p
        language: 5
        node_inputs:
            - name: skipApi
              input:
                value:
                    path: skipApi
                    ref_node: "163000"
            - name: inboundOrderNo
              input:
                value:
                    path: inboundOrderNo
                    ref_node: "163000"
        node_outputs:
            actionName:
                type: string
                value: null
            actionPlans:
