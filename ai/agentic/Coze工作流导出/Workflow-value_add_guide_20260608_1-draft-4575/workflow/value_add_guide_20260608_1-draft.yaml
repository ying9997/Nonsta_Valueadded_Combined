      parameters:
        concatParams:
            - name: concatResult
              input:
                type: string
                value: "# 增值服务（VAS）操作指引知识库\n\n> 来源摘要：product-team vas 文档、上架前拦截/细节拍照/增值预约送仓等客服 KB。\n\n---\n\n## 增值服务总览\n\n| 类型 | 代码 | 典型场景 |\n|------|------|----------|\n| 贴标/换标 | Labeling | FBA 标签、条码更换、合规贴标 |\n| 拍照 | Photo | 新品核实体积重量、质检留档 |\n| 测量 | Measure | 尺寸重量复核 |\n| 重新包装 | Repack | 破损换箱、加固包装 |\n| 质检 | QC | 到仓质检、异常核实 |\n| 上架前拦截 | Intercept | 快到仓拦截、货不对板扣货 |\n| 增值预约送仓 | PremiumBooking | 付费预约审核与改期 |\n\n提交入口：万邑联 → 入库单/增值服务。\n\n---\n\n## 贴标与换标\n\n| 要点 | 说明 |\n|------|------|\n| 申请时限 | 须在货物到仓前或指定节点前提交（以产品价卡为准） |\n| 标签要求 | 尺寸、粘贴位置、条码可读性符合平台规范 |\n| 材料 | 客户提供标签文件或按模板制作 |\n| 费用 | 参考价卡，以实际账单为准 |\n\n**操作步骤**：\n\n1. 万邑联进入对应入库单或增值服务入口。\n2. 选择贴标/换标服务，填写标签规格与数量。\n3. 上传标签样稿（如需要）。\n4. 提交后等待仓库处理；进行中状态以系统为准。\n\n---\n\n## 拍照与测量\n\n| 要点 | 说明 |\n|------|------|\n| 适用场景 | 新品核实体积重量、质检留档、异常核实 |\n| 拍摄要求 | 说明拍摄角度、需覆盖的面（正面/侧面/标签） |\n| 测量精度 | 按仓库标准测量工具复核 |\n\n**操作步骤**：\n\n1. 在增值服务入口选择拍照/测量。\n2. 备注需拍摄/测量的 SKU 与具体要求。\n3. 提交工单，等待仓库执行。\n4. 结果以系统记录/照片回传为准（如有）。\n\n---\n\n## 重新包装与质检\n\n| 要点 | 说明 |\n|------|------|\n| 重新包装 | 破损换箱、加固、更换包材 |\n| 质检 | 到仓抽检、异常核实 |\n| 非标增值 | 超标准范围需走非标申请流程 |\n| 驳回场景 | 材料不齐、超服务范围 → 补充材料或转人工 |\n\n**操作步骤**：\n\n1. 选择重新包装或质检服务。\n2. 描述包装要求或质检标准。\n3. 提交并跟踪工单状态。\n\n---\n\n## 上架前拦截\n\n来源：上架前拦截包裹操作增值服务 SOP。\n\n| 条件 | 对客要点 |\n|------|----------|\n| 快到仓需拦截 | 提前约 2 个工作日提交增值；备注写清拦截需求及拦截后处理方式 |\n| 条码无误但货不对板 | 用「包裹扣货」方式拦截，非条码异常增值 |\n| 整单有问题 | 通过终止入库单拦截 |\n| 拦截失败风险 | 告知可能拦截不成功，需上架后库内增值 |\n| 自验单包裹扣货 | 自验订单可做自验货扣货，仓库登记异常单处理 |\n\n---\n\n## 细节拍照增值\n\n- 用于异常核实留档，与 inbound-exception-check 上架前特殊处理分支衔接。\n- 须通过增值工单提交，写清拍照要求（角度、部位、数量）。\n\n---\n\n## 增值预约送仓\n\n| 要点 | 说明 |\n|------|------|\n| 审核时效 | 付费预约审核约 1 工作日 |\n| 改期规则 | 审批前可多次改时间不收费 |\n| 取消规则 | 审批后取消仍收增值服务费 |\n| 费率 | 因国家/整柜散货而异 |\n\n---\n\n## 增值单状态解读\n\n| 状态 | 对客原则 |\n|------|----------|\n| Pending | 已提交待处理；不承诺完成时间 |\n| InProgress | 仓库处理中；客观说明进度 |\n| Completed | 说明已完成节点 |\n| 长时间 Pending | 建议联系客服核实 |\n\n> 注：完整增值单列表 API（`/wh/vas/order/queryList`）待 Coze action 注册；当前可结合入库单 `getOrderDetail` 上下文与 KB 解读。\n\n---\n\n## 费用口径\n\n- 增值服务费用参考价卡/合同。\n- **以实际账单为准**。\n- 付费预约：审批后取消仍可能收取服务费。\n\n---\n\n## 特殊货型\n\n- 危险品/液体/特殊包装需求需人工评估（本期仅输出通用 SOP）。\n- 升级人工：VAS 单长时间 Pending、状态异常、特殊货型需求。\n\n---\n\n## 其他增值场景\n\n- **无主货找回**：通过增值工单提交找回申请。\n- **上架前自提/销毁**：须提增值工单，写清处理方式（见对应客服 KB）。\n"
            - name: arrayItemConcatChar
