                value:
                    path: actionPlans
                    ref_node: "163003"
            - name: winitPluginOutputList
              input:
                value:
                    path: outputList
                    ref_node: "163004"
        node_outputs:
            rawOrderData:
                type: object
                value: null
        settingOnError:
