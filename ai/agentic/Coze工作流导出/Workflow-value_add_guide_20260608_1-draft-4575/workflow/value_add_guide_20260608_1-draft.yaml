    - id: "163000"
      type: code
      title: validate-vas-query
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 200
        y: 310
      parameters:
        code: |-
            /**
             * 节点：validate-vas-query — 校验 topic 或 inboundOrderNo，识别查询模式
             * FaaS 单文件闭环，无外部 import。
             */

            const VAS_TYPE_ALIASES: Record<string, string> = {
              labeling: "Labeling",
              贴标: "Labeling",
              换标: "Labeling",
              repack: "Repack",
              重新包装: "Repack",
              包装: "Repack",
              photo: "Photo",
              拍照: "Photo",
              measure: "Measure",
              测量: "Measure",
              qc: "QC",
              质检: "QC",
              intercept: "Intercept",
              拦截: "Intercept",
              premium_booking: "PremiumBooking",
              增值预约: "PremiumBooking",
            };

            function str(v: unknown): string {
              return typeof v === "string" ? v.trim() : "";
            }

            function normalizeVasType(raw: unknown, topic: string): string {
              const direct = str(raw);
              if (direct) {
                const key = direct.toLowerCase();
                return VAS_TYPE_ALIASES[key] ?? direct;
              }
              const combined = topic.toLowerCase();
              for (const [alias, canonical] of Object.entries(VAS_TYPE_ALIASES)) {
                if (combined.includes(alias)) return canonical;
              }
              return "";
            }

            function normalizeInboundOrderNo(raw: unknown): string {
              const s = str(raw);
              return s ? s.toUpperCase() : "";
            }

            async function main({ params }: { params: Record<string, unknown> }) {
              const topic = str(params.topic);
              const inboundOrderNo = normalizeInboundOrderNo(params.inboundOrderNo);
              const vasType = normalizeVasType(params.vasType, topic);
              const customerIntent = str(params.customerIntent);
              const inputContext = params.inputContext ?? {};

              const hasTopic = topic.length > 0;
              const hasOrder = inboundOrderNo.length > 0;
              const validationOk = hasTopic || hasOrder;

              const queryMode = hasOrder ? (hasTopic ? "status_and_guide" : "status") : "guide";
              const skipApi = !hasOrder;

              return validationOk
                ? {
                    validationOk: true,
                    queryMode,
                    topic,
                    vasType,
                    inboundOrderNo,
                    skipApi,
                    customerIntent,
                    inputContext,
                  }
                : {
                    validationOk: false,
                    error: "至少提供 topic 或 inboundOrderNo 之一",
                    queryMode: "invalid",
                    topic,
                    vasType,
                    inboundOrderNo,
                    skipApi: true,
                    customerIntent,
                    inputContext,
                  };
            }

            if (typeof process !== "undefined" && process.argv[1]?.includes("validate-vas-query")) {
              const params = JSON.parse(process.argv[2] || "{}");
              main({ params })
                .then((r) => process.stdout.write(JSON.stringify(r)))
                .catch((e) => {
                  console.error(e);
                  process.exit(1);
                });
            }
        functionID: 3a94r2uet728e
        language: 5
