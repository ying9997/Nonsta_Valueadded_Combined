    - id: "163002"
      type: code
      title: load-vas-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 450
        y: 310
      parameters:
        code: |-
            /**
             * 节点：load-vas-kb — 按 vasType / topic 过滤 VAS SOP KB
             * FaaS 单文件闭环，无外部 import。kbVas 由 coze.config.yml textNode 注入。
             */

            const VAS_SECTION_MAP: Record<string, string> = {
              Labeling: "贴标与换标",
              Repack: "重新包装与质检",
              Photo: "拍照与测量",
              Measure: "拍照与测量",
              QC: "重新包装与质检",
              Intercept: "上架前拦截",
              PremiumBooking: "增值预约送仓",
            };

            function str(v: unknown): string {
              return typeof v === "string" ? v : "";
            }

            function extractSection(kb: string, heading: string): string {
              const pattern = new RegExp(`##\\s+${heading}[\\s\\S]*?(?=\\n##\\s+|$)`, "i");
              const m = kb.match(pattern);
              return m ? m[0].trim() : "";
            }

            function filterByTopic(kb: string, topic: string): string {
              if (!topic) return kb;
              const keywords = topic.split(/[\s,，、/]+/).filter((w) => w.length >= 2);
              if (keywords.length === 0) return kb;

              const lines = kb.split("\n");
              const hits = new Set<number>();
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].toLowerCase();
                if (keywords.some((k) => line.includes(k.toLowerCase()))) {
                  for (let j = Math.max(0, i - 2); j <= Math.min(lines.length - 1, i + 4); j++) {
                    hits.add(j);
                  }
                }
              }
              if (hits.size === 0) return kb;
              return Array.from(hits)
                .sort((a, b) => a - b)
                .map((i) => lines[i])
                .join("\n");
            }

            async function main({ params }: { params: Record<string, unknown> }) {
              const validationOk = params.validationOk === true;
              const queryMode = str(params.queryMode);
              const topic = str(params.topic);
              const vasType = str(params.vasType);
              const kbVas = str(params.kbVas);

              if (!validationOk || !kbVas) {
                return {
                  vasSopGuide: kbVas || "",
                  kbScope: "empty",
                  vasType,
                  topic,
                };
              }

              const parts: string[] = [];
              const overview = extractSection(kbVas, "增值服务总览");
              if (overview) parts.push(overview);

              if (queryMode === "status" || queryMode === "status_and_guide") {
                const statusSection = extractSection(kbVas, "增值单状态解读");
                if (statusSection) parts.push(statusSection);
              }

              const sectionHeading = VAS_SECTION_MAP[vasType];
              if (sectionHeading) {
                const section = extractSection(kbVas, sectionHeading);
                if (section) parts.push(section);
              } else if (topic) {
                parts.push(filterByTopic(kbVas, topic));
              } else {
                parts.push(kbVas);
              }

              const feeSection = extractSection(kbVas, "费用口径");
              if (feeSection && /费用|收费|价格/i.test(`${topic} ${vasType}`)) {
                parts.push(feeSection);
              }

              const vasSopGuide = parts.filter(Boolean).join("\n\n---\n\n");
              const kbScope = vasType ? `vas:${vasType}` : topic ? `topic:${topic.slice(0, 32)}` : "full";

              return {
                vasSopGuide: vasSopGuide || kbVas,
                kbScope,
                vasType,
                topic,
              };
            }

            if (typeof process !== "undefined" && process.argv[1]?.includes("load-vas-kb")) {
              const params = JSON.parse(process.argv[2] || "{}");
              main({ params })
                .then((r) => process.stdout.write(JSON.stringify(r)))
                .catch((e) => {
                  console.error(e);
                  process.exit(1);
                });
            }
        functionID: 3a94r3mmiwipg
        language: 5
        node_inputs:
            - name: validationOk
              input:
                value:
                    path: validationOk
                    ref_node: "163000"
            - name: queryMode
              input:
                value:
                    path: queryMode
                    ref_node: "163000"
            - name: topic
              input:
                value:
                    path: topic
                    ref_node: "163000"
            - name: vasType
              input:
                value:
                    path: vasType
                    ref_node: "163000"
            - name: kbVas
              input:
                value:
                    path: output
                    ref_node: "163001"
        node_outputs:
            kbScope:
                type: string
                value: null
            topic:
                type: string
                value: null
            vasSopGuide:
                type: string
                value: null
            vasType:
                type: string
                value: null
        settingOnError:
            processType: 1
            switch: false
            timeoutMs: 60000
