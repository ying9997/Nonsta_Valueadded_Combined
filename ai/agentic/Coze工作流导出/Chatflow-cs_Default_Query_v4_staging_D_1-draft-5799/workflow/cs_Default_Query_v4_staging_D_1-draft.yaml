      type: code
      title: post_get_solution
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 7740
        y: 530.1602636765061
      parameters:
        code: "// 定义输入和输出类型\ninterface Args {\n  params: {\n    debug_mode: boolean;\n    items: any[];\n    [key: string]: any;\n  };\n}\n\ninterface Output {\n  solution: string;\n  ids_mocks: string;\n  /** 所有召回项中 sys_experts 合并后去重得到的 expert_id 列表 */\n  expert_ids: string[];\n}\n\nasync function main({ params }: Args): Promise<Output> {\n\n    const debug_mode = params.debug_mode;\n    const max_solutions = params.max_solutions;\n\n    if(!params.items || params.items.length < 1) {\n        throw new Error(\"没有找到qid对应的问题\");\n    }\n\n    const items = params.items;\n\n    const expertIdSet = new Set<string>();\n    for (const row of items) {\n        if (!row.hasOwnProperty(\"fields\")) continue;\n        const f = row[\"fields\"];\n        if (!f || !f.hasOwnProperty(\"sys_experts\")) continue;\n        const str_experts = get_value(f, \"sys_experts\");\n        if (!str_experts) continue;\n        for (const part of str_experts.split(\",\")) {\n            const id = part.trim();\n            if (id) expertIdSet.add(id);\n        }\n    }\n    const expert_ids = Array.from(expertIdSet);\n\n    var solutions_md:string = '';\n    var ids_mocks = '';\n    var i:number = 1;\n    for (var item of items) {\n        if(item.hasOwnProperty('fields') && item['fields'].hasOwnProperty('sys_solution_final')) {\n            var fields = item['fields'];\n            var solution = get_value(fields, 'sys_solution_final');\n            var question = get_value(fields, 'question');\n            solutions_md += `### 相关问题${i}\\n#### 问题：${question}\\n#### 解决方案：\\n\\`\\`\\`\\n${solution}\\n\\`\\`\\`\\n\\n`;\n            if(debug_mode) {\n                var ids_mock = get_value(fields, 'question_mock');\n                if(ids_mock != '') {\n                    ids_mocks += ids_mock + ',';\n                }\n            }\n        }\n        i++;\n        if(i > max_solutions) break;\n    }\n\n    const ret = {\n        solution: solutions_md,\n        ids_mocks: ids_mocks,\n        expert_ids,\n    };\n\n    return ret;\n}\n\nfunction get_value(obj, head): string {\n    if (obj.hasOwnProperty(head)) {\n        var obj_dialog = obj[head];\n    \n        if (Array.isArray(obj_dialog)) {\n            var text = '';\n\n            obj_dialog.forEach(element => {\n\n                if(!element.hasOwnProperty('type')) {\n                    throw new Error(\"格式错误\");\n                }\n\n                var type = element['type'];\n\n                switch(type) {\n                    case 'text':\n                        text += element['text'];\n                        break;\n                    case 'url':\n                        if(element.hasOwnProperty('link')) {\n                            var link = element['link'];\n                            // var text_link = element['text'];\n                            // text += `[${text_link}](${link})`;\n                            text += `${link}`;\n                        } else {\n                            text += element['text'];\n                        }\n                        break;\n                    case 'mention':\n                        if(element.hasOwnProperty('link')) {\n                            var link = element['link'];\n                            text += `${link}`;\n                        } else {\n                            text += element['text'];\n                        }\n                        break;\n                    default:\n                        if (element.hasOwnProperty('text')) {\n                            text += element['text'];\n                        }\n                        break;\n                }\n            \n            });\n            return text;\n        } else if(typeof(obj_dialog)=='number'){\n            return String(obj_dialog);\n        } else if(typeof(obj_dialog)=='string'){\n            return obj_dialog;\n        }\n    }\n    return '';\n}\n"
        language: 5
        node_inputs:
            - name: items
              input:
                value:
                    path: response.data.items
                    ref_node: "126895"
            - name: debug_mode
              input:
                type: boolean
                value:
                    path: debug_mode
                    ref_node: "167324"
            - name: max_solutions
              input:
                type: integer
                value:
                    path: max_solutions
                    ref_node: "167324"
        node_outputs:
            errorBody:
                type: object
                properties:
                    errorCode:
                        type: string
                        value: null
                    errorMessage:
                        type: string
                        value: null
                value: null
            expert_ids:
                type: list
                items:
                    type: string
                    value: null
                value: null
            ids_mocks:
                type: string
                value: null
            isSuccess:
                type: boolean
                value: null
            solution:
                type: string
                value: null
        settingOnError:
            dataOnErr: |-
                {
                    "solution": "",
                    "ids_mocks": "",
                    "expert_ids": []
                }
            processType: 2
            retryTimes: 0
            switch: true
            timeoutMs: 60000
