        code: |4-
            async function main({ params }: Args): Promise<Output> {

                const debug_mode = params.debug_mode;
                const tenant_access_token = params.tenant_access_token;
                const max_solutions = params.max_solutions;

                var field_names = [
                    'qid',
                    'question',
                    'sys_solution_final',
                    'sys_experts'
                ];

                if(debug_mode) {
                    field_names.push('question_mock');
                }

                var qids = params.qids;

                if(qids.length > max_solutions) {
                    // Take the first max_solutions items
                    qids = qids.slice(0, max_solutions);
                }

                var conditions: Array<{
                    field_name: string;
                    operator: string;
                    value: Array<string>;
                }> = [];

                for (var qid of qids) {
                    conditions.push({
                        "field_name": "qid",
                        "operator": "is",
                        "value": [
                            qid.toString(),
                        ],
                    });
                }

                const filter = {
                    "conditions": conditions,
                    "conjunction": "or",
                };

                const table_id = 'tblLEgFazhddZOUT';
                const app_token = 'Oup1bQvrJabY24sOyphcQ0C1nic';
                const page_size = 20;

                let response = await search_bitable_records(table_id, app_token, tenant_access_token, filter, field_names, page_size);

                const ret = {
                        "response": response,
                };

                return ret;
            }


            async function search_bitable_records(table_id:string, app_token:string, tenant_access_token:string, filter:any, field_names:any, page_size:number) {
                const url = `https://open.feishu.cn/open-apis/bitable/v1/apps/${app_token}/tables/${table_id}/records/search?page_size=${page_size}`;

                const headers = {
                    'Authorization': `Bearer ${tenant_access_token}`,
                    'Content-Type': 'application/json',
                };

                const body = {
                    'filter': filter,
                    'field_names': field_names,
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body),
                });

                const response_body = await response.json();

                return response_body;
            }
        language: 5
