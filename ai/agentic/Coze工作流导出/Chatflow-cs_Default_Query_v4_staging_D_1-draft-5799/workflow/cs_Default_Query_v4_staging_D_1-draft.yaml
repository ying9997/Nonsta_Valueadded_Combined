    - id: "118553"
      type: code
      title: verify_classification
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 3571.563769685192
        y: 1175.540898235673
      parameters:
        code: |4-
            async function main({ params }: Args): Promise<Output> {
                const classification_on = params.classification_on;
                var classifications = params.classifications;
                const others = params.classification_other;
                const commands = params.classification_cmds;
                const time_start = params.time_start;
                const time_diff = new Date().getTime() - time_start;

                // modify classifications , if there is only 0 - no intention, then replace it with 18 - 基本业务和政策介绍
                // classifications is an array of integers
                if (classifications.length === 1 && classifications[0] === 0) {
                    classifications = [18];
                }

                var availables: number[] = [];
                var other_count = 0;
                var commands_ids: number[] = [];

                // 分类
                classifications.forEach(classificationId => {
                    if (classification_on[classificationId.toString()] !== undefined) {
                        availables.push(classificationId);
                    } else if (others[classificationId.toString()] !== undefined) {
                        other_count ++;
                    }
                    if (commands[classificationId.toString()] !== undefined) {
                        commands_ids.push(classificationId);
                    }
                });

                var code = -1;
                var message = "error";

                if (commands_ids.length > 0) {
                    // 只要有指令，仅仅执行指令，不执行其他任务
                    code = 3;
                    message = "has commands";
                } else if (availables.length == classifications.length) {
                    code = 0;
                    message = "all classification available";
                } else if (availables.length > 0) {
                    code = 0;
                    message = "partial available";
                } else if (other_count == classifications.length) {
                    code = 1;
                    message = "no classification informed";
                } else {
                    code = 2;
                    message = "classification informed, but not available";
                }

                const ret = {
                    'code': code,
                    'message': message,
                    'ids': availables,
                    'commands': commands_ids,
                    'time_diff': time_diff,
                    'classifications': classifications,
                };

                return ret;
            }
        language: 5
        node_inputs:
            - name: classifications
              input:
                value:
                    path: classifications
                    ref_node: "149227"
            - name: classification_on
              input:
                value:
                    path: classification_on
                    ref_node: "167324"
            - name: classification_other
              input:
                value:
                    path: classification_other
                    ref_node: "167324"
            - name: classification_cmds
              input:
                value:
                    path: classification_cmds
                    ref_node: "167324"
            - name: time_start
              input:
                value:
                    path: time_start
                    ref_node: "167324"
        node_outputs:
            classifications:
                type: list
                items:
                    type: integer
                    value: null
                value: null
            code:
                type: integer
                value: null
            commands:
                type: list
                items:
                    type: integer
                    value: null
                value: null
            ids:
                type: list
                items:
                    type: integer
                    value: null
                value: null
            message:
                type: string
                value: null
            time_diff:
                type: float
                value: null
        settingOnError:
            processType: 1
            retryTimes: 0
            switch: false
            timeoutMs: 60000
