      type: code
      title: pre_get_questions
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 5340
        y: 68.1915627687932
      parameters:
        code: |-
            async function main({ params }: Args): Promise<Output> {

                const debug_mode = params.debug_mode;
                const batch_mode = params.batch_mode;
                const classifications = params.classifications;
                const classification_map = params.classification_map;
                const tenant_access_token = params.tenant_access_token;

                var field_names = [
                    'qid',
                    'category',
                    'question',
                ];

                if(debug_mode) {
                    field_names.push('question_mock');
                }

                // 获取分类id的名称
                var category_names:string[] = [];
                for(var classificationId of classifications) {
                    let category_name:string = "其他";
                    let cid = classificationId.toString();
                    if (classification_map[cid] != undefined) {
                        category_name = classification_map[cid];
                    }
                    category_names.push(String(category_name));
                }

                const filter = {
                    "conditions": [
                        {
                            "field_name": "categories",
                            "operator": "contains",
                            "value": category_names
                        }
                    ],
                    "conjunction": "and",
                };

                if(!batch_mode) {
                    filter.conditions.push({
                        "field_name": "sys_active",
                        "operator": "is",
                        "value": [
                            "on"
                        ],
                    });
                }

                const table_id = 'tblLEgFazhddZOUT';
                const app_token = 'Oup1bQvrJabY24sOyphcQ0C1nic';
                const page_size = 500;

                var hasMore = true;
                var page_token = '';
                var records = [];
                while(hasMore) {
                    let response = await search_bitable_records(table_id, app_token, tenant_access_token, filter, field_names, page_size, page_token);
                    records = records.concat(response.data.items);
                    page_token = response.data.page_token;
                    hasMore = response.data.has_more;
                }

                const ret = {
                    "records": records,
                };

                return ret;
            }

            async function search_bitable_records(table_id:string, app_token:string, tenant_access_token:string, filter:any, field_names:any, page_size:number, page_token:string = '') {
                var url = `https://open.feishu.cn/open-apis/bitable/v1/apps/${app_token}/tables/${table_id}/records/search?page_size=${page_size}`;
                if(page_token != '') {
                    url += `&page_token=${page_token}`;
                }

                const headers = {
                    'Authorization': `Bearer ${tenant_access_token}`,
                    'Content-Type': 'application/json',
                };

                const body = {
                    'filter': filter,
                    'field_names': field_names,
                };



                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body),
                });

                const response_body = await response.json();

                return response_body;
            }
        language: 5
