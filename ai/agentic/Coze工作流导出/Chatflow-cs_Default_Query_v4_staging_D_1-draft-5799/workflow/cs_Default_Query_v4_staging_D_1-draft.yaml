        code: "async function main({ params }: Args): Promise<Output> {\n\n    const questions = params.records;\n    var questions_md = '| category | question | qid |\\n|-|-|-|\\n';\n\n    if(!questions) {\n        questions_md += '| | | |\\n';\n    } else {\n        questions.forEach(element => {\n            var fields = element['fields'];\n            if(fields) {\n                var qid = get_value(fields, 'qid');\n                var question = get_value(fields, 'question');\n                var category = get_value(fields, 'category');\n                questions_md += `| ${category} | ${question} | ${qid} |\\n`;\n            }\n        });\n    }\n\n    const ret = {\n        \"questions_md\": questions_md,\n    };\n\n    return ret;\n}\n\nfunction get_value(obj, head): string {\n    if (obj.hasOwnProperty(head)) {\n        var obj_dialog = obj[head];\n    \n        if (Array.isArray(obj_dialog)) {\n            var text = '';\n            obj_dialog.forEach(element => {\n                if (element.hasOwnProperty('text')) {\n                    text += element['text'];\n                }\n            });\n            return text;\n        } else if(typeof(obj_dialog)=='number'){\n            return String(obj_dialog);\n        } else if(typeof(obj_dialog)=='string'){\n            return obj_dialog;\n        }\n    }\n    return '';\n}\n"
