    - id: "182546"
      type: code
      title: debug_mode_command_code
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 11546.89314751187
        y: 1490.4106094103204
      parameters:
        code: "import json\n\nasync def main(args: Args) -> Output:\n\n    params = args.params\n    classifications = params['classifications']\n    contents = params['contents']\n    reason = params['reason']\n    question = params['question']\n    ids = params['ids']\n    _debug_msg = params['_debug_msg']\n    \n    # 安全解析 JSON，处理解析失败的情况\n    try:\n        debug = json.loads(_debug_msg) if _debug_msg else {}\n    except (json.JSONDecodeError, TypeError, ValueError):\n        debug = {}\n    \n    # 安全获取 tags，处理为空的情况\n    tags = debug.get('tags', []) if isinstance(debug, dict) else []\n    if not tags or not isinstance(tags, list):\n        tags = []\n\n    debug_msg_template =  \"\"\"\n    #### [debug_mode = on]\n    msg: classification hit，handle command\n\n    ##### query_rewrite\n    ```\n    question: {{question}}\n    ids: {{ids}}\n    ```\n\n    ##### classification\n    ```\n    result: {{classifications}}，{{contents}}\n    reason: {{reason}}\n    ```\n\n    ##### tags\n    ```\n    tags: {{tags}}\n    ```\n    \"\"\"\n    \n    debug_msg = debug_msg_template.replace(\"{{question}}\", question)\n    debug_msg = debug_msg.replace(\"{{ids}}\", str(ids))\n    debug_msg = debug_msg.replace(\"{{classifications}}\", str(classifications))\n    debug_msg = debug_msg.replace(\"{{contents}}\", str(contents))\n    debug_msg = debug_msg.replace(\"{{reason}}\", str(reason))\n    debug_msg = debug_msg.replace(\"{{tags}}\", str(tags))\n\n    # 构建输出对象\n    ret: Output = {\n        \"debug_msg\": debug_msg\n    }\n    return ret"
        language: 3
        node_inputs:
            - name: classifications
              input:
                value:
                    path: classifications
                    ref_node: "149227"
            - name: contents
              input:
                value:
                    path: contents
                    ref_node: "149227"
            - name: reason
              input:
                value:
                    path: reason
                    ref_node: "149227"
            - name: question
              input:
                type: string
                value:
                    path: question
                    ref_node: "175233"
            - name: ids
              input:
                type: string
                value:
                    path: ids
                    ref_node: "175233"
            - name: _debug_msg
              input:
                type: string
                value:
                    path: _debug_msg
                    source: global_variable_user
        node_outputs:
            debug_msg:
                type: string
                value: null
        settingOnError:
            processType: 1
            retryTimes: 0
            switch: false
            timeoutMs: 60000
