            /** OMS 写入 invoice_info 前的体积控制；与 handle_oms_data 配套 */
            const OMS_MAX_PKG_LIST = 10;
            const OMS_MAX_MERCHANDISE_DETAILS_PER_PKG = 10;
            const OMS_MAX_BATCH_VOS_PER_SKU = 20;
            const OMS_MAX_MERCHANDISE_INFO_LIST = 10;
            const OMS_MAX_ITEM_LIST = 10;
            const OMS_MAX_INBOUND_MER_LIST = 15;
            const OMS_MAX_CARGO_QUANTITY_VO_LIST = 10;
            const OMS_MAX_WO_AUX_LIST = 10;
            const OMS_MAX_TRACKING_NO_ENTRIES = 10;
            const OMS_INVOICE_INFO_MAX_CHARS = 200000;
            /** 超过上限时用 JSON 包装短预览，避免整段 partial 再 stringify 后体积反增 */
            const OMS_INVOICE_PREVIEW_MAX_CHARS = 20000;

            const OMS_WO_TRUNCATABLE_ARRAY_KEYS = [
                'slaList',
                'revenueVoList',
                'shippingVoList',
                'packageSpecList',
                'vasRevenueVoList',
                'orderPriorityList',
                'containerList',
                'freezeFeeList',
            ] as const;

            function handle_oms_data(data: string) {
                if (!data) {
                    return data;
                }

                let oms_data: any;
                try {
                    oms_data = JSON.parse(data);
                } catch {
                    return data;
                }

                const sliceKeep = (list: any[], limit: number): any[] => {
                    if (!Array.isArray(list) || list.length <= limit) {
                        return list;
                    }
                    return list.slice(0, limit);
                };

                const handleWiOrder = (order: any) => {
                    const notes: string[] = [];
                    let mdTruncPkgs = 0;
                    let batchTruncSkuRows = 0;

                    if (order && Array.isArray(order.pkgList)) {
                        const orig = order.pkgList.length;
                        order.pkgList = sliceKeep(order.pkgList, OMS_MAX_PKG_LIST);
                        if (orig > OMS_MAX_PKG_LIST) {
                            notes.push(`pkgList kept ${OMS_MAX_PKG_LIST}/${orig}`);
                        }
                        for (const pkg of order.pkgList) {
                            if (!pkg || !Array.isArray(pkg.merchandiseDetailsList)) {
                                continue;
                            }
                            const mdOrig = pkg.merchandiseDetailsList.length;
                            pkg.merchandiseDetailsList = sliceKeep(
                                pkg.merchandiseDetailsList,
                                OMS_MAX_MERCHANDISE_DETAILS_PER_PKG
                            );
                            if (mdOrig > OMS_MAX_MERCHANDISE_DETAILS_PER_PKG) {
                                mdTruncPkgs++;
                            }
                            for (const md of pkg.merchandiseDetailsList) {
                                if (!md || !Array.isArray(md.actualMerchandiseBatchVos)) {
                                    continue;
                                }
                                const bOrig = md.actualMerchandiseBatchVos.length;
                                if (bOrig > OMS_MAX_BATCH_VOS_PER_SKU) {
                                    md.actualMerchandiseBatchVos = md.actualMerchandiseBatchVos.slice(
                                        0,
                                        OMS_MAX_BATCH_VOS_PER_SKU
                                    );
                                    md._batchVosTruncated = true;
                                    md._batchVosOriginalCount = bOrig;
                                    batchTruncSkuRows++;
                                }
                            }
                        }
                    }

                    if (order && Array.isArray(order.inboundMerList)) {
                        const orig = order.inboundMerList.length;
                        order.inboundMerList = sliceKeep(order.inboundMerList, OMS_MAX_INBOUND_MER_LIST);
                        if (orig > OMS_MAX_INBOUND_MER_LIST) {
                            notes.push(`inboundMerList kept ${OMS_MAX_INBOUND_MER_LIST}/${orig}`);
                        }
                    }
                    if (order && Array.isArray(order.cargoQuantityVoList)) {
                        const orig = order.cargoQuantityVoList.length;
                        order.cargoQuantityVoList = sliceKeep(
                            order.cargoQuantityVoList,
                            OMS_MAX_CARGO_QUANTITY_VO_LIST
                        );
                        if (orig > OMS_MAX_CARGO_QUANTITY_VO_LIST) {
                            notes.push(`cargoQuantityVoList kept ${OMS_MAX_CARGO_QUANTITY_VO_LIST}/${orig}`);
                        }
                    }

                    if (mdTruncPkgs > 0) {
                        notes.push(
                            `merchandiseDetailsList truncated in ${mdTruncPkgs} package(s) (max ${OMS_MAX_MERCHANDISE_DETAILS_PER_PKG} SKU rows each)`
                        );
                    }
                    if (batchTruncSkuRows > 0) {
                        notes.push(
                            `actualMerchandiseBatchVos truncated for ${batchTruncSkuRows} SKU row(s) (max ${OMS_MAX_BATCH_VOS_PER_SKU} lines each)`
                        );
                    }
                    if (notes.length > 0) {
                        order._invoiceInfoTruncation = notes.join('; ');
                    }
                    return order;
                };

                const handleWoOrder = (order: any) => {
                    const notes: string[] = [];

                    if (order && Array.isArray(order.merchandiseInfoList)) {
                        const orig = order.merchandiseInfoList.length;
                        order.merchandiseInfoList = sliceKeep(
                            order.merchandiseInfoList,
                            OMS_MAX_MERCHANDISE_INFO_LIST
                        );
                        if (orig > OMS_MAX_MERCHANDISE_INFO_LIST) {
                            notes.push(`merchandiseInfoList kept ${OMS_MAX_MERCHANDISE_INFO_LIST}/${orig}`);
                        }
                        let itemListTruncMerchRows = 0;
                        order.merchandiseInfoList = order.merchandiseInfoList.map((merch: any) => {
                            if (merch && Array.isArray(merch.itemList)) {
                                const ilOrig = merch.itemList.length;
                                merch.itemList = sliceKeep(merch.itemList, OMS_MAX_ITEM_LIST);
                                if (ilOrig > OMS_MAX_ITEM_LIST) {
                                    itemListTruncMerchRows++;
                                }
                            }
                            return merch;
                        });
                        if (itemListTruncMerchRows > 0) {
                            notes.push(
                                `itemList truncated for ${itemListTruncMerchRows} merchandise row(s) (max ${OMS_MAX_ITEM_LIST} each)`
                            );
                        }
                    }

                    if (order && Array.isArray(order.serviceList) && order.serviceList.length > 0) {
                        order.serviceList = [];
                        notes.push('serviceList cleared');
                    }

                    if (order && Array.isArray(order.trackingNo)) {
                        const orig = order.trackingNo.length;
                        order.trackingNo = sliceKeep(order.trackingNo, OMS_MAX_TRACKING_NO_ENTRIES);
                        if (orig > OMS_MAX_TRACKING_NO_ENTRIES) {
                            notes.push(`trackingNo kept ${OMS_MAX_TRACKING_NO_ENTRIES}/${orig}`);
                        }
                    }

                    for (const key of OMS_WO_TRUNCATABLE_ARRAY_KEYS) {
                        if (!order || !Array.isArray(order[key])) {
                            continue;
                        }
                        const orig = order[key].length;
                        order[key] = sliceKeep(order[key], OMS_MAX_WO_AUX_LIST);
                        if (orig > OMS_MAX_WO_AUX_LIST) {
                            notes.push(`${key} kept ${OMS_MAX_WO_AUX_LIST}/${orig}`);
                        }
                    }

                    if (notes.length > 0) {
                        order._invoiceInfoTruncation = notes.join('; ');
                    }
                    return order;
                };

                const handleSingleOrder = (order: any) => {
                    if (!order || typeof order !== 'object') {
                        return order;
                    }
                    const orderNo = typeof order.orderNo === 'string' ? order.orderNo : '';
                    if (orderNo.startsWith('WI')) {
                        return handleWiOrder(order);
                    }
                    if (orderNo.startsWith('WO')) {
                        return handleWoOrder(order);
                    }
                    return order;
                };

                const processValue = (value: any) => {
                    if (Array.isArray(value)) {
                        return value.map(handleSingleOrder);
                    }
                    return handleSingleOrder(value);
                };

                let processed: any = oms_data;

                if (Array.isArray(oms_data)) {
                    processed = processValue(oms_data);
                } else if (oms_data && typeof oms_data === 'object') {
                    processed = {};
                    for (const key in oms_data) {
                        if (Object.prototype.hasOwnProperty.call(oms_data, key)) {
                            processed[key] = processValue(oms_data[key]);
                        }
                    }
                }

                let out: string;
                try {
                    out = JSON.stringify(processed);
                } catch {
                    return data;
                }

                if (out.length > OMS_INVOICE_INFO_MAX_CHARS) {
                    const origLen = out.length;
                    const previewBudget = Math.min(
                        OMS_INVOICE_PREVIEW_MAX_CHARS,
                        Math.max(0, OMS_INVOICE_INFO_MAX_CHARS - 500)
                    );
                    const partial = out.slice(0, previewBudget) + (previewBudget < origLen ? '…' : '');
                    out = JSON.stringify({
                        _invoiceInfoTruncated: true,
                        _originalCharLength: origLen,
                        _cap: OMS_INVOICE_INFO_MAX_CHARS,
                        _partialPayload: partial,
                    });
                }

                return out;
            }
