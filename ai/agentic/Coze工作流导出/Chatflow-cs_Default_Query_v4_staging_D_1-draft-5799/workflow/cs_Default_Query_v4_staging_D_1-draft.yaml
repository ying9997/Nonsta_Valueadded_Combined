    - id: "175233"
      type: code
      title: post_query_rewrite
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 1844.5595500177023
        y: 1369.541898235673
      parameters:
        code: |
            /**
             * Parses query-rewrite LLM output (see default_query/prompts/query_write.md):
             * - Body starts with `question:` (may span multiple lines).
             * - Last line is `ids:` comma-separated codes, or `ids: NONE`.
             *
             * Params (first match wins):
             * - query_rewrite_output
             * - output
             * - text
             */

            interface Args {
                params: Record<string, unknown>;
            }

            interface Output {
                question: string;
                ids: string;
            }

            function asRawString(v: unknown): string {
                if (v === undefined || v === null) return "";
                return String(v);
            }

            function stripOuterMarkdownFence(s: string): string {
                const t = s.trim();
                if (!t.startsWith("```")) return t;
                let body = t.replace(/^```[a-zA-Z0-9]*\s*\r?\n?/, "");
                const end = body.lastIndexOf("```");
                if (end !== -1) body = body.slice(0, end);
                return body.trim();
            }

            /**
             * Returns `ids` as a single comma-separated string (empty when NONE or blank).
             */
            function parseQueryRewriteOutput(raw: string): { question: string; ids: string } {
                const text = stripOuterMarkdownFence(asRawString(raw)).trim();
                if (!text) {
                    return { question: "", ids: "" };
                }

                const lines = text.split(/\r?\n/);
                let idsLineIndex = -1;
                for (let i = lines.length - 1; i >= 0; i--) {
                    if (/^\s*ids:\s*/i.test(lines[i])) {
                        idsLineIndex = i;
                        break;
                    }
                }

                if (idsLineIndex === -1) {
                    const first = lines[0];
                    if (/^\s*question:\s*/i.test(first)) {
                        const q = lines
                            .map((ln, idx) =>
                                idx === 0 ? ln.replace(/^\s*question:\s*/i, "") : ln
                            )
                            .join("\n")
                            .trim();
                        return { question: q, ids: "" };
                    }
                    return { question: text, ids: "" };
                }

                const idsRaw = lines[idsLineIndex].replace(/^\s*ids:\s*/i, "").trim();
                const ids =
                    idsRaw === "NONE" ||
                    idsRaw === '""' ||
                    idsRaw === "''" ||
                    idsRaw === ""
                        ? ""
                        : idsRaw;

                const bodyLines = lines.slice(0, idsLineIndex);
                if (bodyLines.length === 0) {
                    return { question: "", ids };
                }

                const first = bodyLines[0];
                if (/^\s*question:\s*/i.test(first)) {
                    const head = first.replace(/^\s*question:\s*/i, "");
                    const question = [head, ...bodyLines.slice(1)].join("\n").trim();
                    return { question, ids };
                }

                return { question: bodyLines.join("\n").trim(), ids };
            }

            async function main({ params }: Args): Promise<Output> {
                const raw =
                    params.query_rewrite_output ?? params.output ?? params.text ?? "";
                const { question, ids } = parseQueryRewriteOutput(asRawString(raw));
                return {
                    question,
                    ids,
                };
            }
        language: 5
