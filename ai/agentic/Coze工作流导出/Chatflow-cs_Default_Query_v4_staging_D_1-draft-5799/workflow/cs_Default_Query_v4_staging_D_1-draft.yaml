                value:
                    path: question
                    ref_node: "175233"
            - name: ids
              input:
                type: string
                value:
                    path: ids
                    ref_node: "175233"
        node_outputs:
            debug_msg:
                type: string
                value: null
        settingOnError:
            processType: 1
            retryTimes: 0
            switch: false
            timeoutMs: 60000
