            const FMS_REGIONS: FmsRegion[] = ["CN", "US", "EU", "AU"];

            function fmsEnv(name: string, fallback: string): string {
              if (typeof process !== "undefined" && process.env?.[name]) {
                return String(process.env[name]).trim();
              }
              return fallback;
            }

            function fmsPlaceholder(region: FmsRegion, name: "CLIENT_KEY" | "CLIENT_SECRET" | "USER_KEY" | "USER_SECRET"): string {
              const placeholders: Record<FmsRegion, Record<"CLIENT_KEY" | "CLIENT_SECRET" | "USER_KEY" | "USER_SECRET", string>> = {
                CN: {
                  CLIENT_KEY: "505bfd297b89d31b83",
                  CLIENT_SECRET: "e91bf652f505f4ec6b497215bab77801",
                  USER_KEY: "fms_cn_coze",
                  USER_SECRET: "7635c0b3a3f1eeb4df1c7503ea3ef9a7",
                },
                US: {
                  CLIENT_KEY: "b5fbd17e63202625fa",
                  CLIENT_SECRET: "1a4d5cc0e953d6ad70b8bd5a26bde605",
                  USER_KEY: "fms_us_coze",
                  USER_SECRET: "4e91bec023a95a3f44916a832d3b66dd",
                },
                AU: {
                  CLIENT_KEY: "c2033ff6c613f3d774",
                  CLIENT_SECRET: "944bcb5b703fbc843e4c8c59b83a40ff",
                  USER_KEY: "fms_au_coze",
                  USER_SECRET: "6fbcd95b4503f15a8574966e588defa1",
                },
                EU: {
                  CLIENT_KEY: "bb0de9bd7a3e6db90e",
                  CLIENT_SECRET: "7555b7791a9cbbadee824e4a4373d28e",
                  USER_KEY: "fms_eu_coze",
                  USER_SECRET: "caaf26d92f9850e33bd7a69631db7c24",
