    - id: "163001"
      type: text
      title: kb-api-boundary
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: "用于处理多个字符串类型变量的格式"
      position:
        x: 480
        y: 707
      parameters:
        concatParams:
            - name: concatResult
              input:
                type: string
                value: "# API 主路径层\n\n本文件定义 `value-add-order-status` 的 OpenAPI 查询边界。它只解释接口用途和字段映射，不替代接口返回事实。\n\n---\n\n## P0 主路径\n\n| Action | 用途 | 必要性 |\n|---|---|---|\n| `wh.va.order.basicInfo` | 查询增值单基本信息、主状态、业务单、VASC、时间、控制信息和原子概览 | P0 必查 |\n| `wh.va.order.getVasList` | 查询原子执行状态、完成数量、退回/部分完成原因、已提交属性/附件事实 | P0 默认查询，`includeAtoms=false` 可跳过 |\n\n### businessNo 定位分支\n\n`basicInfo` 的业务参数只稳定支持 `orderNo`；`getVasList` 的业务参数可带 `orderNo`、`businessNo`、`orderEntry`。因此只有 `businessNo` 时不能直接调用 `basicInfo` 得出主状态，应先走定位分支：\n\n1. 使用 `businessNo` 调用原子列表查询，作为候选增值单定位。\n2. 若返回 0 张候选，输出 `clarify_vas_order_no` 或 `api_failed`，要求补充增值单号。\n3. 若返回 1 张候选，从候选原子的 `orderNo` 解析 `resolvedVasOrderNo`，再调用 `basicInfo` 查询主状态。\n4. 若返回多张候选，输出 `needsClarification=true` 和 `clarificationFields=[\"vasOrderNo\"]`，不合并多张增值单状态。\n\n---\n\n## P0 可用事实字段\n\n| 来源 | 字段 | 解释边界 |\n|---|---|---|\n| basicInfo | `orderNo` | 增值单号；对外 `vasOrderNo` 映射到 API `data.orderNo` |\n| basicInfo | `status` / `statusDesc` | 主状态编码和描述；未知 `status` 不自行翻译 |\n| basicInfo | `orderDate` / `estimateCompleteTime` / `actualCompleteTime` | 下单、预计完成、实际完成时间；预计时间不是 SLA 承诺 |\n| basicInfo | `cancelReason` / `failReason` | 取消或失败原因；按接口事实原样解释 |\n| basicInfo | `businessOrder.businessNo` | 关联业务单号；可用于展示关联单，不代表 `businessNo` 查询唯一 |\n| basicInfo | `businessOrder.eventCode` / `unusualName` / `unusualObjectName` | 关联异常信息；只解释这张已提交增值单关联事实 |\n| basicInfo | `vasc.productCode` / `productName` / `isAudit` / `isNeedConfirm` | VASC 产品、审核和确认信息；不能反推推荐链 |\n| basicInfo | `vaAtoms[]` | 原子概览；详细进度以 getVasList 为准 |\n| basicInfo | `control.vasObjectType` | 增值对象类型；不能反推服务项配置全量 |\n| basicInfo | `vaOrderGoods[]` | 已提交增值单货物事实；只作订单事实展示 |\n| getVasList | `list[].serviceCode` / `serviceName` | 原子服务编码和名称 |\n| getVasList | `list[].status` / `statusDesc` | 原子执行状态；未知 `status` 不自行翻译 |\n| getVasList | `list[].partCompleteReason` / `returnReason` | 部分完成或退回原因 |\n| getVasList | `list[].completeTime` | 原子完成时间 |\n| getVasList | `list[].orderCount` / `handleCount` | 下单数量与实际完成数量 |\n| getVasList | `list[].vaAtomAttrs` / `vaAtomFiles` / `vaAtomResults` | 已提交增值单上的属性、附件、执行结果事实；不能作为事前配置全量来源 |\n\n---\n\n## 字段映射\n\n| 对外字段 | API 字段 | 规则 |\n|---|---|---|\n| `inputs.vasOrderNo` | `data.orderNo` | build 节点必须映射为 `orderNo` |\n| `inputs.businessNo` | `getVasList.data.businessNo` | 仅辅助定位候选增值单；不唯一时追问 `vasOrderNo` |\n| `inputs.orderEntry` | `getVasList.data.orderEntry` | 定位分支需要时透传；缺失不应阻断 `vasOrderNo` 主路径 |\n| `inputs.parentGoodsId` | `getSubGoods.data.parentId` | 仅 P2 子货物增强使用 |\n\n---\n\n## businessNo 分支\n\n- 若 `businessNo` 能唯一定位增值单，可继续主路径。\n- 若定位到多张增值单，输出 `needsClarification=true` 和 `clarificationFields=[\"vasOrderNo\"]`。\n- 不把多张增值单状态合并成一个结论。\n- 若无法通过 API 稳定支持 `businessNo` 定位，v1 降级为要求客户补充增值单号。\n- `businessNo` 只作为辅助定位和关联展示字段；查询主键仍以 `vasOrderNo` / API `orderNo` 为准。\n- 当只有 `businessNo` 且没有唯一候选时，`analysis` 只能说明“需要补充增值单号”，不能猜测最近一张或状态最严重的一张。\n- 通过 `businessNo` 定位到的原子列表本身不等于主单状态；只有拿到唯一 `orderNo` 并成功查询 `basicInfo` 后，才能输出 `status_found`。\n\n---\n\n## 调用边界\n\n- 专家调用 JSON 顶层不接收 `data`。\n- 专家调用 JSON 顶层不接收 `action`。\n- OpenAPI 插件入参 `data` 来自 build 节点的 `winitRequestData`。\n- `action` 来自 `coze.config.yml` 字面量或 build 节点输出的 `winitOpenapiAction`。\n"
            - name: arrayItemConcatChar
              input:
                type: string
                value: "，"
            - name: allArrayItemConcatChars
              input:
                type: list
                items:
                    type: object
                    value: null
                value:
                    - isDefault: true
                      label: "换行"
                      value: "\n"
                    - isDefault: true
                      label: "制表符"
                      value: "\t"
                    - isDefault: true
                      label: "句号"
                      value: "。"
                    - isDefault: true
                      label: "逗号"
                      value: "，"
                    - isDefault: true
                      label: "分号"
                      value: "；"
                    - isDefault: true
                      label: "空格"
                      value: " "
        method: concat
        node_outputs:
            output:
                type: string
                value: null
    - id: "163002"
      type: text
      title: kb-status-semantics
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: "用于处理多个字符串类型变量的格式"
      position:
        x: 480
        y: 947
      parameters:
        concatParams:
            - name: concatResult
              input:
                type: string
                value: "# 状态语义层\n\n本文件为增值单主状态、原子进度、退回/部分完成原因和下一步动作提供解释规则。\n\n---\n\n## riskFlags\n\n| 标记 | 触发依据 | 说明 |\n|---|---|---|\n| `returned` | 主单或原子存在退回原因，如 `returnReason` 非空 | 需提示按退回原因补充或转人工 |\n| `partially_completed` | 存在部分完成原因，或完成数量小于请求数量且状态为部分完成 | 说明只完成了部分服务 |\n| `needs_customer_confirmation` | 接口事实显示待确认、缺材料、退回需补充或原子控制信息要求客户动作 | 可提示客户补材料 |\n| `pending_over_48h` | 有创建时间且距当前超过 48 小时，状态仍非完成/取消 | 只作保守提醒，不承诺 SLA |\n| `atom_progress_unavailable` | 主状态成功但 `getVasList` 失败 | 原子进度不可用，不影响主状态 |\n| `api_optional_failed` | P2 增强接口失败但 P0 成功 | 增强信息不可用，不影响主状态 |\n\n---\n\n## 主状态解释原则\n\n接口事实只稳定提供 `status` / `statusDesc` 字段；当前知识切片没有完整、可冻结的增值单主状态枚举。因此：\n\n- 优先使用 API 返回的 `statusDesc` 作为对客状态描述。\n- 若 `statusDesc` 为空，只输出原始 `status`，并说明当前没有可确认的状态中文含义。\n- 不自行把未知 `status` 翻译成“处理中/已完成/已取消”等。\n- 若接口同时返回取消或失败原因，应把 `cancelReason` / `failReason` 作为事实说明，不用状态码猜原因。\n- 若 P2 费用、预估费用或货物增强接口失败，写入 `optionalFetchFailures`；不得改变 P0 主状态语义。\n\n### 保守语义桶\n\n以下只作为归类提示，必须在 API `statusDesc` 或其它接口事实与语义一致时才可使用；不得用它翻译未知编码。\n\n| semanticBucket | 可使用条件 | 对客说明 |\n|---|---|---|\n| `in_progress` | `statusDesc` 明确表示处理中、待处理、作业中或等价含义 | 当前增值单仍在处理流程中 |\n| `completed` | `statusDesc` 明确表示已完成或全部完成 | 当前增值单已完成 |\n| `partially_completed` | `statusDesc` 或原子事实明确表示部分完成，或存在 `partCompleteReason` | 当前只完成了部分服务，需说明部分完成原因 |\n| `returned` | 存在 `returnReason`，或 `statusDesc` 明确表示退回 | 当前存在退回原因，需按原因补充或转人工 |\n| `cancelled` | `statusDesc` 明确表示取消，或 `cancelReason` 非空 | 当前增值单已取消或取消原因已返回 |\n| `failed` | `statusDesc` 明确表示失败，或 `failReason` 非空 | 当前增值单失败，需按失败原因说明 |\n| `unknown` | 缺少 `statusDesc` 且状态码未在已知事实中解释 | 只展示原始状态码，不做翻译 |\n\n---\n\n## 原子状态解释原则\n\n- 原子状态同样优先使用 `statusDesc`。\n- `partCompleteReason` 非空时写入 `riskFlags=[\"partially_completed\"]`，并在 `atomProgress` 中保留原文原因。\n- `returnReason` 非空时写入 `riskFlags=[\"returned\"]`，并在 `nextAction` 中优先考虑 `provide_materials` 或 `contact_support`。\n- `orderCount` 与 `handleCount` 同时存在且 `handleCount < orderCount` 时，只能说明完成数量少于下单数量；是否部分完成仍以状态描述或原因字段为准。\n- `completeTime` 只能说明已完成节点时间；不能承诺其它原子预计完成时间。\n\n---\n\n## nextAction\n\n| 枚举 | 含义 | 对客口径 |\n|---|---|---|\n| `wait` | 继续等待处理 | 当前未见客户动作要求 |\n| `provide_materials` | 需补材料或按退回原因处理 | 按接口返回退回/补充原因说明 |\n| `contact_support` | 需要人工核实 | 接口失败、状态冲突或费用争议 |\n| `clarify_vas_order_no` | 需补增值单号 | businessNo 不唯一或无法定位 |\n| `not_supported_pre_order_quote` | 未下单前报价不支持 | 明确本专家只查已提交增值单 |\n\n---\n\n## 解释限制\n\n- 不承诺完成时间。\n- 不把接口失败解释为业务状态。\n- 不从状态反推 VASC 推荐或服务配置。\n- 退回/部分完成原因只按接口事实解释，不扩展内部原因。\n- 未知 `status` 不自行翻译；状态描述缺失时保留原始编码并标注证据不足。\n- 已提交订单里的 `vaAtomAttrs` 字段形态可作为订单事实解释；不能当作服务配置专家的完整字段证据。\n"
            - name: arrayItemConcatChar
              input:
                type: string
                value: "，"
            - name: allArrayItemConcatChars
              input:
                type: list
                items:
                    type: object
                    value: null
                value:
                    - isDefault: true
                      label: "换行"
                      value: "\n"
                    - isDefault: true
