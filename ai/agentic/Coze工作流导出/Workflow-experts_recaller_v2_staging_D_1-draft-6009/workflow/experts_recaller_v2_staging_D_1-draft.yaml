                        ### replan_reason (from judge or system; optional)

                        {{replan_reason}}

                        ### planner_brief (hints for the next plan; optional)

                        {{planner_brief}}

                        ## Output

                        Output **plain text only**: full task list per **Rules** (`[x]`/`[ ]`), one line per task. No JSON; no outer code fence.
