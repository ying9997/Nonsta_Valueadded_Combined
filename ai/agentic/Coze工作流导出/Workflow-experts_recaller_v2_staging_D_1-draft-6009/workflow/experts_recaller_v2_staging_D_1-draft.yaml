                type: object
                value: null
            task_count:
                type: integer
                value: null
            tasks:
                type: list
                items:
                    type: object
                    value: null
                value: null
            valid:
                type: boolean
                value: null
        settingOnError:
            processType: 1
            switch: false
            timeoutMs: 60000
        vefaasFunctionID: 3adj7awcomrz5
