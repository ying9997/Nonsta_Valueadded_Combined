                value:
                    path: chainContext
                    ref_node: "163202"
            - name: sessionHandoff
              input:
                value:
                    path: sessionHandoff
                    ref_node: "163202"
        node_outputs:
            handoff_log_json:
                type: string
                value: null
            handoff_log_markdown:
                type: string
                value: null
            truncated:
                type: boolean
                value: null
            truncation_note:
                type: string
                value: null
        settingOnError:
            processType: 1
            switch: false
            timeoutMs: 60000
        vefaasFunctionID: 3adj7azefjiut
    - id: "199002"
      type: code
      title: merge-handoff-for-summary
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 4660
        y: -160
      parameters:
        code: |
            /**
             * 汇聚 finalize-queue-handoff（正常路径）和 finalize-planner-skip（bypass 路径）
             * 的 handoff_log_markdown，取非空值传给 queue-user-facing-summary。
             * 两条路径在运行时只有一条执行，另一条输出为 null/空。
             *
             * Coze：整文件粘贴；常量前缀 MERGE_ 避免与其它节点合并冲突。
             */

            async function main({
                params,
            }: {
                params: {
                    /** finalize-queue-handoff 的输出（正常路径有值，bypass 路径为空） */
                    from_queue?: unknown;
                    /** finalize-planner-skip 的输出（bypass 路径有值，正常路径为空） */
                    from_bypass?: unknown;
                };
            }): Promise<{
                handoff_log_markdown: string;
            }> {
                const fromQueue =
                    params.from_queue !== null && params.from_queue !== undefined
                        ? String(params.from_queue).trim()
                        : "";
                const fromBypass =
                    params.from_bypass !== null && params.from_bypass !== undefined
                        ? String(params.from_bypass).trim()
                        : "";
                const handoff_log_markdown = fromQueue || fromBypass;
                return { handoff_log_markdown };
            }
        functionID: 3abmw6tzed4go
        language: 5
        node_inputs:
            - name: from_queue
              input:
                value:
                    path: handoff_log_markdown
                    ref_node: "198835"
            - name: from_bypass
              input:
                value:
                    path: handoff_log_markdown
                    ref_node: "199001"
        node_outputs:
            handoff_log_markdown:
                type: string
                value: null
        settingOnError:
            processType: 1
            switch: false
            timeoutMs: 30000
        vefaasFunctionID: 3adj7azefjw8x
