    - id: "163001"
      type: code
      title: resolve-vasc-context
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 400
        y: 310
      parameters:
        code: |-
            /**
             * 节点：resolve-vasc-context — 输出统一 VASC 与服务意图上下文。
             * FaaS 单文件闭环，无外部 import。
             */

            function asRecord(value: unknown): Record<string, unknown> {
              return value && typeof value === "object" && !Array.isArray(value)
                ? (value as Record<string, unknown>)
                : {};
            }

            function asText(value: unknown): string {
              return typeof value === "string" ? value.trim() : "";
            }

            async function main({ params }: { params: Record<string, unknown> }) {
              const validationResult = asRecord(params.validationResult);
              const rawServiceConfigInput = asRecord(params.rawServiceConfigInput);
              const validationOutputPath = asText(validationResult.outputPath);
              const outputPath = validationOutputPath || (validationResult.ok === false ? "missing_vasc" : "");
              return {
                serviceConfigInput: {
                  ...rawServiceConfigInput,
                  ...(outputPath ? { outputPath } : {}),
                  missingConfirmations: validationResult.missingConfirmations ?? rawServiceConfigInput.missingConfirmations ?? [],
                  handoffExpertId: validationResult.handoffExpertId ?? rawServiceConfigInput.handoffExpertId ?? "",
                },
                validationResult,
                inputContext: asRecord(params.inputContext),
              };
            }

            if (typeof process !== "undefined" && process.argv[1]?.includes("resolve-vasc-context")) {
              const params = JSON.parse(process.argv[2] || "{}");
              main({ params })
                .then((r) => process.stdout.write(JSON.stringify(r)))
                .catch((e) => {
                  console.error(e instanceof Error ? e.message : "resolve-vasc-context failed");
                  process.exit(1);
                });
            }
        functionID: 3abs38q5w17z4
        language: 5
        node_inputs:
            - name: rawServiceConfigInput
              input:
                value:
                    path: rawServiceConfigInput
                    ref_node: "163000"
            - name: validationResult
              input:
                value:
                    path: validationResult
                    ref_node: "163000"
            - name: inputContext
              input:
                value:
                    path: inputContext
                    ref_node: "163000"
        node_outputs:
            inputContext:
                type: object
                value: null
            serviceConfigInput:
                type: object
                value: null
            validationResult:
                type: object
                value: null
        settingOnError:
            processType: 1
            switch: false
            timeoutMs: 60000
        vefaasFunctionID: 3absm2q2folel
    - id: "163002"
      type: text
      title: kb-vasc-context
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: "用于处理多个字符串类型变量的格式"
      position:
        x: 400
        y: 480
      parameters:
        concatParams:
            - name: concatResult
              input:
                type: string
                value: "# VASC 上下文层\n\n本文件为 `value-add-service-config` 提供 VASC 与服务意图的上下文解释。它不推荐 VASC，只解释已知 VASC 的配置入口。\n\n---\n\n## 使用规则\n\n- `vascCode` 是配置解释主键；命中下表后才能读取服务项编排。\n- 未命中 `vascCode` 时输出 `missing_vasc` 或 `conditional`，不得按方向概念猜测服务项。\n- `activeStatus=inactive` 的 VASC 只作历史或映射线索，不承诺页面可下单。\n- `OSF` / 库内 / 出库相关 VASC 可作为关联事实解释，但入库异常链路中不得跨阶段套用。\n\n---\n\n## 已知 VASC 编码映射\n\n当前运行时切片覆盖 18 个 VASC 产品，来自专项知识库中 normalized 映射的裁剪结果。\n\n| vascCode | vascName | PSCG | activeStatus | 服务方向 | 典型意图 | 对象层级 | 配置解释重点 |\n|---|---|---|---|---|---|---|---|\n| `VASC202407012141008` | 新单上架（WINIT创建入库单） | OW01 海外仓入库 | active | 新单上架 | 由 WINIT 创建或承接新入库单后上架 | `package` / `product` | 更换包装、商品条码、包裹条码、新单信息流 |\n| `VASC202407031456553` | 库内轻加工 | OSF632 库内增值 | active | 库内轻加工 | 库内包装、贴标、错装处理、拆分组合 | `product` / `item` | 库内服务项较多，入库异常链路只能作关联解释 |\n| `VASC202407031503503` | 原单上架 | OW01 海外仓入库 | active | 原单上架 | 异常货物继续关联原入库单上架 | `package` / `product` | 更换包装、商品条码、第三方条码、包裹条码 |\n| `VASC202407031507376` | 入库商品拍照 | OW01 海外仓入库 | inactive | 入库拍照 | 上架前商品开箱拍照辨识 | `product` | inactive，只作历史线索；不承诺可下单 |\n| `VASC202407031511413` | 库内商品拍照 | OSF632 库内增值 | active | 库内拍照 | 库内商品外观或开箱拍照 | `product` | 库内拍照事实解释，不能泛化为入库拍照入口 |\n| `VASC202407161056217` | 新单上架（客户创建入库单） | OW01 海外仓入库 | active | 新单上架 | 客户创建新入库单后关联上架 | `package` / `product` | 新入库单、包裹条码、商品条码 |\n| `VASC202409121753076` | 上架前销毁 | OW01 海外仓入库 | active | 销毁 | 上架前按包裹或商品销毁 | `package` / `product` | 销毁对象必须匹配，字段证据当前不足 |\n| `VASC202411192229072` | 库内非标增值（免审核） | OSF632 库内增值 | active | 库内非标 | 库内免审核非标动作 | `product` / `item` | 仅解释库内非标服务项，不作为入库标准 VASC |\n| `VASC202411192240522` | 上架前自提 | OW01 海外仓入库 | active | 自提 | 上架前客户自提，区分是否需打托 | `package` / `pallet` | 自提对象、是否打托、提货准备信息 |\n| `VASC202411192246131` | 入库非标增值（特批） | OW01 海外仓入库 | active | 入库非标 | 串仓调拨或其他入库特殊服务需求 | `package` / `order` | 需特批或人工确认，不替代标准 VASC |\n| `VASC202411192250069` | 库内非标增值（特批） | OSF632 库内增值 | active | 库内非标 | 库内特批非标动作 | `product` / `item` | 库内非标边界说明，不跨阶段推荐 |\n| `VASC202411192253186` | 出库非标增值（特批） | OSF8 海外仓出库 | active | 出库非标 | 出库其他服务需求 | `order` | 非入库链路；入库异常专家不得主动转入 |\n| `VASC202411271721537` | 入库非标拍照或提供视频 | OW01 海外仓入库 | active | 拍照/视频 | 上架前拍照、视频、少件调查 | `package` / `product` / `item` | 通常是调查/确认动作，不默认关闭异常 |\n| `VASC202412111831129` | 新单上架（客户提供预报单） | OW01 海外仓入库 | active | 新单上架 | 客户提供无箱单预报单后上架 | `order` / `product` | 预报单信息、无箱单场景限制 |\n| `VASC202412111836315` | 库内非标增值（需审核） | OSF632 库内增值 | active | 库内非标 | 需审核的库内非标动作 | `product` / `item` | 需要审核，不能承诺直接可选 |\n| `VASC202504171850278` | 库内销毁 | OSF6 库内 | active | 库内销毁 | 库内异常商品销毁 | `product` | 库内销毁，不等同上架前销毁 |\n| `VASC202504251617529` | 原单上架（直接上架） | OW01 海外仓入库 | active | 直接上架 | 原单路径直接上架 | `package` / `product` | 直接上架、覆盖包裹标签、补包裹条码 |\n| `VASC202505282347101` | 新单上架（直接上架） | OW01 海外仓入库 | active | 直接上架 | 新单路径直接上架 | `package` / `product` | 直接上架，服务项编排较窄 |\n\n---\n\n## 方向概念速查\n\n| VASC 方向 | 典型意图 | 对象层级 | 配置解释重点 |\n|---|---|---|---|\n| 原单上架 | 原单上架 | `package` / `product` | 原入库单关联、条码修复、异常货物继续上架 |\n| 新单上架 | 新单上架 | `package` / `product` | 新入库单号、重新关联、条码修复 |\n| 直接上架 | 原单/新单直接上架 | `package` / `product` | 只能在映射和规则支持时解释，不能因客户口述直接判断 |\n| 销毁处理 | 销毁 | `package` / `product` / `item` | 销毁对象、数量、客户授权 |\n| 拍照 / 视频 / 调查 | 拍照、视频、调查 | `package` / `product` / `item` | 多为调查或确认动作，后续仍可能需要继续处理 |\n| 自提 / 调拨 / 非标 | 自提 / 调拨 / 非标 | `order` / `package` / `pallet` | 仓库限制、审批、人工确认 |\n\n---\n\n## handoff 使用规则\n\n- `handoffToServiceConfig.vascCode` 是主键，优先级高于直接入参。\n- `customerActionNormalized` 可作为 `serviceIntent` 默认值。\n- `limitations` 写入 `configBoundaryNotes`，不自动等同于系统禁选。\n- `objectLevel` 决定服务项解释口径：包裹级不承诺商品级配置，商品级不承诺整单配置。\n- 当 handoff 只提供 `vascName` 未提供 `vascCode` 时，只能做方向级解释；不得输出确定服务项编排。\n"
            - name: arrayItemConcatChar
              input:
                type: string
                value: "，"
            - name: allArrayItemConcatChars
              input:
                type: list
                items:
                    type: object
                    value: null
                value:
                    - isDefault: true
                      label: "换行"
                      value: "\n"
                    - isDefault: true
                      label: "制表符"
                      value: "\t"
                    - isDefault: true
                      label: "句号"
                      value: "。"
                    - isDefault: true
                      label: "逗号"
                      value: "，"
                    - isDefault: true
                      label: "分号"
                      value: "；"
                    - isDefault: true
                      label: "空格"
                      value: " "
        method: concat
        node_outputs:
            output:
                type: string
                value: null
