    - id: "163007"
      type: code
      title: load-field-evidence
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 1240
        y: 310
      parameters:
        code: |-
            /**
             * 节点：load-field-evidence — 加载字段/附件/模板证据 KB。
             * FaaS 单文件闭环，无外部 import。
             */

            function asText(value: unknown): string {
              return typeof value === "string" ? value.trim() : "";
            }

            function asRecord(value: unknown): Record<string, unknown> {
              return value && typeof value === "object" && !Array.isArray(value)
                ? (value as Record<string, unknown>)
                : {};
            }

            async function main({ params }: { params: Record<string, unknown> }) {
              return {
                fieldEvidenceKb: asText(params.kbFieldEvidence),
                serviceOrchestrationKb: asText(params.serviceOrchestrationKb),
                vascContextKb: asText(params.vascContextKb),
                serviceConfigInput: asRecord(params.serviceConfigInput),
                validationResult: asRecord(params.validationResult),
              };
            }

            if (typeof process !== "undefined" && process.argv[1]?.includes("load-field-evidence")) {
              const params = JSON.parse(process.argv[2] || "{}");
              main({ params })
                .then((r) => process.stdout.write(JSON.stringify(r)))
                .catch((e) => {
                  console.error(e instanceof Error ? e.message : "load-field-evidence failed");
                  process.exit(1);
                });
            }
        functionID: 3abrs9vrknt3o
        language: 5
        node_inputs:
            - name: serviceConfigInput
              input:
                value:
                    path: serviceConfigInput
                    ref_node: "163005"
            - name: validationResult
              input:
                value:
                    path: validationResult
                    ref_node: "163005"
            - name: vascContextKb
              input:
                value:
                    path: vascContextKb
                    ref_node: "163005"
            - name: serviceOrchestrationKb
              input:
                value:
                    path: serviceOrchestrationKb
                    ref_node: "163005"
            - name: kbFieldEvidence
              input:
                value:
                    path: output
                    ref_node: "163006"
        node_outputs:
            fieldEvidenceKb:
                type: string
                value: null
            serviceConfigInput:
                type: object
                value: null
            serviceOrchestrationKb:
                type: string
                value: null
            validationResult:
                type: object
                value: null
            vascContextKb:
                type: string
                value: null
