    - id: "163008"
      type: text
      title: kb-atom-selectability
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: "用于处理多个字符串类型变量的格式"
      position:
        x: 1240
        y: 480
      parameters:
        concatParams:
            - name: concatResult
              input:
                type: string
                value: "# 原子可选性层\n\n本文件为 `apply-atom-selectability-rules` 提供原子可选、禁选、互斥、置灰、隐藏和前置校验的规则摘要。来源口径为 `atom-selectability-rules.md` 的裁剪结果。\n\n---\n\n## 规则类型\n\n| ruleType | 含义 | 输出位置 |\n|---|---|---|\n| `hidden` | 前端隐藏或后端不展示 | `blockedServiceItems` / `blockingReasons` |\n| `disabled` | 前端置灰或后端禁用 | `blockedServiceItems` / `blockingReasons` |\n| `mutex` | 原子互斥 | `mutexGroups` |\n| `dependency` | 依赖其他字段或原子 | `missingConfirmations` |\n| `submit_validation` | 提交前校验 | `blockingReasons` |\n| `field_visibility` | 字段显隐 | `fieldEvidenceSummary` |\n| `option_filter` | 选项过滤 | `blockedClaims` |\n\n---\n\n## 条件字段示例\n\n| 条件字段 | 说明 |\n|---|---|\n| `shelveWay` | 原单上架 / 新单上架方式 |\n| `isEventVa` | 是否异常发起增值 |\n| `bookingStatus` | 预约或单据状态 |\n| `objectLevel` | 包裹/商品/整单对象层级 |\n| `warehouseSupport` | 仓库能力或白名单 |\n\n---\n\n## confirmed inbound 规则行\n\n以下为运行时裁剪规则，只保留入库域高价值、可解释的 confirmed 行。`confidence=conflict_fixed` 的行只能作为谨慎拦截说明，不能当作普通 confirmed 规则泛化。\n\n| ruleId | atomCode | atomName | ruleType | effectType | condition | result | messageOrCode | confidence | boundary |\n|---|---|---|---|---|---|---|---|---|---|\n| `INB-HID-001` | `OW01V1593` | 采集 A+ 包裹条码 | `hidden` | `backend_is_show_false` | 无条件隐藏 | 不展示、不可选 |  | `confirmed` | 只能解释该原子不可见，不反推 VASC 不可下单 |\n| `INB-HID-002` | `OW01V1794` | LPN 直接上架 | `hidden` | `backend_is_show_false` | 无条件隐藏 | 不展示、不可选 |  | `confirmed` | 只能解释该原子不可见 |\n| `INB-DIS-001` | `OW01V1708` | 不贴标直接上架 | `disabled` | `backend_is_disable` | 非异常单入口，即 `isEventVa=false` | 禁用 |  | `confirmed` | 缺少 `isEventVa` 时写入待确认 |\n| `INB-DIS-002` | `OW01V1708` | 不贴标直接上架 | `disabled` | `backend_is_disable` | `shelveWay` 不是 `USE_ORIGIN_INBOUND_ORDER` 且不是 `INBOUND_ORDER_OF_CUSTOMER` | 禁用 |  | `confirmed` | 缺少 `shelveWay` 时不得强判 |\n| `INB-FLD-001` | `OW01V1708` | 不贴标直接上架 | `field_visibility` | `frontend_disabled` | `shelveWay=USE_ORIGIN_INBOUND_ORDER` | 属性 `VAS_ATTR_REL_WRN` 自动填入入库单号并置灰 |  | `confirmed` | 只说明字段行为，不输出完整字段清单 |\n| `INB-DIS-004` | `OW01V1560` | 补贴包裹条码 | `disabled` | `backend_is_disable` | `shelveWay=USE_NEW_INBOUND_ORDER` | 禁用，不可手动勾选 | 当 VASC 的上架方式是新单上架，默认置灰补贴包裹条码，不能单独选择该原子 | `confirmed` | 可输出 blockedServiceItems |\n| `INB-AUTO-001` | `OW01V1560` | 补贴包裹条码 | `auto_select` | `auto_selected` | 新单上架且已选 `OW01V1558` / `OW01V1559` / `OW01V1572` 任一 | 系统自动勾选 `OW01V1560`，并设置 `LABEL_SIZE=10X6`、`LABEL_TYPE=PACKGE_SERNO`；`OTHER_LABEL` 非必填 |  | `confirmed` | 只在已知新单上架和已选商品级条码原子时使用 |\n| `INB-DIS-005` | `OW01V1558` | 补贴原 SKU 条码（入库） | `disabled` | `backend_is_disable` | 无 `MERCHANDISE` 类型商品 | 禁用 |  | `confirmed` | 缺少商品类型事实时待确认 |\n| `INB-DIS-006` | `OW01V1558` | 补贴原 SKU 条码（入库） | `disabled` | `backend_is_disable` | 任意商品条码 `goodsBarcode` 为空 | 禁用 |  | `confirmed` | 缺少条码事实时待确认 |\n| `INB-DIS-007` | `OW01V1558` | 补贴原 SKU 条码（入库） | `disabled` | `backend_is_disable` | 异常来源 + `USE_ORIGIN_INBOUND_ORDER` + 商品不在原入库单中 | 禁用 |  | `confirmed` | 需要同时具备异常来源、上架方式和原单商品关系 |\n| `INB-FLD-002` | `OW01V1558` | 补贴原 SKU 条码（入库） | `field_visibility` | `field_visibility_changed` | `LABEL_TYPE=THIRD_PARTY_SKU_SERNO_ITEM_SERNO` 且 `GEN_WAY!=CUSTOMER` | 显示 `OTHER_LABEL` 上传标签对应关系 |  | `confirmed` | 只说明显隐，不承诺附件模板完整性 |\n| `INB-FLD-003` | `OW01V1558` | 补贴原 SKU 条码（入库） | `field_visibility` | `field_visibility_changed` | `LABEL_TYPE=THIRD_PARTY_SKU_SERNO_ITEM_SERNO` 且 `GEN_WAY=CUSTOMER` | 显示 `LABEL_FILE_MERCHANDISE_REL_FILE` |  | `confirmed` | 只说明显隐 |\n| `INB-FLD-005` | `OW01V1559` | 更换新 SKU 条码（入库） | `field_visibility` | `field_visibility_changed` | `GEN_WAY!=CUSTOMER` | 显示 `OTHER_LABEL` 上传标签对应关系 |  | `confirmed` | 无后端禁用条件证据，不得额外禁选 |\n| `INB-DIS-008` | `OW01V1572` | 关联第三方条码 | `disabled` | `backend_is_disable` | 无 `MERCHANDISE` 类型商品 | 禁用 |  | `confirmed` | 缺少商品类型事实时待确认 |\n| `INB-DIS-009` | `OW01V1572` | 关联第三方条码 | `disabled` | `backend_is_disable` | 非异常单入口 | 禁用 | 该原子仅支持异常单入口下发 | `confirmed` | 可解释为非异常入口不可选 |\n| `INB-DIS-010` | `OW01V1572` | 关联第三方条码 | `disabled` | `backend_is_disable` | 异常单入口但任意商品第三方条码为空 | 禁用 | 异常信息未登记第三方商品条码，无法选择该增值 | `confirmed` | 需要异常信息里的第三方条码事实 |\n| `INB-DIS-011` | `OW01V1736` | 补贴包裹覆盖标签 | `disabled` | `backend_is_disable` | 下单列表入口且无 `PACKAGE` 类型商品 | 禁用 |  | `confirmed` | 缺少入口和商品类型事实时待确认 |\n| `INB-DIS-012` | `OW01V1736` | 补贴包裹覆盖标签 | `disabled` | `backend_is_disable` | 下单列表入口且任意包裹等级不是 `A` 或 `A+` | 禁用 |  | `confirmed` | 需要包裹等级事实 |\n| `INB-DIS-014` | `OW01V1745` | 采集 A+ 包裹序列号 | `disabled` | `backend_is_disable` | 无 vaOrder 场景：入库单号为空 | 禁用 + 隐藏 |  | `confirmed` | 缺入库单号时可作为 blockingMissing |\n| `INB-DIS-015` | `OW01V1745` | 采集 A+ 包裹序列号 | `disabled` | `backend_is_disable` | 无 vaOrder 场景：入库单下无 A+ 包裹 | 禁用 + 隐藏 |  | `confirmed` | 需要 A+ 包裹事实 |\n| `INB-DIS-016` | `OW01V1745` | 采集 A+ 包裹序列号 | `disabled` | `backend_is_disable` | 无 vaOrder 场景：入库单下无 SI 管理的 BOX 产品 | 禁用 + 隐藏 |  | `confirmed` | 需要 SI 管理与 BOX 商品事实 |\n| `INB-VAL-001` | `OW01V1561` | 更换商品包装（入库） | `submit_validation` | `submit_validation_error` | 入库单/异常单选了 `OW01V1561` 但未同时选 `OW01V1558` 或 `OW01V1559` | 提交时报错拦截 | `_02040501458` | `conflict_fixed` | 仅作提交校验风险说明；编码已按勘误修正 |\n| `INB-FLD-008` | `OW01V1561` | 更换商品包装（入库） | `dependency` | `frontend_disabled` | 勾选时未同时选 `OW01V1558` 或 `OW01V1559` | 前端提示；提交强校验另见 `INB-VAL-001` | 增值选项选择更换商品包装时，必须选择商品级-补贴原SKU条码或者商品级-更换新SKU条码 | `confirmed` | 前端提示不等于后端禁止勾选 |\n| `INB-FLD-009` | `OW01V1573` | 补贴其他商品类标签或文件 | `field_visibility` | `field_visibility_changed` | `ALL_GOODS_SAME_LABEL=Y` | 仅显示统一标签文件 |  | `confirmed` | 只说明显隐 |\n| `INB-FLD-010` | `OW01V1573` | 补贴其他商品类标签或文件 | `field_visibility` | `field_visibility_changed` | `ALL_GOODS_SAME_LABEL=N` | 显示逐条标签文件 + 对应关系文件 |  | `confirmed` | 只说明显隐 |\n| `INB-OPT-001` | `OW01V1573,OSF6V1574` | 补贴其他商品类标签 | `option_filter` | `field_option_filtered` | 商品只有 1 个 | `ALL_GOODS_SAME_LABEL` 排除 `N`，只能选统一 `Y` |  | `confirmed` | 只影响选项，不反推是否必填 |\n| `INB-OPT-002` | `*` | `PACKAGING_MODE` 属性 | `option_filter` | `field_option_filtered` | 非“全单品 SKU + 异常单入口” | 排除 `PACKAGING_CUSTOMER` |  | `confirmed` | 需要商品形态与入口事实 |\n| `INB-OPT-003` | `*` | `DEAL_WITH_WAY` 属性 | `option_filter` | `field_option_filtered` | `vaSource=REVA` | 排除 `storage` |  | `confirmed` | 仅在已知 `vaSource` 时使用 |\n\n---\n\n## 输出规则\n\n- 命中 confirmed 规则时，可输出 `selectableServiceItems` 或 `blockedServiceItems`。\n- 规则条件缺失时，写入 `missingConfirmations.informationalMissing` 或 `blockingMissing`。\n- 规则来源冲突时，写入 `blockedClaims`，不做强判断。\n- 动态配置、业务白名单或后台返回配置影响的规则，必须在 `configBoundaryNotes` 中说明可能变化。\n"
            - name: arrayItemConcatChar
              input:
                type: string
                value: "，"
            - name: allArrayItemConcatChars
              input:
                type: list
                items:
                    type: object
                    value: null
                value:
                    - isDefault: true
                      label: "换行"
                      value: "\n"
                    - isDefault: true
                      label: "制表符"
                      value: "\t"
                    - isDefault: true
                      label: "句号"
                      value: "。"
                    - isDefault: true
                      label: "逗号"
                      value: "，"
                    - isDefault: true
                      label: "分号"
                      value: "；"
                    - isDefault: true
                      label: "空格"
                      value: " "
        method: concat
        node_outputs:
            output:
                type: string
                value: null
    - id: "163009"
      type: code
      title: apply-atom-selectability-rules
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 1520
        y: 310
      parameters:
        code: |-
            /**
             * 节点：apply-atom-selectability-rules — 输出已覆盖规则和待确认规则证据。
             * FaaS 单文件闭环，无外部 import。
             */

            function asText(value: unknown): string {
              return typeof value === "string" ? value.trim() : "";
            }

            function asRecord(value: unknown): Record<string, unknown> {
              return value && typeof value === "object" && !Array.isArray(value)
                ? (value as Record<string, unknown>)
                : {};
            }

            function parseRuleRows(kb: string): Array<Record<string, string>> {
              return kb
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter((line) => line.startsWith("|") && !/^\|\s*:?-{3,}/.test(line))
                .map((line) => line.split("|").map((part) => part.trim()).filter(Boolean))
                .filter((cells) => cells.length >= 10 && cells[0] !== "ruleId")
                .map((cells) => ({
                  ruleId: cells[0] || "",
                  atomCode: cells[1] || "",
                  atomName: cells[2] || "",
                  ruleType: cells[3] || "",
                  effectType: cells[4] || "",
                  condition: cells[5] || "",
                  result: cells[6] || "",
                  messageOrCode: cells[7] || "",
                  confidence: cells[8] || "",
                  boundary: cells[9] || "",
                }));
            }

            function parseServiceRows(kb: string, vascCode: string): Array<Record<string, unknown>> {
              return kb
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter((line) => line.startsWith("|") && !/^\|\s*:?-{3,}/.test(line))
                .map((line) => line.split("|").slice(1, -1).map((part) => part.trim().replace(/^`|`$/g, "")))
                .filter((cells) => cells.length >= 9 && cells[0] !== "vascCode" && cells[0] === vascCode)
                .map((cells) => ({
                  vascCode: cells[0] || "",
                  vascName: cells[1] || "",
                  activeStatus: cells[2] || "",
                  seq: Number(cells[3]) || 0,
                  serviceItemCode: cells[4] || "",
                  serviceItemName: cells[5] || "",
                  atomCode: cells[4] || "",
                  atomName: cells[5] || "",
                  requiredInVasc: cells[6] || "",
                  mutexGroup: cells[7] || "",
                  attrSpecStatus: cells[8] || "",
                }))
                .sort((a, b) => Number(a.seq) - Number(b.seq));
            }

            function hasScenarioFacts(scenarioConditions: Record<string, unknown>): boolean {
              return Object.keys(scenarioConditions).some((key) => {
                const value = scenarioConditions[key];
                return value !== undefined && value !== null && value !== "" && !(Array.isArray(value) && value.length === 0);
              });
            }

            function asStringArray(value: unknown): string[] {
              return Array.isArray(value) ? value.map(asText).filter(Boolean) : [];
            }

            function selectedAtoms(scenarioConditions: Record<string, unknown>): Set<string> {
              return new Set(asStringArray(scenarioConditions.selectedAtoms));
            }

            function buildScenarioBlockedItems(
              serviceItems: Array<Record<string, unknown>>,
              scenarioConditions: Record<string, unknown>
            ): Array<Record<string, unknown>> {
              const selected = selectedAtoms(scenarioConditions);
              const atomCode = asText(scenarioConditions.atomCode);
              const blocked: Array<Record<string, unknown>> = [];
              const serviceByCode = new Map(serviceItems.map((item) => [asText(item.atomCode), item]));

              if ((atomCode === "OW01V1561" || selected.has("OW01V1561")) && !selected.has("OW01V1558") && !selected.has("OW01V1559")) {
                const item = serviceByCode.get("OW01V1561") ?? {};
                blocked.push({
                  ...item,
                  atomCode: "OW01V1561",
                  atomName: asText(item.atomName) || "入库-更换商品包装",
                  ruleType: "dependency",
                  condition: "selected OW01V1561 without OW01V1558 or OW01V1559",
                  reason: "选择更换商品包装时，需要同时选择商品级补贴原 SKU 条码 OW01V1558 或更换新 SKU 条码 OW01V1559。",
                  boundary: "frontend提示和提交校验",
                });
              }

              const asksOw01v1572 = atomCode === "OW01V1572" || selected.has("OW01V1572");
              const isEventVa = scenarioConditions.isEventVa === true || scenarioConditions.isEventVa === "true";
              const thirdPartyBarcodeMissing =
                scenarioConditions.thirdPartyBarcodeMissing === true || scenarioConditions.thirdPartyBarcodeMissing === "true";
              if (asksOw01v1572 && (!isEventVa || thirdPartyBarcodeMissing)) {
                const item = serviceByCode.get("OW01V1572") ?? {};
                blocked.push({
                  ...item,
                  atomCode: "OW01V1572",
                  atomName: asText(item.atomName) || "入库-第三方商品条码关联",
                  ruleType: "disabled",
                  condition: !isEventVa ? "not event value-add entry" : "third party barcode missing",
                  reason: !isEventVa
                    ? "第三方商品条码关联仅支持异常单入口下发，非异常单入口不可选。"
                    : "异常单入口缺少第三方商品条码时，第三方商品条码关联不可选。",
                  boundary: "confirmed",
                });
              }

              return blocked;
            }

            async function main({ params }: { params: Record<string, unknown> }) {
              const serviceConfigInput = asRecord(params.serviceConfigInput);
              const vascCode = asText(serviceConfigInput.vascCode);
              const presetOutputPath = asText(serviceConfigInput.outputPath);
              const serviceIntent = asText(serviceConfigInput.serviceIntent);
              const scenarioConditions = asRecord(serviceConfigInput.scenarioConditions);
              const serviceOrchestrationKb = asText(params.serviceOrchestrationKb);
              const atomSelectabilityKb = asText(params.kbAtomSelectability);
              const fieldEvidenceKb = asText(params.fieldEvidenceKb);
              if (presetOutputPath === "escalated") {
                return {
                  configEvidence: {
                    outputPath: "escalated",
                    vasc: { vascCode, vascName: asText(serviceConfigInput.vascName), activeStatus: "" },
                    serviceIntent,
                    selectableServiceItems: [],
                    serviceItems: [],
                    blockedServiceItems: [],
                    mutexGroups: [],
                    blockingReasons: ["已提交增值单状态查询不属于服务配置解释范围"],
                    pendingRuleEvidence: [],
                    fieldEvidenceStatus: "not_applicable",
                    fieldEvidenceSummary: { status: "not_applicable", reason: "submitted_value_add_order_status_query" },
                    blockedClaims: ["不查询或解释已提交增值单状态"],
                    missingConfirmations: [],
                    handoffExpertId: asText(serviceConfigInput.handoffExpertId) || "value-add-order-status",
                    scenarioConditions,
                  },
                  serviceConfigInput,
                };
              }
              const ruleRows = parseRuleRows(atomSelectabilityKb);
              const serviceItems = parseServiceRows(serviceOrchestrationKb, vascCode);
              const activeStatus = asText(serviceItems[0]?.activeStatus);
              const isInactiveVasc = activeStatus.toLowerCase() === "inactive";
              const blockedServiceItems = buildScenarioBlockedItems(serviceItems, scenarioConditions);
              const mutexGroups = ruleRows
                .filter((row) => row.ruleType === "mutex")
                .map((row) => ({
                  atomCode: row.atomCode,
                  atomName: row.atomName,
                  condition: row.condition,
                  reason: row.messageOrCode || row.result,
                }));
              const hasParsedRules = ruleRows.length > 0;
              const needsScenarioEvidence =
                hasParsedRules && !hasScenarioFacts(scenarioConditions) && ruleRows.some((row) => row.condition !== "无条件隐藏");
              const pendingRuleEvidence =
                !hasParsedRules || needsScenarioEvidence
                  ? [
                      {
                        field: !hasParsedRules ? "atomSelectability" : "scenarioConditions",
                        reason: !hasParsedRules
                          ? "当前离线规则未覆盖或依赖动态配置，不能给确定可选/禁选结论"
                          : "已加载原子规则，但缺少场景条件，不能强判可选、禁选或互斥",
                        source: !hasParsedRules ? "knowledge_gap" : "ask_customer_or_upstream",
                      },
                    ]
                  : [];

              return {
                configEvidence: {
                  outputPath:
                    presetOutputPath === "missing_vasc"
                      ? "missing_vasc"
                      : presetOutputPath === "conditional"
                        ? "conditional"
                        : isInactiveVasc ? "inactive_vasc" : "",
                  vasc: {
                    vascCode,
                    vascName: asText(serviceConfigInput.vascName) || asText(serviceItems[0]?.vascName),
                    activeStatus,
                  },
                  serviceIntent,
                  selectableServiceItems:
                    isInactiveVasc
                      ? []
                      : serviceItems,
                  serviceItems:
                    isInactiveVasc
                      ? []
                      : serviceItems,
                  blockedServiceItems,
                  mutexGroups,
                  blockingReasons: [],
                  pendingRuleEvidence,
                  fieldEvidenceStatus: "partial_field_evidence",
                  fieldEvidenceSummary: { status: "partial_field_evidence" },
                  blockedClaims: [
                    "不承诺完整字段、附件、模板、枚举和页面可下单状态",
                    ...(isInactiveVasc ? ["activeStatus=inactive，只作历史线索，不承诺当前可下单"] : []),
                  ],
                  missingConfirmations: serviceConfigInput.missingConfirmations ?? [],
                  handoffExpertId: asText(serviceConfigInput.handoffExpertId),
                  scenarioConditions,
                  evidenceSources: {
                    serviceOrchestration: serviceOrchestrationKb.length > 0 ? "loaded" : "missing",
                    atomSelectability: atomSelectabilityKb.length > 0 ? "loaded" : "missing",
                    fieldEvidence: fieldEvidenceKb.length > 0 ? "loaded" : "missing",
                  },
                },
                serviceConfigInput,
              };
            }

            if (typeof process !== "undefined" && process.argv[1]?.includes("apply-atom-selectability-rules")) {
              const params = JSON.parse(process.argv[2] || "{}");
              main({ params })
                .then((r) => process.stdout.write(JSON.stringify(r)))
                .catch((e) => {
                  console.error(e instanceof Error ? e.message : "apply-atom-selectability-rules failed");
                  process.exit(1);
                });
            }
        functionID: 3abrtmeli4jg5
        language: 5
        node_inputs:
            - name: serviceConfigInput
              input:
                value:
                    path: serviceConfigInput
                    ref_node: "163007"
            - name: serviceOrchestrationKb
              input:
                value:
                    path: serviceOrchestrationKb
                    ref_node: "163007"
            - name: fieldEvidenceKb
              input:
                value:
                    path: fieldEvidenceKb
                    ref_node: "163007"
            - name: kbAtomSelectability
              input:
                value:
                    path: output
                    ref_node: "163008"
        node_outputs:
            configEvidence:
                type: object
                value: null
            serviceConfigInput:
                type: object
                value: null
        settingOnError:
            processType: 1
            switch: false
            timeoutMs: 60000
        vefaasFunctionID: 3absm2q2fq4w2
    - id: "163010"
      type: code
      title: compose-conditional-config
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 1800
        y: 310
      parameters:
        code: |-
            /**
             * 节点：compose-conditional-config — 缺证据时输出条件性配置结论。
             * FaaS 单文件闭环，无外部 import。
             */

            function asRecord(value: unknown): Record<string, unknown> {
