    - id: "163005"
      type: code
      title: load-service-orchestration
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: "编写代码，处理输入变量来生成返回值"
      version: v2
      position:
        x: 960
        y: 310
      parameters:
        code: |-
            /**
             * 节点：load-service-orchestration — 加载服务项/原子编排 KB。
             * FaaS 单文件闭环，无外部 import。
             */

            function asText(value: unknown): string {
              return typeof value === "string" ? value.trim() : "";
            }

            function asRecord(value: unknown): Record<string, unknown> {
              return value && typeof value === "object" && !Array.isArray(value)
                ? (value as Record<string, unknown>)
                : {};
            }

            async function main({ params }: { params: Record<string, unknown> }) {
              return {
                serviceOrchestrationKb: asText(params.kbServiceOrchestration),
                vascContextKb: asText(params.vascContextKb),
                serviceConfigInput: asRecord(params.serviceConfigInput),
                validationResult: asRecord(params.validationResult),
              };
            }

            if (typeof process !== "undefined" && process.argv[1]?.includes("load-service-orchestration")) {
              const params = JSON.parse(process.argv[2] || "{}");
              main({ params })
                .then((r) => process.stdout.write(JSON.stringify(r)))
                .catch((e) => {
                  console.error(e instanceof Error ? e.message : "load-service-orchestration failed");
                  process.exit(1);
                });
            }
        functionID: 3abru2wp6hhec
        language: 5
        node_inputs:
            - name: serviceConfigInput
              input:
                value:
                    path: serviceConfigInput
                    ref_node: "163003"
            - name: validationResult
              input:
                value:
                    path: validationResult
                    ref_node: "163003"
            - name: vascContextKb
              input:
                value:
                    path: vascContextKb
                    ref_node: "163003"
            - name: kbServiceOrchestration
              input:
                value:
                    path: output
                    ref_node: "163004"
