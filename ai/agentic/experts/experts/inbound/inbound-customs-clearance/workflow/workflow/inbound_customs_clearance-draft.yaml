    - id: "163008"
      type: code
      title: fetch-inbound-order
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2387
      parameters:
          code: |-
              /**
               * 节点：本地 Runner 补拉入库单详情
               */

              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              const INBOUND_DETAIL_ACTION = "winit.wh.inbound.getOrderDetail";

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function coerceDetailPayload(parsed: unknown): Record<string, unknown> | null {
                if (parsed == null || typeof parsed !== "object") return null;
                const o = parsed as Record<string, unknown>;
                if (o.output != null && typeof o.output === "object") return coerceDetailPayload(o.output);
                if (o.code === "0" || o.code === 0) {
                  const inner = o.data;
                  if (typeof inner === "string") {
                    try {
                      return coerceDetailPayload(JSON.parse(inner));
                    } catch {
                      return null;
                    }
                  }
                  if (inner != null && typeof inner === "object") return coerceDetailPayload(inner);
                  return null;
                }
                if (o.orderNo != null || o.inboundOrderNum != null || o.inboundOrderNo != null) return o;
                return null;
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              function mergePluginOutputs(params: Record<string, unknown>): Record<string, unknown> {
                const outputList = (Array.isArray(params.winitPluginOutputList) ? params.winitPluginOutputList : []) as Array<{
                  data?: unknown;
                }>;
                const rowsByKey = new Map<string, Record<string, unknown>>();
                for (const item of outputList) {
                  const row = coerceDetailPayload(parseCozeWorkflowDataField(item?.data));
                  if (!row) continue;
                  const key = String(row.orderNo ?? row.inboundOrderNum ?? "").trim().toUpperCase();
                  if (key) rowsByKey.set(key, row);
                }
                const list = Array.from(rowsByKey.values());
                return { list, total: list.length, _fetchMeta: { strategy: "detail-only", batchPluginMerged: true } };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipApi === true) {
                  return { rawOrderData: { list: [], total: 0, _fetchMeta: { strategy: "kb-only" } } };
                }

                const pluginList = params.winitPluginOutputList;
                if (Array.isArray(pluginList) && pluginList.length > 0) {
                  return { rawOrderData: mergePluginOutputs(params) };
                }

                const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                  action: string;
                  data: string;
                }>;
                const env = getCozeWinitEnv();
                const list: Record<string, unknown>[] = [];
                const errors: string[] = [];

                if (!env) {
                  return {
                    rawOrderData: {
                      list: [],
                      total: 0,
                      _fetchMeta: { strategy: "local-fetch-skipped", reason: "missing Coze env" },
                    },
                  };
                }

                for (const act of actions) {
                  try {
                    const data = JSON.parse(act.data) as Record<string, unknown>;
                    const parsed = await runCozeWinitWorkflow(env, act.action || INBOUND_DETAIL_ACTION, data);
                    const row = coerceDetailPayload(parsed);
                    if (row) list.push(row);
                  } catch (e) {
                    errors.push(String(e instanceof Error ? e.message : e));
                  }
                }

                return {
                  rawOrderData: {
                    list,
                    total: list.length,
                    _fetchMeta: { strategy: "local-proxy-detail", resolvedCount: list.length, errors: errors.length ? errors : undefined },
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-inbound-order")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: actions
                input:
                    value:
                        path: actions
                        ref_node: "163006"
              - name: actionPlans
                input:
                    value:
                        path: actionPlans
                        ref_node: "163006"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163007"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163001"
          node_outputs:
              rawOrderData:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163009"
      type: code
      title: prune-inbound-json
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2627
      parameters:
          code: |-
              /**
               * 节点：清关专家入库单 JSON 剪枝（保留清关相关轨迹）
               */

              const CUSTOMS_KEYWORDS = ["清关", "报关", "申报", "放行", "查验", "customs", "clearance", "declare"];
              const DEFAULT_MAX_TRAJECTORY = 20;

              function str(v: unknown): string {
                return v == null ? "" : String(v);
              }

              function isCustomsNode(node: Record<string, unknown>): boolean {
                const text = [node.nodeName, node.nodeDesc, node.status, node.remark, node.eventName, node.trajectoryDesc]
                  .map(str)
                  .join(" ")
                  .toLowerCase();
                return CUSTOMS_KEYWORDS.some((kw) => text.includes(kw));
              }

              function pruneOrder(order: Record<string, unknown>, maxTrajectory: number, focusCustoms: boolean) {
                const copy = { ...order };
                const traj = copy.trajectoryList;
                if (Array.isArray(traj)) {
                  let working = traj as Record<string, unknown>[];
                  if (focusCustoms) {
                    const customsOnly = working.filter((n) => n && typeof n === "object" && isCustomsNode(n));
                    working = customsOnly.length > 0 ? customsOnly : working.slice(-maxTrajectory);
                  }
                  if (working.length > maxTrajectory) {
                    working = working.slice(-maxTrajectory);
                    (copy as Record<string, unknown>)._trajectoryTruncated = true;
                  }
                  copy.trajectoryList = working;
                }
                if (copy.inboundPackageVos != null) delete copy.inboundPackageVos;
                return copy;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.pathType === "dutiable" || params.skipApi === true) {
                  return { prunedOrderData: { list: [], total: 0 }, _pruneMeta: { skipped: true } };
                }

                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const list = (rawOrderData.list as unknown[]) ?? [];
                const maxTrajectory =
                  typeof params.maxTrajectoryNodes === "number" && params.maxTrajectoryNodes >= 1
                    ? Math.floor(params.maxTrajectoryNodes)
                    : DEFAULT_MAX_TRAJECTORY;
                const focusCustoms = params.focusCustoms !== false;

                const prunedList = list
                  .filter((item) => item && typeof item === "object")
                  .map((item) => pruneOrder(item as Record<string, unknown>, maxTrajectory, focusCustoms));

                return {
                  prunedOrderData: { ...rawOrderData, list: prunedList },
                  _pruneMeta: { orderCount: prunedList.length, focusCustoms },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("prune-inbound-json")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163008"
              - name: pathType
                input:
                    value:
                        path: pathType
                        ref_node: "163000"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163001"
              - name: maxTrajectoryNodes
                input:
                    value:
                        path: inputs.maxTrajectoryNodes
                        ref_node: "100001"
              - name: focusCustoms
                input:
                    value:
                        path: inputs.focusCustoms
                        ref_node: "100001"
          node_outputs:
              prunedOrderData:
                  type: object
                  value: null
              _pruneMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163010"
      type: code
      title: extract-customs-facts
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2867
      parameters:
          code: |-
              /**
               * 节点：从 OMS getOrderDetail 提取清关相关事实
               */

              const CUSTOMS_KEYWORDS = [
                "清关",
                "报关",
                "申报",
                "放行",
                "查验",
                "customs",
                "clearance",
                "declare",
                "inspection",
                "release",
              ];

              function str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              function isCustomsNode(node: Record<string, unknown>): boolean {
                const text = [
                  node.nodeName,
                  node.nodeDesc,
                  node.status,
                  node.remark,
                  node.eventName,
                  node.trajectoryDesc,
                ]
                  .filter((v) => v != null)
                  .join(" ")
                  .toLowerCase();
                return CUSTOMS_KEYWORDS.some((kw) => text.includes(kw.toLowerCase()));
              }

              function summarizeTrajectoryNode(node: Record<string, unknown>) {
                return {
                  nodeName: str(node.nodeName ?? node.eventName ?? node.status),
                  nodeDesc: str(node.nodeDesc ?? node.trajectoryDesc ?? node.remark),
                  eventTime: str(node.eventTime ?? node.createTime ?? node.operateTime),
                  status: str(node.status),
                };
              }

              function extractFromOrder(order: Record<string, unknown>) {
                const trajectory = Array.isArray(order.trajectoryList) ? order.trajectoryList : [];
                const customsTrajectoryNodes = trajectory
                  .filter((n) => n && typeof n === "object" && isCustomsNode(n as Record<string, unknown>))
                  .map((n) => summarizeTrajectoryNode(n as Record<string, unknown>));

                return {
                  orderNo: str(order.orderNo ?? order.inboundOrderNum ?? order.inboundOrderNo),
                  currentStatus: str(order.status),
                  importerCode: str(order.importerCode),
                  containerNo: str(order.containerNo ?? order.cabinetNo),
                  destWhCode: str(order.destWhCode),
                  winitProductCode: str(order.winitProductCode),
                  customsTrajectoryNodes,
                  trajectoryTotal: trajectory.length,
                  customsNodeCount: customsTrajectoryNodes.length,
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const pathType = str(params.pathType) || "progress";
                if (pathType !== "progress" || params.validationOk === false) {
                  return {
                    customsFacts: {
                      orderNo: "",
                      currentStatus: "",
                      importerCode: "",
                      containerNo: str(params.containerNo),
                      customsTrajectoryNodes: [],
                      orders: [],
                      orderCount: 0,
                    },
                  };
                }

                const prunedOrderData = (params.prunedOrderData ?? {}) as Record<string, unknown>;
                const list = (prunedOrderData.list as unknown[]) ?? [];
                const orders = list
                  .filter((item) => item && typeof item === "object")
                  .map((item) => extractFromOrder(item as Record<string, unknown>));

                const primary = orders[0] ?? {
                  orderNo: "",
                  currentStatus: "",
                  importerCode: "",
                  containerNo: str(params.containerNo),
                  customsTrajectoryNodes: [],
                };

                const tmsSummary = (params.tmsTransportSummary ?? {}) as Record<string, unknown>;
                const tmsPrimary = (tmsSummary.primary ?? null) as Record<string, unknown> | null;
                const tmsFacts = tmsPrimary
                  ? {
                      transportOrderNo: String(tmsPrimary.transportOrderNo ?? ""),
                      transportStatus: String(tmsPrimary.status ?? ""),
                      importDeclarationRuleCode: String(tmsPrimary.importDeclarationRuleCode ?? ""),
                      importerCode: String(tmsPrimary.importerCode ?? ""),
                      exportDeclarationType: String(tmsPrimary.exportDeclarationType ?? ""),
                      containerNo: String(tmsPrimary.containerNo ?? primary.containerNo ?? ""),
                    }
                  : null;

                return {
                  customsFacts: {
                    ...primary,
                    country: str(params.country),
                    orders,
                    orderCount: orders.length,
                    tmsFacts,
