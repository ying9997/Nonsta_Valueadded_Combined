    - id: "163000"
      type: code
      title: resolve-customs-query
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 467
      parameters:
          code: |-
              /**
               * 节点：解析清关查询路径（进度查询 vs 包税渠道 FAQ）
               */

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function normalizeCountry(raw: unknown): string {
                const u = str(raw).toUpperCase().replace(/\s+/g, "");
                if (!u) return "";
                const aliases: Record<string, string> = {
                  GB: "UK",
                  USA: "US",
                  UNITEDSTATES: "US",
                  UNITEDKINGDOM: "UK",
                  GERMANY: "DE",
                  DEU: "DE",
                  BELGIUM: "BE",
                  BEL: "BE",
                  英国: "UK",
                  美国: "US",
                  德国: "DE",
                  比利时: "BE",
                };
                return aliases[u] ?? (/^[A-Z]{2}$/.test(u) ? u : "");
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const dutiableChannelQuery = params.dutiableChannelQuery === true;
                const country = normalizeCountry(params.country);
                const containerNo = str(params.containerNo);
                const inboundOrderNos = ((params.inboundOrderNos as string[]) ?? [])
                  .map((o) => String(o ?? "").trim())
                  .filter(Boolean);

                if (dutiableChannelQuery) {
                  return {
                    pathType: "dutiable",
                    skipApi: true,
                    validationOk: true,
                    dutiableChannelQuery: true,
                    country,
                    containerNo,
                    inboundOrderNos,
                  };
                }

                const validationOk = inboundOrderNos.length > 0 || containerNo.length > 0;
                return {
                  pathType: validationOk ? "progress" : "invalid",
                  skipApi: false,
                  validationOk,
                  error: validationOk ? "" : "请提供 inboundOrderNos 或 containerNo",
                  dutiableChannelQuery: false,
                  country,
                  containerNo,
                  inboundOrderNos,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("resolve-customs-query")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: inboundOrderNos
                input:
                    value:
                        path: inputs.inboundOrderNos
                        ref_node: "100001"
              - name: country
                input:
                    value:
                        path: inputs.country
                        ref_node: "100001"
              - name: containerNo
                input:
                    value:
                        path: inputs.containerNo
                        ref_node: "100001"
              - name: dutiableChannelQuery
                input:
                    value:
                        path: inputs.dutiableChannelQuery
                        ref_node: "100001"
          node_outputs:
              pathType:
                  type: string
                  value: null
              skipApi:
                  type: boolean
                  value: null
              validationOk:
                  type: boolean
                  value: null
              error:
                  type: string
                  value: null
              dutiableChannelQuery:
                  type: boolean
                  value: null
              country:
                  type: string
                  value: null
              containerNo:
                  type: string
                  value: null
              inboundOrderNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163001"
      type: code
      title: resolve-inbound-lookup
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 707
      parameters:
          code: |-
              /**
               * 节点：规范化入库单查询标识
               */

              function isWiOrderToken(raw: string): boolean {
                return /^WI/i.test(raw.trim());
              }

              function normalizeWiOrderNum(raw: string): string {
                return raw.trim().toUpperCase();
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const skipFromParent = params.skipApi === true;
                const raw = ((params.inboundOrderNos as string[]) ?? [])
                  .map((o) => String(o ?? "").trim())
                  .filter(Boolean);

                const wiSeen = new Set<string>();
                const refSeen = new Set<string>();
                const wiOrderNos: string[] = [];
                const customerRefNos: string[] = [];

                for (const token of raw) {
                  if (isWiOrderToken(token)) {
                    const normalized = normalizeWiOrderNum(token);
                    if (!wiSeen.has(normalized)) {
                      wiSeen.add(normalized);
                      wiOrderNos.push(normalized);
                    }
                  } else {
                    const normalized = token.trim();
                    if (!refSeen.has(normalized)) {
                      refSeen.add(normalized);
                      customerRefNos.push(normalized);
                    }
                  }
                }

                const hasOrders = wiOrderNos.length > 0 || customerRefNos.length > 0;
                const skipApi = skipFromParent || !hasOrders;

                return {
                  wiOrderNos,
                  customerRefNos,
                  inboundOrderNos: [...wiOrderNos, ...customerRefNos],
                  skipApi,
                  lookupMeta: { hasOrders, skipApi },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("resolve-inbound-lookup")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: inboundOrderNos
                input:
                    value:
                        path: inboundOrderNos
                        ref_node: "163000"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163000"
          node_outputs:
              wiOrderNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              customerRefNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              inboundOrderNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              skipApi:
                  type: boolean
                  value: null
              lookupMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163002"
      type: code
      title: build-tms-transport-query
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 947
      parameters:
          code: |-
              /**
               * 节点：组装 tms.transportorder.queryPage 请求
               * 规格：docs/plan/inbound-tms-transportorder-queryPage.md
               */

              const TMS_QUERY_PAGE_ACTION =
                (typeof process !== "undefined" && process.env?.COZE_WINIT_TMS_QUERY_PAGE_ACTION?.trim()) ||
                "tms.transportorder.queryPage";

              const DEFAULT_WI_KEYWORD_TYPE =
                (typeof process !== "undefined" && process.env?.COZE_WINIT_TMS_KEYWORD_TYPE?.trim()) ||
                "inboundOrderNo";

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function isTransportOrderNo(token: string): boolean {
                return /^TO/i.test(token.trim());
              }

              function basePageData(extra: Record<string, unknown>): Record<string, unknown> {
                return { pageNo: 1, pageSize: 10, ...extra };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipApi === true || params.skipTms === true) {
                  return { actions: [], tmsActionName: TMS_QUERY_PAGE_ACTION, skipTms: true };
                }

                const wiOrderNos = ((params.wiOrderNos as string[]) ?? []).map((o) => str(o)).filter(Boolean);
                const customerRefNos = ((params.customerRefNos as string[]) ?? []).map((o) => str(o)).filter(Boolean);
                const transportOrderNo = str(params.transportOrderNo);
                const containerNo = str(params.containerNo);

                const actions: Array<{ action: string; data: string }> = [];
                const seen = new Set<string>();

                const push = (keywordType: string, content: string) => {
                  const key = `${keywordType}|${content}`;
                  if (!content || seen.has(key)) return;
                  seen.add(key);
                  actions.push({
                    action: TMS_QUERY_PAGE_ACTION,
                    data: JSON.stringify(basePageData({ keywordType, content })),
                  });
                };

                if (transportOrderNo) push("orderNo", transportOrderNo.toUpperCase());
                for (const token of [...wiOrderNos, ...customerRefNos]) {
                  if (isTransportOrderNo(token)) push("orderNo", token.toUpperCase());
                }
                for (const wi of wiOrderNos) push(DEFAULT_WI_KEYWORD_TYPE, wi);
                for (const ref of customerRefNos) push("customerOrderNo", ref);
                if (containerNo) push("containerNo", containerNo);

                if (actions.length === 0) {
                  return { actions: [], tmsActionName: TMS_QUERY_PAGE_ACTION, skipTms: true };
                }

                return { actions: actions, tmsActionName: TMS_QUERY_PAGE_ACTION, skipTms: false };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("build-tms-transport-query")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163001"
              - name: wiOrderNos
                input:
                    value:
                        path: wiOrderNos
                        ref_node: "163001"
              - name: customerRefNos
                input:
                    value:
                        path: customerRefNos
                        ref_node: "163001"
              - name: transportOrderNo
                input:
                    value:
                        path: inputs.transportOrderNo
                        ref_node: "100001"
              - name: containerNo
                input:
                    value:
                        path: containerNo
                        ref_node: "163000"
          node_outputs:
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              tmsActionName:
                  type: string
                  value: null
              skipTms:
                  type: boolean
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
