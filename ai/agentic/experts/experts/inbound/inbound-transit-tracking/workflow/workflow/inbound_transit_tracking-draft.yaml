    - id: "163007"
      type: code
      title: fetch-inbound-order
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2147
      parameters:
          code: |-
              /**
               * 节点：本地 Runner 补拉入库单详情（无插件输出时走 Coze workflow/run 代理）
               * FaaS 单文件闭环，无外部 import。
               */

              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              const INBOUND_DETAIL_ACTION = "winit.wh.inbound.getOrderDetail";

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function coerceDetailPayload(parsed: unknown): Record<string, unknown> | null {
                if (parsed == null || typeof parsed !== "object") return null;
                const o = parsed as Record<string, unknown>;
                if (o.output != null && typeof o.output === "object") return coerceDetailPayload(o.output);
                if (o.code === "0" || o.code === 0) {
                  const inner = o.data;
                  if (typeof inner === "string") {
                    try {
                      return coerceDetailPayload(JSON.parse(inner));
                    } catch {
                      return null;
                    }
                  }
                  if (inner != null && typeof inner === "object") return coerceDetailPayload(inner);
                  return null;
                }
                if (o.orderNo != null || o.inboundOrderNum != null || o.inboundOrderNo != null) return o;
                return null;
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              function mergePluginOutputs(params: Record<string, unknown>): Record<string, unknown> {
                type ActionPlan = { inputToken: string; queryBy: string };
                const actionPlans = (Array.isArray(params.actionPlans) ? params.actionPlans : []) as ActionPlan[];
                const outputList = (Array.isArray(params.winitPluginOutputList) ? params.winitPluginOutputList : []) as Array<{
                  data?: unknown;
                }>;
                const rowsByKey = new Map<string, Record<string, unknown>>();
                for (let i = 0; i < outputList.length; i++) {
                  const row = coerceDetailPayload(parseCozeWorkflowDataField(outputList[i]?.data));
                  if (!row) continue;
                  const key = String(row.orderNo ?? row.inboundOrderNum ?? "").trim().toUpperCase();
                  if (key) rowsByKey.set(key, row);
                }
                const list = Array.from(rowsByKey.values());
                return {
                  list,
                  total: list.length,
                  _fetchMeta: {
                    strategy: "detail-only",
                    batchPluginMerged: true,
                    actionPlanCount: actionPlans.length,
                    resolvedCount: list.length,
                  },
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipApi === true) {
                  return { rawOrderData: { list: [], total: 0, _fetchMeta: { strategy: "kb-only" } } };
                }

                const pluginList = params.winitPluginOutputList;
                if (Array.isArray(pluginList) && pluginList.length > 0) {
                  return { rawOrderData: mergePluginOutputs(params) };
                }

                const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                  action: string;
                  data: string;
                }>;
                const env = getCozeWinitEnv();
                const list: Record<string, unknown>[] = [];
                const errors: string[] = [];

                if (!env) {
                  return {
                    rawOrderData: {
                      list: [],
                      total: 0,
                      _fetchMeta: { strategy: "local-fetch-skipped", reason: "missing Coze env" },
                    },
                  };
                }

                for (const act of actions) {
                  try {
                    const data = JSON.parse(act.data) as Record<string, unknown>;
                    const parsed = await runCozeWinitWorkflow(env, act.action || INBOUND_DETAIL_ACTION, data);
                    const row = coerceDetailPayload(parsed);
                    if (row) list.push(row);
                  } catch (e) {
                    errors.push(String(e instanceof Error ? e.message : e));
                  }
                }

                return {
                  rawOrderData: {
                    list,
                    total: list.length,
                    _fetchMeta: { strategy: "local-proxy-detail", resolvedCount: list.length, errors: errors.length ? errors : undefined },
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-inbound-order")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: actions
                input:
                    value:
                        path: actions
                        ref_node: "163005"
              - name: actionPlans
                input:
                    value:
                        path: actionPlans
                        ref_node: "163005"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163006"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163005"
          node_outputs:
              rawOrderData:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163008"
      type: code
      title: prune-inbound-json
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2387
      parameters:
          code: |-
              /**
               * 节点：头程专家入库单 JSON 剪枝 — 保留 TS 相关轨迹与关键字段
               * FaaS 单文件闭环，无外部 import。
               */

              const DEFAULT_MAX_TRAJECTORY = 20;

              const TS_KEYWORDS = ["ts", "头程", "在途", "发运", "离港", "到港", "送仓", "transit", "shipped", "departure", "arrival"];

              function isTsRelatedNode(node: Record<string, unknown>): boolean {
                const status = String(node.status ?? node.nodeStatus ?? "").toUpperCase();
                if (status === "TS") return true;
                const text = [
                  node.nodeName,
                  node.nodeDesc,
                  node.status,
                  node.remark,
                  node.eventName,
                  node.trajectoryDesc,
                ]
                  .filter((v) => v != null)
                  .join(" ")
                  .toLowerCase();
                return TS_KEYWORDS.some((kw) => text.includes(kw));
              }

              function pruneOrder(
                order: Record<string, unknown>,
                maxTrajectory: number
              ): Record<string, unknown> {
                const copy: Record<string, unknown> = {
                  orderNo: order.orderNo ?? order.inboundOrderNum,
                  status: order.status,
                  expectedSendwarehouseTime: order.expectedSendwarehouseTime ?? order.estimatedArrivalTime,
                  destWhCode: order.destWhCode,
                  transportType: order.transportType ?? order.headwayProduct,
                };

                const traj = order.trajectoryList;
                if (Array.isArray(traj)) {
                  let working = traj.filter(
                    (n) => n && typeof n === "object" && isTsRelatedNode(n as Record<string, unknown>)
                  ) as Record<string, unknown>[];
                  if (working.length === 0) {
                    working = traj.slice(-maxTrajectory) as Record<string, unknown>[];
                  } else if (working.length > maxTrajectory) {
                    working = working.slice(-maxTrajectory);
                    copy._trajectoryTruncated = true;
                  }
                  copy.trajectoryList = working;
                }

                return copy;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const list = (rawOrderData.list as unknown[]) ?? [];
                const maxTrajectory =
                  typeof params.maxTrajectoryNodes === "number" && params.maxTrajectoryNodes >= 1
                    ? Math.floor(params.maxTrajectoryNodes)
                    : DEFAULT_MAX_TRAJECTORY;

                const prunedList = list
                  .filter((item) => item && typeof item === "object")
                  .map((item) => pruneOrder(item as Record<string, unknown>, maxTrajectory));

                return {
                  prunedOrderData: { list: prunedList, total: prunedList.length },
                  _pruneMeta: { strategy: "ts-focused", maxTrajectory },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("prune-inbound-json")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163007"
              - name: maxTrajectoryNodes
                input:
                    value:
                        path: inputs.maxTrajectoryNodes
                        ref_node: "100001"
          node_outputs:
              prunedOrderData:
                  type: object
                  value: null
              _pruneMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163009"
      type: code
      title: extract-ts-facts
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2627
      parameters:
          code: |-
              /**
               * 节点：extract-ts-facts — 从 OMS 订单提取 TS 阶段事实
               * FaaS 单文件闭环，无外部 import。
               */

              function str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              function findTsEntryTime(trajectory: Record<string, unknown>[]): string | null {
                for (const node of trajectory) {
                  const status = str(node.status ?? node.nodeStatus).toUpperCase();
                  if (status === "TS") {
                    return str(node.nodeTime ?? node.eventTime ?? node.createTime) || null;
                  }
                }
                for (const node of trajectory) {
                  const text = [node.nodeName, node.nodeDesc, node.trajectoryDesc].join(" ").toLowerCase();
                  if (text.includes("ts") || text.includes("头程") || text.includes("发运")) {
                    return str(node.nodeTime ?? node.eventTime) || null;
                  }
                }
                return null;
              }

              function extractOrderFacts(order: Record<string, unknown>) {
                const orderNo = str(order.orderNo ?? order.inboundOrderNum);
                const currentStatus = str(order.status).toUpperCase() || "UNKNOWN";
                const expectedSendwarehouseTime =
                  str(order.expectedSendwarehouseTime ?? order.estimatedArrivalTime) || null;

                const traj = Array.isArray(order.trajectoryList)
                  ? (order.trajectoryList as Record<string, unknown>[])
                  : [];
                const tsTrajectoryNodes = traj.filter((n) => {
                  const status = str(n.status ?? n.nodeStatus).toUpperCase();
                  return status === "TS" || /头程|在途|发运|ts/i.test(
                    [n.nodeName, n.nodeDesc, n.trajectoryDesc].join(" ")
                  );
                });

                const tsEntryTime = findTsEntryTime(traj);

                let currentMilestone = "国际在途（TS）";
                if (currentStatus !== "TS") {
                  currentMilestone = currentStatus === "OD" ? "草稿/未发运" : `当前状态 ${currentStatus}（非 TS 在途阶段）`;
                } else if (tsTrajectoryNodes.length > 0) {
                  const last = tsTrajectoryNodes[tsTrajectoryNodes.length - 1];
                  currentMilestone = str(last.nodeDesc ?? last.nodeName ?? last.trajectoryDesc) || currentMilestone;
                }

                return {
                  orderNo,
                  currentStatus,
                  tsEntryTime,
                  expectedSendwarehouseTime,
                  tsTrajectoryNodes,
                  currentMilestone,
                  isTsPhase: currentStatus === "TS",
                };
              }

              function tmsOverlay(summary: unknown) {
                const s = (summary ?? {}) as Record<string, unknown>;
                const primary = (s.primary ?? null) as Record<string, unknown> | null;
                if (!primary) return null;
                return {
                  transportOrderNo: String(primary.transportOrderNo ?? ""),
                  transportStatus: String(primary.status ?? ""),
                  containerNo: String(primary.containerNo ?? ""),
                  cartonType: String(primary.cartonType ?? ""),
                  cutoffCabinetDate: String(primary.cutoffCabinetDate ?? ""),
                  estimateVolume: primary.estimateVolume ?? null,
                  logisticsPlanId: String(primary.logisticsPlanId ?? ""),
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const prunedOrderData = (params.prunedOrderData ?? {}) as Record<string, unknown>;
                const list = (prunedOrderData.list as unknown[]) ?? [];
                const tmsFacts = tmsOverlay(params.tmsTransportSummary);

                const orders = list
                  .filter((item) => item && typeof item === "object")
                  .map((item) => extractOrderFacts(item as Record<string, unknown>));

                const primary = orders[0] ?? {
                  orderNo: "",
                  currentStatus: "UNKNOWN",
                  tsEntryTime: null,
                  expectedSendwarehouseTime: null,
                  tsTrajectoryNodes: [],
                  currentMilestone: "暂无数据",
                  isTsPhase: false,
                };

                return {
                  tsFacts: {
                    ...primary,
                    orders,
                    orderCount: orders.length,
                    dataAvailable: orders.length > 0,
                    tmsFacts,
                    tmsDataQuality: String((params.tmsTransportSummary as Record<string, unknown>)?.dataQuality ?? "missing"),
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("extract-ts-facts")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: prunedOrderData
                input:
                    value:
                        path: prunedOrderData
                        ref_node: "163008"
              - name: tmsTransportSummary
                input:
                    value:
                        path: tmsTransportSummary
                        ref_node: "163004"
          node_outputs:
              tsFacts:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163010"
      type: code
      title: check-tms-gap
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2867
      parameters:
          code: |-
              /**
               * 节点：TMS 可用性 — queryPage 表头 + queryTrackingList 里程碑 Gap
               */

              const TRACKING_GAP =
                "离港/到港/航班船名等里程碑须 tms.transportorder.queryTrackingList，本期 workflow 未接入；勿编造日期。";

              const NO_TO_NOTE =
                "未查到关联运输单（TO）；请客户提供 TO 号，或确认 WI 与 TMS keywordType 映射。";

              function summaryFromParams(params: Record<string, unknown>) {
                return (params.tmsTransportSummary ?? {}) as Record<string, unknown>;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const summary = summaryFromParams(params);
                const recordCount = Number(summary.recordCount ?? 0);
                const hasTms = recordCount > 0;
                const dataQuality = String(summary.dataQuality ?? "missing");

                let phaseScope = "tms_not_found";
                let gapNote = NO_TO_NOTE;

                if (hasTms) {
                  phaseScope = "tms_header_only";
                  gapNote = String(summary.trackingNote ?? TRACKING_GAP);
                } else if (dataQuality === "skipped") {
                  phaseScope = "no_lookup";
                  gapNote = "未提供可查询的单号，跳过 TMS。";
                }

                return {
                  tmsAvailable: hasTms,
                  tmsDataAvailable: hasTms,
                  phaseScope,
                  gapNote,
                  tmsGapNotice: gapNote,
                  tmsTransportSummary: summary,
                  departureTime: null,
                  arrivalPortTime: null,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("check-tms-gap")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: tmsTransportSummary
                input:
                    value:
                        path: tmsTransportSummary
                        ref_node: "163004"
          node_outputs:
              tmsAvailable:
                  type: boolean
                  value: null
              tmsDataAvailable:
                  type: boolean
                  value: null
              gapNote:
                  type: string
                  value: null
              phaseScope:
                  type: string
                  value: null
              tmsTransportSummary:
                  type: object
                  value: null
              departureTime:
                  type: object
                  value: null
              arrivalPortTime:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
