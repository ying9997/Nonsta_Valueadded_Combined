    - id: "163003"
      type: text
      title: kb-order-close
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 480
          y: 1187
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # 入库单关闭/取消规则

                        ## 按状态取消规则

                        | 状态 | 是否可在线取消 | 说明 |
                        |------|----------------|------|
                        | OD（草稿） | ✅ 可以 | 客户可在万邑联平台自行取消 |
                        | TS（在途） | ⚠️ 视情况 | 视物流安排，可能可取消，建议联系客服确认 |
                        | PEWC | ❌ 通常不可 | 需联系仓库运营人工处理 |
                        | EWC | ❌ 通常不可 | 需联系仓库运营人工处理 |
                        | SHD | ❌ 不可 | 已上架完成 |

                        ## 直发类特殊规则

                        - 部分到仓的直发类入库单，客户可在平台自行关闭未到仓部分（参见平台操作指引）

                        ## 风险提示（close/cancel 必提）

                        1. **已发出货物无法召回** — 关闭前请确认物流状态
                        2. 在途（TS）取消可能影响已安排的提货/订舱
                        3. PEWC/EWC 状态关闭**必须人工**处理

                        ## 操作步骤（OD 可取消时）

                        1. 登录万邑联 → 海外仓入库 → 找到目标入库单
                        2. 确认状态为 OD（草稿）
                        3. 点击取消/关闭，确认风险提示
                        4. 等待系统处理

                        ## 升级人工

                        - PEWC/EWC 状态需关闭
                        - TS 状态客户坚持取消
                        - 已支付/已订舱费用争议
