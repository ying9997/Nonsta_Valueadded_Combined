                    value:
                        path: blockReason
                        ref_node: "163007"
              - name: currentStatus
                input:
                    value:
                        path: currentStatus
                        ref_node: "163007"
          node_outputs:
              structured:
                  type: object
                  value: null
              analysis:
                  type: string
                  value: null
              outputContext:
                  type: object
                  value: null
              enrichedContext:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
