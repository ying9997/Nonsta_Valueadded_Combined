    - id: "163007"
      type: code
      title: check-operability
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2147
      parameters:
          code: |-
              /**
               * 节点：check-operability — 基于状态码判断 modify/close/cancel 可操作性
               * FaaS 单文件闭环，无外部 import。
               */

              type OrderIntent = "create" | "modify" | "close" | "cancel" | "general";

              function str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              const CANCEL_RULES: Record<string, { operable: boolean; note: string }> = {
                OD: { operable: true, note: "草稿状态，客户可在万邑联平台自行取消" },
                TS: { operable: false, note: "在途状态，视物流安排可能可取消，建议联系客服确认" },
                PEWC: { operable: false, note: "已到仓验货中，通常不可在线取消，需联系仓库运营人工处理" },
                EWC: { operable: false, note: "验收完成，通常不可在线取消，需联系仓库运营人工处理" },
                SHD: { operable: false, note: "已上架完成，不可取消" },
              };

              const MODIFY_RULES: Record<string, { operable: boolean; note: string }> = {
                OD: { operable: true, note: "草稿状态，可修改箱单/SKU/数量等（直发海外验已下单状态可修改）" },
                TS: { operable: false, note: "在途状态，修改范围有限；目的仓修改需运营介入" },
                PEWC: { operable: false, note: "已到仓，修改截止；自验直发验货中仅可减少商品" },
                EWC: { operable: false, note: "验收完成，不可修改箱单" },
                SHD: { operable: false, note: "已上架，不可修改" },
              };

              async function main({ params }: { params: Record<string, unknown> }) {
                const intent = str(params.intent) as OrderIntent;
                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const list = (rawOrderData.list as unknown[]) ?? [];
                const order = (list[0] ?? {}) as Record<string, unknown>;

                const currentStatus = str(order.status).toUpperCase() || "UNKNOWN";
                const orderNo = str(order.orderNo ?? order.inboundOrderNum ?? params.inboundOrderNo);
                const destWhCode = str(order.destWhCode);

                if (intent === "create" || intent === "general") {
                  return {
                    isOperable: true,
                    blockReason: "",
                    currentStatus: currentStatus || null,
                    orderNo,
                    destWhCode,
                    operabilityNote: "create/general 意图无需状态校验",
                  };
                }

                const rules = intent === "modify" ? MODIFY_RULES : CANCEL_RULES;
                const rule = rules[currentStatus] ?? {
                  operable: false,
                  note: `状态 ${currentStatus} 可操作性未知，建议联系客服确认`,
                };

                return {
                  isOperable: rule.operable,
                  blockReason: rule.operable ? "" : rule.note,
                  currentStatus,
                  orderNo,
                  destWhCode,
                  operabilityNote: rule.note,
                  riskNotes: intent === "close" || intent === "cancel"
                    ? ["已发出货物无法召回，关闭前请谨慎确认", rule.note]
                    : [rule.note],
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("check-operability")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163006"
              - name: intent
                input:
                    value:
                        path: intent
                        ref_node: "163000"
              - name: inboundOrderNo
                input:
                    value:
                        path: inboundOrderNo
                        ref_node: "163000"
          node_outputs:
              isOperable:
                  type: boolean
                  value: null
              blockReason:
                  type: string
                  value: null
              currentStatus:
                  type: string
                  value: null
              orderNo:
                  type: string
                  value: null
              destWhCode:
                  type: string
                  value: null
              operabilityNote:
                  type: string
                  value: null
              riskNotes:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163008"
      type: code
      title: load-order-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2387
      parameters:
          code: |-
              /**
               * 节点：load-order-kb — 按 intent 选择性拼接 KB SOP
               * FaaS 单文件闭环，无外部 import。
               */

              function str(v: unknown): string {
                return typeof v === "string" ? v : "";
              }

              type OrderIntent = "create" | "modify" | "close" | "cancel" | "general";

              function pickKbParts(
                intent: OrderIntent,
                kbCreate: string,
                kbModify: string,
                kbClose: string
              ): { parts: string[]; scope: string } {
                switch (intent) {
                  case "create":
                    return { parts: [kbCreate], scope: "create" };
                  case "modify":
                    return { parts: [kbModify, kbCreate], scope: "modify" };
                  case "close":
                  case "cancel":
                    return { parts: [kbClose, kbModify], scope: "close-cancel" };
                  default:
                    return { parts: [kbCreate, kbModify, kbClose], scope: "full" };
                }
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const validationOk = params.validationOk === true;
                const intent = (str(params.intent) || "general") as OrderIntent;
                const kbCreate = str(params.kbOrderCreate);
                const kbModify = str(params.kbOrderModify);
                const kbClose = str(params.kbOrderClose);
                const enabledProducts = Array.isArray(params.enabledProducts)
                  ? (params.enabledProducts as unknown[]).map(String)
                  : [];
                const targetWarehouseCode = str(params.targetWarehouseCode);
                const targetPsc = str(params.targetPsc);

                if (!validationOk) {
                  return {
                    kbContent: "",
                    kbScope: "invalid",
                    intent,
                    pscContext: "",
                  };
                }

                const { parts, scope } = pickKbParts(intent, kbCreate, kbModify, kbClose);
                const kbContent = parts.filter(Boolean).join("\n\n---\n\n");

                let pscContext = "";
                if (enabledProducts.length > 0) {
                  pscContext = `上游 PSC 快照 enabledProducts: ${enabledProducts.join(", ")}`;
                } else if (targetPsc) {
                  pscContext = `客户指定 targetPsc: ${targetPsc}`;
                } else {
                  pscContext = "无 PSC 快照，输出通用选型指引";
                }

                if (targetWarehouseCode) {
                  pscContext += `；目的仓: ${targetWarehouseCode}`;
                }

                return {
                  kbContent,
                  kbScope: scope,
                  intent,
                  pscContext,
                  enabledProducts,
                  targetWarehouseCode,
                  targetPsc,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-order-kb")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: validationOk
                input:
                    value:
                        path: validationOk
                        ref_node: "163000"
              - name: intent
                input:
                    value:
                        path: intent
                        ref_node: "163000"
              - name: kbOrderCreate
                input:
                    value:
                        path: output
                        ref_node: "163001"
              - name: kbOrderModify
                input:
                    value:
                        path: output
                        ref_node: "163002"
              - name: kbOrderClose
                input:
                    value:
                        path: output
                        ref_node: "163003"
              - name: enabledProducts
                input:
                    value:
                        path: enabledProducts
                        ref_node: "163000"
              - name: targetWarehouseCode
                input:
                    value:
                        path: targetWarehouseCode
                        ref_node: "163000"
              - name: targetPsc
                input:
                    value:
                        path: targetPsc
                        ref_node: "163000"
          node_outputs:
              kbContent:
                  type: string
                  value: null
              kbScope:
                  type: string
                  value: null
              intent:
                  type: string
                  value: null
              pscContext:
                  type: string
                  value: null
              enabledProducts:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              targetWarehouseCode:
                  type: string
                  value: null
              targetPsc:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
