    - id: "163003"
      type: code
      title: fetch-inbound-order
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1187
      parameters:
          code: |-
              /**
               * 节点：本地 Runner 补拉入库单详情（无插件输出时走 Coze workflow/run 代理）
               */

              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              const INBOUND_DETAIL_ACTION = "winit.wh.inbound.getOrderDetail";

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function coerceDetailPayload(parsed: unknown): Record<string, unknown> | null {
                if (parsed == null || typeof parsed !== "object") return null;
                const o = parsed as Record<string, unknown>;
                if (o.output != null && typeof o.output === "object") return coerceDetailPayload(o.output);
                if (o.code === "0" || o.code === 0) {
                  const inner = o.data;
                  if (typeof inner === "string") {
                    try {
                      return coerceDetailPayload(JSON.parse(inner));
                    } catch {
                      return null;
                    }
                  }
                  if (inner != null && typeof inner === "object") return coerceDetailPayload(inner);
                  return null;
                }
                if (o.orderNo != null || o.inboundOrderNum != null || o.inboundOrderNo != null) return o;
                return null;
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              function mergePluginOutputs(params: Record<string, unknown>): Record<string, unknown> {
                type ActionPlan = { inputToken: string; queryBy: string };
                const actionPlans = (Array.isArray(params.actionPlans) ? params.actionPlans : []) as ActionPlan[];
                const outputList = (Array.isArray(params.winitPluginOutputList) ? params.winitPluginOutputList : []) as Array<{
                  data?: unknown;
                }>;
                const rowsByKey = new Map<string, Record<string, unknown>>();
                for (let i = 0; i < outputList.length; i++) {
                  const row = coerceDetailPayload(parseCozeWorkflowDataField(outputList[i]?.data));
                  if (!row) continue;
                  const key = String(row.orderNo ?? row.inboundOrderNum ?? "").trim().toUpperCase();
                  if (key) rowsByKey.set(key, row);
                }
                const list = Array.from(rowsByKey.values());
                return {
                  list,
                  total: list.length,
                  _fetchMeta: {
                    strategy: "detail-only",
                    batchPluginMerged: true,
                    actionPlanCount: actionPlans.length,
                    resolvedCount: list.length,
                  },
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipApi === true) {
                  return { rawOrderData: { list: [], total: 0, _fetchMeta: { strategy: "kb-only" } } };
                }

                const pluginList = params.winitPluginOutputList;
                if (Array.isArray(pluginList) && pluginList.length > 0) {
                  return { rawOrderData: mergePluginOutputs(params) };
                }

                const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                  action: string;
                  data: string;
                }>;
                const env = getCozeWinitEnv();
                const list: Record<string, unknown>[] = [];
                const errors: string[] = [];

                if (!env) {
                  return {
                    rawOrderData: {
                      list: [],
                      total: 0,
                      _fetchMeta: { strategy: "local-fetch-skipped", reason: "missing Coze env" },
                    },
                  };
                }

                for (const act of actions) {
                  try {
                    const data = JSON.parse(act.data) as Record<string, unknown>;
                    const parsed = await runCozeWinitWorkflow(env, act.action || INBOUND_DETAIL_ACTION, data);
                    const row = coerceDetailPayload(parsed);
                    if (row) list.push(row);
                  } catch (e) {
                    errors.push(String(e instanceof Error ? e.message : e));
                  }
                }

                return {
                  rawOrderData: {
                    list,
                    total: list.length,
                    _fetchMeta: { strategy: "local-proxy-detail", resolvedCount: list.length, errors: errors.length ? errors : undefined },
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-inbound-order")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: actions
                input:
                    value:
                        path: actions
                        ref_node: "163001"
              - name: actionPlans
                input:
                    value:
                        path: actionPlans
                        ref_node: "163001"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163002"
          node_outputs:
              rawOrderData:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163004"
      type: code
      title: extract-inbound-detail
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1427
      parameters:
          code: |-
              /* coze-inline: shared/inbound-get-order-detail.ts */
              /**
               * 入库单 getOrderDetail 详情分层：detailLevel ↔ isIncludePackage、extract、SKU/包裹聚合
               * 官方 id/39：N 不返回 merchandiseList/packageList；无包裹分页 API
               */

              const INBOUND_DETAIL_ACTION = "winit.wh.inbound.getOrderDetail";

              type DetailLevel =
                | "header"
                | "sku_summary"
                | "sku_filtered"
                | "package_summary"
                | "package_detail"
                | "item_lookup";

              type IsIncludePackage = "Y" | "N";

              interface DetailExtractOptions {
                detailLevel: DetailLevel;
                targetMerchandiseCodes?: string[];
                targetPackageNos?: string[];
                targetItemSernos?: string[];
                maxPackagesPerOrder?: number;
                maxMerchandisePerPackage?: number;
                packageFetchThreshold?: number;
              }

              interface DetailExtractMeta {
                detailLevel: DetailLevel;
                originalPackageCount: number;
                packagesDiscarded: boolean;
                merchandiseRowCount: number;
                requiresNarrowing?: boolean;
                largeOrderSkuOnly?: boolean;
                packagesRetained?: number;
              }

              interface SkuPutawaySummary {
                totalSkus: number;
                completedSkus: number;
                partialSkus: number;
                pendingSkus: number;
                putawayRate: number;
                anomalySkus: Array<{
                  merchandiseCode: string;
                  quantity: number;
                  actualQuantity: number;
                  inspectionQty?: number;
                }>;
                targetSkusOnly: boolean;
              }

              interface PackagePutawaySummary {
                totalPackages: number;
                byStatus: Record<string, number>;
                recentUnshelvedSample: Array<{
                  packageNo?: string;
                  sellerCaseNo?: string;
                  status?: string;
                  unloadingTime?: string;
                  shelvesTime?: string;
                }>;
                expectedPackages?: number;
                receivedPackages?: number;
                discrepancy?: number;
              }

              const PLUGIN_BATCH_MAX_DEFAULT = 100;
              const DEFAULT_MAX_PACKAGES = 50;
              const DEFAULT_MAX_MERCH_PER_PKG = 20;
              const DEFAULT_PACKAGE_THRESHOLD = 200;

              function str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              function num(v: unknown): number {
                const n = Number(v);
                return Number.isFinite(n) ? n : 0;
              }

              function arr(v: unknown): string[] {
                if (!Array.isArray(v)) return [];
                return v.map((x) => str(x)).filter(Boolean);
              }

              function getPluginBatchMaxActions(): number {
                if (typeof process !== "undefined" && process.env?.COZE_WINIT_PLUGIN_BATCH_MAX) {
                  const n = Number(process.env.COZE_WINIT_PLUGIN_BATCH_MAX);
                  if (Number.isFinite(n) && n >= 1) return Math.floor(n);
                }
                return PLUGIN_BATCH_MAX_DEFAULT;
              }

              function isIncludePackageForLevel(level: DetailLevel): IsIncludePackage {
                return level === "header" ? "N" : "Y";
              }

              /** 解析 detailLevel：兼容 includePackageDetails / checkPackageQty */
              function resolveDetailLevel(
                params: Record<string, unknown>,
                defaultLevel: DetailLevel
              ): DetailLevel {
                if (params.includePackageDetails === true) return "package_detail";
                const raw = str(params.detailLevel);
                const levels: DetailLevel[] = [
                  "header",
                  "sku_summary",
                  "sku_filtered",
                  "package_summary",
                  "package_detail",
                  "item_lookup",
                ];
                if (raw && levels.includes(raw as DetailLevel)) return raw as DetailLevel;
                if (params.checkPackageQty === true && defaultLevel === "header") return "package_summary";
                return defaultLevel;
              }

              /** 统一官方字段名与历史别名 */
              function normalizeInboundOrderFields(order: Record<string, unknown>): Record<string, unknown> {
                const copy = { ...order };
                if (!copy.packageList && Array.isArray(copy.inboundPackageVos)) {
                  copy.packageList = copy.inboundPackageVos;
                }
                if (!copy.merchandiseList && Array.isArray(copy.inboundMerchandiseVos)) {
                  copy.merchandiseList = copy.inboundMerchandiseVos;
                }
                return copy;
              }

              type InboundDetailActionPlan = {
                inputToken: string;
                queryBy: "orderNo" | "customerOrderNo";
              };

              function buildInboundDetailActions(
                wiOrderNos: string[],
                customerRefNos: string[],
                detailLevel: DetailLevel
              ): {
                actions: Array<{ action: string; data: string }>;
                actionPlans: InboundDetailActionPlan[];
                winitPluginBatchActionsCount: number;
                actionName: string;
                detailLevel: DetailLevel;
                isIncludePackage: IsIncludePackage;
              } {
                const actionPlans: InboundDetailActionPlan[] = [];
                for (const no of wiOrderNos) {
                  if (no?.trim()) actionPlans.push({ inputToken: no.trim(), queryBy: "orderNo" });
                }
                for (const ref of customerRefNos) {
                  if (ref?.trim()) actionPlans.push({ inputToken: ref.trim(), queryBy: "customerOrderNo" });
                }

                const isIncludePackage = isIncludePackageForLevel(detailLevel);
                const maxActions = getPluginBatchMaxActions();
                const forPlugin = actionPlans.slice(0, maxActions);

                const actions = forPlugin.map((p) => {
                  const data: Record<string, string> = { isIncludePackage };
                  if (p.queryBy === "orderNo") data.orderNo = p.inputToken;
                  else data.customerOrderNo = p.inputToken;
                  return { action: INBOUND_DETAIL_ACTION, data: JSON.stringify(data) };
                });

                return {
                  actions,
                  actionPlans: forPlugin,
                  winitPluginBatchActionsCount: actions.length,
                  actionName: INBOUND_DETAIL_ACTION,
                  detailLevel,
                  isIncludePackage,
                };
              }

              function pruneMerchandiseList(
                merchandiseList: unknown[],
                maxMerchandise: number,
                includeItemList: boolean
              ): unknown[] {
                const mapRow = (m: unknown) => {
                  const copy = { ...(m as Record<string, unknown>) };
                  if (!includeItemList) {
                    delete copy.itemList;
                    delete copy.batchList;
                  }
                  return copy;
                };
                if (merchandiseList.length <= maxMerchandise) {
                  return merchandiseList.map(mapRow);
                }
                const pruned = merchandiseList.slice(0, maxMerchandise).map(mapRow);
                pruned.push({ _truncated: true, _remainingCount: merchandiseList.length - maxMerchandise });
                return pruned;
              }

              function prunePackageList(
                packageList: unknown[],
                maxPackages: number,
                maxMerchandise: number,
                includeItemList: boolean,
                targetPackageNos?: string[]
              ): unknown[] {
                let list = packageList;
                if (targetPackageNos?.length) {
                  const targets = new Set(targetPackageNos.map((t) => t.toUpperCase()));
                  list = packageList.filter((pkg) => {
                    const p = pkg as Record<string, unknown>;
                    const keys = [p.packageNo, p.sellerCaseNo, p.packageNum, p.barcode].map(str);
                    return keys.some((k) => k && targets.has(k.toUpperCase()));
                  });
                }

                if (list.length <= maxPackages) {
                  return list.map((pkg) => {
                    const p = pkg as Record<string, unknown>;
                    const merchList = (p.merchandiseList as unknown[]) ?? [];
                    const copy = { ...p };
                    if (merchList.length > 0) {
                      copy.merchandiseList = pruneMerchandiseList(merchList, maxMerchandise, includeItemList);
                    }
                    if (!includeItemList) delete copy.itemList;
                    return copy;
                  });
                }

                const sorted = [...list].sort((a, b) => {
                  const pa = a as Record<string, unknown>;
                  const pb = b as Record<string, unknown>;
                  const sa = str(pa.status).toUpperCase();
                  const sb = str(pb.status).toUpperCase();
                  const unshelved = (s: string) => (s === "SCP" || s === "SHD" ? 1 : 0);
                  if (unshelved(sa) !== unshelved(sb)) return unshelved(sa) - unshelved(sb);
                  return str(pb.unloadingTime ?? pb.shelvesTime).localeCompare(str(pa.unloadingTime ?? pa.shelvesTime));
                });

                const retained = sorted.slice(0, maxPackages).map((pkg) => {
                  const p = pkg as Record<string, unknown>;
                  const merchList = (p.merchandiseList as unknown[]) ?? [];
                  const copy = { ...p };
                  if (merchList.length > 0) {
                    copy.merchandiseList = pruneMerchandiseList(merchList, maxMerchandise, includeItemList);
                  }
                  return copy;
                });
                retained.push({ _truncated: true, _remainingCount: list.length - maxPackages });
                return retained;
              }

              function filterItemLookup(packageList: unknown[], targetItemSernos: string[]): unknown[] {
                const targets = new Set(targetItemSernos.map((t) => t.toUpperCase()));
                const out: unknown[] = [];
                for (const pkg of packageList) {
                  const p = pkg as Record<string, unknown>;
                  const merchList = (p.merchandiseList as unknown[]) ?? [];
                  const keptMerch: unknown[] = [];
                  for (const m of merchList) {
                    const row = m as Record<string, unknown>;
                    const items = (row.itemList as unknown[]) ?? [];
                    const hitItems = items.filter((it) => {
                      const i = it as Record<string, unknown>;
                      return targets.has(str(i.itemSerno).toUpperCase());
                    });
                    if (hitItems.length > 0) {
                      keptMerch.push({ ...row, itemList: hitItems });
                    }
                  }
                  if (keptMerch.length > 0) {
                    out.push({ ...p, merchandiseList: keptMerch });
                  }
                }
                return out;
              }

              function extractInboundOrderDetail(
                order: Record<string, unknown>,
                options: DetailExtractOptions
              ): { order: Record<string, unknown>; meta: DetailExtractMeta } {
                const normalized = normalizeInboundOrderFields(order);
                const level = options.detailLevel;
                const maxPackages = options.maxPackagesPerOrder ?? DEFAULT_MAX_PACKAGES;
                const maxMerch = options.maxMerchandisePerPackage ?? DEFAULT_MAX_MERCH_PER_PKG;
                const threshold = options.packageFetchThreshold ?? DEFAULT_PACKAGE_THRESHOLD;
                const targetSkus = arr(options.targetMerchandiseCodes as unknown);
                const targetPkgs = arr(options.targetPackageNos as unknown);
                const targetItems = arr(options.targetItemSernos as unknown);

                const packageList = (normalized.packageList as unknown[]) ?? [];
                const merchandiseList = (normalized.merchandiseList as unknown[]) ?? [];
                const totalPackageQty = num(normalized.totalPackageQty) || packageList.length;

                const meta: DetailExtractMeta = {
                  detailLevel: level,
                  originalPackageCount: packageList.length,
                  packagesDiscarded: false,
                  merchandiseRowCount: merchandiseList.length,
                };

                const copy = { ...normalized };

                if (level === "header") {
                  delete copy.packageList;
                  delete copy.inboundPackageVos;
                  delete copy.merchandiseList;
                  delete copy.inboundMerchandiseVos;
                  meta.packagesDiscarded = packageList.length > 0;
                  return { order: copy, meta };
                }

                if (level === "sku_summary" || level === "sku_filtered") {
                  delete copy.packageList;
                  delete copy.inboundPackageVos;
                  meta.packagesDiscarded = packageList.length > 0;
                  if (totalPackageQty > threshold) meta.largeOrderSkuOnly = true;

                  let merch = merchandiseList;
                  if (level === "sku_filtered" && targetSkus.length > 0) {
                    const set = new Set(targetSkus.map((s) => s.toUpperCase()));
                    merch = merchandiseList.filter((m) => {
                      const code = str((m as Record<string, unknown>).merchandiseCode).toUpperCase();
                      return set.has(code);
                    });
                    meta.merchandiseRowCount = merch.length;
                  }
                  copy.merchandiseList = merch;
                  delete copy.inboundMerchandiseVos;
                  return { order: copy, meta };
                }

                if (level === "package_summary") {
                  delete copy.packageList;
                  delete copy.inboundPackageVos;
                  meta.packagesDiscarded = true;
                  copy._packageListForAggregate = packageList;
                  return { order: copy, meta };
                }

                if (level === "package_detail" || level === "item_lookup") {
                  if (
                    totalPackageQty > threshold &&
                    targetPkgs.length === 0 &&
                    targetItems.length === 0
                  ) {
                    delete copy.packageList;
                    delete copy.inboundPackageVos;
                    meta.requiresNarrowing = true;
                    meta.packagesDiscarded = true;
                    return { order: copy, meta };
                  }

                  const includeItemList = level === "item_lookup";
                  let pruned: unknown[];
                  if (level === "item_lookup" && targetItems.length > 0) {
                    pruned = filterItemLookup(packageList, targetItems);
                  } else {
                    pruned = prunePackageList(packageList, maxPackages, maxMerch, includeItemList, targetPkgs);
                  }
                  copy.packageList = pruned;
                  delete copy.inboundPackageVos;
                  meta.packagesRetained = pruned.filter((p) => !(p as Record<string, unknown>)._truncated).length;
                  return { order: copy, meta };
                }

                return { order: copy, meta };
              }

              function extractInboundDetailBatch(
                rawOrderData: Record<string, unknown>,
                options: DetailExtractOptions
              ): {
                rawOrderData: Record<string, unknown>;
                _detailExtractMeta: { orders: DetailExtractMeta[]; requiresNarrowing: boolean };
              } {
                const list = (rawOrderData.list as unknown[]) ?? [];
                const extracted: unknown[] = [];
                const metas: DetailExtractMeta[] = [];
                let requiresNarrowing = false;

                for (const item of list) {
                  if (!item || typeof item !== "object") continue;
                  const { order, meta } = extractInboundOrderDetail(item as Record<string, unknown>, options);
                  extracted.push(order);
                  metas.push(meta);
                  if (meta.requiresNarrowing) requiresNarrowing = true;
                }

                return {
                  rawOrderData: { ...rawOrderData, list: extracted, _detailExtractMeta: { orders: metas, requiresNarrowing } },
                  _detailExtractMeta: { orders: metas, requiresNarrowing },
                };
              }

              function effectiveParts(row: Record<string, unknown>): number {
                const spn = num(row.standardPartsNum);
                return spn > 0 ? spn : 1;
              }

              function aggregateSkuPutaway(
                merchandiseList: unknown[],
                targetMerchandiseCodes?: string[]
              ): SkuPutawaySummary {
                let rows = merchandiseList.filter((m) => m && typeof m === "object") as Record<string, unknown>[];
                const targetSkusOnly = (targetMerchandiseCodes?.length ?? 0) > 0;
                if (targetSkusOnly) {
                  const set = new Set(targetMerchandiseCodes!.map((s) => s.toUpperCase()));
                  rows = rows.filter((r) => set.has(str(r.merchandiseCode).toUpperCase()));
                }

                let completedSkus = 0;
                let partialSkus = 0;
                let pendingSkus = 0;
                const anomalySkus: SkuPutawaySummary["anomalySkus"] = [];

                for (const row of rows) {
                  const parts = effectiveParts(row);
                  const expected = num(row.quantity) * parts;
                  const actual = num(row.actualQuantity) * parts;
                  const inspectionQty = num(row.inspectionQty) * parts;

                  if (actual >= expected && expected > 0) completedSkus++;
                  else if (actual > 0) partialSkus++;
                  else pendingSkus++;

                  if (expected > 0 && actual !== expected) {
                    anomalySkus.push({
                      merchandiseCode: str(row.merchandiseCode),
                      quantity: expected,
                      actualQuantity: actual,
                      inspectionQty: inspectionQty || undefined,
                    });
                  }
                }

                const totalSkus = rows.length;
                const putawayRate = totalSkus > 0 ? Math.round((completedSkus / totalSkus) * 100) / 100 : 0;

                return {
                  totalSkus,
                  completedSkus,
                  partialSkus,
                  pendingSkus,
                  putawayRate,
                  anomalySkus: anomalySkus.slice(0, 50),
                  targetSkusOnly,
                };
              }

              function aggregatePackagePutaway(
                order: Record<string, unknown>,
                packageListOverride?: unknown[]
              ): PackagePutawaySummary {
                const packageList =
                  packageListOverride ??
                  (order._packageListForAggregate as unknown[]) ??
                  (order.packageList as unknown[]) ??
                  [];
                const byStatus: Record<string, number> = {};
                const unshelved: PackagePutawaySummary["recentUnshelvedSample"] = [];

                for (const pkg of packageList) {
                  if (!pkg || typeof pkg !== "object") continue;
                  const p = pkg as Record<string, unknown>;
                  if (p._truncated) continue;
                  const status = str(p.status) || "UNKNOWN";
                  byStatus[status] = (byStatus[status] ?? 0) + 1;
                  const shelved = ["SCP", "SHD"].includes(status.toUpperCase());
                  if (!shelved && unshelved.length < 10) {
                    unshelved.push({
                      packageNo: str(p.packageNo) || undefined,
                      sellerCaseNo: str(p.sellerCaseNo) || undefined,
                      status,
                      unloadingTime: str(p.unloadingTime) || undefined,
                      shelvesTime: str(p.shelvesTime) || undefined,
                    });
                  }
                }

                const expectedPackages = num(order.totalPackageQty ?? order.orderPackageQty);
                const receivedPackages = num(order.actualOrderPackageQty) || packageList.length;

                return {
                  totalPackages: packageList.filter((p) => !(p as Record<string, unknown>)?._truncated).length,
                  byStatus,
                  recentUnshelvedSample: unshelved,
                  expectedPackages: expectedPackages || undefined,
                  receivedPackages: receivedPackages || undefined,
                  discrepancy:
                    expectedPackages > 0 ? expectedPackages - receivedPackages : undefined,
                };
              }

              /* coze-inline: node */
              /**
               * 节点：加急 SKU 列表路径剥离 packageList
               */


              const DEFAULT_DETAIL_LEVEL: DetailLevel = "sku_summary";

              async function main({ params }: { params: Record<string, unknown> }) {
                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const detailLevel = resolveDetailLevel(params, DEFAULT_DETAIL_LEVEL);

                const { rawOrderData: extracted, _detailExtractMeta } = extractInboundDetailBatch(rawOrderData, {
                  detailLevel,
                  targetMerchandiseCodes: params.targetMerchandiseCodes as string[] | undefined,
                });

                return { rawOrderData: extracted, _detailExtractMeta, detailLevel };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("extract-inbound-detail")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163003"
          node_outputs:
              rawOrderData:
                  type: object
                  value: null
              _detailExtractMeta:
                  type: object
                  value: null
              detailLevel:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163005"
      type: code
      title: prune-inbound-json
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1667
      parameters:
          code: |-
              /**
               * 节点：催上架专家入库单 JSON 剪枝
               * - 保留 inboundMerchandiseVos（供下期加急库存判定）
               * - 省略 inboundPackageVos 与冗余轨迹
               */

              interface PruneMeta {
                originalTrajectoryCount: number;
                retainedTrajectoryCount: number;
                merchandiseRetained: boolean;
              }

              const DEFAULT_MAX_TRAJECTORY = 20;

              function pruneOrder(
                order: Record<string, unknown>,
                maxTrajectory: number
              ): { order: Record<string, unknown>; meta: PruneMeta } {
                let originalTrajectoryCount = 0;
                let retainedTrajectoryCount = 0;
                const copy = { ...order };

                const traj = copy.trajectoryList;
                if (Array.isArray(traj)) {
                  originalTrajectoryCount = traj.length;
                  if (traj.length > maxTrajectory) {
                    copy.trajectoryList = traj.slice(-maxTrajectory);
                    retainedTrajectoryCount = maxTrajectory;
                    (copy as Record<string, unknown>)._trajectoryTruncated = true;
                  } else {
                    retainedTrajectoryCount = traj.length;
                  }
                }

                if (copy.inboundPackageVos != null) {
                  delete copy.inboundPackageVos;
                }

                const merchandiseRetained = copy.inboundMerchandiseVos != null;

                return {
                  order: copy,
                  meta: { originalTrajectoryCount, retainedTrajectoryCount, merchandiseRetained },
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const list = (rawOrderData.list as unknown[]) ?? [];
                const maxTrajectory =
                  typeof params.maxTrajectoryNodes === "number" && params.maxTrajectoryNodes >= 1
                    ? Math.floor(params.maxTrajectoryNodes)
                    : DEFAULT_MAX_TRAJECTORY;

                const prunedList: unknown[] = [];
                const metaList: PruneMeta[] = [];

                for (const item of list) {
                  if (!item || typeof item !== "object") continue;
                  const { order, meta } = pruneOrder(item as Record<string, unknown>, maxTrajectory);
                  prunedList.push(order);
                  metaList.push(meta);
                }

                const _pruneMeta = { orders: metaList };

                return {
                  prunedOrderData: { ...rawOrderData, list: prunedList, _pruneMeta },
                  _pruneMeta,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("prune-inbound-json")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163004"
              - name: maxTrajectoryNodes
                input:
                    value:
                        path: inputs.maxTrajectoryNodes
                        ref_node: "100001"
          node_outputs:
              prunedOrderData:
                  type: object
                  value: null
              _pruneMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163006"
      type: code
      title: evaluate-sla-breach
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1907
      parameters:
          code: |-
              /**
               * 节点：按 SLA 矩阵判定上架超时（dicDate vs now）
               * v1：仅 getOrderDetail；canRush 固定 null（库存 API 下期接入）
               */

              type OrderTypeKey = "standard" | "direct_domestic" | "direct_overseas";
              type RegionKey = "US" | "NON_US";

              function str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              function stringArray(value: unknown): string[] {
                return Array.isArray(value)
                  ? value.map((item) => str(item)).filter(Boolean)
                  : [];
              }

              function parseDate(v: unknown): Date | null {
                const s = str(v);
                if (!s) return null;
                const d = new Date(s);
                return Number.isNaN(d.getTime()) ? null : d;
              }

              function isWeekend(d: Date): boolean {
                const dow = d.getDay();
                return dow === 0 || dow === 6;
              }

              function countBusinessDaysBetween(start: Date, end: Date): number {
                let count = 0;
                const cur = new Date(start);
                cur.setHours(0, 0, 0, 0);
                const endDay = new Date(end);
                endDay.setHours(0, 0, 0, 0);
                while (cur < endDay) {
                  cur.setDate(cur.getDate() + 1);
                  if (!isWeekend(cur)) count++;
                }
                return count;
              }

              function inferRegion(destWhCode: string): RegionKey {
                return /^US/i.test(destWhCode) ? "US" : "NON_US";
              }

              function inferOrderType(order: Record<string, unknown>): OrderTypeKey {
                const raw = str(order.orderType ?? order.inboundType ?? order.inboundOrderType).toLowerCase();
                if (raw.includes("直发") && (raw.includes("海外") || raw.includes("overseas"))) return "direct_overseas";
                if (raw.includes("直发") || raw.includes("direct")) return "direct_domestic";
                return "standard";
              }

              function inferHeadwayBucket(order: Record<string, unknown>): string {
                const parts = [
                  order.headwayProduct,
                  order.winitProductName,
                  order.transportType,
                  order.logisticsProduct,
                  order.expressType,
                ]
                  .map(str)
                  .join(" ")
                  .toLowerCase();

                if (parts.includes("fedex") || parts.includes("空运") || parts.includes("air")) return "air_express";
                if (parts.includes("美森") || parts.includes("以星") || parts.includes("matson")) return "lcl_premium";
                if (parts.includes("ups")) return "ups";
                if (parts.includes("dhl")) return "dhl";
                if (parts.includes("空卡")) return "air_card";
                if (parts.includes("海卡") || parts.includes("海运整柜") || parts.includes("fcl")) return "sea_fcl";
                if (parts.includes("空派") || parts.includes("海派")) return "air_sea_parcel";
                if (parts.includes("海运") || parts.includes("铁路") || parts.includes("sea") || parts.includes("rail")) return "sea_rail";
                if (parts.includes("快递") || parts.includes("express")) return "express";
                if (!parts.trim()) return "unknown";
                return "other";
              }

              function lookupSlaWorkingDays(region: RegionKey, orderType: OrderTypeKey, headway: string): number {
                if (region === "US") {
                  if (orderType === "standard") {
                    if (headway === "air_express") return 1;
                    if (headway === "lcl_premium") return 2;
                    if (headway === "ups" || headway === "unknown") return 4;
                    if (headway === "sea_fcl" || headway === "sea_rail" || headway === "other") return 3;
                    return 3;
                  }
                  if (orderType === "direct_domestic") {
                    if (headway === "air_card" || headway === "dhl") return 1;
                    return 4;
                  }
                  if (orderType === "direct_overseas") {
                    if (headway === "air_card" || headway === "dhl") return 2;
                    return 5;
                  }
                }

                if (orderType === "standard") {
                  if (headway === "air_express" || headway === "express") return 1;
                  return 3;
                }
                if (orderType === "direct_domestic") {
                  if (headway === "air_card") return 1;
                  if (headway === "express") return 2;
                  if (headway === "sea_fcl" || headway === "sea_rail") return 3;
                  return 4;
                }
                if (orderType === "direct_overseas") {
                  if (headway === "air_card") return 2;
                  if (headway === "express") return 3;
                  if (headway === "sea_fcl" || headway === "sea_rail") return 4;
                  return 5;
                }
                return 3;
              }

              function resolveDicTime(order: Record<string, unknown>): string {
                return str(order.dicDate ?? order.awhDate ?? order.actualArrivalTime);
              }

              function isAlreadyPutaway(order: Record<string, unknown>): boolean {
                const status = str(order.status).toUpperCase();
                const shelveDone = str(order.shelveCompletedDate ?? order.dioDate);
                return Boolean(shelveDone) || status === "SHD";
              }

              function resolveEscalationPath(slaBreached: boolean, alreadyPutaway: boolean, status: string): string {
                if (alreadyPutaway) return "none_completed";
                if (str(status).toUpperCase() === "PEWC") return "await_inspection";
                if (slaBreached) return "ticket_winit_customer_service";
                return "wait_within_sla";
              }

              function evaluateOrder(order: Record<string, unknown>) {
                const orderNo = str(order.orderNo ?? order.inboundOrderNum);
                const currentStatus = str(order.status);
                const dicTime = resolveDicTime(order);
                const dicDate = parseDate(dicTime);
                const region = inferRegion(str(order.destWhCode));
                const orderType = inferOrderType(order);
                const headway = inferHeadwayBucket(order);
                const slaWorkingDays = lookupSlaWorkingDays(region, orderType, headway);
                const alreadyPutaway = isAlreadyPutaway(order);

                let workingDaysElapsed = 0;
                let slaBreached = false;
                const statusUpper = currentStatus.toUpperCase();

                if (dicDate && !alreadyPutaway && statusUpper !== "PEWC") {
                  workingDaysElapsed = countBusinessDaysBetween(dicDate, new Date());
                  slaBreached = workingDaysElapsed > slaWorkingDays;
                }

                if (statusUpper === "PEWC") {
                  workingDaysElapsed = 0;
                  slaBreached = false;
                }

                const escalationPath = resolveEscalationPath(slaBreached, alreadyPutaway, currentStatus);

                return {
                  orderNo,
                  currentStatus: currentStatus || null,
                  slaBreached,
                  slaWorkingDays,
                  workingDaysElapsed,
                  dicTime: dicTime || null,
                  alreadyPutaway,
                  escalationPath,
                  canRush: null as boolean | null,
                  canRushReason: "inventory_check_not_available",
                  stockCheckSummary: [] as Array<{ sku: string; qtyAvailable: number; isLowStock: boolean }>,
                  destWhCode: str(order.destWhCode) || null,
                  orderType,
                  headwayBucket: headway,
                  region,
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const prunedOrderData = (params.prunedOrderData ?? {}) as Record<string, unknown>;
                const list = (prunedOrderData.list as unknown[]) ?? [];

                const orders = list
                  .filter((item) => item && typeof item === "object")
                  .map((item) => evaluateOrder(item as Record<string, unknown>));

                if (orders.length === 0 && stringArray(params.inboundOrderNos).length > 0) {
                  return {
                    slaFacts: {
                      outputPath: "no_data",
                      dataAvailable: false,
                      needsClarification: true,
                      clarificationFields: ["inboundOrderNo"],
                      orderNo: "",
                      currentStatus: null,
                      slaBreached: null,
                      slaWorkingDays: null,
                      workingDaysElapsed: null,
                      dicTime: null,
                      alreadyPutaway: null,
                      escalationPath: "no_data",
                      canRush: null,
                      canRushReason: "order_facts_not_available",
                      stockCheckSummary: [],
                      orders: [],
                      orderCount: 0,
                    },
                  };
                }

                const primary = orders[0] ?? {
                  orderNo: "",
                  currentStatus: null,
                  slaBreached: false,
                  slaWorkingDays: 3,
                  workingDaysElapsed: 0,
                  dicTime: null,
                  alreadyPutaway: false,
                  escalationPath: "wait_within_sla",
                  canRush: null,
                  canRushReason: "inventory_check_not_available",
                  stockCheckSummary: [],
                };

                return {
                  slaFacts: {
                    ...primary,
                    orders,
                    orderCount: orders.length,
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("evaluate-sla-breach")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: prunedOrderData
                input:
                    value:
                        path: prunedOrderData
                        ref_node: "163005"
              - name: inboundOrderNos
                input:
                    value:
                        path: inboundOrderNos
                        ref_node: "163000"
          node_outputs:
              slaFacts:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163007"
      type: code
      title: load-putaway-expedite-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2147
      parameters:
          code: |-
              /**
               * 节点：按 SLA 事实加载催促/升级 KB 片段
               */

              const SLA_GUIDE = `# 上架 SLA 矩阵（内部判断，对客说「X 个工作日」）

              来源：咨询入库单上架时间及催上架处理流程.md

              到仓计时：dicDate（验收完成/到仓确认），PEWC 阶段 SLA 未开始。

              美国/非美国矩阵与 inbound-putaway-status 共享；最少 1 工作日，最多 5 工作日。
              不对客说「24 小时」固定时效。
              `;

              const ESCALATION_GUIDE = `# 超 SLA 升级 SOP

              触发：已到仓（非 PEWC）、未完成上架、workingDaysElapsed > slaWorkingDays。

              步骤：
              1. 致歉并说明已超标准 X 工作日时效
              2. 建议通过万邑联平台客服入口提交催架工单
              3. 工单需附：WI 单号、到仓时间、SKU/包裹明细（如有）
              4. 安排专人跟进并同步结果

              canRush 本期为 null（库存 API 未接入）：如需加急请工单说明 SKU 与活动节点。
              `;

              const PUTAWAY_PROGRESS_GUIDE = `# 时效内安抚话术

              - 仓库按收货情况排期，会在标准 SLA（X 工作日）内完成
              - 节假日不计入工作日
              - 仍在 PEWC：说明验收中，上架 SLA 尚未开始
              - 已完成上架：直接告知 shelveCompletedDate，不做无效催促
              `;

              const RUSH_CONDITIONS_GUIDE = `# 加急上架条件（下期 inventory API）

              确定性规则（代码计算，LLM 不推断 canRush）：
              - 须已到仓且未完成上架
              - 目的仓 SKU qtyAvailable <= 0 → 缺货，符合加急
              - qtyAvailable > 0 且 < safetyThreshold（默认 10）→ 濒临缺货
              - 全部 SKU 库存充足 → 不符合加急

              本期 v1：canRush=null，canRushReason=inventory_check_not_available。
              `;

              async function main({ params }: { params: Record<string, unknown> }) {
                const slaFacts = (params.slaFacts ?? {}) as Record<string, unknown>;
                const slaBreached = slaFacts.slaBreached === true;
                const alreadyPutaway = slaFacts.alreadyPutaway === true;

                let escalationGuide = ESCALATION_GUIDE;
                if (alreadyPutaway) {
                  escalationGuide = "已完成上架，无需升级催促。";
                } else if (!slaBreached) {
                  escalationGuide = "未超 SLA，优先使用时效内安抚话术；客户坚持可引导工单说明特殊情形。";
                }

                return {
                  slaGuide: SLA_GUIDE,
                  escalationGuide,
                  putawayProgressGuide: PUTAWAY_PROGRESS_GUIDE,
                  rushConditionsGuide: RUSH_CONDITIONS_GUIDE,
                  branch: alreadyPutaway ? "completed" : slaBreached ? "escalation" : "comfort",
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-putaway-expedite-kb")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: slaFacts
                input:
                    value:
                        path: slaFacts
                        ref_node: "163006"
          node_outputs:
              slaGuide:
                  type: string
                  value: null
              escalationGuide:
                  type: string
                  value: null
              putawayProgressGuide:
                  type: string
                  value: null
              rushConditionsGuide:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
