    - id: "163006"
      type: code
      title: prune-inbound-json
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1907
      parameters:
          code: |-
              /**
               * 节点：到仓专家入库单 JSON 剪枝
               * - includeTrajectory=false 时省略 trajectoryList
               * - focusPod=true 时仅保留 POD/签收/卸货相关轨迹节点
               */

              interface PruneMeta {
                originalTrajectoryCount: number;
                retainedTrajectoryCount: number;
                trajectoryOmitted: boolean;
                podFiltered: boolean;
              }

              const DEFAULT_MAX_TRAJECTORY = 20;

              const POD_KEYWORDS = ["pod", "签收", "卸货", "妥投", "收货", "delivery", "unload"];

              function isPodRelatedNode(node: Record<string, unknown>): boolean {
                const text = [
                  node.nodeName,
                  node.nodeDesc,
                  node.status,
                  node.remark,
                  node.eventName,
                  node.trajectoryDesc,
                ]
                  .filter((v) => v != null)
                  .join(" ")
                  .toLowerCase();
                if (node.podTime != null || node.podQty != null) return true;
                return POD_KEYWORDS.some((kw) => text.includes(kw));
              }

              function pruneOrder(
                order: Record<string, unknown>,
                maxTrajectory: number,
                includeTrajectory: boolean,
                focusPod: boolean
              ): { order: Record<string, unknown>; meta: PruneMeta } {
                let originalTrajectoryCount = 0;
                let retainedTrajectoryCount = 0;
                let trajectoryOmitted = false;
                let podFiltered = false;
                const copy = { ...order };

                if (!includeTrajectory && copy.trajectoryList != null) {
                  delete copy.trajectoryList;
                  trajectoryOmitted = true;
                } else {
                  const traj = copy.trajectoryList;
                  if (Array.isArray(traj)) {
                    originalTrajectoryCount = traj.length;
                    let working = traj as Record<string, unknown>[];
                    if (focusPod) {
                      working = working.filter((n) => n && typeof n === "object" && isPodRelatedNode(n as Record<string, unknown>));
                      podFiltered = true;
                    }
                    if (working.length > maxTrajectory) {
                      working = working.slice(-maxTrajectory);
                      (copy as Record<string, unknown>)._trajectoryTruncated = true;
                    }
                    copy.trajectoryList = working;
                    retainedTrajectoryCount = working.length;
                  }
                }

                if (copy.inboundPackageVos != null) {
                  delete copy.inboundPackageVos;
                }

                return {
                  order: copy,
                  meta: { originalTrajectoryCount, retainedTrajectoryCount, trajectoryOmitted, podFiltered },
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const list = (rawOrderData.list as unknown[]) ?? [];
                const maxTrajectory =
                  typeof params.maxTrajectoryNodes === "number" && params.maxTrajectoryNodes >= 1
                    ? Math.floor(params.maxTrajectoryNodes)
                    : DEFAULT_MAX_TRAJECTORY;
                const includeTrajectory = params.includeTrajectory !== false;
                const focusPod = params.focusPod === true;

                const prunedList: unknown[] = [];
                const metaList: PruneMeta[] = [];

                for (const item of list) {
                  if (!item || typeof item !== "object") continue;
                  const { order, meta } = pruneOrder(item as Record<string, unknown>, maxTrajectory, includeTrajectory, focusPod);
                  prunedList.push(order);
                  metaList.push(meta);
                }

                const _pruneMeta = { orders: metaList };

                return {
                  prunedOrderData: { ...rawOrderData, list: prunedList, _pruneMeta },
                  _pruneMeta,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("prune-inbound-json")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163004"
              - name: includeTrajectory
                input:
                    value:
                        path: inputs.includeTrajectory
                        ref_node: "100001"
              - name: focusPod
                input:
                    value:
                        path: inputs.focusPod
                        ref_node: "100001"
              - name: maxTrajectoryNodes
                input:
                    value:
                        path: inputs.maxTrajectoryNodes
                        ref_node: "100001"
          node_outputs:
              prunedOrderData:
                  type: object
                  value: null
              _pruneMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163007"
      type: code
      title: compute-arrival-milestones
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2147
      parameters:
          code: |-
              /**
               * 节点：确定性解析到仓里程碑（awhDate、POD、PEWC/EWC、包裹数对比）
               */

              type ArrivalPhase = "in_transit" | "arrived_pending" | "confirmed" | "unknown";

              const IN_TRANSIT_STATUSES = new Set(["DR", "OD", "RE", "TS"]);
              const ARRIVED_PENDING = "PEWC";
              const CONFIRMED_STATUSES = new Set(["EWC", "SHD"]);

              const TYPICAL_PEWC_WAIT_DAYS: Record<string, number> = {
                self: 2,
                domestic: 3,
                overseas: 5,
                default: 3,
              };

              function str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              function parseDate(v: unknown): Date | null {
                const s = str(v);
                if (!s) return null;
                const d = new Date(s);
                return Number.isNaN(d.getTime()) ? null : d;
              }

              function countBusinessDaysSince(start: Date, end: Date): number {
                let count = 0;
                const cur = new Date(start);
                cur.setHours(0, 0, 0, 0);
                const endDay = new Date(end);
                endDay.setHours(0, 0, 0, 0);
                while (cur < endDay) {
                  cur.setDate(cur.getDate() + 1);
                  const dow = cur.getDay();
                  if (dow !== 0 && dow !== 6) count++;
                }
                return count;
              }

              function inferInspectionWaitDays(order: Record<string, unknown>): number {
                const inspection = str(order.inspectionType ?? order.inspectionMode).toLowerCase();
                if (inspection.includes("海外") || inspection.includes("overseas")) return TYPICAL_PEWC_WAIT_DAYS.overseas;
                if (inspection.includes("自验") || inspection.includes("self")) return TYPICAL_PEWC_WAIT_DAYS.self;
                if (inspection.includes("国内") || inspection.includes("domestic")) return TYPICAL_PEWC_WAIT_DAYS.domestic;
                return TYPICAL_PEWC_WAIT_DAYS.default;
              }

              function inferArrivalPhase(status: string, awhDate: string): ArrivalPhase {
                const s = status.toUpperCase();
                if (CONFIRMED_STATUSES.has(s)) return "confirmed";
                if (s === ARRIVED_PENDING || awhDate) return "arrived_pending";
                if (IN_TRANSIT_STATUSES.has(s)) return "in_transit";
                return "unknown";
              }

              function extractPodSummary(order: Record<string, unknown>): Record<string, unknown> {
                let podTime = str(order.podTime ?? order.unloadTime ?? order.actualArrivalTime);
                let podQty = order.podQty ?? order.actualOrderPackageQty ?? null;

                const traj = order.trajectoryList;
                if (Array.isArray(traj)) {
                  for (const node of traj) {
                    if (!node || typeof node !== "object") continue;
                    const n = node as Record<string, unknown>;
                    const desc = [n.nodeName, n.nodeDesc, n.trajectoryDesc, n.remark].join(" ").toLowerCase();
                    if (!podTime && (n.podTime || n.eventTime || n.operateTime)) {
                      podTime = str(n.podTime ?? n.eventTime ?? n.operateTime);
                    }
                    if (podQty == null && n.podQty != null) podQty = n.podQty;
                    if (!podTime && (desc.includes("pod") || desc.includes("签收") || desc.includes("卸货"))) {
                      podTime = str(n.eventTime ?? n.operateTime ?? n.createTime);
                    }
                  }
                }

                const podAvailable = Boolean(podTime || (podQty != null && Number(podQty) > 0));

                return {
                  podTime: podTime || null,
                  podQty: podQty != null ? Number(podQty) : null,
                  podAvailable,
                };
              }

              function computePackageQtyComparison(
                order: Record<string, unknown>,
                packagePutawaySummary?: Record<string, unknown> | null
              ): { expectedPackages: number; receivedPackages: number; discrepancy: number } | null {
                if (packagePutawaySummary) {
                  const expected = Number(packagePutawaySummary.expectedPackages ?? 0);
                  const received = Number(packagePutawaySummary.receivedPackages ?? 0);
                  if (expected || received) {
                    return {
                      expectedPackages: expected,
                      receivedPackages: received,
                      discrepancy: Number(
                        packagePutawaySummary.discrepancy ?? Math.max(0, expected - received)
                      ),
                    };
                  }
                }
                const expected = Number(order.totalPackageQty ?? order.orderPackageQty ?? order.bookingPackageQty ?? 0);
                const received = Number(order.actualOrderPackageQty ?? order.receivedPackageQty ?? 0);
                if (!expected && !received) return null;
                return {
                  expectedPackages: expected,
                  receivedPackages: received,
                  discrepancy: Math.max(0, expected - received),
                };
              }

              function computeOrderFacts(
                order: Record<string, unknown>,
                checkPackageQty: boolean,
                packagePutawaySummary?: Record<string, unknown> | null
              ) {
                const orderNo = str(order.orderNo ?? order.inboundOrderNum ?? order.inboundOrderNo);
                const status = str(order.status);
                const awhDate = str(order.awhDate ?? order.actualArrivalTime ?? order.dicDate);
                const estimatedArrival = str(order.expectedSendwarehouseTime ?? order.estimatedArrivalTime);
                const bookingStatus = str(order.bookingStatus ?? order.appointmentStatus);
                const arrivalPhase = inferArrivalPhase(status, awhDate);
                const podSummary = extractPodSummary(order);

                let needsAttention = false;
                if (status.toUpperCase() === ARRIVED_PENDING && awhDate) {
                  const arrived = parseDate(awhDate);
                  if (arrived) {
                    const waitDays = inferInspectionWaitDays(order);
                    const elapsed = countBusinessDaysSince(arrived, new Date());
                    needsAttention = elapsed > waitDays;
                  }
                }

                const packageQtyComparison = checkPackageQty
                  ? computePackageQtyComparison(order, packagePutawaySummary)
                  : undefined;

                return {
                  orderNo,
                  arrivalPhase,
                  awhDate: awhDate || null,
                  estimatedArrival: estimatedArrival || null,
                  currentStatus: status || null,
                  bookingStatus: bookingStatus || null,
                  needsAttention,
                  podSummary,
                  packageQtyComparison: packageQtyComparison ?? null,
                  pickupDate: str(order.pickupDate) || null,
                  inspectionType: str(order.inspectionType) || null,
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const prunedOrderData = (params.prunedOrderData ?? {}) as Record<string, unknown>;
                const list = (prunedOrderData.list as unknown[]) ?? [];
                const checkPackageQty = params.checkPackageQty === true;
                const packagePutawaySummary = (params.packagePutawaySummary ?? null) as Record<string, unknown> | null;
                const requiresNarrowing = params.requiresNarrowing === true;

                const orders = list
                  .filter((item) => item && typeof item === "object")
                  .map((item) =>
                    computeOrderFacts(item as Record<string, unknown>, checkPackageQty, packagePutawaySummary)
                  );

                const primary = orders[0] ?? {
                  orderNo: "",
                  arrivalPhase: "unknown" as ArrivalPhase,
                  awhDate: null,
                  estimatedArrival: null,
                  currentStatus: null,
                  bookingStatus: null,
                  needsAttention: false,
                  podSummary: { podTime: null, podQty: null, podAvailable: false },
                  packageQtyComparison: null,
                };

                return {
                  arrivalFacts: {
                    ...primary,
                    orders,
                    orderCount: orders.length,
                    packagePutawaySummary: packagePutawaySummary ?? undefined,
                    requiresNarrowing,
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("compute-arrival-milestones")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: prunedOrderData
                input:
                    value:
                        path: prunedOrderData
                        ref_node: "163006"
              - name: checkPackageQty
                input:
                    value:
                        path: inputs.checkPackageQty
                        ref_node: "100001"
              - name: packagePutawaySummary
                input:
                    value:
                        path: packagePutawaySummary
                        ref_node: "163005"
              - name: requiresNarrowing
                input:
                    value:
                        path: requiresNarrowing
                        ref_node: "163004"
          node_outputs:
              arrivalFacts:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163008"
      type: code
      title: load-arrival-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2387
      parameters:
          code: |-
              /**
               * 节点：加载到仓状态 KB 片段（与 prompts/*.md 同步）
               */

              const PEWC_RULES = `# PEWC 等待规则

              | 验货类型 | 典型等待期（工作日）| 说明 |
              |----------|-------------------|------|
              | 客户自验 | 约 2 日 | 等待客户确认或系统对接 |
              | 国内标准验 | 约 3 日 | 国内验货完成后转海外流程 |
              | 海外验 | 约 5 日 | 海外验货可达数个工作日，属常见现象 |

              **不设固定 48h 告警**。needsAttention 由代码节点根据验货类型 + 实际停留工作日综合判定。

              PEWC 含义：货物已到海外仓，处于验货/待确认阶段，尚未完成验收转 EWC。
              `;

              const EWC_TRANSITION_GUIDE = `# PEWC → EWC 转换条件

              1. 仓库完成卸货/签收扫描（可能出现 awhDate）
              2. 验货流程完成（自验确认 / 国内验 / 海外验结果录入）
              3. OMS 状态由 PEWC 更新为 EWC

              EWC 含义：验收完成，进入上架排期阶段（上架进度见 inbound-putaway-status 专家）。
              `;

              const POD_GUIDE = `# POD / 签收证明解读

              | 字段 | 含义 |
              |------|------|
              | podTime | 签收/卸货时间 |
              | podQty | 签收包裹数量 |
              | actualOrderPackageQty | 实收包裹数 |

              POD 可用判定：podTime 非空或 podQty > 0。

              注意：
              - UPS 官网「妥投」可能为站点装柜时间，非实际派送日
              - POD 扫描件附件可能不在 getOrderDetail 响应中（Gap）
              - 直发场景客户无法提供 POD 时，需联系货代或仓库运营核实
              `;

              const DIRECT_SHIPMENT_GUIDE = `# 直发少包裹确认流程

              1. 确认签收地址是否为万邑通直发收货地址
              2. 对比 orderPackageQty（预约/预报）与 actualOrderPackageQty（实收）
              3. discrepancy > 0 时：收集 WI 号、快递单号、承运商、POD 截图
              4. 查区域云仓 → POD 卸货记录 / 卸货包裹记录
              5. 无法定位时建议转 inbound-exception-check 专家

              不输出索赔建议；需人工时说明「可联系仓库运营核实」。
              `;

              const TRAJECTORY_GUIDE = `# 入库轨迹节点对照

              | 节点/状态 | 中文含义 |
              |-----------|----------|
              | TS | 已发运/国际在途 |
              | PEWC | 预计到仓期/已到仓验货中 |
              | EWC | 验收完成/待上架或上架中 |
              | SHD | 已入库存可用 |

              轨迹被剪枝时须说明 isTruncated，不臆断缺失节点。
              `;

              async function main() {
                return {
                  pewcRules: PEWC_RULES,
                  ewcTransitionGuide: EWC_TRANSITION_GUIDE,
                  podGuide: POD_GUIDE,
                  directShipmentGuide: DIRECT_SHIPMENT_GUIDE,
                  trajectoryGuide: TRAJECTORY_GUIDE,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-arrival-kb")) {
                main().then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs: []
          node_outputs:
              pewcRules:
                  type: string
                  value: null
              ewcTransitionGuide:
                  type: string
                  value: null
              podGuide:
                  type: string
                  value: null
              directShipmentGuide:
                  type: string
                  value: null
              trajectoryGuide:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
