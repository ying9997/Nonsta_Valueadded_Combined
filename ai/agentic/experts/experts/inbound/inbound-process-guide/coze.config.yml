# 入库流程与规则指引 — Coze 工作流包导出
# 导出：npm run export:coze -- experts/inbound/inbound-process-guide

yamlBasename: inbound_process_guide-draft.yaml
packageMainName: inbound_process_guide
packageDescription: 入库流程与规则指引（validate → load-kb → LLM → format）

textNodes:
  - logicalId: kb-process-text
    title: kb-process
    insertAfter: validate-guide-query
    sourceFile: prompts/kb-process.md
  - logicalId: kb-fees-text
    title: kb-fees
    insertAfter: validate-guide-query
    sourceFile: prompts/kb-fees.md
  - logicalId: kb-restrictions-text
    title: kb-restrictions
    insertAfter: validate-guide-query
    sourceFile: prompts/kb-restrictions.md

inputBindings:
  load-process-kb:
    kbProcess:
      ref: kb-process-text
      path: output
    kbFees:
      ref: kb-fees-text
      path: output
    kbRestrictions:
      ref: kb-restrictions-text
      path: output

endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext

positions:
  __start__:
    x: -150
    y: 230
  __end__:
    x: 1200
    y: 310
  validate-guide-query:
    x: 200
    y: 310
  kb-process-text:
    x: 200
    y: 480
  kb-fees-text:
    x: 200
    y: 620
  kb-restrictions-text:
    x: 200
    y: 760
  load-process-kb:
    x: 550
    y: 310
  llm-analyze:
    x: 850
    y: 310
  format-output:
    x: 1050
    y: 310
