                        path: country
                        ref_node: "163000"
              - name: productLine
                input:
                    value:
                        path: productLine
                        ref_node: "163000"
              - name: subTopic
                input:
                    value:
                        path: subTopic
                        ref_node: "163000"
              - name: kbProcess
                input:
                    value:
                        path: output
                        ref_node: "163001"
              - name: kbFees
                input:
                    value:
                        path: output
                        ref_node: "163002"
              - name: kbRestrictions
                input:
                    value:
                        path: output
                        ref_node: "163003"
          node_outputs:
              kbContent:
                  type: string
                  value: null
              kbScope:
                  type: string
                  value: null
