    - id: "163004"
      type: code
      title: fetch-available-product
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1427
      parameters:
          code: |-
              /**
               * 节点：本地 Runner 补拉 winit.wh.pms.getWinitProducts（无插件输出时走 Coze workflow/run 代理）
               * 返回 data 为产品数组：{ productCode, productName, description }
               * FaaS 单文件闭环，无 external import。
               */

              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              const GET_WINIT_PRODUCTS_ACTION = "winit.wh.pms.getWinitProducts";

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function coerceListPayload(parsed: unknown): unknown[] {
                if (parsed == null) return [];
                if (Array.isArray(parsed)) return parsed;
                if (typeof parsed !== "object") return [];

                const o = parsed as Record<string, unknown>;
                if (o.output != null) return coerceListPayload(o.output);

                if (o.code === "0" || o.code === 0) {
                  const inner = o.data;
                  if (Array.isArray(inner)) return inner;
                  if (typeof inner === "string") {
                    try {
                      return coerceListPayload(JSON.parse(inner));
                    } catch {
                      return [];
                    }
                  }
                  if (inner != null && typeof inner === "object") return coerceListPayload(inner);
                  return [];
                }

                if (Array.isArray(o.list)) return o.list;
                if (Array.isArray(o.data)) return o.data;
                return [];
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipApi === true) {
                  return { rawPscData: { list: [], total: 0, _fetchMeta: { strategy: "skipped" } } };
                }

                const pluginList = params.winitPluginOutputList;
                if (Array.isArray(pluginList) && pluginList.length > 0) {
                  const list: unknown[] = [];
                  for (const item of pluginList as Array<{ data?: unknown }>) {
                    const parsed = parseCozeWorkflowDataField(item?.data);
                    list.push(...coerceListPayload(parsed));
                  }
                  return {
                    rawPscData: {
                      list,
                      total: list.length,
                      _fetchMeta: { strategy: "plugin-batch", resolvedCount: list.length },
                    },
                  };
                }

                const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                  action: string;
                  data: string;
                }>;
                const env = getCozeWinitEnv();
                if (!env || actions.length === 0) {
                  return {
                    rawPscData: {
                      list: [],
                      total: 0,
                      _fetchMeta: { strategy: "local-fetch-skipped", reason: "missing Coze env or actions" },
                    },
                  };
                }

                const errors: string[] = [];
                const list: unknown[] = [];
                for (const act of actions) {
                  try {
                    const data = JSON.parse(act.data) as Record<string, unknown>;
                    const parsed = await runCozeWinitWorkflow(env, act.action || GET_WINIT_PRODUCTS_ACTION, data);
                    list.push(...coerceListPayload(parsed));
                  } catch (e) {
                    errors.push(String(e instanceof Error ? e.message : e));
                  }
                }

                return {
                  rawPscData: {
                    list,
                    total: list.length,
                    _fetchMeta: {
                      strategy: "local-proxy",
                      resolvedCount: list.length,
                      errors: errors.length ? errors : undefined,
                    },
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-available-product")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163002"
              - name: actions
                input:
                    value:
                        path: actions
                        ref_node: "163002"
              - name: actionPlans
                input:
                    value:
                        path: actionPlans
                        ref_node: "163002"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163003"
          node_outputs:
              rawPscData:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163005"
      type: code
      title: merge-available-product
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1667
      parameters:
          code: |-
              /**
               * 节点：merge-get-winit-products — 解析 getWinitProducts 响应、过滤、计算权限标记
               * API 仅返回可下单产品（无 enabled 字段）；未出现在结果中的 filterCode 视为未开通。
               * FaaS 单文件闭环，无 external import。
               */

              type PscRow = {
                productCode: string;
                productName: string;
                description: string;
                enabled: boolean;
                productType: string;
                inspectionType: string;
              };

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function inferProductType(code: string): string {
                if (code.startsWith("OW0101")) return "OW0101";
                if (code.startsWith("OW0102") || code.startsWith("OW0104")) return "OW0102";
                if (code.startsWith("OW0103")) return "OW0103";
                return "";
              }

              function inferInspectionType(code: string): string {
                if (code.startsWith("OW01021")) return "self_inspection_winit_carrier";
                if (code.startsWith("OW01022")) return "self_inspection_direct";
                if (code.startsWith("OW0102")) return "self_inspection";
                if (code.startsWith("OW01031")) return "overseas_inspection_winit_carrier";
                if (code.startsWith("OW01032")) return "overseas_inspection_direct";
                if (code.startsWith("OW0103") || code.startsWith("OW0104")) return "overseas_inspection";
                if (code.startsWith("OW0101")) return "standard_first_leg";
                return "other";
              }

              function matchesCodeFilter(productCode: string, filterCode: string): boolean {
                const fc = filterCode.toUpperCase();
                const pc = productCode.toUpperCase();
                return pc === fc || pc.startsWith(fc);
              }

              function matchesProductLine(row: PscRow, productLine: string): boolean {
                if (!productLine) return true;
                const pl = productLine.toLowerCase();
                if (pl.includes("自验") || pl === "si" || pl === "qsi") {
                  return row.productCode.startsWith("OW0102");
                }
                if (pl.includes("海外验")) {
                  return row.productCode.startsWith("OW0103") || row.productCode.startsWith("OW0104");
                }
                if (pl.includes("头程") || pl.includes("标准")) {
                  return row.productCode.startsWith("OW0101");
                }
                if (/^OW01/.test(productLine.toUpperCase())) {
                  return matchesCodeFilter(row.productCode, productLine.toUpperCase());
                }
                return true;
              }

              function normalizeRow(raw: unknown): PscRow | null {
                if (!raw || typeof raw !== "object") return null;
                const o = raw as Record<string, unknown>;
                const productCode = str(o.productCode ?? o.pscCode ?? o.code).toUpperCase();
                if (!productCode) return null;

                return {
                  productCode,
                  productName: str(o.productName ?? o.name),
                  description: str(o.description),
                  enabled: true,
                  productType: str(o.productType) || inferProductType(productCode),
                  inspectionType: str(o.inspectionType) || inferInspectionType(productCode),
                };
              }

              function dedupeRows(rows: PscRow[]): PscRow[] {
                const seen = new Set<string>();
                const out: PscRow[] = [];
                for (const row of rows) {
                  if (seen.has(row.productCode)) continue;
                  seen.add(row.productCode);
                  out.push(row);
                }
                return out;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const filterCodes = ((params.filterCodes as string[]) ?? []).map((c) => c.toUpperCase());
                const productLine = str(params.productLine);
                const warehouseCode = str(params.warehouseCode).toUpperCase();
                const country = str(params.country);

                if (params.skipApi === true) {
                  return {
                    pscList: [],
                    pscFacts: {
                      enabledProducts: [],
                      disabledProducts: [],
                      hasSelfInspection: false,
                      hasOverseasInspection: false,
                      hasStandardFirstLeg: false,
                      apiAvailable: false,
                      queryWarehouseCode: warehouseCode,
                      queryCountry: country,
                      apiAction: "winit.wh.pms.getWinitProducts",
                    },
                    apiAvailable: false,
                  };
                }

                const rawPscData = (params.rawPscData ?? {}) as Record<string, unknown>;
                const rawList = Array.isArray(rawPscData.list) ? rawPscData.list : [];
                const allRows = dedupeRows(
                  rawList.map(normalizeRow).filter((row): row is PscRow => row != null)
                );

                const fetchMeta = (rawPscData._fetchMeta ?? {}) as Record<string, unknown>;
                const hadSuccessfulFetch =
                  allRows.length > 0 ||
                  fetchMeta.strategy === "plugin-batch" ||
                  fetchMeta.strategy === "local-proxy";

                let filtered = allRows.filter((r) => matchesProductLine(r, productLine));
                if (filterCodes.length > 0) {
                  filtered = filtered.filter((r) => filterCodes.some((fc) => matchesCodeFilter(r.productCode, fc)));
                }

                const enabledProducts = filtered.map((r) => ({
                  productCode: r.productCode,
                  productName: r.productName,
                  description: r.description,
                  productType: r.productType,
                  inspectionType: r.inspectionType,
                }));

                const disabledProducts: Array<{
                  productCode: string;
                  productName: string;
                  inspectionType: string;
                }> = [];

                if (filterCodes.length > 0 && hadSuccessfulFetch) {
                  for (const fc of filterCodes) {
                    const hasMatch = allRows.some((r) => matchesCodeFilter(r.productCode, fc));
                    if (!hasMatch) {
                      disabledProducts.push({
                        productCode: fc,
                        productName: "",
                        inspectionType: inferInspectionType(fc),
                      });
                    }
                  }
                }

                const hasSelfInspection = allRows.some((r) => r.productCode.startsWith("OW0102"));
                const hasOverseasInspection = allRows.some(
                  (r) => r.productCode.startsWith("OW0103") || r.productCode.startsWith("OW0104")
                );
                const hasStandardFirstLeg = allRows.some((r) => r.productCode.startsWith("OW0101"));

                return {
                  pscList: filtered,
                  pscFacts: {
                    enabledProducts,
                    disabledProducts,
                    hasSelfInspection,
                    hasOverseasInspection,
                    hasStandardFirstLeg,
                    apiAvailable: hadSuccessfulFetch,
                    queryWarehouseCode: warehouseCode,
                    queryCountry: country,
                    totalFromApi: allRows.length,
                    apiAction: "winit.wh.pms.getWinitProducts",
                  },
                  apiAvailable: hadSuccessfulFetch,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("merge-available-product")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163002"
              - name: rawPscData
                input:
                    value:
                        path: rawPscData
                        ref_node: "163004"
              - name: filterCodes
                input:
                    value:
                        path: filterCodes
                        ref_node: "163000"
              - name: productLine
                input:
                    value:
                        path: productLine
                        ref_node: "163000"
              - name: warehouseCode
                input:
                    value:
                        path: warehouseCode
                        ref_node: "163000"
              - name: country
                input:
                    value:
                        path: country
                        ref_node: "163000"
          node_outputs:
              pscList:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              pscFacts:
                  type: object
                  value: null
              apiAvailable:
                  type: boolean
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163006"
      type: code
      title: load-psc-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1907
      parameters:
          code: |-
              /**
               * 节点：load-psc-kb — 从 kb-psc-products 语料提取 PSC 编码对照
               * FaaS 单文件闭环，无外部 import。
               */

              function str(v: unknown): string {
                return typeof v === "string" ? v : "";
              }

              function parseCodeMap(kb: string): Record<string, { name: string; inspectionType: string; scene: string }> {
                const map: Record<string, { name: string; inspectionType: string; scene: string }> = {};
                const rowPattern = /\|\s*(OW01\d+)\s*\|\s*([^|]+)\|\s*([^|]+)\|\s*([^|]+)\|/g;
                let m: RegExpExecArray | null;
                while ((m = rowPattern.exec(kb)) !== null) {
                  const code = m[1].trim().toUpperCase();
                  map[code] = {
                    name: m[2].trim(),
                    inspectionType: m[3].trim(),
                    scene: m[4].trim(),
                  };
                }
                return map;
              }

              function filterKbByKeywords(kb: string, keywords: string[]): string {
                if (!kb || keywords.length === 0) return kb;
                const lines = kb.split("\n");
                const hits = new Set<number>();
                const lowerKeywords = keywords.map((k) => k.toLowerCase()).filter(Boolean);
                for (let i = 0; i < lines.length; i++) {
                  const line = lines[i].toLowerCase();
                  if (lowerKeywords.some((k) => line.includes(k))) {
                    for (let j = Math.max(0, i - 1); j <= Math.min(lines.length - 1, i + 2); j++) hits.add(j);
                  }
                }
                if (hits.size === 0) return kb;
                return Array.from(hits)
                  .sort((a, b) => a - b)
                  .map((i) => lines[i])
                  .join("\n");
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const kbPscProducts = str(params.kbPscProducts);
                const productLine = str(params.productLine);
                const country = str(params.country);
                const keywords = [productLine, country].filter(Boolean);
                const filteredKb = filterKbByKeywords(kbPscProducts, keywords);
                const pscCodeMap = parseCodeMap(kbPscProducts);

                return {
                  pscCodeMap,
                  kbScope: productLine ? `psc:${productLine}` : country ? `country:${country}` : "full",
                  kbExcerpt: filteredKb.slice(0, 8000),
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-psc-kb")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: validationOk
                input:
                    value:
                        path: validationOk
                        ref_node: "163000"
              - name: productLine
                input:
                    value:
                        path: productLine
                        ref_node: "163000"
              - name: country
                input:
                    value:
                        path: country
                        ref_node: "163000"
              - name: kbPscProducts
                input:
                    value:
                        path: output
                        ref_node: "163001"
          node_outputs:
              pscCodeMap:
                  type: object
                  value: null
              kbScope:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
