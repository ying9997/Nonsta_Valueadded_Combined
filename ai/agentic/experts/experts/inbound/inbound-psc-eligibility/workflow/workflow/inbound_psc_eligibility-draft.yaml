    - id: "163000"
      type: code
      title: validate-psc-query
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 467
      parameters:
          code: |-
              /**
               * 节点：validate-psc-query — 规范化 warehouseCode / country / productLine / filterCodes
               * FaaS 单文件闭环，无外部 import。
               */

              const SELF_INSPECTION_CODES = new Set(["OW01021", "OW01022"]);
              const OVERSEAS_INSPECTION_CODES = new Set(["OW01031", "OW01032"]);

              const PRODUCT_LINE_ALIASES: Record<string, string[]> = {
                自验: ["OW01021", "OW01022"],
                SI: ["OW01021"],
                QSI: ["OW01022"],
                快速自验: ["OW01022"],
                海外验: ["OW01031", "OW01032"],
                头程: ["OW01011"],
                标准头程: ["OW01011"],
              };

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function normalizeWarehouseCode(raw: unknown): string {
                const s = str(raw);
                return s ? s.toUpperCase().replace(/[\s_-]+/g, "") : "";
              }

              function normalizeCountry(raw: unknown): string {
                const s = str(raw).toUpperCase();
                if (!s) return "";
                const aliases: Record<string, string> = {
                  GB: "UK",
                  USA: "US",
                  UNITEDSTATES: "US",
                  UNITEDKINGDOM: "UK",
                  GERMANY: "DE",
                  DEU: "DE",
                  AUSTRALIA: "AU",
                  CANADA: "CA",
                  BELGIUM: "BE",
                  英国: "UK",
                  美国: "US",
                  德国: "DE",
                  澳洲: "AU",
                  澳大利亚: "AU",
                  加拿大: "CA",
                  比利时: "BE",
                };
                if (aliases[s]) return aliases[s];
                return /^[A-Z]{2}$/.test(s) ? s : "";
              }

              function coerceStringArray(raw: unknown): string[] {
                if (Array.isArray(raw)) {
                  return raw.map((x) => String(x).trim()).filter(Boolean);
                }
                if (typeof raw === "string" && raw.trim()) {
                  try {
                    const p = JSON.parse(raw) as unknown;
                    if (Array.isArray(p)) return p.map((x) => String(x).trim()).filter(Boolean);
                  } catch {
                    return raw
                      .split(/[,，、\s]+/)
                      .map((x) => x.trim())
                      .filter(Boolean);
                  }
                }
                return [];
              }

              function expandProductLine(productLine: string): string[] {
                if (!productLine) return [];
                const upper = productLine.toUpperCase();
                if (/^OW01\d+/.test(upper)) return [upper];
                for (const [key, codes] of Object.entries(PRODUCT_LINE_ALIASES)) {
                  if (productLine.includes(key) || upper === key.toUpperCase()) return codes;
                }
                return [];
              }

              function mergeFilterCodes(filterCodes: string[], productLine: string): string[] {
                const seen = new Set<string>();
                const out: string[] = [];
                for (const c of [...filterCodes, ...expandProductLine(productLine)]) {
                  const code = c.toUpperCase();
                  if (!seen.has(code)) {
                    seen.add(code);
                    out.push(code);
                  }
                }
                return out;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const warehouseCode = normalizeWarehouseCode(params.warehouseCode);
                const country = normalizeCountry(params.country);
                const productLine = str(params.productLine);
                const filterCodes = mergeFilterCodes(coerceStringArray(params.filterCodes), productLine);
                const customerIntent = str(params.customerIntent);
                const query = str(params.query);
                const inputContext = params.inputContext ?? {};

                return {
                  validationOk: true,
                  warehouseCode,
                  country,
                  productLine,
                  filterCodes,
                  query,
                  customerIntent,
                  inputContext,
                  _meta: {
                    hasWarehouseFilter: warehouseCode.length > 0,
                    hasCodeFilter: filterCodes.length > 0,
                    selfInspectionCodes: Array.from(SELF_INSPECTION_CODES),
                    overseasInspectionCodes: Array.from(OVERSEAS_INSPECTION_CODES),
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("validate-psc-query")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e);
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: warehouseCode
                input:
                    value:
                        path: inputs.warehouseCode
                        ref_node: "100001"
              - name: country
                input:
                    value:
                        path: inputs.country
                        ref_node: "100001"
              - name: productLine
                input:
                    value:
                        path: inputs.productLine
                        ref_node: "100001"
              - name: filterCodes
                input:
                    value:
                        path: inputs.filterCodes
                        ref_node: "100001"
              - name: query
                input:
                    value:
                        path: query
                        ref_node: "100001"
              - name: customerIntent
                input:
                    value:
                        path: customerIntent
                        ref_node: "100001"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "100001"
          node_outputs:
              validationOk:
                  type: boolean
                  value: null
              error:
                  type: string
                  value: null
              warehouseCode:
                  type: string
                  value: null
              country:
                  type: string
                  value: null
              productLine:
                  type: string
                  value: null
              filterCodes:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              query:
                  type: string
                  value: null
              customerIntent:
                  type: string
                  value: null
              inputContext:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163001"
      type: text
      title: kb-psc-products
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 480
          y: 707
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # 入库 PSC 产品线对照表

                        > API：`winit.wh.pms.getWinitProducts`（[查询头程服务](https://developer.winit.com.cn/document/detail/id/28.html)）

                        ## productType 与产品线

                        | productType | 产品线 | 说明 |
                        |-------------|--------|------|
                        | OW0101 | 标准海外仓入库 | Winit 头程全托管，返回 OW0101* 具体 PSC |
                        | OW0102 | 直发自验入库 | 返回 OW01021*（Winit 承运自验）、OW01022*（卖家直发自验）等 |
                        | OW0103 | 直发海外验入库 | 返回 OW01031*、OW01032* 等 |

                        接口按 `productType` 分三次查询（或按 filter 只查相关类型）；**仅返回当前 app_key 可下单的产品**，无 `enabled` 字段。

                        ## 权限标记规则（由 productCode 前缀推断）

                        - **自验权限**（`hasSelfInspection`）：存在任意 `OW0102*` 产品
                        - **海外验权限**（`hasOverseasInspection`）：存在任意 `OW0103*` / `OW0104*` 产品
                        - **标准头程**（`hasStandardFirstLeg`）：存在任意 `OW0101*` 产品

                        家族编码对照（filterCodes 常用）：

                        | 家族编码 | 含义 | productCode 前缀 |
                        |----------|------|------------------|
                        | OW01011 | 标准头程 | OW0101* |
                        | OW01021 | Winit 承运自验 | OW01021* |
                        | OW01022 | 卖家直发自验 | OW01022* |
                        | OW01031 | Winit 承运海外验 | OW01031* |
                        | OW01032 | 直发海外验 | OW01032* |

                        ## 对客原则

                        - 简洁列举 API 返回的可下单产品及中文名称
                        - 客户问某家族编码（如 OW01021）但 API 无匹配产品时，说明未开通并提示「如需申请，请通过万邑联客服渠道申请」
                        - 不输出额度数字；额度查询见 inbound-capacity-availability
                        - 本接口不含仓库维度；`warehouseCode` 仅作上下文，不用于 API 过滤

                        ## 客户自助查看路径

                        万邑联 → 个人中心 → 产品权限
              - name: arrayItemConcatChar
                input:
                    type: string
                    value: ，
              - name: allArrayItemConcatChars
                input:
                    type: list
                    items:
                        type: object
                        value: null
                    value:
                        - isDefault: true
                          label: 换行
                          value: |+
                              
                        - isDefault: true
                          label: 制表符
                          value: "\t"
                        - isDefault: true
                          label: 句号
                          value: 。
                        - isDefault: true
                          label: 逗号
                          value: ，
                        - isDefault: true
                          label: 分号
                          value: ；
                        - isDefault: true
                          label: 空格
                          value: " "
          method: concat
          node_outputs:
              output:
                  type: string
                  value: null
    - id: "163002"
      type: code
      title: build-available-product-request
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 947
      parameters:
          code: |-
              /**
               * 节点：为 winit.wh.pms.getWinitProducts 组装插件批处理动作
               * 文档：https://developer.winit.com.cn/document/detail/id/28.html
               * FaaS 单文件闭环，无 external import。
               */

              const GET_WINIT_PRODUCTS_ACTION = "winit.wh.pms.getWinitProducts";

              const ALL_PRODUCT_TYPES = ["OW0101", "OW0102", "OW0103"] as const;

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function coerceStringArray(raw: unknown): string[] {
                if (Array.isArray(raw)) return raw.map((x) => String(x).trim()).filter(Boolean);
                return [];
              }

              /** 将 filterCodes / productLine 映射为 getWinitProducts 的 productType 入参 */
              function resolveProductTypes(filterCodes: string[], productLine: string): string[] {
                const hints = [...filterCodes, productLine].map((h) => h.toUpperCase()).filter(Boolean);
                if (hints.length === 0) return [...ALL_PRODUCT_TYPES];

                const types = new Set<string>();
                for (const h of hints) {
                  if (h.startsWith("OW0101") || h.includes("头程") || h.includes("标准")) types.add("OW0101");
                  if (
                    h.startsWith("OW0102") ||
                    h === "OW01021" ||
                    h === "OW01022" ||
                    h.includes("自验") ||
                    h === "SI" ||
                    h === "QSI"
                  ) {
                    types.add("OW0102");
                  }
                  if (
                    h.startsWith("OW0103") ||
                    h.startsWith("OW0104") ||
                    h === "OW01031" ||
                    h === "OW01032" ||
                    h.includes("海外验")
                  ) {
                    types.add("OW0103");
                  }
                }

                return types.size > 0 ? Array.from(types) : [...ALL_PRODUCT_TYPES];
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const skipApi = params.validationOk !== true;

                if (skipApi) {
                  return {
                    actions: [],
                    actionPlans: [],
                    winitPluginBatchActionsCount: 0,
                    actionName: GET_WINIT_PRODUCTS_ACTION,
                    skipApi: true,
                    productTypes: [],
                  };
                }

                const filterCodes = coerceStringArray(params.filterCodes).map((c) => c.toUpperCase());
                const productLine = str(params.productLine);
                const productTypes = resolveProductTypes(filterCodes, productLine);

                const actions = productTypes.map((productType) => ({
                  action: GET_WINIT_PRODUCTS_ACTION,
                  data: JSON.stringify({ productType }),
                }));

                const actionPlans = productTypes.map((productType) => ({
                  inputToken: productType,
                  queryBy: "getWinitProducts" as const,
                  productType,
                }));

                return {
                  actions,
                  actionPlans,
                  winitPluginBatchActionsCount: actions.length,
                  actionName: GET_WINIT_PRODUCTS_ACTION,
                  skipApi: false,
                  productTypes,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("build-available-product-request")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: validationOk
                input:
                    value:
                        path: validationOk
                        ref_node: "163000"
              - name: filterCodes
                input:
                    value:
                        path: filterCodes
                        ref_node: "163000"
              - name: productLine
                input:
                    value:
                        path: productLine
                        ref_node: "163000"
          node_outputs:
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              actionPlans:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              winitPluginBatchActionsCount:
                  type: integer
                  value: null
              actionName:
                  type: string
                  value: null
              skipApi:
                  type: boolean
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
