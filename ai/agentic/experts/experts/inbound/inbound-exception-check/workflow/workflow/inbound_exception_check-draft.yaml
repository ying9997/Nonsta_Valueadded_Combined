                    list: signedList,
                    total: total || signedList.length,
                    _fetchMeta: {
                      strategy: "local-proxy",
                      status,
                      requestCount: actions.length,
                      resolvedCount: signedList.length,
                      emptySuccessCount,
                      apiErrorCount,
                      parseErrorCount,
                      errors: errors.length ? errors : undefined,
                    },
                  },
                };
              }

