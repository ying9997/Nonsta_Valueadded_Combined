    - id: "163000"
      type: code
      title: resolve-inbound-lookup
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 467
      parameters:
          code: |-
              /**
               * 节点：规范化入库单查询标识
               * FaaS 单文件闭环，无外部 import。
               */

              function isWiOrderToken(raw: string): boolean {
                return /^WI/i.test(raw.trim());
              }

              function normalizeWiOrderNum(raw: string): string {
                return raw.trim().toUpperCase();
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const raw = ((params.inboundOrderNos as string[]) ?? [])
                  .map((o) => String(o ?? "").trim())
                  .filter(Boolean);

                const queryAllExceptions = params.queryAllExceptions === true;
                const wiSeen = new Set<string>();
                const refSeen = new Set<string>();
                const wiOrderNos: string[] = [];
                const customerRefNos: string[] = [];
                const entries: Array<{ input: string; normalized: string; kind: "wi" | "customerRef" }> = [];

                for (const token of raw) {
                  if (isWiOrderToken(token)) {
                    const normalized = normalizeWiOrderNum(token);
                    entries.push({ input: token, normalized, kind: "wi" });
                    if (!wiSeen.has(normalized)) {
                      wiSeen.add(normalized);
                      wiOrderNos.push(normalized);
                    }
                  } else {
                    const normalized = token.trim();
                    entries.push({ input: token, normalized, kind: "customerRef" });
                    if (!refSeen.has(normalized)) {
                      refSeen.add(normalized);
                      customerRefNos.push(normalized);
                    }
                  }
                }

                const hasOrders = wiOrderNos.length > 0 || customerRefNos.length > 0;
                const useListMode = queryAllExceptions && !hasOrders;

                return {
                  wiOrderNos,
                  customerRefNos,
                  inboundOrderNos: [...wiOrderNos, ...customerRefNos],
                  useListMode,
                  lookupMeta: { entries, hasOrders, queryAllExceptions, useListMode },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("resolve-inbound-lookup")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: inboundOrderNos
                input:
                    value:
                        path: inputs.inboundOrderNos
                        ref_node: "100001"
              - name: queryAllExceptions
                input:
                    value:
                        path: inputs.queryAllExceptions
                        ref_node: "100001"
          node_outputs:
              wiOrderNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              customerRefNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              inboundOrderNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              useListMode:
                  type: boolean
                  value: null
              lookupMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163001"
      type: text
      title: exception-type-guide
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 480
          y: 707
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # 入库异常类型与处理路径

                        ## QTY_DIFF（数量差异）

                        - 场景：上架少包裹/少单品
                        - 处理：分标准入库单与直发海外验/自验两套 SOP；客观陈述差异数量，不判责
                        - 升级：差异率 ≥ 5% 或绝对差 ≥ 10 件时建议人工核实

                        ## DAMAGE（包裹破损）

                        - 场景：运输或卸货破损
                        - 处理：要求拍照证明 + 提交核实工单
                        - 升级：始终建议人工介入

                        ## LABEL_MISSING（条码异常）

                        - 场景：包裹条码缺失或异常
                        - 处理：客户需补贴包裹条码上架（增值服务）
                        - 下游：`value-add/value-add-exception-diagnosis`

                        ## WRONG_WAREHOUSE（串仓异常）

                        - 场景：直发订单发错仓
                        - 处理：进入 value-add 推荐链判断串仓调拨或非标等可选路径
                        - 下游：`value-add/value-add-exception-diagnosis`

                        ## EXTRA_ITEM（订单外商品）

                        - 场景：包裹内存在订单外商品
                        - 处理：需下换新单上架

                        ## OWNERLESS_GOODS（入库无主货）

                        - 场景：无法匹配订单的货物
                        - 处理：进入 value-add 推荐链判断无主货找回或后续处理路径
                        - 下游：`value-add/value-add-exception-diagnosis`

                        ## PRE_SHELVE_ACTION（上架前特殊处理）

                        - 场景：自提/销毁/拦截/细节拍照
                        - 处理：进入 value-add 推荐链判断自提、销毁、拦截或拍照路径
                        - 下游：`value-add/value-add-exception-diagnosis`
              - name: arrayItemConcatChar
                input:
                    type: string
                    value: ，
