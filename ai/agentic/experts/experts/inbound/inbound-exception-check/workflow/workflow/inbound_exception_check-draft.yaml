      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # 数量差异容差与升级条件

                        ## 参考阈值（待仓库最终确认）

                        | 指标 | 参考线 | 说明 |
                        |------|--------|------|
                        | 差异率 | ≥ 5% | 相对预报量的差异比例 |
                        | 绝对差异 | ≥ 10 件 | 单品数量绝对差 |

                        满足任一条件时 `needsHumanReview=true`。

                        ## 四层数量说明

                        | 层级 | 字段来源 | 含义 |
                        |------|----------|------|
                        | 预报量 | orderMerchandiseQty | 客户预报商品数 |
                        | 签收量 | actualOrderMerchandiseQty | 仓库签收商品数 |
                        | 验收量 | 异常单 receivedQty | 验货环节实收 |
                        | 上架量 | actualOrderMerchandiseQty（EWC 后） | 最终上架数 |

                        ## 对客原则

                        - AI 不做责任判定，差异结论需仓库确认
                        - 客观报告数字，说明核实进行中
                        - 不承诺赔付结果
