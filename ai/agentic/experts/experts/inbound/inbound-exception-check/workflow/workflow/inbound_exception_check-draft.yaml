                input:
                    value:
                        path: inputs.includePackageDetails
                        ref_node: "100001"
          node_outputs:
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              actionPlans:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
