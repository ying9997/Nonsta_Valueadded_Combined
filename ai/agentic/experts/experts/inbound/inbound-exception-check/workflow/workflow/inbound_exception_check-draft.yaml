                          value: "\t"
                        - isDefault: true
                          label: 句号
                          value: 。
                        - isDefault: true
                          label: 逗号
                          value: ，
                        - isDefault: true
                          label: 分号
                          value: ；
                        - isDefault: true
                          label: 空格
                          value: " "
          method: concat
          node_outputs:
              output:
                  type: string
                  value: null
    - id: "163002"
      type: text
      title: discrepancy-thresholds
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 480
