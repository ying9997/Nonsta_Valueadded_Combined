    - id: "163008"
      type: code
      title: fetch-exception-list
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2387
      parameters:
          code: |-
              /* coze-inline: shared/fms-token-url.ts */
              type FmsRegion = "CN" | "US" | "EU" | "AU" | "DEFAULT";

              type FmsCredential = {
                fmsUrl: string;
                clientId: string;
                clientSecret: string;
                edsUser: string;
                edsToken: string;
              };

              type FmsRuntimeConfig = Partial<Record<FmsRegion, FmsCredential>>;

              type FmsTokenUrlResult = {
                rawUrl: string;
                signedUrl: string;
                region: FmsRegion | "";
                status: "ok" | "not_fms" | "missing_config" | "invalid_url";
              };

              const FMS_REGIONS: FmsRegion[] = ["CN", "US", "EU", "AU"];

              function __coze_shared_fms_token_url_ts_fmsEnv(name: string, fallback: string): string {
                if (typeof process !== "undefined" && process.env?.[name]) {
                  return String(process.env[name]).trim();
                }
                return fallback;
              }

              function __coze_shared_fms_token_url_ts_fmsPlaceholder(region: FmsRegion, name: "CLIENT_KEY" | "CLIENT_SECRET" | "USER_KEY" | "USER_SECRET"): string {
                const placeholders: Record<FmsRegion, Record<"CLIENT_KEY" | "CLIENT_SECRET" | "USER_KEY" | "USER_SECRET", string>> = {
                  CN: {
                    CLIENT_KEY: "__FMS_CN_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_CN_CLIENT_SECRET__",
                    USER_KEY: "__FMS_CN_USER_KEY__",
                    USER_SECRET: "__FMS_CN_USER_SECRET__",
                  },
                  US: {
                    CLIENT_KEY: "__FMS_US_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_US_CLIENT_SECRET__",
                    USER_KEY: "__FMS_US_USER_KEY__",
                    USER_SECRET: "__FMS_US_USER_SECRET__",
                  },
                  AU: {
                    CLIENT_KEY: "__FMS_AU_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_AU_CLIENT_SECRET__",
                    USER_KEY: "__FMS_AU_USER_KEY__",
                    USER_SECRET: "__FMS_AU_USER_SECRET__",
                  },
                  EU: {
                    CLIENT_KEY: "__FMS_EU_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_EU_CLIENT_SECRET__",
                    USER_KEY: "__FMS_EU_USER_KEY__",
                    USER_SECRET: "__FMS_EU_USER_SECRET__",
                  },
                  DEFAULT: {
                    CLIENT_KEY: "__FMS_US_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_US_CLIENT_SECRET__",
                    USER_KEY: "__FMS_US_USER_KEY__",
                    USER_SECRET: "__FMS_US_USER_SECRET__",
                  },
                };
                return placeholders[region][name];
              }

              function __coze_shared_fms_token_url_ts_fmsCredentialFromEnv(region: FmsRegion, defaultUrl: string): FmsCredential {
                return {
                  fmsUrl: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_URL`, defaultUrl).replace(/\/+$/, ""),
                  clientId: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_CLIENT_KEY`, __coze_shared_fms_token_url_ts_fmsPlaceholder(region, "CLIENT_KEY")),
                  clientSecret: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_CLIENT_SECRET`, __coze_shared_fms_token_url_ts_fmsPlaceholder(region, "CLIENT_SECRET")),
                  edsUser: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_USER_KEY`, __coze_shared_fms_token_url_ts_fmsPlaceholder(region, "USER_KEY")),
                  edsToken: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_USER_SECRET`, __coze_shared_fms_token_url_ts_fmsPlaceholder(region, "USER_SECRET")),
                };
              }

              function defaultFmsRuntimeConfig(): FmsRuntimeConfig {
                const us = __coze_shared_fms_token_url_ts_fmsCredentialFromEnv("US", "https://usfmsstream.winit.com.cn");
                return {
                  CN: __coze_shared_fms_token_url_ts_fmsCredentialFromEnv("CN", "https://cnfmsstream.winit.com.cn"),
                  US: us,
                  AU: __coze_shared_fms_token_url_ts_fmsCredentialFromEnv("AU", "https://aufmsstream.winit.com.cn"),
                  EU: __coze_shared_fms_token_url_ts_fmsCredentialFromEnv("EU", "https://eufmsstream.winit.com.cn"),
                  DEFAULT: us,
                };
              }

              function __coze_shared_fms_token_url_ts_fmsIsConfigured(value: string): boolean {
                const s = value.trim();
                return Boolean(s) && !/^__FMS_[A-Z]+_[A-Z_]+__$/.test(s);
              }

              function __coze_shared_fms_token_url_ts_fmsHasCredential(credential: FmsCredential | undefined): credential is FmsCredential {
                return Boolean(
                  credential &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.fmsUrl) &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.clientId) &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.clientSecret) &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.edsUser) &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.edsToken)
                );
              }

              function __coze_shared_fms_token_url_ts_fmsParseUrl(rawUrl: string): { isAbsolute: boolean; host: string; path: string } | null {
                const trimmed = rawUrl.trim();
                if (!trimmed) return null;
                if (/^https?:\/\//i.test(trimmed)) {
                  const match = trimmed.match(/^https?:\/\/([^/?#]+)([^?#]*)/i);
                  if (!match) return null;
                  return {
                    isAbsolute: true,
                    host: match[1] ?? "",
                    path: match[2] || "/",
                  };
                }
                const pathOnly = trimmed.split(/[?#]/)[0] ?? "";
                return { isAbsolute: false, host: "", path: pathOnly.startsWith("/") ? pathOnly : `/${pathOnly}` };
              }

              function __coze_shared_fms_token_url_ts_fmsRegionByUrl(rawUrl: string, config: FmsRuntimeConfig): FmsRegion | "" {
                const trimmed = rawUrl.trim();
                for (const region of FMS_REGIONS) {
                  const cfgUrl = config[region]?.fmsUrl?.replace(/\/+$/, "");
                  if (cfgUrl && trimmed.startsWith(cfgUrl)) return region;
                }

                const parsed = __coze_shared_fms_token_url_ts_fmsParseUrl(trimmed);
                if (parsed?.isAbsolute) {
                  const match = parsed.host.match(/^([a-z]+)fmsstream\.winit\.com/i);
                  const region = match?.[1]?.toUpperCase() as FmsRegion | undefined;
                  if (region && FMS_REGIONS.includes(region)) return region;
                  return "";
                }

                return config.DEFAULT ? "DEFAULT" : "";
              }

              function isFmsUrl(rawUrl: unknown, config: FmsRuntimeConfig = defaultFmsRuntimeConfig()): rawUrl is string {
                return typeof rawUrl === "string" && __coze_shared_fms_token_url_ts_fmsRegionByUrl(rawUrl, config) !== "";
              }

              function __coze_shared_fms_token_url_ts_fmsUrlForSigning(rawUrl: string, credential: FmsCredential): string {
                const parsed = __coze_shared_fms_token_url_ts_fmsParseUrl(rawUrl);
                const path = parsed?.path || "/";
                const base = credential.fmsUrl.replace(/\/+$/, "");
                return `${base}${path.startsWith("/") ? path : `/${path}`}`;
              }

              function __coze_shared_fms_token_url_ts_fmsObjectUri(fileUrl: string): string {
                return __coze_shared_fms_token_url_ts_fmsParseUrl(fileUrl)?.path || "/";
              }

              function __coze_shared_fms_token_url_ts_fmsUtf8Bytes(input: string): number[] {
                const bytes: number[] = [];
                for (let i = 0; i < input.length; i++) {
                  let code = input.charCodeAt(i);
                  if (code < 0x80) {
                    bytes.push(code);
                  } else if (code < 0x800) {
                    bytes.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f));
                  } else if (code >= 0xd800 && code <= 0xdbff && i + 1 < input.length) {
                    const next = input.charCodeAt(++i);
                    code = 0x10000 + ((code & 0x3ff) << 10) + (next & 0x3ff);
                    bytes.push(
                      0xf0 | (code >> 18),
                      0x80 | ((code >> 12) & 0x3f),
                      0x80 | ((code >> 6) & 0x3f),
                      0x80 | (code & 0x3f)
                    );
                  } else {
                    bytes.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
                  }
                }
                return bytes;
              }

              function __coze_shared_fms_token_url_ts_fmsLeftRotate(value: number, bits: number): number {
                return ((value << bits) | (value >>> (32 - bits))) >>> 0;
              }

              function __coze_shared_fms_token_url_ts_fmsSha1(bytes: number[]): number[] {
                const message = bytes.slice();
                const bitLength = message.length * 8;
                message.push(0x80);
                while ((message.length % 64) !== 56) message.push(0);
                for (let i = 7; i >= 0; i--) message.push((bitLength / Math.pow(2, i * 8)) & 0xff);

                let h0 = 0x67452301;
                let h1 = 0xefcdab89;
                let h2 = 0x98badcfe;
                let h3 = 0x10325476;
                let h4 = 0xc3d2e1f0;

                for (let offset = 0; offset < message.length; offset += 64) {
                  const w = new Array<number>(80);
                  for (let i = 0; i < 16; i++) {
                    const j = offset + i * 4;
                    w[i] = ((message[j]! << 24) | (message[j + 1]! << 16) | (message[j + 2]! << 8) | message[j + 3]!) >>> 0;
                  }
                  for (let i = 16; i < 80; i++) {
                    w[i] = __coze_shared_fms_token_url_ts_fmsLeftRotate((w[i - 3]! ^ w[i - 8]! ^ w[i - 14]! ^ w[i - 16]!) >>> 0, 1);
                  }

                  let a = h0;
                  let b = h1;
                  let c = h2;
                  let d = h3;
                  let e = h4;

                  for (let i = 0; i < 80; i++) {
                    let f = 0;
                    let k = 0;
                    if (i < 20) {
                      f = (b & c) | (~b & d);
                      k = 0x5a827999;
                    } else if (i < 40) {
                      f = b ^ c ^ d;
                      k = 0x6ed9eba1;
                    } else if (i < 60) {
                      f = (b & c) | (b & d) | (c & d);
                      k = 0x8f1bbcdc;
                    } else {
                      f = b ^ c ^ d;
                      k = 0xca62c1d6;
                    }
                    const temp = (__coze_shared_fms_token_url_ts_fmsLeftRotate(a, 5) + f + e + k + w[i]!) >>> 0;
                    e = d;
                    d = c;
                    c = __coze_shared_fms_token_url_ts_fmsLeftRotate(b, 30);
                    b = a;
                    a = temp;
                  }

                  h0 = (h0 + a) >>> 0;
                  h1 = (h1 + b) >>> 0;
                  h2 = (h2 + c) >>> 0;
                  h3 = (h3 + d) >>> 0;
                  h4 = (h4 + e) >>> 0;
                }

                const out: number[] = [];
                for (const h of [h0, h1, h2, h3, h4]) {
                  out.push((h >>> 24) & 0xff, (h >>> 16) & 0xff, (h >>> 8) & 0xff, h & 0xff);
                }
                return out;
              }

              function __coze_shared_fms_token_url_ts_fmsHmacSha1Hex(key: string, message: string): string {
                let keyBytes = __coze_shared_fms_token_url_ts_fmsUtf8Bytes(key);
                if (keyBytes.length > 64) keyBytes = __coze_shared_fms_token_url_ts_fmsSha1(keyBytes);
                while (keyBytes.length < 64) keyBytes.push(0);

                const outer = keyBytes.map((b) => b ^ 0x5c);
                const inner = keyBytes.map((b) => b ^ 0x36);
                const digest = __coze_shared_fms_token_url_ts_fmsSha1(inner.concat(__coze_shared_fms_token_url_ts_fmsUtf8Bytes(message)));
                return __coze_shared_fms_token_url_ts_fmsSha1(outer.concat(digest))
                  .map((b) => b.toString(16).padStart(2, "0"))
                  .join("")
                  .toUpperCase();
              }

              function __coze_shared_fms_token_url_ts_fmsBase64Utf8(input: string): string {
                const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
                const bytes = __coze_shared_fms_token_url_ts_fmsUtf8Bytes(input);
                let out = "";
                for (let i = 0; i < bytes.length; i += 3) {
                  const a = bytes[i]!;
                  const b = bytes[i + 1];
                  const c = bytes[i + 2];
                  out += alphabet[a >> 2];
                  out += alphabet[((a & 3) << 4) | ((b ?? 0) >> 4)];
                  out += b === undefined ? "=" : alphabet[((b & 15) << 2) | ((c ?? 0) >> 6)];
                  out += c === undefined ? "=" : alphabet[c & 63];
                }
                return out;
              }

              function buildFmsTokenUrl(
                rawUrl: string,
                config: FmsRuntimeConfig = defaultFmsRuntimeConfig(),
                nowMs = Date.now()
              ): FmsTokenUrlResult {
                const parsed = __coze_shared_fms_token_url_ts_fmsParseUrl(rawUrl);
                if (!parsed) return { rawUrl, signedUrl: rawUrl, region: "", status: "invalid_url" };

                const region = __coze_shared_fms_token_url_ts_fmsRegionByUrl(rawUrl, config);
                if (!region) return { rawUrl, signedUrl: rawUrl, region: "", status: "not_fms" };

                const credential = config[region] ?? config.DEFAULT;
                if (!__coze_shared_fms_token_url_ts_fmsHasCredential(credential)) {
                  return { rawUrl, signedUrl: rawUrl, region, status: "missing_config" };
                }

                const fileUrl = __coze_shared_fms_token_url_ts_fmsUrlForSigning(rawUrl, credential);
                const objectUri = __coze_shared_fms_token_url_ts_fmsObjectUri(fileUrl);
                const date = Math.floor(nowMs);
                const canonical = `GET\n${objectUri}?clientId=${credential.clientId}&date=${date}&user=${credential.edsUser}`;
                const clientSign = __coze_shared_fms_token_url_ts_fmsHmacSha1Hex(credential.clientSecret, canonical);
                const userSign = __coze_shared_fms_token_url_ts_fmsHmacSha1Hex(credential.edsToken, canonical);
                const tokenContent =
                  `${objectUri}?clientSign=${clientSign}` +
                  `&userSign=${userSign}` +
                  `&version=V1.0` +
                  `&date=${date}` +
                  `&user=${credential.edsUser}` +
                  `&clientId=${credential.clientId}`;
                return {
                  rawUrl,
                  signedUrl: `${fileUrl}?token=${__coze_shared_fms_token_url_ts_fmsBase64Utf8(tokenContent)}`,
                  region,
                  status: "ok",
                };
              }

              function __coze_shared_fms_token_url_ts_fmsSignedKey(key: string): string {
                if (key === "fileUrl") return "signedFileUrl";
                if (key === "url") return "signedUrl";
                return `signed${key.charAt(0).toUpperCase()}${key.slice(1)}`;
              }

              function __coze_shared_fms_token_url_ts_fmsSignStatusKey(key: string): string {
                if (key === "fileUrl") return "fileUrlSignStatus";
                if (key === "url") return "urlSignStatus";
                return `${key}SignStatus`;
              }

              function __coze_shared_fms_token_url_ts_fmsShouldSignScalarKey(key: string): boolean {
                return key === "fileUrl" || key === "url" || /url$/i.test(key);
              }

              function signFmsUrlDeep(
                value: unknown,
                config: FmsRuntimeConfig = defaultFmsRuntimeConfig(),
                nowMs = Date.now()
              ): unknown {
                if (Array.isArray(value)) return value.map((item) => signFmsUrlDeep(item, config, nowMs));
                if (!value || typeof value !== "object") return value;

                const source = value as Record<string, unknown>;
                const out: Record<string, unknown> = {};

                for (const [key, raw] of Object.entries(source)) {
                  out[key] = signFmsUrlDeep(raw, config, nowMs);
                  if (__coze_shared_fms_token_url_ts_fmsShouldSignScalarKey(key) && typeof raw === "string") {
                    const signed = buildFmsTokenUrl(raw, config, nowMs);
                    if (signed.status === "ok") {
                      out[__coze_shared_fms_token_url_ts_fmsSignedKey(key)] = signed.signedUrl;
                    } else if (signed.status === "missing_config") {
                      out[__coze_shared_fms_token_url_ts_fmsSignStatusKey(key)] = signed.status;
                    }
                  }
                }

                if (Array.isArray(source.unusualFiles)) {
                  const signedUnusualFiles: string[] = [];
                  const statuses: string[] = [];
                  for (const raw of source.unusualFiles) {
                    if (typeof raw !== "string") continue;
                    const signed = buildFmsTokenUrl(raw, config, nowMs);
                    if (signed.status === "ok") signedUnusualFiles.push(signed.signedUrl);
                    else if (signed.status === "missing_config") statuses.push(signed.status);
                  }
                  if (signedUnusualFiles.length > 0) out.signedUnusualFiles = signedUnusualFiles;
                  if (statuses.length > 0) out.unusualFilesSignStatus = Array.from(new Set(statuses)).join(",");
                }

                return out;
              }

              /* coze-inline: node */
              /**
               * 节点：本地 Runner 补拉入库单异常（list / queryExceptionList）
               * FaaS 单文件闭环，无 external import。
               */


              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              const EXCEPTION_LIST_ACTION = "wh.inboundOrderException.list";
              const ORDER_EXCEPTION_DETAIL_ACTION = "wh.inboundOrder.queryExceptionList";

              type ExceptionLookupStatus =
                | "success_with_records"
                | "success_empty"
                | "api_error"
                | "parse_error"
                | "partial_failure"
                | "skipped";

              type CoercedExceptionList = {
                list: unknown[];
                total: number;
                recognized: boolean;
              };

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function flattenOrderExceptionDetails(orderNo: string, items: unknown[]): unknown[] {
                const rows: unknown[] = [];
                for (const item of items) {
                  if (!item || typeof item !== "object") continue;
                  const o = item as Record<string, unknown>;
                  const exceptionName = str(o.exceptionName);
                  const exceptionDesc = str(o.exceptionDesc);
                  const details = Array.isArray(o.exceptionDetailList) ? o.exceptionDetailList : [];
                  if (details.length === 0) {
                    rows.push({
                      orderNo,
                      exceptionType: exceptionName,
                      type: exceptionName,
                      exceptionReason: exceptionDesc,
                      errormsg: exceptionDesc,
                    });
                    continue;
                  }
                  for (const d of details) {
                    if (!d || typeof d !== "object") continue;
                    const detail = d as Record<string, unknown>;
                    rows.push({
                      orderNo,
                      exceptionType: exceptionName,
                      type: exceptionName,
                      exceptionReason: exceptionDesc,
                      errormsg: exceptionDesc,
                      merchandiseCode: str(detail.merchandiseSerno),
                      packageNo: str(detail.packageSerno),
                    });
                  }
                }
                return rows;
              }

              function coerceExceptionList(parsed: unknown, orderNoHint?: string): CoercedExceptionList {
                if (parsed == null || parsed === "") return { list: [], total: 0, recognized: true };

                if (Array.isArray(parsed)) {
                  const orderNo = orderNoHint ?? "";
                  const list = orderNo ? flattenOrderExceptionDetails(orderNo, parsed) : parsed;
                  return { list, total: list.length, recognized: true };
                }

                if (typeof parsed !== "object") return { list: [], total: 0, recognized: false };
                const o = parsed as Record<string, unknown>;
                if (o.output != null) return coerceExceptionList(o.output, orderNoHint);

                if (o.code === "0" || o.code === 0) {
                  const inner = o.data;
                  if (typeof inner === "string") {
                    try {
                      return coerceExceptionList(JSON.parse(inner), orderNoHint);
                    } catch {
                      return inner.trim() === ""
                        ? { list: [], total: 0, recognized: true }
                        : { list: [], total: 0, recognized: false };
                    }
                  }
                  if (inner != null) return coerceExceptionList(inner, orderNoHint);
                  return { list: [], total: 0, recognized: true };
                }

                const hasListField = Array.isArray(o.list) || Array.isArray(o.records);
                if (!hasListField) return { list: [], total: 0, recognized: false };
                const list = Array.isArray(o.list) ? o.list : (o.records as unknown[]);
                const pageParams = (o.pageParams ?? {}) as Record<string, unknown>;
                const total =
                  typeof pageParams.totalCount === "number"
                    ? pageParams.totalCount
