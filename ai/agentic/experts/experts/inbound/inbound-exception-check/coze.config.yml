yamlBasename: inbound_exception_check-draft.yaml
packageMainName: inbound_exception_check
packageDescription: 入库异常核实（resolve → 并行 build detail + exception list → fetch →
  discrepancy report → LLM）

omitCodeNodeInputs:
  extract-inbound-detail:
    - targetItemSernos
    - maxPackagesPerOrder
    - maxMerchandisePerPackage

textNodes:
  - logicalId: exception-type-guide-text
    title: exception-type-guide
    insertAfter: resolve-inbound-lookup
    sourceFile: prompts/exception-type-guide.md
  - logicalId: discrepancy-thresholds-text
    title: discrepancy-thresholds
    insertAfter: resolve-inbound-lookup
    sourceFile: prompts/discrepancy-thresholds.md

winitOpenapiPlugins:
  - insertBefore: fetch-inbound-order
    logicalId: winit_inbound_detail_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-winit-inbound-detail
        path: actions
  - insertBefore: fetch-exception-list
    logicalId: winit_exception_list_batch
    pluginBatch:
      enabled: true
      batchSize: 10
      concurrentSize: 5
      actionsFrom:
        logicalId: build-exception-list-request
        path: actions

inputBindings:
  build-winit-inbound-detail:
    wiOrderNos:
      ref: resolve-inbound-lookup
      path: wiOrderNos
    customerRefNos:
      ref: resolve-inbound-lookup
      path: customerRefNos
    useListMode:
      ref: resolve-inbound-lookup
      path: useListMode
    detailLevel:
      ref: __start__
      path: inputs.detailLevel
    includePackageDetails:
      ref: __start__
      path: inputs.includePackageDetails
  build-exception-list-request:
    wiOrderNos:
      ref: resolve-inbound-lookup
      path: wiOrderNos
    useListMode:
      ref: resolve-inbound-lookup
      path: useListMode
    dateRange:
      ref: __start__
      path: inputs.dateRange
    queryAllExceptions:
      ref: __start__
      path: inputs.queryAllExceptions
  fetch-inbound-order:
    skipDetailApi:
      ref: build-winit-inbound-detail
      path: skipDetailApi
    actions:
      ref: build-winit-inbound-detail
      path: actions
    actionPlans:
      ref: build-winit-inbound-detail
      path: actionPlans
    winitPluginOutputList:
      ref: winit_inbound_detail_batch
      path: outputList
  fetch-exception-list:
    skipExceptionApi:
      ref: build-exception-list-request
      path: skipExceptionApi
    actions:
      ref: build-exception-list-request
      path: actions
    exceptionActionPlans:
      ref: build-exception-list-request
      path: exceptionActionPlans
    winitExceptionPluginOutputList:
      ref: winit_exception_list_batch
      path: outputList
  extract-inbound-detail:
    rawOrderData:
      ref: fetch-inbound-order
      path: rawOrderData
    detailLevel:
      ref: __start__
      path: inputs.detailLevel
    includePackageDetails:
      ref: __start__
      path: inputs.includePackageDetails
    targetMerchandiseCodes:
      ref: __start__
      path: inputs.targetMerchandiseCodes
    targetPackageNos:
      ref: __start__
      path: inputs.targetPackageNos
  build-discrepancy-report:
    rawOrderData:
      ref: extract-inbound-detail
      path: rawOrderData
    rawExceptionData:
      ref: fetch-exception-list
      path: rawExceptionData
    query:
      ref: __start__
      path: query
    customerIntent:
      ref: __start__
      path: customerIntent
    exceptionDescription:
      ref: __start__
      path: inputs.exceptionDescription
    vasOrderNo:
      ref: __start__
      path: inputs.vasOrderNo
    inputContext:
      ref: __start__
      path: inputContext
    inboundOrderNos:
      ref: resolve-inbound-lookup
      path: inboundOrderNos
    requiresNarrowing:
      ref: extract-inbound-detail
      path: requiresNarrowing
  load-exception-kb:
    exceptionTypes:
      ref: build-discrepancy-report
      path: exceptionTypes
    exceptionTypeGuide:
      ref: exception-type-guide-text
      path: output
    discrepancyThresholds:
      ref: discrepancy-thresholds-text
      path: output
  llm-analyze:
    contextContinuity:
      ref: build-discrepancy-report
      path: contextContinuity
    followUpVasOrderNo:
      ref: build-discrepancy-report
      path: followUpVasOrderNo
    needsFollowUp:
      ref: build-discrepancy-report
      path: needsFollowUp
    followUpReason:
      ref: build-discrepancy-report
      path: followUpReason
    valueAddHandoff:
      ref: build-discrepancy-report
      path: valueAddHandoff
  format-output:
    discrepancyReport:
      ref: build-discrepancy-report
      path: discrepancyReport
    needsClarification:
      ref: build-discrepancy-report
      path: needsClarification
    clarificationFields:
      ref: build-discrepancy-report
      path: clarificationFields
    contextContinuity:
      ref: build-discrepancy-report
      path: contextContinuity
    followUpVasOrderNo:
      ref: build-discrepancy-report
      path: followUpVasOrderNo
    needsFollowUp:
      ref: build-discrepancy-report
      path: needsFollowUp
    followUpReason:
      ref: build-discrepancy-report
      path: followUpReason
    suggestedNextExpert:
      ref: build-discrepancy-report
      path: suggestedNextExpert
    valueAddHandoff:
      ref: build-discrepancy-report
      path: valueAddHandoff

endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext
