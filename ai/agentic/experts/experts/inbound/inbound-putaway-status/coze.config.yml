yamlBasename: inbound_putaway_status-draft.yaml
packageMainName: inbound_putaway_status
packageDescription: 上架进度查询（resolve → build(getOrderDetail) → 批处理
  cobra_winit_openapi_request → fetch → prune → compute-putaway-progress → LLM）

omitCodeNodeInputs:
  extract-inbound-detail:
    - targetPackageNos
    - targetItemSernos
    - maxPackagesPerOrder
    - maxMerchandisePerPackage

endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext

winitOpenapiPlugins:
  - insertBefore: fetch-inbound-order
    logicalId: winit_inbound_detail_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-winit-inbound-detail
        path: actions

inputBindings:
  build-winit-inbound-detail:
    wiOrderNos:
      ref: resolve-inbound-lookup
      path: wiOrderNos
    customerRefNos:
      ref: resolve-inbound-lookup
      path: customerRefNos
    detailLevel:
      ref: __start__
      path: inputs.detailLevel
    includePackageDetails:
      ref: __start__
      path: inputs.includePackageDetails
  fetch-inbound-order:
    actions:
      ref: build-winit-inbound-detail
      path: actions
    actionPlans:
      ref: build-winit-inbound-detail
      path: actionPlans
    winitPluginOutputList:
      ref: winit_inbound_detail_batch
      path: outputList
  extract-inbound-detail:
    rawOrderData:
      ref: fetch-inbound-order
      path: rawOrderData
    detailLevel:
      ref: __start__
      path: inputs.detailLevel
    includePackageDetails:
      ref: __start__
      path: inputs.includePackageDetails
    targetMerchandiseCodes:
      ref: __start__
      path: inputs.targetMerchandiseCodes
  aggregate-sku-putaway:
    rawOrderData:
      ref: extract-inbound-detail
      path: rawOrderData
    targetMerchandiseCodes:
      ref: __start__
      path: inputs.targetMerchandiseCodes
  prune-inbound-json:
    rawOrderData:
      ref: extract-inbound-detail
      path: rawOrderData
    includePackageDetails:
      ref: __start__
      path: inputs.includePackageDetails
    maxTrajectoryNodes:
      ref: __start__
      path: inputs.maxTrajectoryNodes
  compute-putaway-progress:
    prunedOrderData:
      ref: prune-inbound-json
      path: prunedOrderData
    checkQtyDiscrepancy:
      ref: __start__
      path: inputs.checkQtyDiscrepancy
    skuPutawaySummary:
      ref: aggregate-sku-putaway
      path: skuPutawaySummary
    requiresNarrowing:
      ref: extract-inbound-detail
      path: requiresNarrowing
    inboundOrderNos:
      ref: resolve-inbound-lookup
      path: inboundOrderNos
  format-output:
    putawayProgress:
      ref: compute-putaway-progress
      path: putawayProgress
