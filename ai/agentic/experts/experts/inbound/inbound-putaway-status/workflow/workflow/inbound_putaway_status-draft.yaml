    - id: "163010"
      type: code
      title: format-output
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2867
      parameters:
          code: |-
              /**
               * 节点：format-output — 归一化 LLM 输出
               */

              interface AnalysisResult {
                structured?: Record<string, unknown>;
                analysis?: string;
              }

              interface InputContext {
                sourceExpertId?: string;
                previousOutput?: string | object;
                chainId?: string;
              }

              function asRecord(value: unknown): Record<string, unknown> {
                return value && typeof value === "object" && !Array.isArray(value)
                  ? (value as Record<string, unknown>)
                  : {};
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const analysisResult = (params.analysisResult ?? {}) as AnalysisResult;
                const inputContext = params.inputContext as InputContext | undefined;
                const putawayProgress = asRecord(params.putawayProgress);
                const structured =
                  putawayProgress.outputPath === "no_data"
                    ? { ...(analysisResult.structured ?? {}), ...putawayProgress }
                    : (analysisResult.structured ?? {});
                const analysis = analysisResult.analysis ?? "";
                const summary = analysis.slice(0, 200) || "上架进度查询完成";

                return {
                  structured,
                  analysis,
                  outputContext: {expertId: "inbound-putaway-status",
                    resultSummary: summary,
                    chainId: inputContext?.chainId ?? "" },
                  enrichedContext: {
                      putawayStage: structured.putawayStage,
                      qtyComparison: structured.qtyComparison,
                      slaBreached: structured.slaBreached,
                    },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("format-output")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: analysisResult
                input:
                    value:
                        path: analysisResult
                        ref_node: "163009"
              - name: putawayProgress
                input:
                    value:
                        path: putawayProgress
                        ref_node: "163007"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "100001"
          node_outputs:
              structured:
                  type: object
                  value: null
              analysis:
                  type: string
                  value: null
              outputContext:
                  type: object
                  value: null
              enrichedContext:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
