                        ref_node: "163003"
              - name: dataQuality
                input:
                    value:
                        path: dataQuality
                        ref_node: "163002"
          node_outputs:
              structured:
                  type: object
                  value: null
              analysis:
                  type: string
                  value: null
              outputContext:
