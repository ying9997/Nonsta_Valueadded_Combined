    - id: "163000"
      type: code
      title: validate-capacity-query
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 467
      parameters:
          code: |-
              /**
               * 节点：validate-capacity-query — 校验 warehouseCode 与 checkType
               * FaaS 单文件闭环，无外部 import。
               */

              type CheckType = "cbm" | "sku" | "slots" | "overall";

              const VALID_CHECK_TYPES = new Set<CheckType>(["cbm", "sku", "slots", "overall"]);

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function normalizeCheckType(raw: unknown): CheckType {
                const s = str(raw).toLowerCase();
                if (VALID_CHECK_TYPES.has(s as CheckType)) return s as CheckType;
                return "overall";
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const warehouseCode = str(params.warehouseCode).toUpperCase();
                const checkType = normalizeCheckType(params.checkType);
                const customerIntent = str(params.customerIntent);
                const inputContext = params.inputContext ?? {};
                const cargoProfile = params.cargoProfile ?? null;

                const validationOk = warehouseCode.length > 0;

                return validationOk
                  ? {
                      validationOk: true,
                      warehouseCode,
                      checkType,
                      customerIntent,
                      inputContext,
                      cargoProfile,
                    }
                  : {
                      validationOk: false,
                      error: "warehouseCode 为必填项",
                      warehouseCode,
                      checkType,
                      customerIntent,
                      inputContext,
                      cargoProfile,
                    };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("validate-capacity-query")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: warehouseCode
                input:
                    value:
                        path: inputs.warehouseCode
                        ref_node: "100001"
              - name: checkType
                input:
                    value:
                        path: inputs.checkType
                        ref_node: "100001"
              - name: cargoProfile
                input:
                    value:
                        path: inputs.cargoProfile
                        ref_node: "100001"
              - name: query
                input:
                    value:
                        path: query
                        ref_node: "100001"
              - name: customerIntent
                input:
                    value:
                        path: customerIntent
                        ref_node: "100001"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "100001"
          node_outputs:
              validationOk:
                  type: boolean
                  value: null
              error:
                  type: string
                  value: null
              warehouseCode:
                  type: string
                  value: null
              checkType:
                  type: string
                  value: null
              customerIntent:
                  type: string
                  value: null
              inputContext:
                  type: object
                  value: null
              cargoProfile:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163001"
      type: code
      title: fetch-mks-quota
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 707
      parameters:
          code: |-
              /**
               * 节点：fetch-mks-quota — InboundSkuLimitAggChart 额度查询（Coze 代理），失败时 KB 降级
               * FaaS 单文件闭环，无外部 import。
               *
               * action: winit.huaweiDas.invoke
               * data: OPC/Detail/InboundSkuLimitAggChart（与卖家中心 ajaxProcess form 同构）
               */

              const QUOTA_ACTION = "winit.huaweiDas.invoke";
              const LIMIT_URI = "OPC/Detail/InboundSkuLimitAggChart";

              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              type LimitRow = {
                limitValue?: unknown;
                limitValueRemain?: unknown;
                actValueInv?: unknown;
                actValueOnway?: unknown;
                limitItemName?: unknown;
                warehouseCode?: unknown;
                limitTypeName?: unknown;
                limitSkuAttr?: unknown;
                skuSizeClass?: unknown;
              };

              function num(v: unknown): number {
                const n = Number(v);
                return Number.isFinite(n) ? n : 0;
              }

              function str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function buildHuaweiDasPayload(warehouseCode: string): Record<string, unknown> {
                return {
                  body: {
                    countryCode: "",
                    warehouseCode: warehouseCode || "",
                    skuSizeClass: "",
                    limitSkuAttr: "",
                  },
                  headers: { "x-stage": "RELEASE" },
                  httpMethod: "POST",
                  uri: LIMIT_URI,
                };
              }

              function extractLimitRows(parsed: unknown, depth = 0): LimitRow[] {
                if (parsed == null || depth > 8) return [];
                if (typeof parsed === "string") {
                  const trimmed = parsed.trim();
                  if (!trimmed.startsWith("{") && !trimmed.startsWith("[")) return [];
                  try {
                    return extractLimitRows(JSON.parse(trimmed) as unknown, depth + 1);
                  } catch {
                    return [];
                  }
                }
                if (Array.isArray(parsed)) return parsed as LimitRow[];
                if (typeof parsed !== "object") return [];

                const o = parsed as Record<string, unknown>;

                if (o.code != null && o.code !== "0" && o.code !== 0) {
                  const msg = str(o.msg ?? o.info ?? o.message);
                  if (msg) throw new Error(msg.slice(0, 120));
                }

                if (o.code === "0" || o.code === 0) return extractLimitRows(o.data, depth + 1);
                if (o.output != null) return extractLimitRows(o.output, depth + 1);
                if (o.status === 1 || o.status === "1") return extractLimitRows(o.data, depth + 1);

                const data = o.data;
                if (Array.isArray(data)) return data as LimitRow[];
                if (data != null && typeof data === "object") {
                  const inner = (data as Record<string, unknown>).data;
                  if (Array.isArray(inner)) return inner as LimitRow[];
                  return extractLimitRows(data, depth + 1);
                }

                return [];
              }

              function warehouseToken(code: string): string {
                return code.toUpperCase().replace(/\s+/g, "");
              }

              function matchesWarehouse(rowWarehouse: string, inputCode: string): boolean {
                const row = str(rowWarehouse);
                if (!row || row.includes(",")) return false;
                const token = warehouseToken(inputCode);
                if (!token) return false;
                const rowToken = warehouseToken(row.split(/\s+/)[0] ?? row);
                if (rowToken === token) return true;
                return warehouseToken(row).startsWith(token);
              }

              function isCbmItem(limitItemName: string): boolean {
                return limitItemName.includes("CBM");
              }

              function isSkuCountItem(limitItemName: string): boolean {
                return limitItemName === "SKU数量";
              }

              function isOrderLimit(limitTypeName: string): boolean {
                return limitTypeName === "限制下单";
              }

              function isAppointmentLimit(limitTypeName: string): boolean {
                return limitTypeName === "限制预约";
              }

              function rowUsed(row: LimitRow): number {
                const inv = num(row.actValueInv);
                const onway = num(row.actValueOnway);
                if (inv > 0 || onway > 0) return inv + onway;
                const total = num(row.limitValue);
                const remain = num(row.limitValueRemain);
                return Math.max(0, total - remain);
              }

              function buildFallbackSnapshot(warehouseCode: string, reason: string) {
                return {
                  totalCbm: null,
                  usedCbm: null,
                  remainingCbm: null,
                  totalSkuSlots: null,
                  usedSkuSlots: null,
                  remainingSkuSlots: null,
                  apiAvailable: false,
                  warehouseCode,
                  message: reason,
                };
              }

              function aggregateWarehouseLimits(rows: LimitRow[], warehouseCode: string) {
                const matched = rows.filter((row) => {
                  const wh = str(row.warehouseCode);
                  const attr = str(row.limitSkuAttr);
                  const type = str(row.limitTypeName);
                  if (!matchesWarehouse(wh, warehouseCode)) return false;
                  if (attr && attr !== "普货") return false;
                  return isOrderLimit(type) || isAppointmentLimit(type);
                });

                const orderRows = matched.filter((row) => isOrderLimit(str(row.limitTypeName)));
                const sourceRows = orderRows.length > 0 ? orderRows : matched;

                let totalCbm = 0;
                let remainingCbm = 0;
                let usedCbm = 0;
                let totalSkuSlots = 0;
                let remainingSkuSlots = 0;
                let usedSkuSlots = 0;
                let cbmBuckets = 0;
                let skuBuckets = 0;

                for (const row of sourceRows) {
                  const item = str(row.limitItemName);
                  const total = num(row.limitValue);
                  const remain = num(row.limitValueRemain);
                  const used = rowUsed(row);

                  if (isCbmItem(item)) {
                    totalCbm += total;
                    remainingCbm += remain;
                    usedCbm += used;
                    cbmBuckets += 1;
                  } else if (isSkuCountItem(item)) {
                    totalSkuSlots += total;
                    remainingSkuSlots += remain;
                    usedSkuSlots += used;
                    skuBuckets += 1;
                  }
                }

                return {
                  totalCbm: cbmBuckets > 0 ? totalCbm : null,
                  usedCbm: cbmBuckets > 0 ? usedCbm : null,
                  remainingCbm: cbmBuckets > 0 ? remainingCbm : null,
                  totalSkuSlots: skuBuckets > 0 ? totalSkuSlots : null,
                  usedSkuSlots: skuBuckets > 0 ? usedSkuSlots : null,
                  remainingSkuSlots: skuBuckets > 0 ? remainingSkuSlots : null,
                  bucketCount: { cbm: cbmBuckets, sku: skuBuckets, matched: sourceRows.length },
                };
              }

              async function fetchInboundSkuLimitAggChart(
                env: CozeWinitLocalEnv,
                warehouseCode: string
              ): Promise<LimitRow[]> {
                const payloads = [buildHuaweiDasPayload(warehouseCode), buildHuaweiDasPayload("")];

                for (const payload of payloads) {
                  const parsed = await runCozeWinitWorkflow(env, QUOTA_ACTION, payload);
                  const rows = extractLimitRows(parsed);
                  if (rows.length > 0) return rows;
                }

                throw new Error("额度接口返回空列表");
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const validationOk = params.validationOk === true;
                const warehouseCode = String(params.warehouseCode ?? "").trim().toUpperCase();

                if (!validationOk || !warehouseCode) {
                  return {
                    quotaSnapshot: buildFallbackSnapshot(warehouseCode, "validation failed"),
                    quotaFetchOk: false,
                  };
                }

                const env = getCozeWinitEnv();
                if (!env) {
                  return {
                    quotaSnapshot: buildFallbackSnapshot(warehouseCode, "额度数据暂时无法实时获取（缺少 Coze 环境配置）"),
                    quotaFetchOk: false,
                  };
                }

                try {
                  const rows = await fetchInboundSkuLimitAggChart(env, warehouseCode);
                  const agg = aggregateWarehouseLimits(rows, warehouseCode);

                  if (agg.bucketCount.matched === 0) {
                    return {
                      quotaSnapshot: buildFallbackSnapshot(
                        warehouseCode,
                        `额度数据暂时无法实时获取（未找到 ${warehouseCode} 对应额度项）`
                      ),
                      quotaFetchOk: false,
                    };
                  }

                  return {
                    quotaSnapshot: {
                      totalCbm: agg.totalCbm,
                      usedCbm: agg.usedCbm,
                      remainingCbm: agg.remainingCbm,
                      totalSkuSlots: agg.totalSkuSlots,
                      usedSkuSlots: agg.usedSkuSlots,
                      remainingSkuSlots: agg.remainingSkuSlots,
                      apiAvailable: true,
                      warehouseCode,
                      message: "",
                      dataSource: "winit.huaweiDas.invoke/InboundSkuLimitAggChart",
                      limitBucketCount: agg.bucketCount,
                    },
                    quotaFetchOk: true,
                  };
                } catch (e) {
                  const msg = e instanceof Error ? e.message : String(e);
                  return {
                    quotaSnapshot: buildFallbackSnapshot(warehouseCode, `额度数据暂时无法实时获取（${msg.slice(0, 120)}）`),
                    quotaFetchOk: false,
                  };
                }
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-mks-quota")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: validationOk
                input:
                    value:
                        path: validationOk
                        ref_node: "163000"
              - name: warehouseCode
                input:
                    value:
                        path: warehouseCode
                        ref_node: "163000"
          node_outputs:
              quotaSnapshot:
                  type: object
                  value: null
              quotaFetchOk:
                  type: boolean
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163002"
      type: code
      title: merge-capacity-signal
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 947
      parameters:
          code: |-
              /**
               * 节点：merge-capacity-signal — 组装 MKS 额度查询上下文
               * FaaS 单文件闭环，无外部 import。
               */

              function str(v: unknown): string {
                return v == null ? "" : String(v);
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const quotaSnapshot = (params.quotaSnapshot ?? {}) as Record<string, unknown>;
                const warehouseCode = str(params.warehouseCode);
                const checkType = str(params.checkType) || "overall";
                const cargoProfile = params.cargoProfile ?? null;
                const quotaFetchOk = params.quotaFetchOk === true;

                const apiAvailable = quotaSnapshot.apiAvailable === true;
                const dataSource = apiAvailable ? "api" : "kb_only";
                const dataQuality = apiAvailable ? "real" : "mock";

                return {
                  mergedCapacity: {
                    warehouseCode,
                    checkType,
                    quotaSnapshot,
                    cargoProfile,
                  },
                  dataSource,
                  dataQuality,
                  quotaFetchOk,
                  kbFallbackNeeded: !quotaFetchOk,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("merge-capacity-signal")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: quotaSnapshot
                input:
                    value:
                        path: quotaSnapshot
                        ref_node: "163001"
              - name: quotaFetchOk
                input:
                    value:
                        path: quotaFetchOk
                        ref_node: "163001"
              - name: warehouseCode
                input:
                    value:
                        path: warehouseCode
                        ref_node: "163000"
              - name: checkType
                input:
                    value:
                        path: checkType
                        ref_node: "163000"
              - name: cargoProfile
                input:
                    value:
                        path: cargoProfile
                        ref_node: "163000"
          node_outputs:
              mergedCapacity:
                  type: object
                  value: null
              dataSource:
                  type: string
                  value: null
              dataQuality:
                  type: string
                  value: null
              quotaFetchOk:
                  type: boolean
                  value: null
              kbFallbackNeeded:
                  type: boolean
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163003"
      type: code
      title: eval-overall-temperature
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1187
      parameters:
          code: |-
              /**
               * 节点：eval-overall-temperature — 基于 MKS 额度的库容温度
               * FaaS 单文件闭环，无外部 import。
               */

              type Temperature = "green" | "yellow" | "orange" | "red" | "unknown";

              function num(v: unknown): number | null {
                if (v == null) return null;
                const n = Number(v);
                return Number.isFinite(n) ? n : null;
              }

              function pctRemaining(total: number | null, remaining: number | null): number | null {
                if (total == null || remaining == null || total <= 0) return null;
                return remaining / total;
              }

              function quotaTemperature(totalCbm: number | null, remainingCbm: number | null): Temperature {
                const cbmPct = pctRemaining(totalCbm, remainingCbm);
                if (cbmPct == null) return "unknown";
                if (cbmPct < 0.05) return "red";
                if (cbmPct < 0.2) return "orange";
                if (cbmPct < 0.5) return "yellow";
                return "green";
              }

              function adviceFor(temp: Temperature, checkType: string): string[] {
                if (checkType === "slots") {
                  return [
                    "仓级 Slots 可约时间不在本专家查询范围",
                    "请在万邑联平台预约送仓页面查看可约时段，或咨询 inbound-appointment-manage 操作指引",
                  ];
                }

                const base: Record<Temperature, string[]> = {
                  green: ["客户额度充裕，可正常安排入库"],
                  yellow: ["客户额度偏紧，建议尽快安排入库并提前规划"],
                  orange: ["客户额度紧张，建议拆批入库或申请额度扩容"],
                  red: ["客户额度接近上限，建议换仓或扩容后再发", "请联系客服获取最新额度信息"],
                  unknown: ["实时额度数据不可用，建议登录万邑联账户中心查看或联系客服"],
                };
                const lines = [...base[temp]];
                if (checkType === "cbm") lines.unshift("聚焦 CBM 额度维度");
                if (checkType === "sku") lines.unshift("聚焦 SKU 额度维度");
                return lines;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const mergedCapacity = (params.mergedCapacity ?? {}) as Record<string, unknown>;
                const quotaSnapshot = (mergedCapacity.quotaSnapshot ?? {}) as Record<string, unknown>;
                const checkType = String(mergedCapacity.checkType ?? "overall");
                const cargoProfile = mergedCapacity.cargoProfile as Record<string, unknown> | null;

                const totalCbm = num(quotaSnapshot.totalCbm);
                const remainingCbm = num(quotaSnapshot.remainingCbm);
                const quotaTemp = quotaTemperature(totalCbm, remainingCbm);

                let overallTemperature: Temperature =
                  checkType === "slots" ? "unknown" : quotaTemp;

                if (checkType !== "slots" && cargoProfile && overallTemperature !== "red") {
                  const needCbm = num(cargoProfile.cbmVolume);
                  const needSku = num(cargoProfile.skuCount);
                  if (needCbm != null && remainingCbm != null && needCbm > remainingCbm) overallTemperature = "red";
                  const remainingSku = num(quotaSnapshot.remainingSkuSlots);
                  if (needSku != null && remainingSku != null && needSku > remainingSku) overallTemperature = "red";
                }

                if (checkType !== "slots" && quotaSnapshot.apiAvailable !== true) {
                  overallTemperature = "unknown";
                }

                return {
                  overallTemperature,
                  capacityAdvice: adviceFor(overallTemperature, checkType),
                  quotaTemperature: quotaTemp,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("eval-overall-temperature")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: mergedCapacity
                input:
                    value:
                        path: mergedCapacity
                        ref_node: "163002"
          node_outputs:
              overallTemperature:
                  type: string
                  value: null
              capacityAdvice:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              quotaTemperature:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
