                        # 海外仓仓库基础资料知识库

                        > 来源摘要：
                        > - `_kb/service-team/inbound-services-doc/海外仓的头程直发收货地址.md`（地址、面单、直发 FAQ）
                        > - `_kb/product-team/winit/in-warehouse/storage-product-details.md`（仓型定位、可接商品类型、存放分区）

                        ---

