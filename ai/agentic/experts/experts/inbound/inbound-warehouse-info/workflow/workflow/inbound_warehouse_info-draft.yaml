                        ### 库存属性与存放分区（摘要）

                        | 商品属性 | 存放分区 | 说明 |
                        |----------|----------|------|
                        | 普货_良品 | 普通库位 | 常规可售商品 |
                        | 普货_不良品 | 不良品区域 | 有瑕疵、无法直接二次销售 |
                        | 纯电 | 纯电区域 | 带电但非 DG；防火隔离 |
                        | DG | DG 区域 | 陆运/空运 DG，各国标准不同 |
                        | 特殊化工(US) | 化工区域 | 须满足 SDS 等条件，仅美国部分仓承接 |
                        | 食品 | 食品区域 | 肉、蛋、奶类制品禁止入库 |

