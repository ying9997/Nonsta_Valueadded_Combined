    - id: "163003"
      type: text
      title: kb-penalty-rules
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 480
          y: 1187
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # 预约违规费规则

                        > 来源：`_kb/直发预约违规费常见问题.md`、`直发散货预约常见问题.md`

                        ## 送仓方式选错（不退费）

                        | 下单选择 | 实际送仓 | 后果 |
                        |----------|----------|------|
                        | 快递 | 散货送仓 | **散装卸货费** |
                        | 散货 | 快递面单逐件 | **未预约违规费** |
                        | 散货 | 散货但未预约 | **未预约违规费** |

                        ## 未预约 / 提前到仓（按订单 CBM）

                        | 国家 | 费率 (/CBM) | 上限 | 备注 |
                        |------|-------------|------|------|
                        | US | 10 USD | 650 USD | 最低 10 USD |
                        | AU | 14.5 AUD | 940 AUD | |
                        | UK | 8.5 GBP | 550 GBP | |
                        | DE/BE | 9.5 EUR | 620 EUR | |
                        | CA | 14 CAD | 880 CAD | |

                        ## 已预约未到仓 / 超时取消（按预约单）

                        | 国家 | 整柜 (/单) | 散货 (/单) |
                        |------|------------|------------|
                        | US | 200 | 100 |
                        | UK | 165 | 82 |
                        | DE/BE | 190 | 95 |
                        | AU | 290 | 145 |
                        | CA | 275 | 137 |

                        ## 免违规费情形

                        - 快递（逐件面单）免预约，不适用未预约违规费
                        - 仓内上架单 PSC 无需预约，不收违规费

                        ## 申诉路径

                        1. 万邑联查看违规费记录与触发原因
                        2. 有异议通过万邑联客服渠道申诉
                        3. **不承诺减免结果**

                        ## 升级人工

