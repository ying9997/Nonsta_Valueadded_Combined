    - id: "163016"
      type: code
      title: summarize-booking-records
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 4307
      parameters:
          code: |-
              /**
               * 节点：合并 booking.list 与 getOrderDetail 表头，确定性输出预约摘要
               * FaaS 单文件闭环，无外部 import。
               */

              const BOOKING_STATUS_LABELS: Record<string, string> = {
                WBO: "待预约确认",
                WABO: "待审批",
                SBO: "预约成功",
                RBO: "已到仓",
                EXRBO: "到仓异常",
                CANCEL: "已取消",
              };

              type BookingRecord = {
                bookingNo: string;
                bookingStatus: string;
                bookingStatusLabel: string;
                appointmentDate: string;
                penaltyFee: number | null;
                penaltyReason: string;
                inboundOrderNo: string;
                warehouseCode: string;
                source: string;
                dataQuality: string;
              };

              function statusLabel(code: string): string {
                const key = code.trim().toUpperCase();
                return BOOKING_STATUS_LABELS[key] ?? "";
              }

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
              }

              function numOrNull(v: unknown): number | null {
                const n = Number(v);
                return Number.isFinite(n) && n > 0 ? n : null;
              }

              function normalizeApiRecord(raw: unknown): BookingRecord | null {
                if (!raw || typeof raw !== "object") return null;
                const o = raw as Record<string, unknown>;
                const bookingNo = str(o.bookingNo ?? o.appointmentNo);
                if (!bookingNo && !o.inboundOrderNo && !o.bookingStatus && !o.status) return null;
                const fee = numOrNull(o.penaltyFee ?? o.violationFee);
                const bookingStatus = str(o.bookingStatus ?? o.status);
                return {
                  bookingNo,
                  bookingStatus,
                  bookingStatusLabel: statusLabel(bookingStatus),
                  appointmentDate: str(o.appointmentDate ?? o.bookingDate),
                  penaltyFee: fee,
                  penaltyReason: str(o.penaltyReason ?? o.violationReason),
                  inboundOrderNo: str(o.inboundOrderNo ?? o.orderNo),
                  warehouseCode: str(o.warehouseCode ?? o.destWhCode),
                  source: "booking_api",
                  dataQuality: "real",
                };
              }

              function orderHeaderHint(row: Record<string, unknown>): BookingRecord | null {
                const bookingNo = str(row.bookingNo ?? row.inboundBookingNo);
                const orderNo = str(row.orderNo ?? row.inboundOrderNum);
                const status = str(row.inboundBookingStatus ?? row.bookingStatus);
                if (!bookingNo && !status) return null;
                return {
                  bookingNo,
                  bookingStatus: status,
                  bookingStatusLabel: statusLabel(status),
                  appointmentDate: str(row.appointmentDate ?? row.bookingDate ?? row.expectedSendwarehouseTime),
                  penaltyFee: null,
                  penaltyReason: "",
                  inboundOrderNo: orderNo,
                  warehouseCode: str(row.destWhCode ?? row.warehouseCode),
                  source: "order_header_fallback",
                  dataQuality: bookingNo ? "partial" : "status_only",
                };
              }

              function coerceBookingList(raw: unknown): unknown[] {
                if (Array.isArray(raw)) return raw;
                return [];
              }

              function coerceOrderList(rawOrderData: unknown): Record<string, unknown>[] {
                if (rawOrderData == null || typeof rawOrderData !== "object") return [];
                const list = (rawOrderData as { list?: unknown[] }).list;
                if (!Array.isArray(list)) return [];
                return list.filter((r): r is Record<string, unknown> => r != null && typeof r === "object");
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const intent = str(params.intent) || "query";
                const apiRecords = coerceBookingList(params.bookingRecords)
                  .map(normalizeApiRecord)
                  .filter((r): r is BookingRecord => r != null);

                const seen = new Set(apiRecords.map((r) => `${r.bookingNo}|${r.inboundOrderNo}`));
                const merged: BookingRecord[] = [...apiRecords];

                if (apiRecords.length === 0) {
                  for (const row of coerceOrderList(params.rawOrderData)) {
                    const hint = orderHeaderHint(row);
                    if (!hint) continue;
                    const key = `${hint.bookingNo}|${hint.inboundOrderNo}`;
                    if (!seen.has(key)) {
                      seen.add(key);
                      merged.push(hint);
                    }
                  }
                }

                const penaltyFees = merged.map((r) => r.penaltyFee).filter((f): f is number => f != null);
                const totalPenaltyFee = penaltyFees.length > 0 ? penaltyFees.reduce((a, b) => a + b, 0) : null;

                let dataQuality: string;
                if (apiRecords.length > 0) dataQuality = "booking_api";
                else if (merged.length > 0) dataQuality = "order_header_fallback";
                else dataQuality = "missing";

                const requiresManualAction =
                  (intent === "query" || intent === "penalty") && merged.length === 0;

                return {
                  bookingSummary: {
                    records: merged,
                    recordCount: merged.length,
                    totalPenaltyFee,
                    dataQuality,
                    requiresManualAction,
                    hasPenaltyFeeField: penaltyFees.length > 0,
                  },
                  bookingRecords: merged,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("summarize-booking-records")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: intent
                input:
                    value:
                        path: intent
                        ref_node: "163000"
              - name: bookingRecords
                input:
                    value:
                        path: bookingRecords
                        ref_node: "163015"
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163012"
          node_outputs:
              bookingSummary:
                  type: object
                  value: null
              bookingRecords:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163017"
      type: code
      title: scope-guard
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 4547
      parameters:
          code: |-
              /**
               * 节点：PSC / 链路 scope 守卫 — 标准头程等转介
               * FaaS 单文件闭环，无外部 import。
               */

              const STANDARD_HEADWAY = /^OW01011/i;
              const DIRECT_PSC = /^OW010(21|22|31|32)/i;

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function firstOrder(rawOrderData: unknown): Record<string, unknown> | null {
                if (rawOrderData == null || typeof rawOrderData !== "object") return null;
                const list = (rawOrderData as { list?: unknown[] }).list;
                if (!Array.isArray(list) || list.length === 0) return null;
                const row = list[0];
                return row != null && typeof row === "object" ? (row as Record<string, unknown>) : null;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const routePath = str(params.routePath);
                const row = firstOrder(params.rawOrderData);
                const psc = str(row?.winitProductCode ?? row?.productCode);
                const orderNo = str(row?.orderNo ?? row?.inboundOrderNum);

                let guard: Record<string, unknown>;

                if (routePath === "kb_only" || !psc) {
                  guard = {
                    scopeAction: "answer",
                    scopeNote: "",
                    winitProductCode: psc,
                    isStandardHeadway: false,
                    referExpertId: "",
                    orderNo,
                  };
                } else if (STANDARD_HEADWAY.test(psc)) {
                  guard = {
                    scopeAction: "refer_process_guide",
                    scopeNote: "标准头程（OW01011）通常由 Winit 安排送仓，客户无需提交预约单",
                    winitProductCode: psc,
                    isStandardHeadway: true,
                    referExpertId: "inbound/inbound-process-guide",
                    orderNo,
                  };
                } else if (!DIRECT_PSC.test(psc)) {
                  guard = {
                    scopeAction: "refer_process_guide",
                    scopeNote: `当前 PSC（${psc}）非直发预约链路，建议确认产品选型与送仓规则`,
                    winitProductCode: psc,
                    isStandardHeadway: false,
                    referExpertId: "inbound/inbound-process-guide",
                    orderNo,
                  };
                } else {
                  guard = {
                    scopeAction: "answer",
                    scopeNote: "",
                    winitProductCode: psc,
                    isStandardHeadway: false,
                    referExpertId: "",
                    orderNo,
                  };
                }

                return { scopeGuard: guard, ...guard };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("scope-guard")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: routePath
                input:
                    value:
                        path: routePath
                        ref_node: "163008"
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163012"
          node_outputs:
              scopeGuard:
                  type: object
                  value: null
              scopeAction:
                  type: string
                  value: null
              scopeNote:
                  type: string
                  value: null
              winitProductCode:
                  type: string
                  value: null
              isStandardHeadway:
                  type: boolean
                  value: null
              referExpertId:
                  type: string
                  value: null
              orderNo:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163018"
      type: code
      title: load-booking-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 4787
      parameters:
          code: |-
              /**
               * 节点：load-booking-kb — 按 intent / 送仓方式拼接预约 KB
               * FaaS 单文件闭环，无外部 import。
               */

              function str(v: unknown): string {
                return typeof v === "string" ? v : "";
              }

              function hasLookupHint(text: string): boolean {
                return /\bWI\d+/i.test(text) || /预约单|booking/i.test(text);
              }

              function extractSections(kb: string, sectionTitles: string[]): string {
                if (!kb.trim()) return "";
                const blocks = kb.split(/\n(?=## )/);
                const picked: string[] = [];
                for (const block of blocks) {
                  const titleLine = block.split("\n")[0] ?? "";
                  const title = titleLine.replace(/^##\s*/, "").trim();
                  if (sectionTitles.some((t) => title.includes(t) || t.includes(title))) {
                    picked.push(block.trim());
                  }
                }
                return picked.length > 0 ? picked.join("\n\n") : kb;
              }

              function sopForDeliveryWay(kbSop: string, hint: string): string {
                const key = hint.toUpperCase();
                if (key === "EXPRESS" || key === "COURIER" || key.includes("快递")) {
                  return extractSections(kbSop, ["Express", "快递", "通用说明"]);
                }
                if (key === "FCL" || key.includes("整柜")) {
                  return extractSections(kbSop, ["FCL", "整柜", "通用说明", "合并预约"]);
                }
                if (key === "LCL" || key.includes("散货")) {
                  return extractSections(kbSop, ["LCL", "散货", "通用说明", "合并预约"]);
                }
                return kbSop;
              }

              function pickKbParts(
                intent: string,
                deliveryWayHint: string,
                kbBookingSop: string,
                kbBookingRules: string,
                kbPenaltyRules: string,
                kbSplitShipment: string,
                kbPremiumBooking: string,
                kbBookingApiRef: string,
                kbPodDownloadGuide: string,
                queryText: string
              ): { parts: string[]; scope: string } {
                const wantsPremium = /增值|付费预约|premium/i.test(queryText);

                switch (intent) {
                  case "create_guide": {
                    const sop = sopForDeliveryWay(kbBookingSop, deliveryWayHint);
                    const apiHint = extractSections(kbBookingApiRef, ["API 链路", "核心业务规则", "FCL 必填"]);
                    const parts = [sop];
                    if (apiHint) parts.push(apiHint);
                    return {
                      parts,
                      scope: deliveryWayHint ? `create_guide:${deliveryWayHint}` : "create_guide",
                    };
                  }
                  case "modify_guide":
                    return {
                      parts: [extractSections(kbBookingRules, ["修改", "变更"]), extractSections(kbBookingSop, ["通用说明"])],
                      scope: "modify_guide",
                    };
                  case "cancel_guide":
                    return {
                      parts: [
                        extractSections(kbBookingRules, ["取消", "免费取消"]),
                        extractSections(kbPenaltyRules, ["已预约未到仓", "超时取消"]),
                      ],
                      scope: "cancel_guide",
                    };
                  case "split_shipment":
                    return {
                      parts: [kbSplitShipment, extractSections(kbBookingSop, ["合并预约", "通用说明"])],
                      scope: "split_shipment",
                    };
                  case "penalty": {
                    const parts = [kbPenaltyRules];
                    if (wantsPremium) parts.push(kbPremiumBooking);
                    parts.push(extractSections(kbBookingSop, ["Express", "快递", "仓内上架"]));
                    return { parts, scope: wantsPremium ? "penalty:premium" : "penalty" };
                  }
                  case "query":
                    return {
                      parts: [
                        extractSections(kbBookingApiRef, ["预约状态码", "API 链路"]),
                        extractSections(kbBookingRules, ["预约状态", "提前预约", "修改"]),
                        extractSections(kbBookingSop, ["通用说明"]),
                      ],
                      scope: "query",
                    };
                  case "pod_guide":
                    return {
                      parts: [
                        kbPodDownloadGuide,
                        extractSections(kbBookingApiRef, ["Step 6", "B.6", "预约状态码"]),
                        extractSections(kbBookingRules, ["预约状态"]),
                      ],
                      scope: hasLookupHint(queryText) ? "pod_guide:with_lookup" : "pod_guide",
                    };
                  default:
                    return { parts: [kbBookingSop, kbBookingRules], scope: "full" };
                }
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const intent = str(params.intent) || "create_guide";
                const deliveryWayHint = str(params.deliveryWayHint);
                const warehouseCode = str(params.warehouseCode);
                const routePath = str(params.routePath);
                const query = str(params.query);

                const { parts, scope } = pickKbParts(
                  intent,
                  deliveryWayHint,
                  str(params.kbBookingSop),
                  str(params.kbBookingRules),
                  str(params.kbPenaltyRules),
                  str(params.kbSplitShipment),
                  str(params.kbPremiumBooking),
                  str(params.kbBookingApiRef),
                  str(params.kbPodDownloadGuide),
                  query
                );

                const kbParts = parts.filter(Boolean);
                if (warehouseCode) {
                  kbParts.push(`## 仓库上下文\n查询/指引涉及仓库：${warehouseCode}`);
                }

                return {
                  kbContent: kbParts.join("\n\n---\n\n"),
                  kbScope: `${scope}:${routePath || "default"}`,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-booking-kb")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: intent
                input:
                    value:
                        path: intent
                        ref_node: "163000"
              - name: routePath
                input:
                    value:
                        path: routePath
                        ref_node: "163008"
              - name: kbOnly
                input:
                    value:
                        path: kbOnly
                        ref_node: "163008"
              - name: deliveryWayHint
                input:
                    value:
                        path: deliveryWayHint
                        ref_node: "163000"
              - name: warehouseCode
                input:
                    value:
                        path: warehouseCode
                        ref_node: "163000"
              - name: query
                input:
                    value:
                        path: query
                        ref_node: "163000"
              - name: kbBookingSop
                input:
                    value:
                        path: output
                        ref_node: "163001"
              - name: kbBookingRules
                input:
                    value:
                        path: output
                        ref_node: "163002"
              - name: kbPenaltyRules
                input:
                    value:
                        path: output
                        ref_node: "163003"
              - name: kbSplitShipment
                input:
                    value:
                        path: output
                        ref_node: "163004"
              - name: kbPremiumBooking
                input:
                    value:
                        path: output
                        ref_node: "163005"
              - name: kbBookingApiRef
                input:
                    value:
                        path: output
                        ref_node: "163006"
              - name: kbPodDownloadGuide
                input:
                    value:
                        path: output
                        ref_node: "163007"
          node_outputs:
              kbContent:
                  type: string
                  value: null
              kbScope:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163019"
      type: llm
      title: llm-analyze
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-LLM-v2.jpg
      description: 调用大语言模型,使用变量和提示词生成回复
      version: "3"
      position:
          x: 480
          y: 5027
      parameters:
          fcParamVar:
              knowledgeFCParam: {}
          llmParam:
              - name: apiMode
                input:
                    type: integer
                    value: "0"
              - name: temperature
                input:
                    type: float
                    value: "0.5"
              - name: topP
                input:
                    type: float
                    value: "1"
              - name: frequencyPenalty
                input:
                    type: float
