    - id: "163008"
      type: code
      title: route-intent
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2387
      parameters:
          code: |-
              /**
               * 节点：route-intent — SOP 类 intent=KB only；query/penalty=API + 可选 OMS 表头
               * FaaS 单文件闭环，无外部 import。
               */

              const KB_ONLY_INTENTS = new Set([
                "create_guide",
                "modify_guide",
                "cancel_guide",
                "split_shipment",
              ]);
              const API_INTENTS = new Set(["query", "penalty", "pod_guide"]);

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function hasOrderLookup(params: Record<string, unknown>): boolean {
                const nos = Array.isArray(params.inboundOrderNos) ? params.inboundOrderNos : [];
                return nos.length > 0 || str(params.bookingNo).length > 0;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.validationOk !== true) {
                  return {
                    routePath: "invalid",
                    skipApi: true,
                    skipOrderDetail: true,
                    kbOnly: true,
                  };
                }

                const intent = str(params.intent) || "create_guide";
                const hasLookup = hasOrderLookup(params);
                const kbOnlyIntent = KB_ONLY_INTENTS.has(intent);
                const apiIntent = API_INTENTS.has(intent);
                const kbOnly = kbOnlyIntent || (intent === "pod_guide" && !hasLookup);
                const skipApi = kbOnly || !apiIntent;
                const skipOrderDetail = skipApi || !hasLookup;

                return {
                  routePath: kbOnly ? "kb_only" : "api_chain",
                  skipApi,
                  skipOrderDetail,
                  kbOnly,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("route-intent")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: validationOk
                input:
                    value:
                        path: validationOk
                        ref_node: "163000"
              - name: intent
                input:
                    value:
                        path: intent
                        ref_node: "163000"
              - name: inboundOrderNos
                input:
                    value:
                        path: inboundOrderNos
                        ref_node: "163000"
              - name: bookingNo
                input:
                    value:
                        path: bookingNo
                        ref_node: "163000"
          node_outputs:
              routePath:
                  type: string
                  value: null
              skipApi:
                  type: boolean
                  value: null
              skipOrderDetail:
                  type: boolean
                  value: null
              kbOnly:
                  type: boolean
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163009"
      type: code
      title: resolve-inbound-lookup
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2627
      parameters:
          code: |-
              /**
               * 节点：规范化入库单查询标识
               * FaaS 单文件闭环，无外部 import。
               */

              function isWiOrderToken(raw: string): boolean {
                return /^WI/i.test(raw.trim());
              }

              function normalizeWiOrderNum(raw: string): string {
                return raw.trim().toUpperCase();
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipOrderDetail === true) {
                  return {
                    wiOrderNos: [],
                    customerRefNos: [],
                    inboundOrderNos: [],
                    lookupMeta: { skipped: true },
                  };
                }

                const raw = ((params.inboundOrderNos as string[]) ?? [])
                  .map((o) => String(o ?? "").trim())
                  .filter(Boolean);

                const wiSeen = new Set<string>();
                const refSeen = new Set<string>();
                const wiOrderNos: string[] = [];
                const customerRefNos: string[] = [];

                for (const token of raw) {
                  if (isWiOrderToken(token)) {
                    const normalized = normalizeWiOrderNum(token);
                    if (!wiSeen.has(normalized)) {
                      wiSeen.add(normalized);
                      wiOrderNos.push(normalized);
                    }
                  } else {
                    const normalized = token.trim();
                    if (!refSeen.has(normalized)) {
                      refSeen.add(normalized);
                      customerRefNos.push(normalized);
                    }
                  }
                }

                return {
                  wiOrderNos,
                  customerRefNos,
                  inboundOrderNos: [...wiOrderNos, ...customerRefNos],
                  lookupMeta: { hasOrders: wiOrderNos.length > 0 || customerRefNos.length > 0 },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("resolve-inbound-lookup")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
