              - name: thinkingType
                input:
                    type: string
                    value: disabled
              - name: responseFormat
                input:
                    type: integer
                    value: "2"
              - name: modelName
                input:
                    type: string
                    value: 豆包·2.0·pro
              - name: modelType
                input:
                    type: integer
                    value: "1772700462"
              - name: generationDiversity
                input:
                    type: string
                    value: balance
              - name: parameters
                input:
                    type: object
                    properties:
                        max_completion_tokens:
                            type: integer
