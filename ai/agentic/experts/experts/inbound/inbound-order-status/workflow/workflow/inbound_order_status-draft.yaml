               * 官方 id/39：N 不返回 merchandiseList/packageList；无包裹分页 API
               */

              const INBOUND_DETAIL_ACTION = "winit.wh.inbound.getOrderDetail";

              type DetailLevel =
                | "header"
                | "sku_summary"
                | "sku_filtered"
                | "package_summary"
                | "package_detail"
                | "item_lookup";

              type IsIncludePackage = "Y" | "N";

              interface DetailExtractOptions {
                detailLevel: DetailLevel;
                targetMerchandiseCodes?: string[];
                targetPackageNos?: string[];
                targetItemSernos?: string[];
                maxPackagesPerOrder?: number;
                maxMerchandisePerPackage?: number;
                packageFetchThreshold?: number;
              }

              interface DetailExtractMeta {
                detailLevel: DetailLevel;
                originalPackageCount: number;
                packagesDiscarded: boolean;
                merchandiseRowCount: number;
                requiresNarrowing?: boolean;
                largeOrderSkuOnly?: boolean;
                packagesRetained?: number;
              }

              interface SkuPutawaySummary {
                totalSkus: number;
                completedSkus: number;
                partialSkus: number;
                pendingSkus: number;
                putawayRate: number;
                anomalySkus: Array<{
                  merchandiseCode: string;
                  quantity: number;
                  actualQuantity: number;
                  inspectionQty?: number;
                }>;
                targetSkusOnly: boolean;
              }

              interface PackagePutawaySummary {
                totalPackages: number;
                byStatus: Record<string, number>;
                recentUnshelvedSample: Array<{
                  packageNo?: string;
                  sellerCaseNo?: string;
                  status?: string;
                  unloadingTime?: string;
                  shelvesTime?: string;
                }>;
                expectedPackages?: number;
                receivedPackages?: number;
                discrepancy?: number;
              }

              const PLUGIN_BATCH_MAX_DEFAULT = 100;
              const DEFAULT_MAX_PACKAGES = 50;
              const DEFAULT_MAX_MERCH_PER_PKG = 20;
              const DEFAULT_PACKAGE_THRESHOLD = 200;

              function __coze_shared_inbound_get_order_detail_ts_str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              function __coze_shared_inbound_get_order_detail_ts_num(v: unknown): number {
                const n = Number(v);
                return Number.isFinite(n) ? n : 0;
              }

              function __coze_shared_inbound_get_order_detail_ts_arr(v: unknown): string[] {
                if (!Array.isArray(v)) return [];
                return v.map((x) => __coze_shared_inbound_get_order_detail_ts_str(x)).filter(Boolean);
              }

              function getPluginBatchMaxActions(): number {
                if (typeof process !== "undefined" && process.env?.COZE_WINIT_PLUGIN_BATCH_MAX) {
                  const n = Number(process.env.COZE_WINIT_PLUGIN_BATCH_MAX);
                  if (Number.isFinite(n) && n >= 1) return Math.floor(n);
                }
                return PLUGIN_BATCH_MAX_DEFAULT;
              }

              function isIncludePackageForLevel(level: DetailLevel): IsIncludePackage {
                return level === "header" ? "N" : "Y";
              }

              /** 解析 detailLevel：兼容 includePackageDetails / checkPackageQty */
              function resolveDetailLevel(
                params: Record<string, unknown>,
                defaultLevel: DetailLevel
              ): DetailLevel {
                if (params.includePackageDetails === true) return "package_detail";
                const raw = __coze_shared_inbound_get_order_detail_ts_str(params.detailLevel);
                const levels: DetailLevel[] = [
                  "header",
                  "sku_summary",
                  "sku_filtered",
                  "package_summary",
                  "package_detail",
                  "item_lookup",
                ];
                if (raw && levels.includes(raw as DetailLevel)) return raw as DetailLevel;
                if (params.checkPackageQty === true && defaultLevel === "header") return "package_summary";
                return defaultLevel;
              }

              /** 统一官方字段名与历史别名 */
              function normalizeInboundOrderFields(order: Record<string, unknown>): Record<string, unknown> {
                const copy = { ...order };
                if (!copy.packageList && Array.isArray(copy.inboundPackageVos)) {
                  copy.packageList = copy.inboundPackageVos;
                }
                if (!copy.merchandiseList && Array.isArray(copy.inboundMerchandiseVos)) {
                  copy.merchandiseList = copy.inboundMerchandiseVos;
                }
                return copy;
              }

              type InboundDetailActionPlan = {
                inputToken: string;
                queryBy: "orderNo" | "customerOrderNo";
              };

              function buildInboundDetailActions(
                wiOrderNos: string[],
                customerRefNos: string[],
                detailLevel: DetailLevel
              ): {
                actions: Array<{ action: string; data: string }>;
                actionPlans: InboundDetailActionPlan[];
                winitPluginBatchActionsCount: number;
                actionName: string;
                detailLevel: DetailLevel;
                isIncludePackage: IsIncludePackage;
              } {
                const actionPlans: InboundDetailActionPlan[] = [];
                for (const no of wiOrderNos) {
                  if (no?.trim()) actionPlans.push({ inputToken: no.trim(), queryBy: "orderNo" });
                }
                for (const ref of customerRefNos) {
                  if (ref?.trim()) actionPlans.push({ inputToken: ref.trim(), queryBy: "customerOrderNo" });
                }

                const isIncludePackage = isIncludePackageForLevel(detailLevel);
                const maxActions = getPluginBatchMaxActions();
                const forPlugin = actionPlans.slice(0, maxActions);

                const actions = forPlugin.map((p) => {
                  const data: Record<string, string> = { isIncludePackage };
                  if (p.queryBy === "orderNo") data.orderNo = p.inputToken;
                  else data.customerOrderNo = p.inputToken;
                  return { action: INBOUND_DETAIL_ACTION, data: JSON.stringify(data) };
                });

                return {
                  actions,
                  actionPlans: forPlugin,
                  winitPluginBatchActionsCount: actions.length,
                  actionName: INBOUND_DETAIL_ACTION,
                  detailLevel,
                  isIncludePackage,
                };
              }

              function __coze_shared_inbound_get_order_detail_ts_pruneMerchandiseList(
                merchandiseList: unknown[],
                maxMerchandise: number,
                includeItemList: boolean
              ): unknown[] {
                const mapRow = (m: unknown) => {
                  const copy = { ...(m as Record<string, unknown>) };
                  if (!includeItemList) {
                    delete copy.itemList;
                    delete copy.batchList;
                  }
                  return copy;
                };
                if (merchandiseList.length <= maxMerchandise) {
                  return merchandiseList.map(mapRow);
                }
                const pruned = merchandiseList.slice(0, maxMerchandise).map(mapRow);
                pruned.push({ _truncated: true, _remainingCount: merchandiseList.length - maxMerchandise });
                return pruned;
              }

              function __coze_shared_inbound_get_order_detail_ts_prunePackageList(
                packageList: unknown[],
                maxPackages: number,
                maxMerchandise: number,
                includeItemList: boolean,
                targetPackageNos?: string[]
              ): unknown[] {
                let list = packageList;
                if (targetPackageNos?.length) {
                  const targets = new Set(targetPackageNos.map((t) => t.toUpperCase()));
                  list = packageList.filter((pkg) => {
                    const p = pkg as Record<string, unknown>;
                    const keys = [p.packageNo, p.sellerCaseNo, p.packageNum, p.barcode].map(__coze_shared_inbound_get_order_detail_ts_str);
                    return keys.some((k) => k && targets.has(k.toUpperCase()));
                  });
                }

                if (list.length <= maxPackages) {
                  return list.map((pkg) => {
                    const p = pkg as Record<string, unknown>;
                    const merchList = (p.merchandiseList as unknown[]) ?? [];
                    const copy = { ...p };
                    if (merchList.length > 0) {
                      copy.merchandiseList = __coze_shared_inbound_get_order_detail_ts_pruneMerchandiseList(merchList, maxMerchandise, includeItemList);
                    }
                    if (!includeItemList) delete copy.itemList;
                    return copy;
                  });
                }

                const sorted = [...list].sort((a, b) => {
                  const pa = a as Record<string, unknown>;
                  const pb = b as Record<string, unknown>;
                  const sa = __coze_shared_inbound_get_order_detail_ts_str(pa.status).toUpperCase();
                  const sb = __coze_shared_inbound_get_order_detail_ts_str(pb.status).toUpperCase();
                  const unshelved = (s: string) => (s === "SCP" || s === "SHD" ? 1 : 0);
                  if (unshelved(sa) !== unshelved(sb)) return unshelved(sa) - unshelved(sb);
                  return __coze_shared_inbound_get_order_detail_ts_str(pb.unloadingTime ?? pb.shelvesTime).localeCompare(__coze_shared_inbound_get_order_detail_ts_str(pa.unloadingTime ?? pa.shelvesTime));
                });

                const retained = sorted.slice(0, maxPackages).map((pkg) => {
                  const p = pkg as Record<string, unknown>;
                  const merchList = (p.merchandiseList as unknown[]) ?? [];
                  const copy = { ...p };
                  if (merchList.length > 0) {
                    copy.merchandiseList = __coze_shared_inbound_get_order_detail_ts_pruneMerchandiseList(merchList, maxMerchandise, includeItemList);
                  }
                  return copy;
                });
                retained.push({ _truncated: true, _remainingCount: list.length - maxPackages });
                return retained;
              }

              function __coze_shared_inbound_get_order_detail_ts_filterItemLookup(packageList: unknown[], targetItemSernos: string[]): unknown[] {
                const targets = new Set(targetItemSernos.map((t) => t.toUpperCase()));
                const out: unknown[] = [];
                for (const pkg of packageList) {
                  const p = pkg as Record<string, unknown>;
                  const merchList = (p.merchandiseList as unknown[]) ?? [];
                  const keptMerch: unknown[] = [];
                  for (const m of merchList) {
                    const row = m as Record<string, unknown>;
                    const items = (row.itemList as unknown[]) ?? [];
                    const hitItems = items.filter((it) => {
                      const i = it as Record<string, unknown>;
                      return targets.has(__coze_shared_inbound_get_order_detail_ts_str(i.itemSerno).toUpperCase());
                    });
                    if (hitItems.length > 0) {
                      keptMerch.push({ ...row, itemList: hitItems });
                    }
                  }
                  if (keptMerch.length > 0) {
                    out.push({ ...p, merchandiseList: keptMerch });
                  }
                }
                return out;
              }

              function extractInboundOrderDetail(
                order: Record<string, unknown>,
                options: DetailExtractOptions
              ): { order: Record<string, unknown>; meta: DetailExtractMeta } {
                const normalized = normalizeInboundOrderFields(order);
                const level = options.detailLevel;
                const maxPackages = options.maxPackagesPerOrder ?? DEFAULT_MAX_PACKAGES;
                const maxMerch = options.maxMerchandisePerPackage ?? DEFAULT_MAX_MERCH_PER_PKG;
                const threshold = options.packageFetchThreshold ?? DEFAULT_PACKAGE_THRESHOLD;
                const targetSkus = __coze_shared_inbound_get_order_detail_ts_arr(options.targetMerchandiseCodes as unknown);
                const targetPkgs = __coze_shared_inbound_get_order_detail_ts_arr(options.targetPackageNos as unknown);
                const targetItems = __coze_shared_inbound_get_order_detail_ts_arr(options.targetItemSernos as unknown);

                const packageList = (normalized.packageList as unknown[]) ?? [];
                const merchandiseList = (normalized.merchandiseList as unknown[]) ?? [];
                const totalPackageQty = __coze_shared_inbound_get_order_detail_ts_num(normalized.totalPackageQty) || packageList.length;

                const meta: DetailExtractMeta = {
                  detailLevel: level,
                  originalPackageCount: packageList.length,
                  packagesDiscarded: false,
                  merchandiseRowCount: merchandiseList.length,
                };

                const copy = { ...normalized };

                if (level === "header") {
                  delete copy.packageList;
                  delete copy.inboundPackageVos;
                  delete copy.merchandiseList;
                  delete copy.inboundMerchandiseVos;
                  meta.packagesDiscarded = packageList.length > 0;
                  return { order: copy, meta };
                }

                if (level === "sku_summary" || level === "sku_filtered") {
                  delete copy.packageList;
                  delete copy.inboundPackageVos;
                  meta.packagesDiscarded = packageList.length > 0;
                  if (totalPackageQty > threshold) meta.largeOrderSkuOnly = true;

                  let merch = merchandiseList;
                  if (level === "sku_filtered" && targetSkus.length > 0) {
                    const set = new Set(targetSkus.map((s) => s.toUpperCase()));
                    merch = merchandiseList.filter((m) => {
                      const code = __coze_shared_inbound_get_order_detail_ts_str((m as Record<string, unknown>).merchandiseCode).toUpperCase();
                      return set.has(code);
                    });
                    meta.merchandiseRowCount = merch.length;
                  }
                  copy.merchandiseList = merch;
                  delete copy.inboundMerchandiseVos;
                  return { order: copy, meta };
                }

                if (level === "package_summary") {
                  delete copy.packageList;
                  delete copy.inboundPackageVos;
                  meta.packagesDiscarded = true;
                  copy._packageListForAggregate = packageList;
                  return { order: copy, meta };
                }

                if (level === "package_detail" || level === "item_lookup") {
                  if (
                    totalPackageQty > threshold &&
                    targetPkgs.length === 0 &&
                    targetItems.length === 0
                  ) {
                    delete copy.packageList;
                    delete copy.inboundPackageVos;
                    meta.requiresNarrowing = true;
                    meta.packagesDiscarded = true;
                    return { order: copy, meta };
                  }

                  const includeItemList = level === "item_lookup";
                  let pruned: unknown[];
                  if (level === "item_lookup" && targetItems.length > 0) {
                    pruned = __coze_shared_inbound_get_order_detail_ts_filterItemLookup(packageList, targetItems);
                  } else {
                    pruned = __coze_shared_inbound_get_order_detail_ts_prunePackageList(packageList, maxPackages, maxMerch, includeItemList, targetPkgs);
                  }
                  copy.packageList = pruned;
                  delete copy.inboundPackageVos;
                  meta.packagesRetained = pruned.filter((p) => !(p as Record<string, unknown>)._truncated).length;
                  return { order: copy, meta };
                }

                return { order: copy, meta };
              }

              function extractInboundDetailBatch(
                rawOrderData: Record<string, unknown>,
                options: DetailExtractOptions
              ): {
                rawOrderData: Record<string, unknown>;
                _detailExtractMeta: { orders: DetailExtractMeta[]; requiresNarrowing: boolean };
              } {
                const list = (rawOrderData.list as unknown[]) ?? [];
                const extracted: unknown[] = [];
                const metas: DetailExtractMeta[] = [];
                let requiresNarrowing = false;

                for (const item of list) {
                  if (!item || typeof item !== "object") continue;
                  const { order, meta } = extractInboundOrderDetail(item as Record<string, unknown>, options);
                  extracted.push(order);
                  metas.push(meta);
                  if (meta.requiresNarrowing) requiresNarrowing = true;
                }

                return {
                  rawOrderData: { ...rawOrderData, list: extracted, _detailExtractMeta: { orders: metas, requiresNarrowing } },
                  _detailExtractMeta: { orders: metas, requiresNarrowing },
                };
              }

              function __coze_shared_inbound_get_order_detail_ts_effectiveParts(row: Record<string, unknown>): number {
                const spn = __coze_shared_inbound_get_order_detail_ts_num(row.standardPartsNum);
                return spn > 0 ? spn : 1;
              }

              function aggregateSkuPutaway(
                merchandiseList: unknown[],
                targetMerchandiseCodes?: string[]
              ): SkuPutawaySummary {
                let rows = merchandiseList.filter((m) => m && typeof m === "object") as Record<string, unknown>[];
                const targetSkusOnly = (targetMerchandiseCodes?.length ?? 0) > 0;
                if (targetSkusOnly) {
                  const set = new Set(targetMerchandiseCodes!.map((s) => s.toUpperCase()));
                  rows = rows.filter((r) => set.has(__coze_shared_inbound_get_order_detail_ts_str(r.merchandiseCode).toUpperCase()));
                }

                let completedSkus = 0;
                let partialSkus = 0;
                let pendingSkus = 0;
                const anomalySkus: SkuPutawaySummary["anomalySkus"] = [];

                for (const row of rows) {
                  const parts = __coze_shared_inbound_get_order_detail_ts_effectiveParts(row);
                  const expected = __coze_shared_inbound_get_order_detail_ts_num(row.quantity) * parts;
                  const actual = __coze_shared_inbound_get_order_detail_ts_num(row.actualQuantity) * parts;
                  const inspectionQty = __coze_shared_inbound_get_order_detail_ts_num(row.inspectionQty) * parts;

                  if (actual >= expected && expected > 0) completedSkus++;
                  else if (actual > 0) partialSkus++;
                  else pendingSkus++;

                  // 以验收量为准判断异常：验收量存在时用它比较，否则回退到上架量
                  // 避免「已验收通过但未上架」被误判为数量差异
                  const effectiveReceived = inspectionQty > 0 ? inspectionQty : actual;
                  if (expected > 0 && effectiveReceived !== expected) {
                    anomalySkus.push({
                      merchandiseCode: __coze_shared_inbound_get_order_detail_ts_str(row.merchandiseCode),
                      quantity: expected,
                      actualQuantity: actual,
                      inspectionQty: inspectionQty || undefined,
                    });
                  }
                }

                const totalSkus = rows.length;
                const putawayRate = totalSkus > 0 ? Math.round((completedSkus / totalSkus) * 100) / 100 : 0;

                return {
                  totalSkus,
                  completedSkus,
                  partialSkus,
                  pendingSkus,
                  putawayRate,
                  anomalySkus: anomalySkus.slice(0, 50),
                  targetSkusOnly,
                };
              }

              function aggregatePackagePutaway(
                order: Record<string, unknown>,
                packageListOverride?: unknown[]
              ): PackagePutawaySummary {
                const packageList =
                  packageListOverride ??
                  (order._packageListForAggregate as unknown[]) ??
                  (order.packageList as unknown[]) ??
                  [];
                const byStatus: Record<string, number> = {};
                const unshelved: PackagePutawaySummary["recentUnshelvedSample"] = [];

                for (const pkg of packageList) {
                  if (!pkg || typeof pkg !== "object") continue;
                  const p = pkg as Record<string, unknown>;
                  if (p._truncated) continue;
                  const status = __coze_shared_inbound_get_order_detail_ts_str(p.status) || "UNKNOWN";
                  byStatus[status] = (byStatus[status] ?? 0) + 1;
                  const shelved = ["SCP", "SHD"].includes(status.toUpperCase());
                  if (!shelved && unshelved.length < 10) {
                    unshelved.push({
                      packageNo: __coze_shared_inbound_get_order_detail_ts_str(p.packageNo) || undefined,
                      sellerCaseNo: __coze_shared_inbound_get_order_detail_ts_str(p.sellerCaseNo) || undefined,
                      status,
                      unloadingTime: __coze_shared_inbound_get_order_detail_ts_str(p.unloadingTime) || undefined,
                      shelvesTime: __coze_shared_inbound_get_order_detail_ts_str(p.shelvesTime) || undefined,
                    });
                  }
                }

                const expectedPackages = __coze_shared_inbound_get_order_detail_ts_num(order.totalPackageQty ?? order.orderPackageQty);
                const receivedPackages = __coze_shared_inbound_get_order_detail_ts_num(order.actualOrderPackageQty) || packageList.length;

                return {
                  totalPackages: packageList.filter((p) => !(p as Record<string, unknown>)?._truncated).length,
                  byStatus,
                  recentUnshelvedSample: unshelved,
                  expectedPackages: expectedPackages || undefined,
                  receivedPackages: receivedPackages || undefined,
                  discrepancy:
                    expectedPackages > 0 ? expectedPackages - receivedPackages : undefined,
                };
              }

              /* coze-inline: node */
              /**
               * 节点：按 detailLevel 剥离 packageList / merchandiseList（默认 header）
               */


              const DEFAULT_DETAIL_LEVEL: DetailLevel = "header";

              async function main({ params }: { params: Record<string, unknown> }) {
                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const detailLevel = resolveDetailLevel(params, DEFAULT_DETAIL_LEVEL);

                const { rawOrderData: extracted, _detailExtractMeta } = extractInboundDetailBatch(rawOrderData, {
                  detailLevel,
                  targetMerchandiseCodes: params.targetMerchandiseCodes as string[] | undefined,
                  targetPackageNos: params.targetPackageNos as string[] | undefined,
                  targetItemSernos: params.targetItemSernos as string[] | undefined,
                  maxPackagesPerOrder: params.maxPackagesPerOrder as number | undefined,
                  maxMerchandisePerPackage: params.maxMerchandisePerPackage as number | undefined,
                });

                return { rawOrderData: extracted, _detailExtractMeta, detailLevel };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("extract-inbound-detail")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163011"
              - name: detailLevel
                input:
                    value:
                        path: inputs.detailLevel
                        ref_node: "100001"
              - name: includePackageDetails
                input:
                    value:
                        path: inputs.includePackageDetails
                        ref_node: "100001"
          node_outputs:
              rawOrderData:
                  type: object
                  value: null
              _detailExtractMeta:
                  type: object
                  value: null
              detailLevel:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163013"
      type: code
      title: prune-inbound-json
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 3587
      parameters:
          code: |-
              /**
               * 节点：入库单 JSON 剪枝（trackingList / 兼容 trajectoryList / inboundPackageVos）
               */

              interface PruneMeta {
                originalTrajectoryCount: number;
                retainedTrajectoryCount: number;
                packagesOmitted: boolean;
              }

              const DEFAULT_MAX_TRAJECTORY = 20;

              function pruneOrder(
                order: Record<string, unknown>,
                maxTrajectory: number,
                includePackageDetails: boolean
              ): { order: Record<string, unknown>; meta: PruneMeta } {
                let originalTrajectoryCount = 0;
                let retainedTrajectoryCount = 0;
                const copy = { ...order };

                const trajKey = Array.isArray(copy.trackingList)
                  ? "trackingList"
                  : Array.isArray(copy.trajectoryList)
                    ? "trajectoryList"
                    : null;
                if (trajKey) {
                  const traj = copy[trajKey] as unknown[];
                  originalTrajectoryCount = traj.length;
                  if (traj.length > maxTrajectory) {
                    copy[trajKey] = traj.slice(-maxTrajectory);
                    retainedTrajectoryCount = maxTrajectory;
                    (copy as Record<string, unknown>)._trajectoryTruncated = true;
                  } else {
                    retainedTrajectoryCount = traj.length;
                  }
                }

                let packagesOmitted = false;
                if (!includePackageDetails) {
                  if (copy.packageList != null) {
                    delete copy.packageList;
                    packagesOmitted = true;
                  }
                  if (copy.inboundPackageVos != null) {
                    delete copy.inboundPackageVos;
                    packagesOmitted = true;
                  }
                }

                return {
                  order: copy,
                  meta: { originalTrajectoryCount, retainedTrajectoryCount, packagesOmitted },
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const list = (rawOrderData.list as unknown[]) ?? [];
                const maxTrajectory =
                  typeof params.maxTrajectoryNodes === "number" && params.maxTrajectoryNodes >= 1
                    ? Math.floor(params.maxTrajectoryNodes)
                    : DEFAULT_MAX_TRAJECTORY;
                const includePackageDetails = params.includePackageDetails === true;

                const prunedList: unknown[] = [];
                const metaList: PruneMeta[] = [];

                for (const item of list) {
                  if (!item || typeof item !== "object") continue;
                  const { order, meta } = pruneOrder(item as Record<string, unknown>, maxTrajectory, includePackageDetails);
                  prunedList.push(order);
                  metaList.push(meta);
                }

                const _pruneMeta = { orders: metaList };

                return {
                  prunedOrderData: { ...rawOrderData, list: prunedList, _pruneMeta },
                  _pruneMeta,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("prune-inbound-json")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163012"
              - name: includePackageDetails
                input:
                    value:
                        path: inputs.includePackageDetails
                        ref_node: "100001"
              - name: maxTrajectoryNodes
                input:
                    value:
                        path: inputs.maxTrajectoryNodes
                        ref_node: "100001"
          node_outputs:
              prunedOrderData:
                  type: object
                  value: null
              _pruneMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163014"
      type: code
      title: load-status-lexicon
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 3827
      parameters:
          code: |-
              /**
               * 节点：加载入库状态词典与字段指南（与 prompts/*.md 同步）
               */

              const STATUS_LEXICON = `# 入库单状态词典

              | 状态码 | 中文含义 | 实物流位置 | 解读要点 |
              |--------|----------|------------|----------|
              | DR | 草稿/已创建 | — | 尚未确认发货 |
              | OD | 已确认/待发货 | 国内待交付 | 等待客户发货或交运 |
              | RE | 国内仓已收货 | 国内仓 | 国内验货/集货阶段 |
              | TS | 已发运/在途 | 国际运输 | 头程运输中 |
              | PEWC | 预计在仓期 | 海外已到仓/验货中 | 到仓后验货或等待确认 |
              | EWC | 已完全上架前在仓 | 海外仓 | 已到仓，可能待上架完成 |
              | SHD | 已入库存 | 库存可用 | 上架完成可售 |
              | STOP | 已终止 | — | 流程中止 |
              | Void | 已作废 | — | 单据作废 |

              ## 状态流转（简化）

              OD → TS → PEWC → EWC → SHD

              国内验货路径可能含 RE；直发/海外验路径 PEWC 停留时间较长属常见现象。
              `;

              const FIELD_GUIDE = `# 入库单 JSON 字段解读

              | 字段 | 含义 |
              |------|------|
              | orderNo / inboundOrderNum | 万邑通入库单号（WI 前缀） |
              | status | 状态码 |
              | winitProductCode | PSC 产品编码 |
              | winitProductName | PSC 产品名称 |
              | destWhCode | 目的仓编码 |
              | inspectionType | 验货类型（自验/海外验等） |
              | entryWhType | 入库方式（DI/DW/SD 等） |
              | trajectoryList | 轨迹里程碑 |
              | trackingList | 轨迹列表（来自 queryOrderTracking；getOrderDetail 不含轨迹） |
              | isAbnormal | 是否异常标记 |
              | dicDate | 到仓时间 |
              | shelveCompletedDate | 上架完成时间 |
              | orderMerchandiseQty / actualOrderMerchandiseQty | 预报/实收商品件数 |
              | orderPackageQty / actualOrderPackageQty | 预报/实收包裹数 |

              ## 剪枝说明
              - _pruneMeta.orders[].originalTrajectoryCount / retainedTrajectoryCount：轨迹剪枝元信息
              - _trajectoryTruncated=true 表示轨迹被截断，分析时须说明 isTruncated
              `;

              const ERROR_CODE_KB = `# 常见入库报错码（KB 摘要）

              | 报错码/关键词 | 含义 | 常见触发 |
              |---------------|------|----------|
              | ERR_STOCK_MISMATCH | 库存/商品信息不匹配 | SKU 未注册或信息不一致 |
              | 商品不存在 | SKU 未在系统注册 | 需先注册发布商品 |
              | 逾期账单 | 账户欠费 | 账单未结清限制下单 |
              | 额度不足 | CBM/SKU 额度用尽 | 库容或 SKU 额度不足 |

              纯 KB 路径：无单号仅有 errorCode 时，据此解读，不调用 API。
              `;

              async function main({ params }: { params: Record<string, unknown> }) {
                return {
                  statusLexicon: STATUS_LEXICON,
                  fieldGuide: FIELD_GUIDE,
                  errorCodeKb: ERROR_CODE_KB,
                  errorCode: String(params.errorCode ?? "").trim(),
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-status-lexicon")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: errorCode
                input:
                    value:
                        path: errorCode
                        ref_node: "163000"
          node_outputs:
              statusLexicon:
                  type: string
                  value: null
              fieldGuide:
                  type: string
                  value: null
              errorCodeKb:
                  type: string
                  value: null
              errorCode:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163015"
      type: code
      title: derive-order-status-evidence
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 4067
      parameters:
          code: |-
              /**
               * 节点：derive-order-status-evidence
               *
               * 将 OMS 订单字段与轨迹拆成可安全消费的证据层：
               * - 轨迹节点属于当前接口实际返回的事实；
               * - expected / target / goal 时间只保留其计划语义；
               * - 本专家不查询头程 TMS 或异常接口，因此不得据此宣称已到港或无异常。
               */

              interface TrackingFact {
                code: string;
                description: string;
                time: string;
                location: string;
              }

              interface OrderStatusEvidence {
                orderNo: string;
                currentStatus: string;
                isHeadLegInTransit: boolean;
                latestActualMilestone: TrackingFact | null;
                arrivalPortVerified: false;
                warehouseArrivalVerified: boolean;
                actualWarehouseArrivalTime: string | null;
                expectedSendwarehouseTime: string | null;
                forecastWarehouseTime: string | null;
                targetWarehouseArrivalTime: string | null;
                goalShelveDate: string | null;
                estimatedShelveTime: string | null;
                estimatedShelveTimeLocal: string | null;
                actualShelveTime: string | null;
                orderTimes: Record<string, string | null>;
                pickupTimes: Record<string, string | number | null>;
                timeEvidencePolicy: Record<string, string>;
                timeZone: "unknown";
                supplementalSource: string | null;
                orderProfile: Record<string, unknown>;
                product: Record<string, unknown>;
                transport: Record<string, unknown>;
                warehouse: Record<string, unknown>;
                inspection: Record<string, unknown>;
                processFlags: Record<string, unknown>;
                booking: Record<string, unknown>;
                serviceTiming: Record<string, unknown>;
                forecast: Record<string, unknown>;
                quantitySummary: Record<string, unknown>;
                dataCoverage: Record<string, string>;
                exceptionVerification: "not_checked_by_inbound_order_status";
                canClaimNoException: false;
                requiresManualTransitVerification: boolean;
                evidenceWarnings: string[];
              }

              const WAREHOUSE_ARRIVED_STATUSES = new Set(["PEWC", "EWC", "SHD"]);

              const ORDER_TIME_SEMANTICS: Record<string, string> = {
                orderDate: "system_recorded_order_time",
                shelveCompletedDate: "actual_shelve_completed_time",
                voidDate: "actual_void_time",
                awhDate: "actual_warehouse_arrival_time",
                dicDate: "actual_domestic_inbound_completed_time",
                dioDate: "actual_domestic_outbound_completed_time",
                pickupDate: "system_recorded_pickup_time",
                pickupCompletedDate: "actual_pickup_completed_time",
                estimateShelveCompletedDate: "system_target_shelve_time_not_commitment",
                goalShelveDate: "system_estimated_shelve_time_not_commitment",
                targetWarehouseArrivalTime: "system_target_warehouse_arrival_not_actual",
                unloadStartDate: "actual_unload_start_time",
                unloadDate: "actual_unload_completed_time",
                estimateUnloadDate: "system_estimated_unload_time_not_actual",
                mergeDate: "actual_order_merge_time",
                receiptCompletionDate: "actual_domestic_receipt_completed_time",
                estimateDeliveryDate: "system_estimated_outbound_time_not_warehouse_delivery",
                targetShelveTime: "system_target_shelve_time_not_commitment",
                targetShelveTimeLocal: "local_system_target_shelve_time_not_commitment",
                estimateShelveTime: "system_estimated_shelve_time_not_commitment",
                estimateShelveTimeLocal: "local_system_estimated_shelve_time_not_commitment",
                actualShelveTime: "actual_shelve_time",
                actualShelveTimeLocal: "local_actual_shelve_time",
                expectedSendwarehouseTime: "system_estimated_send_to_warehouse_not_actual",
                forecastWarehouseTime: "system_forecast_warehouse_arrival_not_actual",
              };

              function str(value: unknown): string {
                return value === undefined || value === null ? "" : String(value).trim();
              }

              function firstNonEmpty(...values: unknown[]): string {
                for (const value of values) {
                  const normalized = str(value);
                  if (normalized) return normalized;
                }
                return "";
              }

              function record(value: unknown): Record<string, unknown> {
                return value !== null && typeof value === "object" && !Array.isArray(value)
                  ? (value as Record<string, unknown>)
                  : {};
              }

              function stringMap(value: unknown): Record<string, string | null> {
                const source = record(value);
                const result: Record<string, string | null> = {};
                for (const [key, item] of Object.entries(source)) result[key] = str(item) || null;
                return result;
              }

              function trackingList(order: Record<string, unknown>): Array<Record<string, unknown>> {
                const raw = Array.isArray(order.trackingList)
                  ? order.trackingList
                  : Array.isArray(order.trajectoryList)
                    ? order.trajectoryList
                    : [];
                return raw.filter((item): item is Record<string, unknown> => Boolean(item) && typeof item === "object");
              }

              function trackingTime(item: Record<string, unknown>): string {
                return firstNonEmpty(
                  item.localTrackingDate,
                  item.trackingDate,
                  item.date,
                  item.time,
                  item.created,
                );
              }

              function latestTrackingFact(order: Record<string, unknown>): TrackingFact | null {
                const items = trackingList(order);
                if (items.length === 0) return null;

                let latest = items[items.length - 1]!;
                let latestTimestamp = Number.NEGATIVE_INFINITY;

                for (const item of items) {
                  const parsed = Date.parse(trackingTime(item).replace(" ", "T"));
                  if (Number.isFinite(parsed) && parsed >= latestTimestamp) {
                    latest = item;
                    latestTimestamp = parsed;
                  }
                }

                return {
                  code: firstNonEmpty(latest.trackingCode, latest.code, latest.statusCode),
                  description: firstNonEmpty(
                    latest.trackingDesc,
                    latest.description,
                    latest.desc,
                    latest.statusDesc,
                  ),
                  time: trackingTime(latest),
                  location: firstNonEmpty(latest.location, latest.address),
                };
              }

              function isHeadLegInTransit(order: Record<string, unknown>, status: string): boolean {
                if (status !== "TS") return false;
                const supplemental = record(order.supplementalOrderDetail);
                const product = record(supplemental.product);
                const transport = record(supplemental.transport);
                const productCode = firstNonEmpty(order.winitProductCode, product.winitProductCode);
                const transportType = firstNonEmpty(
                  order.transprotType,
                  order.transportType,
                  transport.transprotType,
                  transport.transportMode,
                ).toUpperCase();
                return /^OW01011/i.test(productCode) || transportType === "SEA" || transportType === "AIR";
              }

              function deriveEvidence(order: Record<string, unknown>): OrderStatusEvidence {
                const supplemental = record(order.supplementalOrderDetail);
                const orderTimes = stringMap(supplemental.orderTimes);
                const pickupTimesSource = record(supplemental.pickupTimes);
                const pickupTimes: Record<string, string | number | null> = {};
                for (const [key, value] of Object.entries(pickupTimesSource)) {
                  pickupTimes[key] = typeof value === "number" ? value : str(value) || null;
                }
                const forecast = record(supplemental.forecast);
                const baseStatus = str(order.status).toUpperCase();
                const supplementalStatus = str(supplemental.status).toUpperCase();
                const currentStatus = baseStatus || supplementalStatus;
                const actualWarehouseArrivalTime =
                  firstNonEmpty(orderTimes.awhDate, order.awhDate, order.actualArrivalTime) || null;
                const warehouseArrivalVerified =
                  Boolean(actualWarehouseArrivalTime) || WAREHOUSE_ARRIVED_STATUSES.has(currentStatus);
                const headLegInTransit = isHeadLegInTransit(order, currentStatus);
                const expectedSendwarehouseTime = firstNonEmpty(
                  forecast.expectedSendwarehouseTime,
                  order.expectedSendwarehouseTime,
                ) || null;
                const forecastWarehouseTime = str(forecast.forecastWarehouseTime) || null;
                const targetWarehouseArrivalTime =
                  firstNonEmpty(orderTimes.targetWarehouseArrivalTime, order.targetWarehouseArrivalTime) || null;
                const goalShelveDate = firstNonEmpty(orderTimes.goalShelveDate, order.goalShelveDate) || null;
                const estimatedShelveTime = firstNonEmpty(
                  orderTimes.estimateShelveTime,
                  orderTimes.estimateShelveCompletedDate,
                ) || null;
                const estimatedShelveTimeLocal = str(orderTimes.estimateShelveTimeLocal) || null;
                const actualShelveTime = firstNonEmpty(
                  orderTimes.actualShelveTime,
                  orderTimes.shelveCompletedDate,
                  order.shelveCompletedDate,
                ) || null;

                const evidenceWarnings = [
                  "PORT_ARRIVAL_NOT_VERIFIED_BY_CURRENT_EXPERT",
                  "EXCEPTION_STATUS_NOT_CHECKED_BY_CURRENT_EXPERT",
                ];
                if (expectedSendwarehouseTime || targetWarehouseArrivalTime) {
                  evidenceWarnings.push("PLANNED_WAREHOUSE_TIME_IS_NOT_ACTUAL_ARRIVAL_EVIDENCE");
                }
                if (forecastWarehouseTime) {
                  evidenceWarnings.push("FORECAST_WAREHOUSE_TIME_IS_NOT_ACTUAL_ARRIVAL_EVIDENCE");
                }
                if (headLegInTransit && !expectedSendwarehouseTime) {
                  evidenceWarnings.push("EXPECTED_SENDWAREHOUSE_TIME_NOT_RETURNED");
                }
                if (goalShelveDate) {
                  evidenceWarnings.push("GOAL_SHELVE_DATE_IS_NOT_A_COMPLETION_COMMITMENT");
                }
                if (baseStatus && supplementalStatus && baseStatus !== supplementalStatus) {
                  evidenceWarnings.push("ORDER_STATUS_SOURCE_CONFLICT");
                }
                if ((actualWarehouseArrivalTime || actualShelveTime) && (expectedSendwarehouseTime || forecastWarehouseTime)) {
                  evidenceWarnings.push("ACTUAL_TIME_TAKES_PRECEDENCE_OVER_FORECAST");
                }

                const latestActualMilestone = latestTrackingFact(order);
                const hasTracking = Boolean(latestActualMilestone);

                return {
                  orderNo: firstNonEmpty(order.orderNo, order.inboundOrderNo, order.inboundOrderNum),
                  currentStatus,
                  isHeadLegInTransit: headLegInTransit,
                  latestActualMilestone,
                  // 当前专家只调用 OMS 详情与 OMS 轨迹，不调用 TMS 头程轨迹。
                  arrivalPortVerified: false,
                  warehouseArrivalVerified,
                  actualWarehouseArrivalTime,
                  expectedSendwarehouseTime,
                  forecastWarehouseTime,
                  targetWarehouseArrivalTime,
                  goalShelveDate,
                  estimatedShelveTime,
                  estimatedShelveTimeLocal,
                  actualShelveTime,
                  orderTimes,
                  pickupTimes,
                  timeEvidencePolicy: {
                    ...ORDER_TIME_SEMANTICS,
                  },
                  timeZone: "unknown",
                  supplementalSource: str(supplemental.sourceAction) || null,
                  orderProfile: record(supplemental.orderProfile),
                  product: record(supplemental.product),
                  transport: record(supplemental.transport),
                  warehouse: record(supplemental.warehouse),
                  inspection: record(supplemental.inspection),
                  processFlags: record(supplemental.processFlags),
                  booking: record(supplemental.booking),
                  serviceTiming: record(supplemental.serviceTiming),
                  forecast,
                  quantitySummary: record(supplemental.quantitySummary),
                  dataCoverage: {
                    orderStatus: currentStatus ? "available" : "not_returned",
                    tracking: hasTracking ? "available" : "not_returned",
                    expectedSendTime: expectedSendwarehouseTime ? "available" : "not_returned",
                    forecastWarehouseTime: forecastWarehouseTime ? "available" : "not_returned",
                    warehouseArrival: warehouseArrivalVerified ? "verified" : "not_verified",
                    shelveTime: actualShelveTime
                      ? "actual_available"
                      : estimatedShelveTime || estimatedShelveTimeLocal || goalShelveDate
                        ? "estimate_available"
                        : "not_returned",
                    exceptionStatus: "not_checked",
                  },
                  // 当前专家没有调用任何异常单或内部异常事件接口。
                  exceptionVerification: "not_checked_by_inbound_order_status",
                  canClaimNoException: false,
                  requiresManualTransitVerification: headLegInTransit && !warehouseArrivalVerified,
                  evidenceWarnings,
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const prunedOrderData = (params.prunedOrderData ?? {}) as Record<string, unknown>;
                const list = Array.isArray(prunedOrderData.list) ? prunedOrderData.list : [];
                const orders = list
                  .filter((item): item is Record<string, unknown> => Boolean(item) && typeof item === "object")
                  .map(deriveEvidence);

                return {
                  orderStatusEvidence: {
                    primary: orders[0] ?? null,
                    orders,
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("derive-order-status-evidence")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((result) => process.stdout.write(JSON.stringify(result)));
              }
          language: 5
          node_inputs:
              - name: prunedOrderData
                input:
                    value:
                        path: prunedOrderData
                        ref_node: "163013"
          node_outputs:
              orderStatusEvidence:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163016"
      type: llm
      title: llm-analyze
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-LLM-v2.jpg
      description: 调用大语言模型,使用变量和提示词生成回复
      version: "3"
      position:
          x: 480
          y: 4307
      parameters:
          fcParamVar:
              knowledgeFCParam: {}
          llmParam:
              - name: apiMode
                input:
                    type: integer
                    value: "0"
              - name: temperature
                input:
                    type: float
                    value: "0.5"
              - name: topP
                input:
                    type: float
                    value: "1"
              - name: frequencyPenalty
                input:
                    type: float
                    value: "0"
              - name: maxTokens
                input:
                    type: integer
                    value: "4096"
              - name: spCurrentTime
                input:
                    type: boolean
                    value: false
              - name: spAntiLeak
                input:
                    type: boolean
                    value: false
              - name: thinkingType
                input:
                    type: string
                    value: disabled
              - name: responseFormat
                input:
                    type: integer
                    value: "2"
              - name: modelName
                input:
                    type: string
                    value: 豆包·2.0·pro
              - name: modelType
                input:
                    type: integer
                    value: "1772700462"
              - name: generationDiversity
                input:
                    type: string
                    value: balance
              - name: parameters
                input:
                    type: object
                    properties:
                        max_completion_tokens:
                            type: integer
                            value: "0"
                        reasoning_effort:
                            type: string
                            value: minimal
                    value: null
              - name: prompt
                input:
                    type: string
                    value: ""
              - name: enableChatHistory
                input:
                    type: boolean
                    value: false
              - name: chatHistoryRound
                input:
                    type: integer
                    value: "3"
              - name: systemPrompt
                input:
                    type: string
                    value: |
                        # 入库单状态解读专家 - LLM Prompt

                        ## 角色

                        你是入库单状态解读专家，根据 `orderStatusEvidence`、`prunedOrderData` 与状态词典做**事实归纳**：说明当前状态码、状态中文名、关键字段与轨迹里程碑。纯 errorCode 路径时依据 errorCodeKb 解读报错含义。

                        `orderStatusEvidence` 由代码节点确定性生成，其证据分类与布尔判断优先级高于原始 JSON 和语言模型推断，不得改写或推翻。

                        ## 禁止项

                        - 不提供操作建议（不写「下一步怎么做」「请联系谁」）
                        - 不承诺上架/到仓时间
                        - 不引用飞书或内部系统 URL
                        - 只引用 JSON 中出现的字段
                        - 不得把 `expectedSendwarehouseTime`、`forecastWarehouseTime`、`targetWarehouseArrivalTime`、`goalShelveDate`、`estimatedShelveTime` 或 `estimatedShelveTimeLocal` 当作实际到港、实际到仓、实际上架或完成承诺
                        - 时间证据优先级固定为：实际时间 > 预计时间 > 目标时间；有实际值时不得用预计或目标值替代实际结果，但结构化结果仍须原样保留接口返回的各类时间
                        - `timeZone=unknown` 时不得自行补充时区或把非 Local 字段解释为仓库当地时间；仅带 `Local` 后缀的字段可称为当地时间
                        - `arrivalPortVerified=false` 时，不得声称已核实到港；客户询问到哪里时须说明实际到港时间尚未由当前专家核实
                        - `exceptionVerification=not_checked_by_inbound_order_status` 或 `canClaimNoException=false` 时，禁止使用「无异常」「没有异常」「不存在异常」或同义表述
                        - `requiresManualTransitVerification=true` 时，须明确说明当前仅能确认 OMS 状态和轨迹，精确到港及头程异常需要进一步人工核实
                        - `expectedSendwarehouseTime` 与 `forecastWarehouseTime` 语义不同：前者是预计送仓时间，后者是预计到仓时间，禁止互相补位或合并成一个字段

                        ## 输入

                        - **query**：`{{query}}`
                        - **customerIntent**：`{{customerIntent}}`
                        - **inboundOrderNos**：`{{inboundOrderNos}}`
                        - **errorCode**：`{{errorCode}}`
                        - **prunedOrderData**：

                        ```json
                        {{prunedOrderData}}
                        ```

                        - **orderStatusEvidence**（确定性证据边界）：

                        ```json
                        {{orderStatusEvidence}}
                        ```

                        - **statusLexicon**：`{{statusLexicon}}`
                        - **fieldGuide**：`{{fieldGuide}}`
                        - **errorCodeKb**：`{{errorCodeKb}}`

                        ## 输出格式

                        ```json
                        {
                          "analysisResult": {
                            "structured": {
                              "orderNo": "",
                              "status": "",
                              "statusLabel": "",
                              "winitProductCode": "",
                              "destWhCode": "",
                              "trajectorySummary": [],
                              "latestActualMilestone": null,
                              "arrivalPortVerified": false,
                              "warehouseArrivalVerified": false,
                              "actualWarehouseArrivalTime": null,
                              "expectedSendwarehouseTime": null,
                              "forecastWarehouseTime": null,
                              "targetWarehouseArrivalTime": null,
                              "goalShelveDate": null,
                              "estimatedShelveTime": null,
                              "estimatedShelveTimeLocal": null,
                              "actualShelveTime": null,
                              "orderTimes": {},
                              "pickupTimes": {},
                              "timeEvidencePolicy": {},
                              "timeZone": "unknown",
                              "dataCoverage": {},
                              "exceptionVerification": "not_checked_by_inbound_order_status",
                              "canClaimNoException": false,
                              "requiresManualTransitVerification": false,
                              "evidenceWarnings": [],
                              "errorCodeExplanation": "",
                              "isTruncated": false
                            },
                            "analysis": "基于数据的客观状态与字段说明。"
                          }
                        }
                        ```

                        ## 特殊规则

                        - `isAbnormal=true` 且无法定性时，analysis 末尾注明「建议联系客服进一步核实」
                        - 轨迹被剪枝（`_trajectoryTruncated` 或 `_pruneMeta`）时 `isTruncated=true` 并说明
                        - 轨迹来自 `trackingList`（`queryOrderTracking`）；若为空说明接口未返回或已跳过拉取
                        - `isTruncated=true` 仅当 `_trajectoryTruncated=true` 或 `_pruneMeta` 显示 original > retained；**空 trackingList 不算截断**
                        - 仅有 errorCode 无单号时，填充 `errorCodeExplanation`，orderNo 可留空
                        - 预计/目标字段如需回应，只能使用「系统预计」「系统目标」等限定语，并明确其不是实际到港或完成承诺
                        - `latestActualMilestone` 只描述 OMS 接口实际返回的最新轨迹，不把「海外港在途」改写成「已到港」
                        - `expectedSendwarehouseTime` 按「系统预计送仓时间」引用，`forecastWarehouseTime` 按「系统预计到仓时间」引用，两者均仅供参考
                        - `actualWarehouseArrivalTime`、`actualShelveTime` 有值时优先说明实际时间；预计和目标时间可作为补充字段展示，但不得覆盖实际事实
                        - `orderTimes` 与 `pickupTimes` 中非空字段均可按 `timeEvidencePolicy` 的语义回答；空值保持未知，不推算、不补齐
