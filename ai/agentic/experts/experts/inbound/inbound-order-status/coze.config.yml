yamlBasename: inbound_order_status-draft.yaml
packageMainName: inbound_order_status
packageDescription: 入库单状态解读（基础详情 → 补充订单时间 → queryOrderTracking → 证据分层 → LLM）

omitCodeNodeInputs:
  extract-inbound-detail:
    - targetMerchandiseCodes
    - targetPackageNos
    - targetItemSernos
    - maxPackagesPerOrder
    - maxMerchandisePerPackage

endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext

winitOpenapiPlugins:
  - insertBefore: fetch-inbound-order
    logicalId: winit_inbound_detail_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-winit-inbound-detail
        path: actions
  - insertBefore: fetch-order-tracking
    logicalId: winit_inbound_tracking_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-winit-order-tracking
        path: trackingActions
  - insertBefore: fetch-supplemental-order-detail
    logicalId: winit_inbound_supplemental_detail_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-supplemental-order-detail
        path: supplementalActions

inputBindings:
  build-winit-inbound-detail:
    wiOrderNos:
      ref: resolve-inbound-lookup
      path: wiOrderNos
    customerRefNos:
      ref: resolve-inbound-lookup
      path: customerRefNos
    skipApi:
      ref: resolve-inbound-lookup
      path: skipApi
    detailLevel:
      ref: __start__
      path: inputs.detailLevel
    includePackageDetails:
      ref: __start__
      path: inputs.includePackageDetails
  fetch-inbound-order:
    skipApi:
      ref: resolve-inbound-lookup
      path: skipApi
    actions:
      ref: build-winit-inbound-detail
      path: actions
    actionPlans:
      ref: build-winit-inbound-detail
      path: actionPlans
    winitPluginOutputList:
      ref: winit_inbound_detail_batch
      path: outputList
  build-supplemental-order-detail:
    skipApi:
      ref: resolve-inbound-lookup
      path: skipApi
    includeOrderTimeDetails:
      ref: __start__
      path: inputs.includeOrderTimeDetails
    rawOrderData:
      ref: fetch-inbound-order
      path: rawOrderData
  fetch-supplemental-order-detail:
    skipApi:
      ref: resolve-inbound-lookup
      path: skipApi
    skipSupplementalDetail:
      ref: build-supplemental-order-detail
      path: skipSupplementalDetail
    supplementalActions:
      ref: build-supplemental-order-detail
      path: supplementalActions
    supplementalActionPlans:
      ref: build-supplemental-order-detail
      path: supplementalActionPlans
    winitSupplementalPluginOutputList:
      ref: winit_inbound_supplemental_detail_batch
      path: outputList
    customerCode:
      ref: __start__
      path: customerCode
  merge-supplemental-order-detail:
    rawOrderData:
      ref: fetch-inbound-order
      path: rawOrderData
    supplementalByOrderNo:
      ref: fetch-supplemental-order-detail
      path: supplementalByOrderNo
  build-winit-order-tracking:
    skipApi:
      ref: resolve-inbound-lookup
      path: skipApi
    includeTracking:
      ref: resolve-inbound-lookup
      path: includeTracking
    rawOrderData:
      ref: merge-supplemental-order-detail
      path: rawOrderData
  fetch-order-tracking:
    skipApi:
      ref: resolve-inbound-lookup
      path: skipApi
    skipTracking:
      ref: build-winit-order-tracking
      path: skipTracking
    trackingActions:
      ref: build-winit-order-tracking
      path: trackingActions
    trackingActionPlans:
      ref: build-winit-order-tracking
      path: trackingActionPlans
    winitTrackingPluginOutputList:
      ref: winit_inbound_tracking_batch
      path: outputList
  merge-order-with-tracking:
    rawOrderData:
      ref: merge-supplemental-order-detail
      path: rawOrderData
    trackingByOrderNo:
      ref: fetch-order-tracking
      path: trackingByOrderNo
  extract-inbound-detail:
    rawOrderData:
      ref: merge-order-with-tracking
      path: rawOrderData
    detailLevel:
      ref: __start__
      path: inputs.detailLevel
    includePackageDetails:
      ref: __start__
      path: inputs.includePackageDetails
  prune-inbound-json:
    rawOrderData:
      ref: extract-inbound-detail
      path: rawOrderData
    includePackageDetails:
      ref: __start__
      path: inputs.includePackageDetails
    maxTrajectoryNodes:
      ref: __start__
      path: inputs.maxTrajectoryNodes
  derive-order-status-evidence:
    prunedOrderData:
      ref: prune-inbound-json
      path: prunedOrderData
  format-output:
    orderStatusEvidence:
      ref: derive-order-status-evidence
      path: orderStatusEvidence
  load-status-lexicon:
    errorCode:
      ref: resolve-inbound-lookup
      path: errorCode
