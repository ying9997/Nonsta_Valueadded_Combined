    - id: "163000"
      type: code
      title: resolve-overseas-query
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 467
      parameters:
          code: |-
              /**
               * 节点：解析海外验查询意图与模式
               */

              const VALID_INTENTS = new Set(["progress", "mode_faq"]);
              const VALID_MODES = new Set(["with_carton", "without_carton", "forecast", "auto"]);

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function normalizeIntent(raw: unknown): string {
                const t = str(raw).toLowerCase();
                return VALID_INTENTS.has(t) ? t : "progress";
              }

              function normalizeMode(raw: unknown): string {
                const t = str(raw).toLowerCase();
                return VALID_MODES.has(t) ? t : "auto";
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const intent = normalizeIntent(params.intent);
                const inspectionMode = normalizeMode(params.inspectionMode);
                const modeTopic = str(params.modeTopic) || "packing_list_vs_forecast";
                const inboundOrderNos = ((params.inboundOrderNos as string[]) ?? [])
                  .map((o) => String(o ?? "").trim())
                  .filter(Boolean);

                if (intent === "mode_faq") {
                  return {
                    intent,
                    inspectionMode,
                    modeTopic,
                    skipApi: true,
                    validationOk: true,
                    inboundOrderNos,
                  };
                }

                const validationOk = inboundOrderNos.length > 0;
                return {
                  intent,
                  inspectionMode,
                  modeTopic,
                  skipApi: !validationOk,
                  validationOk,
                  error: validationOk ? "" : "progress 意图需提供 inboundOrderNos",
                  inboundOrderNos,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("resolve-overseas-query")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: intent
                input:
                    value:
                        path: inputs.intent
                        ref_node: "100001"
              - name: inspectionMode
                input:
                    value:
                        path: inputs.inspectionMode
                        ref_node: "100001"
              - name: modeTopic
                input:
                    value:
                        path: inputs.modeTopic
                        ref_node: "100001"
              - name: inboundOrderNos
                input:
                    value:
                        path: inputs.inboundOrderNos
                        ref_node: "100001"
          node_outputs:
              intent:
                  type: string
                  value: null
              inspectionMode:
                  type: string
                  value: null
              modeTopic:
                  type: string
                  value: null
              skipApi:
                  type: boolean
                  value: null
              validationOk:
                  type: boolean
                  value: null
              error:
                  type: string
                  value: null
              inboundOrderNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163001"
      type: code
      title: resolve-inbound-lookup
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 707
      parameters:
          code: |-
              /**
               * 节点：规范化入库单查询标识
               */

              function isWiOrderToken(raw: string): boolean {
                return /^WI/i.test(raw.trim());
              }

              function normalizeWiOrderNum(raw: string): string {
                return raw.trim().toUpperCase();
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const skipFromParent = params.skipApi === true;
                const raw = ((params.inboundOrderNos as string[]) ?? [])
                  .map((o) => String(o ?? "").trim())
                  .filter(Boolean);

                const wiSeen = new Set<string>();
                const refSeen = new Set<string>();
                const wiOrderNos: string[] = [];
                const customerRefNos: string[] = [];

                for (const token of raw) {
                  if (isWiOrderToken(token)) {
                    const normalized = normalizeWiOrderNum(token);
                    if (!wiSeen.has(normalized)) {
                      wiSeen.add(normalized);
                      wiOrderNos.push(normalized);
                    }
                  } else {
                    const normalized = token.trim();
                    if (!refSeen.has(normalized)) {
                      refSeen.add(normalized);
                      customerRefNos.push(normalized);
                    }
                  }
                }

                const hasOrders = wiOrderNos.length > 0 || customerRefNos.length > 0;
                const skipApi = skipFromParent || !hasOrders;

                return {
                  wiOrderNos,
                  customerRefNos,
                  inboundOrderNos: [...wiOrderNos, ...customerRefNos],
                  skipApi,
                  lookupMeta: { hasOrders, skipApi },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("resolve-inbound-lookup")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: inboundOrderNos
                input:
                    value:
                        path: inboundOrderNos
                        ref_node: "163000"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163000"
          node_outputs:
              wiOrderNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              customerRefNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              inboundOrderNos:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              skipApi:
                  type: boolean
                  value: null
              lookupMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163002"
      type: code
      title: build-winit-inbound-detail
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 947
      parameters:
          code: |-
              /**
               * 节点：为 winit.wh.inbound.getOrderDetail 组装插件批处理动作
               */

              const INBOUND_DETAIL_ACTION = "winit.wh.inbound.getOrderDetail";
              const PLUGIN_BATCH_MAX_ACTIONS_DEFAULT = 100;

              function getPluginBatchMaxActions(): number {
                if (typeof process !== "undefined" && process.env?.COZE_WINIT_PLUGIN_BATCH_MAX) {
                  const n = Number(process.env.COZE_WINIT_PLUGIN_BATCH_MAX);
                  if (Number.isFinite(n) && n >= 1) return Math.floor(n);
                }
                return PLUGIN_BATCH_MAX_ACTIONS_DEFAULT;
              }

              type ActionPlan = { inputToken: string; queryBy: "orderNo" | "customerOrderNo" };

              async function main({ params }: { params: Record<string, unknown> }) {
                const skipApi = params.skipApi === true;
                const wiOrderNos = ((params.wiOrderNos as string[]) ?? []).filter((o) => o?.trim());
                const customerRefNos = ((params.customerRefNos as string[]) ?? []).filter((o) => o?.trim());

                if (skipApi) {
                  return {
                    actions: [],
                    actionPlans: [],
                    winitPluginBatchActionsCount: 0,
                    actionName: INBOUND_DETAIL_ACTION,
                    skipApi: true,
                  };
                }

                const actionPlans: ActionPlan[] = [];
                for (const no of wiOrderNos) actionPlans.push({ inputToken: no, queryBy: "orderNo" });
                for (const ref of customerRefNos) actionPlans.push({ inputToken: ref, queryBy: "customerOrderNo" });

                const forPlugin = actionPlans.slice(0, getPluginBatchMaxActions());
                const actions = forPlugin.map((p) => {
                  const data: Record<string, string> = {};
                  if (p.queryBy === "orderNo") data.orderNo = p.inputToken;
                  else data.customerOrderNo = p.inputToken;
                  return { action: INBOUND_DETAIL_ACTION, data: JSON.stringify(data) };
                });

                return {
                  actions,
                  actionPlans: forPlugin,
                  winitPluginBatchActionsCount: actions.length,
                  actionName: INBOUND_DETAIL_ACTION,
                  skipApi: false,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("build-winit-inbound-detail")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: wiOrderNos
                input:
                    value:
                        path: wiOrderNos
                        ref_node: "163001"
              - name: customerRefNos
                input:
                    value:
                        path: customerRefNos
                        ref_node: "163001"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163001"
          node_outputs:
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              actionPlans:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              winitPluginBatchActionsCount:
                  type: integer
                  value: null
              actionName:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
