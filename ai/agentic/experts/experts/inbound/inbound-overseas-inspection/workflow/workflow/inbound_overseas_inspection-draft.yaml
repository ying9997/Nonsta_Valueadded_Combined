    - id: "163004"
      type: code
      title: fetch-inbound-order
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1427
      parameters:
          code: |-
              /**
               * 节点：本地 Runner 补拉入库单详情
               */

              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              const INBOUND_DETAIL_ACTION = "winit.wh.inbound.getOrderDetail";

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function coerceDetailPayload(parsed: unknown): Record<string, unknown> | null {
                if (parsed == null || typeof parsed !== "object") return null;
                const o = parsed as Record<string, unknown>;
                if (o.output != null && typeof o.output === "object") return coerceDetailPayload(o.output);
                if (o.code === "0" || o.code === 0) {
                  const inner = o.data;
                  if (typeof inner === "string") {
                    try {
                      return coerceDetailPayload(JSON.parse(inner));
                    } catch {
                      return null;
                    }
                  }
                  if (inner != null && typeof inner === "object") return coerceDetailPayload(inner);
                  return null;
                }
                if (o.orderNo != null || o.inboundOrderNum != null || o.inboundOrderNo != null) return o;
                return null;
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              function mergePluginOutputs(params: Record<string, unknown>): Record<string, unknown> {
                const outputList = (Array.isArray(params.winitPluginOutputList) ? params.winitPluginOutputList : []) as Array<{
                  data?: unknown;
                }>;
                const rowsByKey = new Map<string, Record<string, unknown>>();
                for (const item of outputList) {
                  const row = coerceDetailPayload(parseCozeWorkflowDataField(item?.data));
                  if (!row) continue;
                  const key = String(row.orderNo ?? row.inboundOrderNum ?? "").trim().toUpperCase();
                  if (key) rowsByKey.set(key, row);
                }
                const list = Array.from(rowsByKey.values());
                return { list, total: list.length, _fetchMeta: { strategy: "detail-only", batchPluginMerged: true } };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipApi === true) {
                  return { rawOrderData: { list: [], total: 0, _fetchMeta: { strategy: "kb-only" } } };
                }

                const pluginList = params.winitPluginOutputList;
                if (Array.isArray(pluginList) && pluginList.length > 0) {
                  return { rawOrderData: mergePluginOutputs(params) };
                }

                const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                  action: string;
                  data: string;
                }>;
                const env = getCozeWinitEnv();
                const list: Record<string, unknown>[] = [];
                const errors: string[] = [];

                if (!env) {
                  return {
                    rawOrderData: {
                      list: [],
                      total: 0,
                      _fetchMeta: { strategy: "local-fetch-skipped", reason: "missing Coze env" },
                    },
                  };
                }

                for (const act of actions) {
                  try {
                    const data = JSON.parse(act.data) as Record<string, unknown>;
                    const parsed = await runCozeWinitWorkflow(env, act.action || INBOUND_DETAIL_ACTION, data);
                    const row = coerceDetailPayload(parsed);
                    if (row) list.push(row);
                  } catch (e) {
                    errors.push(String(e instanceof Error ? e.message : e));
                  }
                }

                return {
                  rawOrderData: {
                    list,
                    total: list.length,
                    _fetchMeta: { strategy: "local-proxy-detail", resolvedCount: list.length, errors: errors.length ? errors : undefined },
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-inbound-order")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: actions
                input:
                    value:
                        path: actions
                        ref_node: "163002"
              - name: actionPlans
                input:
                    value:
                        path: actionPlans
                        ref_node: "163002"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163003"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163001"
          node_outputs:
              rawOrderData:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163005"
      type: code
      title: prune-inbound-json
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1667
      parameters:
          code: |-
              /**
               * 节点：海外验专家入库单 JSON 剪枝（保留验货相关字段与轨迹）
               */

              const INSPECTION_FIELDS = [
                "orderNo",
                "inboundOrderNum",
                "status",
                "winitProductCode",
                "inspectionType",
                "inspectionStatus",
                "dicDate",
                "awhDate",
                "actualArrivalTime",
                "isAbnormal",
                "bookingStatus",
                "orderMerchandiseQty",
                "actualOrderMerchandiseQty",
                "trajectoryList",
              ];

              const DEFAULT_MAX_TRAJECTORY = 20;

              function pickFields(order: Record<string, unknown>, maxTrajectory: number) {
                const copy: Record<string, unknown> = {};
                for (const key of INSPECTION_FIELDS) {
                  if (order[key] != null) copy[key] = order[key];
                }
                const traj = copy.trajectoryList;
                if (Array.isArray(traj) && traj.length > maxTrajectory) {
                  copy.trajectoryList = traj.slice(-maxTrajectory);
                  copy._trajectoryTruncated = true;
                }
                return copy;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipApi === true) {
                  return { prunedOrderData: { list: [], total: 0 }, _pruneMeta: { skipped: true } };
                }

                const rawOrderData = (params.rawOrderData ?? {}) as Record<string, unknown>;
                const list = (rawOrderData.list as unknown[]) ?? [];
                const maxTrajectory =
                  typeof params.maxTrajectoryNodes === "number" && params.maxTrajectoryNodes >= 1
                    ? Math.floor(params.maxTrajectoryNodes)
                    : DEFAULT_MAX_TRAJECTORY;

                const prunedList = list
                  .filter((item) => item && typeof item === "object")
                  .map((item) => pickFields(item as Record<string, unknown>, maxTrajectory));

                return {
                  prunedOrderData: { ...rawOrderData, list: prunedList },
                  _pruneMeta: { orderCount: prunedList.length },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("prune-inbound-json")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163004"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163001"
              - name: maxTrajectoryNodes
                input:
                    value:
                        path: inputs.maxTrajectoryNodes
                        ref_node: "100001"
          node_outputs:
              prunedOrderData:
                  type: object
                  value: null
              _pruneMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163006"
      type: code
      title: compute-overseas-inspection-phase
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1907
      parameters:
          code: |-
              /**
               * 节点：从 OMS 入库单推断海外验阶段、模式与轨迹行为
               */

              type OverseasInspectionPhase =
                | "not_arrived"
                | "awaiting_inspection"
                | "in_progress"
                | "completed"
                | "blocked";

              type InspectionMode = "with_carton" | "without_carton" | "forecast" | "unknown";

              function str(v: unknown): string {
                return v == null ? "" : String(v).trim();
              }

              function stringArray(value: unknown): string[] {
                return Array.isArray(value)
                  ? value.map((item) => str(item)).filter(Boolean)
                  : [];
              }

              function parseDate(v: unknown): Date | null {
                const s = str(v);
                if (!s) return null;
                const d = new Date(s);
                return Number.isNaN(d.getTime()) ? null : d;
              }

              function isWeekend(d: Date): boolean {
                const dow = d.getDay();
                return dow === 0 || dow === 6;
              }

              function countBusinessDaysBetween(start: Date, end: Date): number {
                let count = 0;
                const cur = new Date(start);
                cur.setHours(0, 0, 0, 0);
                const endDay = new Date(end);
                endDay.setHours(0, 0, 0, 0);
                while (cur < endDay) {
                  cur.setDate(cur.getDate() + 1);
                  if (!isWeekend(cur)) count++;
                }
                return count;
              }

              const INSPECTION_KEYWORDS = ["验货", "验收", "海外验", "inspection", "pewc", "ewc"];

              function isInspectionNode(node: Record<string, unknown>): boolean {
                const text = [node.nodeName, node.nodeDesc, node.status, node.remark, node.eventName, node.trajectoryDesc]
                  .map(str)
                  .join(" ")
                  .toLowerCase();
                return INSPECTION_KEYWORDS.some((kw) => text.includes(kw));
              }

              function inferInspectionMode(
                order: Record<string, unknown>,
                requestedMode: string
              ): InspectionMode {
                if (requestedMode === "with_carton") return "with_carton";
                if (requestedMode === "without_carton") return "without_carton";
                if (requestedMode === "forecast") return "forecast";

                const psc = str(order.winitProductCode).toUpperCase();
                const inspectionType = str(order.inspectionType).toLowerCase();

                if (psc === "OW01031" || inspectionType.includes("有箱单") || inspectionType.includes("packing")) {
                  return "with_carton";
                }
                if (psc === "OW01032" || inspectionType.includes("预报") || inspectionType.includes("forecast")) {
                  return "forecast";
                }
                if (inspectionType.includes("无箱单") || inspectionType.includes("without")) {
                  return "without_carton";
                }
                return "unknown";
              }

              function mapPhase(order: Record<string, unknown>): OverseasInspectionPhase {
                const status = str(order.status).toUpperCase();
                const inspectionStatus = str(order.inspectionStatus);
                const dicDate = str(order.dicDate);
                const isAbnormal = order.isAbnormal === true || order.isAbnormal === "Y";

                if (status === "TS") return "not_arrived";
                if (dicDate || status === "EWC" || status === "SHD") return "completed";
                if (status === "PEWC") {
                  if (/in\s*progress|进行中/i.test(inspectionStatus)) return "in_progress";
                  return "awaiting_inspection";
                }
                if (isAbnormal) return "blocked";
                return "awaiting_inspection";
              }

              function extractTrajectorySummary(order: Record<string, unknown>) {
                const trajectory = Array.isArray(order.trajectoryList) ? order.trajectoryList : [];
                return trajectory
                  .filter((n) => n && typeof n === "object" && isInspectionNode(n as Record<string, unknown>))
                  .slice(-10)
                  .map((n) => {
                    const node = n as Record<string, unknown>;
                    return {
                      nodeName: str(node.nodeName ?? node.eventName ?? node.status),
                      eventTime: str(node.eventTime ?? node.createTime ?? node.operateTime),
                      nodeDesc: str(node.nodeDesc ?? node.trajectoryDesc ?? node.remark),
                    };
                  });
              }

              function computeOrderPhase(order: Record<string, unknown>, requestedMode: string) {
                const awhDate = str(order.awhDate ?? order.actualArrivalTime);
                const awhParsed = parseDate(awhDate);
                const daysSinceArrival = awhParsed ? countBusinessDaysBetween(awhParsed, new Date()) : 0;
                let overseasInspectionPhase = mapPhase(order);
                const isAbnormal = order.isAbnormal === true || order.isAbnormal === "Y";
                const blockedReason = isAbnormal ? "存在异常单，可能阻塞验货进度" : "";

                if (isAbnormal && overseasInspectionPhase !== "completed" && overseasInspectionPhase !== "not_arrived") {
                  overseasInspectionPhase = "blocked";
                }

                return {
                  orderNo: str(order.orderNo ?? order.inboundOrderNum),
                  winitProductCode: str(order.winitProductCode),
                  inspectionType: str(order.inspectionType),
                  inspectionStatus: str(order.inspectionStatus),
                  inspectionMode: inferInspectionMode(order, requestedMode),
                  currentStatus: str(order.status),
                  overseasInspectionPhase,
                  dicDate: str(order.dicDate) || null,
                  awhDate: awhDate || null,
                  daysSinceArrival,
                  trajectorySummary: extractTrajectorySummary(order),
                  isAbnormal,
                  blockedReason: blockedReason || null,
                  qtySnapshot: {
                    orderMerchandiseQty: order.orderMerchandiseQty ?? null,
                    actualOrderMerchandiseQty: order.actualOrderMerchandiseQty ?? null,
                  },
                  bookingStatus: str(order.bookingStatus) || null,
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const intent = str(params.intent) || "progress";
                const inspectionMode = str(params.inspectionMode) || "auto";

                if (intent === "mode_faq") {
                  return {
                    inspectionPhase: {
                      intent: "mode_faq",
                      inspectionMode,
                      orders: [],
                      orderCount: 0,
                    },
                  };
                }

                const prunedOrderData = (params.prunedOrderData ?? {}) as Record<string, unknown>;
                const list = (prunedOrderData.list as unknown[]) ?? [];
                const orders = list
                  .filter((item) => item && typeof item === "object")
                  .map((item) => computeOrderPhase(item as Record<string, unknown>, inspectionMode));

                if (orders.length === 0 && intent === "progress" && stringArray(params.inboundOrderNos).length > 0) {
                  return {
                    inspectionPhase: {
                      outputPath: "no_data",
                      dataAvailable: false,
                      needsClarification: true,
                      clarificationFields: ["inboundOrderNo"],
                      orderNo: "",
                      winitProductCode: "",
                      inspectionType: "",
                      inspectionStatus: "",
                      inspectionMode: inspectionMode === "auto" ? "unknown" : inspectionMode,
                      currentStatus: "",
                      overseasInspectionPhase: "unknown",
                      dicDate: null,
                      awhDate: null,
                      daysSinceArrival: null,
                      trajectorySummary: [],
                      isAbnormal: null,
                      blockedReason: null,
                      qtySnapshot: { orderMerchandiseQty: null, actualOrderMerchandiseQty: null },
                      bookingStatus: null,
                      intent: "progress",
                      orders: [],
                      orderCount: 0,
                      wmsDataAvailable: false,
                    },
                  };
                }

                const primary = orders[0] ?? {
                  orderNo: "",
                  winitProductCode: "",
                  inspectionType: "",
                  inspectionStatus: "",
                  inspectionMode: inspectionMode === "auto" ? "unknown" : inspectionMode,
                  currentStatus: "",
                  overseasInspectionPhase: "not_arrived" as OverseasInspectionPhase,
                  dicDate: null,
                  awhDate: null,
                  daysSinceArrival: 0,
                  trajectorySummary: [],
                  isAbnormal: false,
                  blockedReason: null,
                  qtySnapshot: { orderMerchandiseQty: null, actualOrderMerchandiseQty: null },
                  bookingStatus: null,
                };

                return {
                  inspectionPhase: {
                    ...primary,
                    intent: "progress",
                    orders,
                    orderCount: orders.length,
                    wmsDataAvailable: false,
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("compute-overseas-inspection-phase")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: prunedOrderData
                input:
                    value:
                        path: prunedOrderData
                        ref_node: "163005"
              - name: intent
                input:
                    value:
                        path: intent
                        ref_node: "163000"
              - name: inspectionMode
                input:
                    value:
                        path: inspectionMode
                        ref_node: "163000"
              - name: inboundOrderNos
                input:
                    value:
                        path: inboundOrderNos
                        ref_node: "163001"
          node_outputs:
              inspectionPhase:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
