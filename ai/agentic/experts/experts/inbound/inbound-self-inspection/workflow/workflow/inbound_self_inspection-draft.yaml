    - id: "163012"
      type: code
      title: fetch-exception-list
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 3347
      parameters:
          code: |-
              /* coze-inline: shared/fms-token-url.ts */
              type FmsRegion = "CN" | "US" | "EU" | "AU" | "DEFAULT";

              type FmsCredential = {
                fmsUrl: string;
                clientId: string;
                clientSecret: string;
                edsUser: string;
                edsToken: string;
              };

              type FmsRuntimeConfig = Partial<Record<FmsRegion, FmsCredential>>;

              type FmsTokenUrlResult = {
                rawUrl: string;
                signedUrl: string;
                region: FmsRegion | "";
                status: "ok" | "not_fms" | "missing_config" | "invalid_url";
              };

              const FMS_REGIONS: FmsRegion[] = ["CN", "US", "EU", "AU"];

              function fmsEnv(name: string, fallback: string): string {
                if (typeof process !== "undefined" && process.env?.[name]) {
                  return String(process.env[name]).trim();
                }
                return fallback;
              }

              function fmsPlaceholder(region: FmsRegion, name: "CLIENT_KEY" | "CLIENT_SECRET" | "USER_KEY" | "USER_SECRET"): string {
                const placeholders: Record<FmsRegion, Record<"CLIENT_KEY" | "CLIENT_SECRET" | "USER_KEY" | "USER_SECRET", string>> = {
                  CN: {
                    CLIENT_KEY: "__FMS_CN_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_CN_CLIENT_SECRET__",
                    USER_KEY: "__FMS_CN_USER_KEY__",
                    USER_SECRET: "__FMS_CN_USER_SECRET__",
                  },
                  US: {
                    CLIENT_KEY: "__FMS_US_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_US_CLIENT_SECRET__",
                    USER_KEY: "__FMS_US_USER_KEY__",
                    USER_SECRET: "__FMS_US_USER_SECRET__",
                  },
                  AU: {
                    CLIENT_KEY: "__FMS_AU_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_AU_CLIENT_SECRET__",
                    USER_KEY: "__FMS_AU_USER_KEY__",
                    USER_SECRET: "__FMS_AU_USER_SECRET__",
                  },
                  EU: {
                    CLIENT_KEY: "__FMS_EU_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_EU_CLIENT_SECRET__",
                    USER_KEY: "__FMS_EU_USER_KEY__",
                    USER_SECRET: "__FMS_EU_USER_SECRET__",
                  },
                  DEFAULT: {
                    CLIENT_KEY: "__FMS_US_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_US_CLIENT_SECRET__",
                    USER_KEY: "__FMS_US_USER_KEY__",
                    USER_SECRET: "__FMS_US_USER_SECRET__",
                  },
                };
                return placeholders[region][name];
              }

              function fmsCredentialFromEnv(region: FmsRegion, defaultUrl: string): FmsCredential {
                return {
                  fmsUrl: fmsEnv(`FMS_${region}_URL`, defaultUrl).replace(/\/+$/, ""),
                  clientId: fmsEnv(`FMS_${region}_CLIENT_KEY`, fmsPlaceholder(region, "CLIENT_KEY")),
                  clientSecret: fmsEnv(`FMS_${region}_CLIENT_SECRET`, fmsPlaceholder(region, "CLIENT_SECRET")),
                  edsUser: fmsEnv(`FMS_${region}_USER_KEY`, fmsPlaceholder(region, "USER_KEY")),
                  edsToken: fmsEnv(`FMS_${region}_USER_SECRET`, fmsPlaceholder(region, "USER_SECRET")),
                };
              }

              function defaultFmsRuntimeConfig(): FmsRuntimeConfig {
                const us = fmsCredentialFromEnv("US", "https://usfmsstream.winit.com.cn");
                return {
                  CN: fmsCredentialFromEnv("CN", "https://cnfmsstream.winit.com.cn"),
                  US: us,
                  AU: fmsCredentialFromEnv("AU", "https://aufmsstream.winit.com.cn"),
                  EU: fmsCredentialFromEnv("EU", "https://eufmsstream.winit.com.cn"),
                  DEFAULT: us,
                };
              }

              function fmsIsConfigured(value: string): boolean {
                const s = value.trim();
                return Boolean(s) && !/^__FMS_[A-Z]+_[A-Z_]+__$/.test(s);
              }

              function fmsHasCredential(credential: FmsCredential | undefined): credential is FmsCredential {
                return Boolean(
                  credential &&
                    fmsIsConfigured(credential.fmsUrl) &&
                    fmsIsConfigured(credential.clientId) &&
                    fmsIsConfigured(credential.clientSecret) &&
                    fmsIsConfigured(credential.edsUser) &&
                    fmsIsConfigured(credential.edsToken)
                );
              }

              function fmsParseUrl(rawUrl: string): { isAbsolute: boolean; host: string; path: string } | null {
                const trimmed = rawUrl.trim();
                if (!trimmed) return null;
                if (/^https?:\/\//i.test(trimmed)) {
                  const match = trimmed.match(/^https?:\/\/([^/?#]+)([^?#]*)/i);
                  if (!match) return null;
                  return {
                    isAbsolute: true,
                    host: match[1] ?? "",
                    path: match[2] || "/",
                  };
                }
                const pathOnly = trimmed.split(/[?#]/)[0] ?? "";
                return { isAbsolute: false, host: "", path: pathOnly.startsWith("/") ? pathOnly : `/${pathOnly}` };
              }

              function fmsRegionByUrl(rawUrl: string, config: FmsRuntimeConfig): FmsRegion | "" {
                const trimmed = rawUrl.trim();
                for (const region of FMS_REGIONS) {
                  const cfgUrl = config[region]?.fmsUrl?.replace(/\/+$/, "");
                  if (cfgUrl && trimmed.startsWith(cfgUrl)) return region;
                }

                const parsed = fmsParseUrl(trimmed);
                if (parsed?.isAbsolute) {
                  const match = parsed.host.match(/^([a-z]+)fmsstream\.winit\.com/i);
                  const region = match?.[1]?.toUpperCase() as FmsRegion | undefined;
                  if (region && FMS_REGIONS.includes(region)) return region;
                  return "";
                }

                return config.DEFAULT ? "DEFAULT" : "";
              }

              function isFmsUrl(rawUrl: unknown, config: FmsRuntimeConfig = defaultFmsRuntimeConfig()): rawUrl is string {
                return typeof rawUrl === "string" && fmsRegionByUrl(rawUrl, config) !== "";
              }

              function fmsUrlForSigning(rawUrl: string, credential: FmsCredential): string {
                const parsed = fmsParseUrl(rawUrl);
                const path = parsed?.path || "/";
                const base = credential.fmsUrl.replace(/\/+$/, "");
                return `${base}${path.startsWith("/") ? path : `/${path}`}`;
              }

              function fmsObjectUri(fileUrl: string): string {
                return fmsParseUrl(fileUrl)?.path || "/";
              }

              function fmsUtf8Bytes(input: string): number[] {
                const bytes: number[] = [];
                for (let i = 0; i < input.length; i++) {
                  let code = input.charCodeAt(i);
                  if (code < 0x80) {
                    bytes.push(code);
                  } else if (code < 0x800) {
                    bytes.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f));
                  } else if (code >= 0xd800 && code <= 0xdbff && i + 1 < input.length) {
                    const next = input.charCodeAt(++i);
                    code = 0x10000 + ((code & 0x3ff) << 10) + (next & 0x3ff);
                    bytes.push(
                      0xf0 | (code >> 18),
                      0x80 | ((code >> 12) & 0x3f),
                      0x80 | ((code >> 6) & 0x3f),
                      0x80 | (code & 0x3f)
                    );
                  } else {
                    bytes.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
                  }
                }
                return bytes;
              }

              function fmsLeftRotate(value: number, bits: number): number {
                return ((value << bits) | (value >>> (32 - bits))) >>> 0;
              }

              function fmsSha1(bytes: number[]): number[] {
                const message = bytes.slice();
                const bitLength = message.length * 8;
                message.push(0x80);
                while ((message.length % 64) !== 56) message.push(0);
                for (let i = 7; i >= 0; i--) message.push((bitLength / Math.pow(2, i * 8)) & 0xff);

                let h0 = 0x67452301;
                let h1 = 0xefcdab89;
                let h2 = 0x98badcfe;
                let h3 = 0x10325476;
                let h4 = 0xc3d2e1f0;

                for (let offset = 0; offset < message.length; offset += 64) {
                  const w = new Array<number>(80);
                  for (let i = 0; i < 16; i++) {
                    const j = offset + i * 4;
                    w[i] = ((message[j]! << 24) | (message[j + 1]! << 16) | (message[j + 2]! << 8) | message[j + 3]!) >>> 0;
                  }
                  for (let i = 16; i < 80; i++) {
                    w[i] = fmsLeftRotate((w[i - 3]! ^ w[i - 8]! ^ w[i - 14]! ^ w[i - 16]!) >>> 0, 1);
                  }

                  let a = h0;
                  let b = h1;
                  let c = h2;
                  let d = h3;
                  let e = h4;

                  for (let i = 0; i < 80; i++) {
                    let f = 0;
                    let k = 0;
                    if (i < 20) {
                      f = (b & c) | (~b & d);
                      k = 0x5a827999;
                    } else if (i < 40) {
                      f = b ^ c ^ d;
                      k = 0x6ed9eba1;
                    } else if (i < 60) {
                      f = (b & c) | (b & d) | (c & d);
                      k = 0x8f1bbcdc;
                    } else {
                      f = b ^ c ^ d;
                      k = 0xca62c1d6;
                    }
                    const temp = (fmsLeftRotate(a, 5) + f + e + k + w[i]!) >>> 0;
                    e = d;
                    d = c;
                    c = fmsLeftRotate(b, 30);
                    b = a;
                    a = temp;
                  }

                  h0 = (h0 + a) >>> 0;
                  h1 = (h1 + b) >>> 0;
                  h2 = (h2 + c) >>> 0;
                  h3 = (h3 + d) >>> 0;
                  h4 = (h4 + e) >>> 0;
                }

                const out: number[] = [];
                for (const h of [h0, h1, h2, h3, h4]) {
                  out.push((h >>> 24) & 0xff, (h >>> 16) & 0xff, (h >>> 8) & 0xff, h & 0xff);
                }
                return out;
              }

              function fmsHmacSha1Hex(key: string, message: string): string {
                let keyBytes = fmsUtf8Bytes(key);
                if (keyBytes.length > 64) keyBytes = fmsSha1(keyBytes);
                while (keyBytes.length < 64) keyBytes.push(0);

                const outer = keyBytes.map((b) => b ^ 0x5c);
                const inner = keyBytes.map((b) => b ^ 0x36);
                const digest = fmsSha1(inner.concat(fmsUtf8Bytes(message)));
                return fmsSha1(outer.concat(digest))
                  .map((b) => b.toString(16).padStart(2, "0"))
                  .join("")
                  .toUpperCase();
              }

              function fmsBase64Utf8(input: string): string {
                const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
                const bytes = fmsUtf8Bytes(input);
                let out = "";
                for (let i = 0; i < bytes.length; i += 3) {
                  const a = bytes[i]!;
                  const b = bytes[i + 1];
                  const c = bytes[i + 2];
                  out += alphabet[a >> 2];
                  out += alphabet[((a & 3) << 4) | ((b ?? 0) >> 4)];
                  out += b === undefined ? "=" : alphabet[((b & 15) << 2) | ((c ?? 0) >> 6)];
                  out += c === undefined ? "=" : alphabet[c & 63];
                }
                return out;
              }

              function buildFmsTokenUrl(
                rawUrl: string,
                config: FmsRuntimeConfig = defaultFmsRuntimeConfig(),
                nowMs = Date.now()
              ): FmsTokenUrlResult {
                const parsed = fmsParseUrl(rawUrl);
                if (!parsed) return { rawUrl, signedUrl: rawUrl, region: "", status: "invalid_url" };

                const region = fmsRegionByUrl(rawUrl, config);
                if (!region) return { rawUrl, signedUrl: rawUrl, region: "", status: "not_fms" };

                const credential = config[region] ?? config.DEFAULT;
                if (!fmsHasCredential(credential)) {
                  return { rawUrl, signedUrl: rawUrl, region, status: "missing_config" };
                }

                const fileUrl = fmsUrlForSigning(rawUrl, credential);
                const objectUri = fmsObjectUri(fileUrl);
                const date = Math.floor(nowMs);
                const canonical = `GET\n${objectUri}?clientId=${credential.clientId}&date=${date}&user=${credential.edsUser}`;
                const clientSign = fmsHmacSha1Hex(credential.clientSecret, canonical);
                const userSign = fmsHmacSha1Hex(credential.edsToken, canonical);
                const tokenContent =
                  `${objectUri}?clientSign=${clientSign}` +
                  `&userSign=${userSign}` +
                  `&version=V1.0` +
                  `&date=${date}` +
                  `&user=${credential.edsUser}` +
                  `&clientId=${credential.clientId}`;
                return {
                  rawUrl,
                  signedUrl: `${fileUrl}?token=${fmsBase64Utf8(tokenContent)}`,
                  region,
                  status: "ok",
                };
              }

              function fmsSignedKey(key: string): string {
                if (key === "fileUrl") return "signedFileUrl";
                if (key === "url") return "signedUrl";
                return `signed${key.charAt(0).toUpperCase()}${key.slice(1)}`;
              }

              function fmsSignStatusKey(key: string): string {
                if (key === "fileUrl") return "fileUrlSignStatus";
                if (key === "url") return "urlSignStatus";
                return `${key}SignStatus`;
              }

              function fmsShouldSignScalarKey(key: string): boolean {
                return key === "fileUrl" || key === "url" || /url$/i.test(key);
              }

              function signFmsUrlDeep(
                value: unknown,
                config: FmsRuntimeConfig = defaultFmsRuntimeConfig(),
                nowMs = Date.now()
              ): unknown {
                if (Array.isArray(value)) return value.map((item) => signFmsUrlDeep(item, config, nowMs));
                if (!value || typeof value !== "object") return value;

                const source = value as Record<string, unknown>;
                const out: Record<string, unknown> = {};

                for (const [key, raw] of Object.entries(source)) {
                  out[key] = signFmsUrlDeep(raw, config, nowMs);
                  if (fmsShouldSignScalarKey(key) && typeof raw === "string") {
                    const signed = buildFmsTokenUrl(raw, config, nowMs);
                    if (signed.status === "ok") {
                      out[fmsSignedKey(key)] = signed.signedUrl;
                    } else if (signed.status === "missing_config") {
                      out[fmsSignStatusKey(key)] = signed.status;
                    }
                  }
                }

                if (Array.isArray(source.unusualFiles)) {
                  const signedUnusualFiles: string[] = [];
                  const statuses: string[] = [];
                  for (const raw of source.unusualFiles) {
                    if (typeof raw !== "string") continue;
                    const signed = buildFmsTokenUrl(raw, config, nowMs);
                    if (signed.status === "ok") signedUnusualFiles.push(signed.signedUrl);
                    else if (signed.status === "missing_config") statuses.push(signed.status);
                  }
                  if (signedUnusualFiles.length > 0) out.signedUnusualFiles = signedUnusualFiles;
                  if (statuses.length > 0) out.unusualFilesSignStatus = Array.from(new Set(statuses)).join(",");
                }

                return out;
              }

              /* coze-inline: node */
              /**
               * 节点：拉取抽验相关异常单（wh.inboundOrder.queryExceptionList）
               * FaaS 单文件闭环，无 external import。
               */


              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              const ORDER_EXCEPTION_DETAIL_ACTION = "wh.inboundOrder.queryExceptionList";
              const SAMPLING_TYPES = /SAMPL|抽验|OW01V126/i;

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  return JSON.parse(data) as unknown;
                } catch {
                  return data;
                }
              }

              function flattenOrderExceptionDetails(orderNo: string, items: unknown[]): unknown[] {
                const rows: unknown[] = [];
                for (const item of items) {
                  if (!item || typeof item !== "object") continue;
                  const o = item as Record<string, unknown>;
                  const exceptionName = str(o.exceptionName);
                  const exceptionDesc = str(o.exceptionDesc);
                  const details = Array.isArray(o.exceptionDetailList) ? o.exceptionDetailList : [];
                  if (details.length === 0) {
                    rows.push({
                      orderNo,
                      exceptionType: exceptionName,
                      type: exceptionName,
                      exceptionReason: exceptionDesc,
                      errormsg: exceptionDesc,
                    });
                    continue;
                  }
                  for (const d of details) {
                    if (!d || typeof d !== "object") continue;
                    const detail = d as Record<string, unknown>;
                    rows.push({
                      orderNo,
                      exceptionType: exceptionName,
                      type: exceptionName,
                      exceptionReason: exceptionDesc,
                      errormsg: exceptionDesc,
                      merchandiseCode: str(detail.merchandiseSerno),
                      packageNo: str(detail.packageSerno),
                    });
                  }
                }
                return rows;
              }

              function coerceList(parsed: unknown, orderNoHint?: string): unknown[] {
                if (parsed == null) return [];
                if (Array.isArray(parsed)) {
                  return orderNoHint ? flattenOrderExceptionDetails(orderNoHint, parsed) : parsed;
                }
                if (typeof parsed !== "object") return [];
                const o = parsed as Record<string, unknown>;
                if (o.output != null) return coerceList(o.output, orderNoHint);
                if (o.code === "0" || o.code === 0) return coerceList(o.data, orderNoHint);
                return Array.isArray(o.list) ? o.list : [];
              }

              function isSamplingRecord(raw: unknown): boolean {
                if (!raw || typeof raw !== "object") return false;
                const o = raw as Record<string, unknown>;
                const type = String(o.exceptionType ?? o.type ?? o.exceptionName ?? "");
                const reason = String(o.exceptionReason ?? o.errormsg ?? o.exceptionDesc ?? "");
                return SAMPLING_TYPES.test(type) || SAMPLING_TYPES.test(reason);
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipExceptionApi === true) {
                  return { samplingExceptions: [] };
                }

                const pluginList = params.winitExceptionPluginOutputList;
                let list: unknown[] = [];
                if (Array.isArray(pluginList) && pluginList.length > 0) {
                  const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                    data: string;
                  }>;
                  for (let i = 0; i < pluginList.length; i++) {
                    const item = pluginList[i] as { data?: unknown };
                    let orderNoHint = "";
                    try {
                      orderNoHint = str(JSON.parse(actions[i]?.data ?? "{}").orderNo);
                    } catch {
                      /* ignore */
                    }
                    list.push(...coerceList(parseCozeWorkflowDataField(item?.data), orderNoHint || undefined));
                  }
                } else {
                  const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                    action: string;
                    data: string;
                  }>;
                  const env = getCozeWinitEnv();
                  if (env && actions.length > 0) {
                    for (const act of actions) {
                      try {
                        const data = JSON.parse(act.data) as Record<string, unknown>;
                        const orderNoHint = str(data.orderNo);
                        const parsed = await runCozeWinitWorkflow(
                          env,
                          act.action || ORDER_EXCEPTION_DETAIL_ACTION,
                          data
                        );
                        list.push(...coerceList(parsed, orderNoHint || undefined));
                      } catch {
                        /* continue */
                      }
                    }
                  }
                }

                const samplingExceptions = list.filter(isSamplingRecord);
                const selected = samplingExceptions.length > 0 ? samplingExceptions : list.slice(0, 20);
                return { samplingExceptions: signFmsUrlDeep(selected) };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-exception-list")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skipExceptionApi
                input:
                    value:
                        path: skipExceptionApi
                        ref_node: "163010"
              - name: actions
                input:
                    value:
                        path: actions
                        ref_node: "163010"
              - name: winitExceptionPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163011"
          node_outputs:
              samplingExceptions:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163013"
      type: code
      title: load-self-inspection-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 3587
      parameters:
          code: |-
              /**
               * 节点：load-self-inspection-kb — 按 intent/subTopic/phase + SI/QSI 拼接 KB
               * FaaS 单文件闭环，无外部 import。
               */

              type InspectionProduct = "SI" | "QSI" | "unknown";

              function str(v: unknown): string {
                return typeof v === "string" ? v : "";
              }

              function firstOrderRow(rawOrderData: unknown): Record<string, unknown> | null {
                if (rawOrderData == null || typeof rawOrderData !== "object") return null;
                const list = (rawOrderData as { list?: unknown[] }).list;
                if (!Array.isArray(list) || list.length === 0) return null;
                const row = list[0];
                return row != null && typeof row === "object" ? (row as Record<string, unknown>) : null;
              }

              function resolveInspectionProduct(rawOrderData: unknown, routePath: string): InspectionProduct {
                if (routePath === "kb_only") return "unknown";

                const row = firstOrderRow(rawOrderData);
                if (!row) return "unknown";

                const psc = str(row.winitProductCode) || str(row.productCode);
                const inspectionType = str(row.inspectionType);

                if (/OW01022/i.test(psc)) return "QSI";
                if (/OW01021/i.test(psc)) return "SI";
                if (/QSI|quick|快速|SelfInspectionPlanSKU/i.test(inspectionType)) return "QSI";
                if (/SI|classic|经典|旧自验/i.test(inspectionType)) return "SI";

                return "unknown";
              }

              function pickSubmitGuideKb(
                product: InspectionProduct,
                kbSubmitGuide: string,
                kbQsiGuide: string
              ): string {
                if (product === "QSI") return kbQsiGuide || kbSubmitGuide;
                if (product === "SI") return kbSubmitGuide;
                const parts = [kbSubmitGuide, kbQsiGuide].filter(Boolean);
                return parts.join("\n\n---\n\n");
              }

              function pickKbParts(
                intent: string,
                subTopic: string,
                phase: string,
                submitGuide: string,
                kbSamplingRules: string,
                kbExemptionConditions: string,
                product: InspectionProduct
              ): { parts: string[]; scope: string } {
                const productTag = product === "unknown" ? "" : `:${product}`;

                if (intent === "submit_guide" || subTopic === "submit_guide" || subTopic === "modify_guide") {
                  return { parts: [submitGuide], scope: `pre_ship:submit${productTag}` };
                }
                if (subTopic === "exemption_check") {
                  return { parts: [kbExemptionConditions, submitGuide], scope: `pre_ship:exemption${productTag}` };
                }
                if (intent === "progress" || phase === "post_arrival" || subTopic === "sampling_result") {
                  return { parts: [kbSamplingRules, submitGuide], scope: `post_arrival:sampling${productTag}` };
                }
                if (intent === "status") {
                  return { parts: [submitGuide, kbExemptionConditions], scope: `status${productTag}` };
                }
                return { parts: [submitGuide, kbSamplingRules, kbExemptionConditions], scope: `full${productTag}` };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const intent = str(params.intent) || "submit_guide";
                const subTopic = str(params.normalizedSubTopic) || str(params.subTopic);
                const phase = str(params.normalizedPhase);
                const routePath = str(params.routePath);

                const kbSubmitGuide = str(params.kbSubmitGuide);
                const kbQsiGuide = str(params.kbQsiGuide);
                const kbSamplingRules = str(params.kbSamplingRules);
                const kbExemptionConditions = str(params.kbExemptionConditions);

                const inspectionProduct = resolveInspectionProduct(params.rawOrderData, routePath);
                const submitGuide = pickSubmitGuideKb(inspectionProduct, kbSubmitGuide, kbQsiGuide);

                const { parts, scope } = pickKbParts(
                  intent,
                  subTopic,
                  phase,
                  submitGuide,
                  kbSamplingRules,
                  kbExemptionConditions,
                  inspectionProduct
                );

                return {
                  kbContent: parts.filter(Boolean).join("\n\n---\n\n"),
                  kbScope: `${scope}:${routePath || "default"}`,
                  inspectionProduct,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-self-inspection-kb")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: intent
                input:
                    value:
                        path: intent
                        ref_node: "163000"
              - name: subTopic
                input:
                    value:
                        path: subTopic
                        ref_node: "163000"
              - name: normalizedSubTopic
                input:
                    value:
                        path: normalizedSubTopic
                        ref_node: "163005"
              - name: normalizedPhase
                input:
                    value:
                        path: normalizedPhase
                        ref_node: "163005"
              - name: routePath
                input:
                    value:
                        path: routePath
                        ref_node: "163005"
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163009"
              - name: kbSubmitGuide
                input:
                    value:
                        path: output
                        ref_node: "163001"
              - name: kbQsiGuide
                input:
                    value:
                        path: output
                        ref_node: "163004"
              - name: kbSamplingRules
                input:
                    value:
                        path: output
                        ref_node: "163002"
              - name: kbExemptionConditions
                input:
                    value:
                        path: output
                        ref_node: "163003"
          node_outputs:
              kbContent:
                  type: string
                  value: null
              kbScope:
                  type: string
                  value: null
              inspectionProduct:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163014"
      type: llm
      title: llm-analyze
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-LLM-v2.jpg
      description: 调用大语言模型,使用变量和提示词生成回复
      version: "3"
      position:
          x: 480
          y: 3827
      parameters:
          fcParamVar:
              knowledgeFCParam: {}
          llmParam:
              - name: apiMode
                input:
                    type: integer
                    value: "0"
