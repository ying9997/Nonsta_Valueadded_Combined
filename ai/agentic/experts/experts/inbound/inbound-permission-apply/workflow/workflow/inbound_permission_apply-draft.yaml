                input:
                    type: string
                    value: |
                        # 权限申请材料与申请指引

                        ## 自验权限（self_inspection → OW01021/OW01022）

                        ### 材料清单
                        - 公司名称、联系人邮箱、联系电话
                        - 验货能力说明（自有验货团队或第三方）
                        - 营业执照（如需）

                        ### 前提条件
                        - 商品 SKU 已注册
                        - 了解自验直发须先完成验货才能创建预约单

                        ### 申请步骤
                        1. 万邑联 → 个人中心 → 产品权限
                        2. 选择自验产品（OW01021 直发 / OW01022 头程）
                        3. 填写材料并提交
                        4. 等待审核（通常 3–5 个工作日）

                        ---

                        ## 海外验权限（overseas_inspection → OW01031/OW01032）

                        ### 材料清单
                        - 公司名称、联系人邮箱
                        - 目的仓编码
                        - 业务说明

                        ### 申请步骤
                        同自验，选择海外验产品 OW01031/OW01032。

                        ---

                        ## CBM 额度扩容（cbm_quota）

                        ### 材料清单
                        - 公司名称、联系人邮箱
                        - 目标仓库
                        - 申请扩容 CBM 数量与业务理由

                        ### 申请步骤
                        1. 万邑联 → 账户中心 → 库容额度
                        2. 提交扩容申请
                        3. 等待审核

                        ---

                        ## 续期（renew）

                        权限到期前 30 天提交续期申请，流程与初次申请类似。

                        ## 当前 Sprint 限制

                        - 飞书 Bitable/审批 API 为 Gap，**无法自动代提**
                        - 输出材料清单与手动操作步骤（dataSource: kb_only）
                        - 不承诺审批通过
              - name: arrayItemConcatChar
