                  value: null
              enabledProducts:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              targetPscCodes:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
