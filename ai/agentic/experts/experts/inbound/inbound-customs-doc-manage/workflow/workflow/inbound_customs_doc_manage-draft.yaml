                input:
                    type: string
                    value: |
                        # 自有进口商注册指引

                        ## 适用场景

                        客户希望使用**自有进口商**（非 Winit 平台进口商）进行递延清关。

                        ## 注册方式（写操作）

                        `winit.ums.getVendorInfo` **仅查询**已有进出口商，**不能**提交注册。

                        新进口商须通过**万邑联平台**自行提交：

                        1. 万邑联 → 进口商管理 → 新增进口商
                        2. 填写公司信息与 EORI/VAT，上传资质文件
                        3. 提交审核（通常 3-7 个工作日）

                        注册成功后，该进口商会出现在 `getVendorInfo` 返回列表中（`isWinit=N`）。

                        ## UK 英国所需材料

                        - 公司营业执照（中英文）
                        - EORI 号码
                        - VAT 注册证明（如适用）

                        ## EU / BE 欧盟所需材料

                        - 欧盟 VAT + EORI
                        - 公司注册文件
                        - 比利时递延：进口商须在欧盟有有效 VAT

                        ## 对客约束

                        - 不代客提交注册申请
                        - 进口商审核被拒 → 建议复核材料或联系客服
