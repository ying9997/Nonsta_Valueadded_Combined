    - id: "163008"
      type: code
      title: fetch-vendor-info
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2387
      parameters:
          code: |-
              /**
               * 节点：拉取 winit.ums.getVendorInfo
               */

              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              const GET_VENDOR_INFO_ACTION = "winit.ums.getVendorInfo";

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function coerceVendorList(parsed: unknown): unknown[] {
                if (parsed == null) return [];
                if (Array.isArray(parsed)) return parsed;
                if (typeof parsed !== "object") return [];
                const o = parsed as Record<string, unknown>;
                if (o.output != null) return coerceVendorList(o.output);
                if (o.code === "0" || o.code === 0) return coerceVendorList(o.data);
                if (Array.isArray(o.list)) return o.list;
                if (Array.isArray(o.data)) return o.data;
                return [];
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                if (params.skipUmsApi === true) {
                  return { rawVendorData: { list: [], _fetchMeta: { strategy: "skipped" } } };
                }

                const pluginList = params.winitUmsPluginOutputList;
                if (Array.isArray(pluginList) && pluginList.length > 0) {
                  const list: unknown[] = [];
                  for (const item of pluginList as Array<{ data?: unknown }>) {
                    list.push(...coerceVendorList(parseCozeWorkflowDataField(item?.data)));
                  }
                  return {
                    rawVendorData: {
                      list,
                      _fetchMeta: { strategy: "plugin-batch", resolvedCount: list.length },
                    },
                  };
                }

                const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                  action: string;
                  data: string;
                }>;
                const env = getCozeWinitEnv();
                if (!env || actions.length === 0) {
                  return { rawVendorData: { list: [], _fetchMeta: { strategy: "skipped" } } };
                }

                const errors: string[] = [];
                const list: unknown[] = [];
                for (const act of actions) {
                  try {
                    const data = JSON.parse(act.data) as Record<string, unknown>;
                    const parsed = await runCozeWinitWorkflow(env, act.action || GET_VENDOR_INFO_ACTION, data);
                    list.push(...coerceVendorList(parsed));
                  } catch (e) {
                    errors.push(String(e instanceof Error ? e.message : e));
                  }
                }

                return {
                  rawVendorData: {
                    list,
                    _fetchMeta: {
                      strategy: "local-proxy",
                      resolvedCount: list.length,
                      errors: errors.length ? errors : undefined,
                    },
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-vendor-info")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skipUmsApi
                input:
                    value:
                        path: skipUmsApi
                        ref_node: "163006"
              - name: actions
                input:
                    value:
                        path: actions
                        ref_node: "163006"
              - name: winitUmsPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163007"
          node_outputs:
              rawVendorData:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163009"
      type: code
      title: merge-vendor-info
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2627
      parameters:
          code: |-
              /**
               * 节点：解析 getVendorInfo 响应，匹配 importerCode，输出 vendorFacts
               */

              const GET_VENDOR_INFO_ACTION = "winit.ums.getVendorInfo";

              const REGISTER_GAP_NOTE = `进口商注册为写操作，须通过万邑联 → 进口商管理自行提交；本专家不代客注册。
              查询已配置的进出口商可使用 API 返回的 vendorCode 在入库单中选择。`;

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : "";
              }

              type VendorRow = {
                vendorCode: string;
                vendorName: string;
                isWinit: boolean;
                isWinitLabel: string;
              };

              function normalizeVendor(raw: unknown): VendorRow | null {
                if (!raw || typeof raw !== "object") return null;
                const o = raw as Record<string, unknown>;
                const vendorCode = str(o.vendorCode ?? o.importerCode);
                if (!vendorCode) return null;
                const isWinitLabel = str(o.isWinit).toUpperCase();
                return {
                  vendorCode,
                  vendorName: str(o.vendorName ?? o.importerName),
                  isWinit: isWinitLabel === "Y" || isWinitLabel === "YES" || isWinitLabel === "TRUE",
                  isWinitLabel: isWinitLabel || "N",
                };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const intent = str(params.intent);
                const importerCode = str(params.importerCode);
                const vendorCountryCode = str(params.vendorCountryCode);
                const skipUmsApi = params.skipUmsApi === true;

                if (skipUmsApi) {
                  return {
                    umsDataAvailable: false,
                    vendorList: [],
                    matchedVendor: null,
                    vendorFacts: {
                      umsDataAvailable: false,
                      vendorList: [],
                      matchedVendor: null,
                      apiAction: GET_VENDOR_INFO_ACTION,
                      registerGapNote: intent === "register_importer" ? REGISTER_GAP_NOTE : "",
                    },
                    gapNote: intent === "register_importer" ? REGISTER_GAP_NOTE : "",
                    registerGapNote: REGISTER_GAP_NOTE,
                  };
                }

                const rawVendorData = (params.rawVendorData ?? {}) as Record<string, unknown>;
                const rawList = Array.isArray(rawVendorData.list) ? rawVendorData.list : [];
                const allVendors = rawList.map(normalizeVendor).filter((v): v is VendorRow => v != null);

                const fetchMeta = (rawVendorData._fetchMeta ?? {}) as Record<string, unknown>;
                const apiCalled =
                  fetchMeta.strategy === "plugin-batch" || fetchMeta.strategy === "local-proxy";

                let vendorList = allVendors;
                let matchedVendor: VendorRow | null = null;
                if (importerCode) {
                  matchedVendor =
                    allVendors.find(
                      (v) => v.vendorCode === importerCode || v.vendorCode.toUpperCase() === importerCode.toUpperCase()
                    ) ?? null;
                  if (matchedVendor) vendorList = [matchedVendor];
                }

                const umsDataAvailable = apiCalled && allVendors.length >= 0;

                return {
                  umsDataAvailable: umsDataAvailable && allVendors.length > 0,
                  vendorList: vendorList.map((v) => ({
                    vendorCode: v.vendorCode,
                    vendorName: v.vendorName,
                    isWinit: v.isWinit,
                    isWinitLabel: v.isWinitLabel,
                  })),
                  matchedVendor: matchedVendor
                    ? {
                        vendorCode: matchedVendor.vendorCode,
                        vendorName: matchedVendor.vendorName,
                        isWinit: matchedVendor.isWinit,
                      }
                    : importerCode
                      ? null
                      : null,
                  vendorFacts: {
                    umsDataAvailable: umsDataAvailable && allVendors.length > 0,
                    vendorList: allVendors,
                    matchedVendor,
                    importerCodeFilter: importerCode || undefined,
                    vendorCountryCode,
                    totalVendors: allVendors.length,
                    apiAction: GET_VENDOR_INFO_ACTION,
                    registerGapNote: intent === "register_importer" ? REGISTER_GAP_NOTE : "",
                    importerNotFound: importerCode ? !matchedVendor && allVendors.length > 0 : false,
                  },
                  gapNote: intent === "register_importer" ? REGISTER_GAP_NOTE : "",
                  registerGapNote: REGISTER_GAP_NOTE,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("merge-vendor-info")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skipUmsApi
                input:
                    value:
                        path: skipUmsApi
                        ref_node: "163006"
              - name: rawVendorData
                input:
                    value:
                        path: rawVendorData
                        ref_node: "163008"
              - name: importerCode
                input:
                    value:
                        path: importerCode
                        ref_node: "163000"
              - name: intent
                input:
                    value:
                        path: intent
                        ref_node: "163000"
              - name: vendorCountryCode
                input:
                    value:
                        path: vendorCountryCode
                        ref_node: "163006"
          node_outputs:
              umsDataAvailable:
                  type: boolean
                  value: null
              vendorList:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              matchedVendor:
                  type: object
                  value: null
              vendorFacts:
                  type: object
                  value: null
              gapNote:
                  type: string
                  value: null
              registerGapNote:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163010"
      type: text
      title: kb-upload-guide
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 480
          y: 2867
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # 清关文件上传指引

                        ## 通用原则

                        - 清关资料须在货物发运前或到港前完成上传
                        - 客户须在**万邑联平台**自行上传，本专家不代客操作
                        - 上传 API：`wh.inbound.order.uploadCustomsDeclareDocs`（端点已确认，Coze action 注册待研发确认）

                        ## 万邑联平台操作路径

                        1. 登录万邑联 → 入库管理 → 选择入库单
                        2. 进入「清关资料」/「报关文件」页签
                        3. 按目的国要求上传对应文件（PDF/JPG 等）
                        4. 提交后等待关务审核

                        ## UK 英国清关资料

                        - 商业发票（含产品描述、数量、价值、EORI）
                        - 装箱单（Packing List）
                        - 进口商资质文件（自有进口商或 Winit 进口商）
                        - 递延清关（DDP 包税）：需提前注册进口商

                        ## EU / BE / DE 欧盟清关资料

                        - 商业发票 + 装箱单
                        - 进口商 VAT 注册证明
                        - EORI 号码
                        - 比利时递延清关：材料要求与英国略有差异，需进口商在欧盟注册

                        ## 注意事项

                        - 文件须清晰可读，中英文均可（以目的国海关要求为准）
                        - 特殊货型（超限/敏感品类）材料可能需人工确认
                        - 关税费用以清关实际账单为准，本专家不提供关税核算
              - name: arrayItemConcatChar
                input:
                    type: string
                    value: ，
              - name: allArrayItemConcatChars
                input:
                    type: list
                    items:
                        type: object
                        value: null
                    value:
                        - isDefault: true
                          label: 换行
                          value: |+
                              
                        - isDefault: true
                          label: 制表符
                          value: "\t"
                        - isDefault: true
                          label: 句号
                          value: 。
                        - isDefault: true
                          label: 逗号
                          value: ，
                        - isDefault: true
                          label: 分号
                          value: ；
                        - isDefault: true
                          label: 空格
                          value: " "
          method: concat
          node_outputs:
              output:
                  type: string
                  value: null
    - id: "163011"
      type: text
