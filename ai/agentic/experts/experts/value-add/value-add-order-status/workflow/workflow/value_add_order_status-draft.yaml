                  out += c === undefined ? "=" : alphabet[c & 63];
                }
                return out;
              }

              function buildFmsTokenUrl(
                rawUrl: string,
                config: FmsRuntimeConfig = defaultFmsRuntimeConfig(),
                nowMs = Date.now()
              ): FmsTokenUrlResult {
                const parsed = __coze_shared_fms_token_url_ts_fmsParseUrl(rawUrl);
                if (!parsed) return { rawUrl, signedUrl: rawUrl, region: "", status: "invalid_url" };

                const region = __coze_shared_fms_token_url_ts_fmsRegionByUrl(rawUrl, config);
                if (!region) return { rawUrl, signedUrl: rawUrl, region: "", status: "not_fms" };

                const credential = config[region] ?? config.DEFAULT;
                if (!__coze_shared_fms_token_url_ts_fmsHasCredential(credential)) {
                  return { rawUrl, signedUrl: rawUrl, region, status: "missing_config" };
                }

                const fileUrl = __coze_shared_fms_token_url_ts_fmsUrlForSigning(rawUrl, credential);
                const objectUri = __coze_shared_fms_token_url_ts_fmsObjectUri(fileUrl);
                const date = Math.floor(nowMs);
                const canonical = `GET\n${objectUri}?clientId=${credential.clientId}&date=${date}&user=${credential.edsUser}`;
                const clientSign = __coze_shared_fms_token_url_ts_fmsHmacSha1Hex(credential.clientSecret, canonical);
                const userSign = __coze_shared_fms_token_url_ts_fmsHmacSha1Hex(credential.edsToken, canonical);
                const tokenContent =
                  `${objectUri}?clientSign=${clientSign}` +
                  `&userSign=${userSign}` +
                  `&version=V1.0` +
                  `&date=${date}` +
                  `&user=${credential.edsUser}` +
                  `&clientId=${credential.clientId}`;
                return {
                  rawUrl,
                  signedUrl: `${fileUrl}?token=${__coze_shared_fms_token_url_ts_fmsBase64Utf8(tokenContent)}`,
                  region,
                  status: "ok",
                };
              }

              function __coze_shared_fms_token_url_ts_fmsSignedKey(key: string): string {
                if (key === "fileUrl") return "signedFileUrl";
                if (key === "url") return "signedUrl";
                return `signed${key.charAt(0).toUpperCase()}${key.slice(1)}`;
              }

              function __coze_shared_fms_token_url_ts_fmsSignStatusKey(key: string): string {
                if (key === "fileUrl") return "fileUrlSignStatus";
                if (key === "url") return "urlSignStatus";
                return `${key}SignStatus`;
              }

              function __coze_shared_fms_token_url_ts_fmsShouldSignScalarKey(key: string): boolean {
                return key === "fileUrl" || key === "url" || /url$/i.test(key);
              }

              function signFmsUrlDeep(
                value: unknown,
                config: FmsRuntimeConfig = defaultFmsRuntimeConfig(),
                nowMs = Date.now()
              ): unknown {
                if (Array.isArray(value)) return value.map((item) => signFmsUrlDeep(item, config, nowMs));
                if (!value || typeof value !== "object") return value;

                const source = value as Record<string, unknown>;
                const out: Record<string, unknown> = {};

                for (const [key, raw] of Object.entries(source)) {
                  out[key] = signFmsUrlDeep(raw, config, nowMs);
                  if (__coze_shared_fms_token_url_ts_fmsShouldSignScalarKey(key) && typeof raw === "string") {
                    const signed = buildFmsTokenUrl(raw, config, nowMs);
                    if (signed.status === "ok") {
                      out[__coze_shared_fms_token_url_ts_fmsSignedKey(key)] = signed.signedUrl;
                    } else if (signed.status === "missing_config") {
                      out[__coze_shared_fms_token_url_ts_fmsSignStatusKey(key)] = signed.status;
                    }
                  }
                }

                if (Array.isArray(source.unusualFiles)) {
                  const signedUnusualFiles: string[] = [];
                  const statuses: string[] = [];
                  for (const raw of source.unusualFiles) {
                    if (typeof raw !== "string") continue;
                    const signed = buildFmsTokenUrl(raw, config, nowMs);
                    if (signed.status === "ok") signedUnusualFiles.push(signed.signedUrl);
                    else if (signed.status === "missing_config") statuses.push(signed.status);
                  }
                  if (signedUnusualFiles.length > 0) out.signedUnusualFiles = signedUnusualFiles;
                  if (statuses.length > 0) out.unusualFilesSignStatus = Array.from(new Set(statuses)).join(",");
                }

                return out;
              }

              /* coze-inline: node */
              /**
               * 节点：fetch-sub-goods — 解析 getSubGoods 插件响应。
               * FaaS 单文件闭环，无外部 import。
               */


              function asRecord(value: unknown): Record<string, unknown> {
                return value && typeof value === "object" && !Array.isArray(value)
                  ? (value as Record<string, unknown>)
                  : {};
              }

              function asText(value: unknown): string {
                return typeof value === "string" ? value.trim() : "";
              }

              function parseMaybeJson(value: unknown): unknown {
                if (value == null || value === "") return undefined;
                if (typeof value !== "string") return value;
                try {
                  return JSON.parse(value);
                } catch {
                  return { __malformedJson: true };
                }
              }

              function hasOwn(obj: Record<string, unknown>, key: string): boolean {
                return Object.prototype.hasOwnProperty.call(obj, key);
              }

              function asList(value: unknown): Record<string, unknown>[] {
                if (Array.isArray(value)) return value.map(asRecord);
                const obj = asRecord(value);
                if (Array.isArray(obj.list)) return obj.list.map(asRecord);
                if (Array.isArray(obj.records)) return obj.records.map(asRecord);
                if (Array.isArray(obj.rows)) return obj.rows.map(asRecord);
                return [];
              }

              function coerceEnvelope(raw: unknown): {
                fetchStatus: "ok" | "api_error" | "malformed" | "not_fetched";
                data: Record<string, unknown>;
                errorMessage: string;
              } {
                if (raw === undefined) return { fetchStatus: "not_fetched", data: {}, errorMessage: "subGoodsApiResult_missing" };
                const result = asRecord(raw);
                if (result.__malformedJson) return { fetchStatus: "malformed", data: {}, errorMessage: "subGoodsApiResult_malformed_json" };
                if (hasOwn(result, "code")) {
                  const code = String(result.code ?? "");
                  if (code !== "0") {
                    return {
                      fetchStatus: "api_error",
                      data: {},
                      errorMessage: asText(result.msg) || asText(result.message) || `subGoods_api_error_${code}`,
                    };
                  }
                  return { fetchStatus: "ok", data: asRecord(result.data ?? result.result), errorMessage: "" };
                }
                return { fetchStatus: "ok", data: asRecord(result.data || result.result || raw), errorMessage: "" };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const actionPlan = asRecord(params.subGoodsActionPlan);
                if (actionPlan.skip === true) {
                  return {
                    goodsFacts: {
                      fetchStatus: "skipped",
                      goodsSummary: null,
                      optionalFetchFailures: [],
                    },
                  };
                }
                const raw = parseMaybeJson(params.subGoodsApiResult);
                const envelope = coerceEnvelope(raw);
                const data = envelope.data;
                const records = asList(data.list ?? data.records ?? data.rows ?? data);
                const failure = envelope.fetchStatus === "ok" ? "" : envelope.errorMessage;

                return {
                  goodsFacts: {
                    fetchStatus: envelope.fetchStatus,
                    goodsSummary:
                      envelope.fetchStatus === "ok"
                        ? {
                            recordCount: records.length,
                            goods: records.slice(0, 20).map((item) => ({
                              goodsId: item.goodsId ?? item.id ?? "",
                              parentId: item.parentId ?? "",
                              skuCode: asText(item.skuCode) || asText(item.merchandiseCode),
                              skuName: asText(item.skuName) || asText(item.merchandiseName),
                              barcode: asText(item.barcode) || asText(item.productBarcode),
                              batchNo: asText(item.batchNo),
                              quantity: item.quantity ?? item.qty ?? "",
                              weight: item.weight ?? "",
                              length: item.length ?? "",
                              width: item.width ?? "",
                              height: item.height ?? "",
                              attachmentUrlList: signFmsUrlDeep(item.attachmentUrlList ?? []),
                            })),
                          }
                        : null,
                    optionalFetchFailures: failure ? [failure] : [],
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-sub-goods")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e instanceof Error ? e.message : "fetch-sub-goods failed");
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: subGoodsActionPlan
                input:
                    value:
                        path: subGoodsActionPlan
                        ref_node: "163021"
              - name: subGoodsApiResult
                input:
                    type: string
                    value:
                        path: data
                        ref_node: "163022"
          node_outputs:
              goodsFacts:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
