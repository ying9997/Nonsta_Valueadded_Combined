    - id: "163007"
      type: code
      title: fetch-basic-info
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 1080
          y: 310
      parameters:
          code: |-
              /* coze-inline: shared/fms-token-url.ts */
              type FmsRegion = "CN" | "US" | "EU" | "AU" | "DEFAULT";

              type FmsCredential = {
                fmsUrl: string;
                clientId: string;
                clientSecret: string;
                edsUser: string;
                edsToken: string;
              };

              type FmsRuntimeConfig = Partial<Record<FmsRegion, FmsCredential>>;

              type FmsTokenUrlResult = {
                rawUrl: string;
                signedUrl: string;
                region: FmsRegion | "";
                status: "ok" | "not_fms" | "missing_config" | "invalid_url";
              };

              const FMS_REGIONS: FmsRegion[] = ["CN", "US", "EU", "AU"];

              function __coze_shared_fms_token_url_ts_fmsEnv(name: string, fallback: string): string {
                if (typeof process !== "undefined" && process.env?.[name]) {
                  return String(process.env[name]).trim();
                }
                return fallback;
              }

              function __coze_shared_fms_token_url_ts_fmsPlaceholder(region: FmsRegion, name: "CLIENT_KEY" | "CLIENT_SECRET" | "USER_KEY" | "USER_SECRET"): string {
                const placeholders: Record<FmsRegion, Record<"CLIENT_KEY" | "CLIENT_SECRET" | "USER_KEY" | "USER_SECRET", string>> = {
                  CN: {
                    CLIENT_KEY: "__FMS_CN_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_CN_CLIENT_SECRET__",
                    USER_KEY: "__FMS_CN_USER_KEY__",
                    USER_SECRET: "__FMS_CN_USER_SECRET__",
                  },
                  US: {
                    CLIENT_KEY: "__FMS_US_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_US_CLIENT_SECRET__",
                    USER_KEY: "__FMS_US_USER_KEY__",
                    USER_SECRET: "__FMS_US_USER_SECRET__",
                  },
                  AU: {
                    CLIENT_KEY: "__FMS_AU_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_AU_CLIENT_SECRET__",
                    USER_KEY: "__FMS_AU_USER_KEY__",
                    USER_SECRET: "__FMS_AU_USER_SECRET__",
                  },
                  EU: {
                    CLIENT_KEY: "__FMS_EU_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_EU_CLIENT_SECRET__",
                    USER_KEY: "__FMS_EU_USER_KEY__",
                    USER_SECRET: "__FMS_EU_USER_SECRET__",
                  },
                  DEFAULT: {
                    CLIENT_KEY: "__FMS_US_CLIENT_KEY__",
                    CLIENT_SECRET: "__FMS_US_CLIENT_SECRET__",
                    USER_KEY: "__FMS_US_USER_KEY__",
                    USER_SECRET: "__FMS_US_USER_SECRET__",
                  },
                };
                return placeholders[region][name];
              }

              function __coze_shared_fms_token_url_ts_fmsCredentialFromEnv(region: FmsRegion, defaultUrl: string): FmsCredential {
                return {
                  fmsUrl: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_URL`, defaultUrl).replace(/\/+$/, ""),
                  clientId: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_CLIENT_KEY`, __coze_shared_fms_token_url_ts_fmsPlaceholder(region, "CLIENT_KEY")),
                  clientSecret: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_CLIENT_SECRET`, __coze_shared_fms_token_url_ts_fmsPlaceholder(region, "CLIENT_SECRET")),
                  edsUser: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_USER_KEY`, __coze_shared_fms_token_url_ts_fmsPlaceholder(region, "USER_KEY")),
                  edsToken: __coze_shared_fms_token_url_ts_fmsEnv(`FMS_${region}_USER_SECRET`, __coze_shared_fms_token_url_ts_fmsPlaceholder(region, "USER_SECRET")),
                };
              }

              function defaultFmsRuntimeConfig(): FmsRuntimeConfig {
                const us = __coze_shared_fms_token_url_ts_fmsCredentialFromEnv("US", "https://usfmsstream.winit.com.cn");
                return {
                  CN: __coze_shared_fms_token_url_ts_fmsCredentialFromEnv("CN", "https://cnfmsstream.winit.com.cn"),
                  US: us,
                  AU: __coze_shared_fms_token_url_ts_fmsCredentialFromEnv("AU", "https://aufmsstream.winit.com.cn"),
                  EU: __coze_shared_fms_token_url_ts_fmsCredentialFromEnv("EU", "https://eufmsstream.winit.com.cn"),
                  DEFAULT: us,
                };
              }

              function __coze_shared_fms_token_url_ts_fmsIsConfigured(value: string): boolean {
                const s = value.trim();
                return Boolean(s) && !/^__FMS_[A-Z]+_[A-Z_]+__$/.test(s);
              }

              function __coze_shared_fms_token_url_ts_fmsHasCredential(credential: FmsCredential | undefined): credential is FmsCredential {
                return Boolean(
                  credential &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.fmsUrl) &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.clientId) &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.clientSecret) &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.edsUser) &&
                    __coze_shared_fms_token_url_ts_fmsIsConfigured(credential.edsToken)
                );
              }

              function __coze_shared_fms_token_url_ts_fmsParseUrl(rawUrl: string): { isAbsolute: boolean; host: string; path: string } | null {
                const trimmed = rawUrl.trim();
                if (!trimmed) return null;
                if (/^https?:\/\//i.test(trimmed)) {
                  const match = trimmed.match(/^https?:\/\/([^/?#]+)([^?#]*)/i);
                  if (!match) return null;
                  return {
                    isAbsolute: true,
                    host: match[1] ?? "",
                    path: match[2] || "/",
                  };
                }
                const pathOnly = trimmed.split(/[?#]/)[0] ?? "";
                return { isAbsolute: false, host: "", path: pathOnly.startsWith("/") ? pathOnly : `/${pathOnly}` };
              }

              function __coze_shared_fms_token_url_ts_fmsRegionByUrl(rawUrl: string, config: FmsRuntimeConfig): FmsRegion | "" {
                const trimmed = rawUrl.trim();
                for (const region of FMS_REGIONS) {
                  const cfgUrl = config[region]?.fmsUrl?.replace(/\/+$/, "");
                  if (cfgUrl && trimmed.startsWith(cfgUrl)) return region;
                }

                const parsed = __coze_shared_fms_token_url_ts_fmsParseUrl(trimmed);
                if (parsed?.isAbsolute) {
                  const match = parsed.host.match(/^([a-z]+)fmsstream\.winit\.com/i);
                  const region = match?.[1]?.toUpperCase() as FmsRegion | undefined;
                  if (region && FMS_REGIONS.includes(region)) return region;
                  return "";
                }

                return config.DEFAULT ? "DEFAULT" : "";
              }

              function isFmsUrl(rawUrl: unknown, config: FmsRuntimeConfig = defaultFmsRuntimeConfig()): rawUrl is string {
                return typeof rawUrl === "string" && __coze_shared_fms_token_url_ts_fmsRegionByUrl(rawUrl, config) !== "";
              }

              function __coze_shared_fms_token_url_ts_fmsUrlForSigning(rawUrl: string, credential: FmsCredential): string {
                const parsed = __coze_shared_fms_token_url_ts_fmsParseUrl(rawUrl);
                const path = parsed?.path || "/";
                const base = credential.fmsUrl.replace(/\/+$/, "");
                return `${base}${path.startsWith("/") ? path : `/${path}`}`;
              }

              function __coze_shared_fms_token_url_ts_fmsObjectUri(fileUrl: string): string {
                return __coze_shared_fms_token_url_ts_fmsParseUrl(fileUrl)?.path || "/";
              }

              function __coze_shared_fms_token_url_ts_fmsUtf8Bytes(input: string): number[] {
                const bytes: number[] = [];
                for (let i = 0; i < input.length; i++) {
                  let code = input.charCodeAt(i);
                  if (code < 0x80) {
                    bytes.push(code);
                  } else if (code < 0x800) {
                    bytes.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f));
                  } else if (code >= 0xd800 && code <= 0xdbff && i + 1 < input.length) {
                    const next = input.charCodeAt(++i);
                    code = 0x10000 + ((code & 0x3ff) << 10) + (next & 0x3ff);
                    bytes.push(
                      0xf0 | (code >> 18),
                      0x80 | ((code >> 12) & 0x3f),
                      0x80 | ((code >> 6) & 0x3f),
                      0x80 | (code & 0x3f)
                    );
                  } else {
                    bytes.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
                  }
                }
                return bytes;
              }

              function __coze_shared_fms_token_url_ts_fmsLeftRotate(value: number, bits: number): number {
                return ((value << bits) | (value >>> (32 - bits))) >>> 0;
              }

              function __coze_shared_fms_token_url_ts_fmsSha1(bytes: number[]): number[] {
                const message = bytes.slice();
                const bitLength = message.length * 8;
                message.push(0x80);
                while ((message.length % 64) !== 56) message.push(0);
                for (let i = 7; i >= 0; i--) message.push((bitLength / Math.pow(2, i * 8)) & 0xff);

                let h0 = 0x67452301;
                let h1 = 0xefcdab89;
                let h2 = 0x98badcfe;
                let h3 = 0x10325476;
                let h4 = 0xc3d2e1f0;

                for (let offset = 0; offset < message.length; offset += 64) {
                  const w = new Array<number>(80);
                  for (let i = 0; i < 16; i++) {
                    const j = offset + i * 4;
                    w[i] = ((message[j]! << 24) | (message[j + 1]! << 16) | (message[j + 2]! << 8) | message[j + 3]!) >>> 0;
                  }
                  for (let i = 16; i < 80; i++) {
                    w[i] = __coze_shared_fms_token_url_ts_fmsLeftRotate((w[i - 3]! ^ w[i - 8]! ^ w[i - 14]! ^ w[i - 16]!) >>> 0, 1);
                  }

                  let a = h0;
                  let b = h1;
                  let c = h2;
                  let d = h3;
                  let e = h4;

                  for (let i = 0; i < 80; i++) {
                    let f = 0;
                    let k = 0;
                    if (i < 20) {
                      f = (b & c) | (~b & d);
                      k = 0x5a827999;
                    } else if (i < 40) {
                      f = b ^ c ^ d;
                      k = 0x6ed9eba1;
                    } else if (i < 60) {
                      f = (b & c) | (b & d) | (c & d);
                      k = 0x8f1bbcdc;
                    } else {
                      f = b ^ c ^ d;
