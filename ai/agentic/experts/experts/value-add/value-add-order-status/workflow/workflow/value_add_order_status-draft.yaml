                  const code = String(result.code ?? "");
                  if (code !== "0") {
                    return {
                      fetchStatus: "api_error",
                      data: {},
                      errorMessage: asText(result.msg) || asText(result.message) || `resolvedBasicInfo_api_error_${code}`,
