# 增值单状态查询 — Coze 工作流包导出
yamlBasename: value_add_order_status-draft.yaml
packageMainName: value_add_order_status
packageDescription: 增值单状态查询（validate → basicInfo/getVasList → P2 payment/prepayment/goods → merge → LLM → format）

textNodes:
  - logicalId: kb-api-boundary-text
    title: kb-api-boundary
    insertAfter: validate-vas-order-input
    sourceFile: prompts/kb-api-boundary.md
  - logicalId: kb-status-semantics-text
    title: kb-status-semantics
    insertAfter: validate-vas-order-input
    sourceFile: prompts/kb-status-semantics.md
  - logicalId: kb-fee-goods-boundary-text
    title: kb-fee-goods-boundary
    insertAfter: validate-vas-order-input
    sourceFile: prompts/kb-fee-goods-boundary.md

inputBindings:
  load-api-boundary:
    kbApiBoundary:
      ref: kb-api-boundary-text
      path: output
    kbStatusSemantics:
      ref: kb-status-semantics-text
      path: output
    kbFeeGoodsBoundary:
      ref: kb-fee-goods-boundary-text
      path: output
  fetch-basic-info:
    basicInfoApiResult:
      ref: winit_va_basic_info
      path: data
  fetch-vas-list:
    vasListApiResult:
      ref: winit_va_get_vas_list
      path: data
  fetch-resolved-basic-info:
    resolvedBasicInfoApiResult:
      ref: winit_va_resolved_basic_info
      path: data
  fetch-payment-list:
    paymentApiResult:
      ref: winit_va_get_payment_list
      path: data
  fetch-prepayment-list:
    prepaymentApiResult:
      ref: winit_va_get_prepayment_list
      path: data
  fetch-sub-goods:
    subGoodsApiResult:
      ref: winit_va_get_sub_goods
      path: data

endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext

winitOpenapiPlugins:
  - insertBefore: fetch-basic-info
    logicalId: winit_va_basic_info
    openapiAction: wh.va.order.basicInfo
    requestDataFrom:
      logicalId: build-basic-info-request
      path: basicInfoRequestData
  - insertBefore: fetch-vas-list
    logicalId: winit_va_get_vas_list
    openapiAction: wh.va.order.getVasList
    requestDataFrom:
      logicalId: build-vas-list-request
      path: vasListRequestData
  - insertBefore: fetch-resolved-basic-info
    logicalId: winit_va_resolved_basic_info
    openapiAction: wh.va.order.basicInfo
    requestDataFrom:
      logicalId: build-resolved-basic-info-request
      path: resolvedBasicInfoRequestData
  - insertBefore: fetch-payment-list
    logicalId: winit_va_get_payment_list
    openapiAction: wh.va.order.getPaymentList
    requestDataFrom:
      logicalId: build-payment-request
      path: paymentRequestData
  - insertBefore: fetch-prepayment-list
    logicalId: winit_va_get_prepayment_list
    openapiAction: wh.va.order.getPrepaymentList
    requestDataFrom:
      logicalId: build-prepayment-request
      path: prepaymentRequestData
  - insertBefore: fetch-sub-goods
    logicalId: winit_va_get_sub_goods
    openapiAction: wh.va.order.getSubGoods
    requestDataFrom:
      logicalId: build-sub-goods-request
      path: subGoodsRequestData

