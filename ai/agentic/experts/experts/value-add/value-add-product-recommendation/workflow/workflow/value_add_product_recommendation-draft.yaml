    - id: "163008"
      type: text
      title: kb-vasc-constraints
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 1240
          y: 620
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # VASC 约束过滤层

                        本文件为 `filter-by-constraints` 节点提供过滤依据。候选 VASC 在经过意图导航和映射验证后，须通过本层约束检查，排除**不可用**的候选。

                        > 使用规则：
                        > - inactive VASC 不得作为可下单推荐，只能作为历史线索或待确认项。
                        > - 约束的具体命中值依赖知识库同步，v1 不调用 `pms.VascTomService_queryVascPage` 刷新。
                        > - 约束有疑义时输出 `informationalMissing`，不编造系统限制。

                        ---

                        ## 一、VASC 启用态约束

                        | VASC 类别 | 启用态 | 使用限制 |
                        |---|---|---|
                        | 原单上架类 VASC | active | 可推荐为首选 |
                        | 新单上架类 VASC | active | 可推荐为首选 |
                        | 拍照/测量/质检类 VASC | active | 可推荐为辅助服务 |
                        | 销毁类 VASC | active | 可推荐，需客户授权确认 |
                        | 自提类 VASC | active（部分仓库限制）| 需确认目的仓是否支持 |
                        | 调拨/转运类 VASC | active（非标服务）| 需人工评估，建议升级 |
                        | inactive VASC | inactive | 不作可下单推荐；作为历史/待确认线索，在 `notRecommendedOptions` 中注明 |

                        ---

                        ## 二、入库单状态依赖约束

                        以下约束影响特定 VASC 的可用性，缺失时产生 `blockingMissing` 或 `informationalMissing`。

                        | VASC 意图 | 依赖的入库单状态 | 状态不满足时的处理 | 缺失信息类型 |
                        |---|---|---|---|
                        | 原单上架 | 入库单须为**可操作状态**（待上架、验货中等，非已关闭/已完成） | 降级：提示改为新单上架；原单上架候选降为条件性推荐 | `blockingMissing`（dimension: orderStatus） |
                        | 新单上架 | 无强依赖，但新入库单号有助于后续服务配置 | 可先推荐，新单号作 `informationalMissing` | `informationalMissing`（dimension: newOrderNo） |
                        | 库内盘点 | 无强依赖 | 直接推荐 | — |
                        | 销毁 | 无状态依赖，但需客户授权 | 授权确认作 `informationalMissing` | `informationalMissing`（dimension: destroyAuthorization） |
                        | 自提 | 仓库须支持自提 | 仓库限制不满足时降级 | `blockingMissing`（dimension: warehousePickupSupport） |

                        ---

                        ## 三、对象层级兼容约束

                        候选 VASC 有对象层级适用范围；异常对象层级与 VASC 适用范围不匹配时，该候选应降级或排除。

                        | VASC 类别 | 适用对象层级 | 不兼容时处理 |
                        |---|---|---|
                        | 包裹条码修复类（原单/新单） | `package` | 若异常对象为 `product` 或 `item`，此类 VASC 不适用 |
                        | 商品条码修复类（原单/新单） | `product`、`item` | 若异常对象为 `package`，此类 VASC 不适用 |
                        | 拍照/测量 | `package`、`product`（均支持）| 通常无层级限制 |
                        | 销毁 | `package`、`product`、`item`（均支持）| 通常无层级限制 |
                        | 库内盘点 | `order`、`package` | 通常按入库单整体盘点 |
                        | 自提/调拨 | `order`（整单操作）| 不适用于单件操作 |

                        ---

                        ## 四、实物包装方式约束

                        | 实物包装方式 | 约束说明 |
                        |---|---|
                        | 托盘（pallet）装 | 托盘层异常不能直接做商品级贴标；需先「拆托盘」才能操作商品层级 VASC；`objectLevel=pallet` 时此约束作为 `informationalMissing` 提示 |
                        | 散件/箱装 | 无额外约束 |

                        ---

                        ## 五、其他不推荐原因参考

                        | 原因类型 | 说明 | 输出位置 |
                        |---|---|---|
                        | 意图不匹配 | VASC 适用的上架方式与客户意图相悖（如意图原单上架但 VASC 是新单上架类） | `notRecommendedOptions` |
                        | 对象层级不匹配 | 见第三节 | `notRecommendedOptions` |
                        | inactive | VASC 当前未启用 | `notRecommendedOptions`（附历史线索说明） |
                        | PSC 轨道限制 | 数量差异类 VASC 在 standard_firstleg 轨道不建议直接推荐（优先核实责任） | `notRecommendedOptions` 或 `missingConfirmations` |
                        | 仓库不支持 | 特定仓库不支持此 VASC（如自提仓库限制）| `notRecommendedOptions` |
              - name: arrayItemConcatChar
                input:
                    type: string
                    value: ，
              - name: allArrayItemConcatChars
                input:
                    type: list
                    items:
                        type: object
                        value: null
                    value:
                        - isDefault: true
                          label: 换行
                          value: |+
                              
                        - isDefault: true
                          label: 制表符
                          value: "\t"
                        - isDefault: true
                          label: 句号
                          value: 。
                        - isDefault: true
                          label: 逗号
                          value: ，
                        - isDefault: true
                          label: 分号
                          value: ；
                        - isDefault: true
                          label: 空格
                          value: " "
          method: concat
          node_outputs:
              output:
                  type: string
                  value: null
    - id: "163009"
      type: code
      title: verify-with-mapping
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 1520
          y: 310
      parameters:
          code: |-
              /**
               * 节点：verify-with-mapping — 用异常到 VASC 映射表验证/补充候选。
               * FaaS 单文件闭环，无外部 import。
               */

              function asText(value: unknown): string {
                return typeof value === "string" ? value.trim() : "";
              }

              function asRecord(value: unknown): Record<string, unknown> {
                return value && typeof value === "object" && !Array.isArray(value)
                  ? (value as Record<string, unknown>)
                  : {};
              }

              function extractVasc(line: string): { vascCode: string; vascName: string } {
                const code = line.match(/\bVASC[A-Z0-9_-]*\b/i)?.[0] || line.match(/\b[A-Z]{2,}\d{2,}[A-Z0-9_-]*\b/)?.[0] || "";
                const parts = line.split("|").map((part) => part.trim()).filter(Boolean);
                const codeIndex = parts.findIndex((part) => part === code);
                return {
                  vascCode: code,
                  vascName:
                    codeIndex >= 0 && parts[codeIndex + 1] && parts[codeIndex + 1] !== code
                      ? parts[codeIndex + 1]
                      : parts[parts.length - 1] && parts[parts.length - 1] !== code
                        ? parts[parts.length - 1]
                        : "",
                };
              }

              function isDeprecatedOrRedirectNote(line: string): boolean {
                const lower = line.toLowerCase();
                return (
                  lower.includes("deprecated") ||
                  line.includes("已废弃") ||
                  line.includes("废弃") ||
                  line.includes("请使用") ||
                  line.includes("替代")
                );
              }

              function parseTableCells(line: string): string[] {
                if (!line.includes("|")) return [];
                return line
                  .split("|")
                  .map((part) => part.trim())
                  .filter((part) => part.length > 0);
              }

              function isSeparatorRow(cells: string[]): boolean {
                return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
              }

              function mappingRowMatches(line: string, needles: string[]): boolean {
                if (isDeprecatedOrRedirectNote(line)) return false;
                const cells = parseTableCells(line);
                if (cells.length > 0) {
                  if (isSeparatorRow(cells)) return false;
                  const identityCells = cells.slice(0, Math.min(2, cells.length)).join(" ").toLowerCase();
                  return needles.some((needle) => identityCells.includes(needle.toLowerCase()));
                }
                const lower = line.toLowerCase();
                return needles.some((needle) => lower.includes(needle.toLowerCase()));
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const recommendationInput = asRecord(params.recommendationInput);
                const mappingKb = asText(params.kbMappingTable);
                const exceptionCode = asText(recommendationInput.exceptionCode);
                const exceptionName = asText(recommendationInput.exceptionName);
                const needles = [exceptionCode, exceptionName].filter((item) => item.length > 0);
                const candidateSeed = mappingKb
                  .split(/\r?\n/)
                  .map((line) => line.trim())
                  .filter((line) => line.length > 0 && mappingRowMatches(line, needles))
                  .map((line) => {
                    const vasc = extractVasc(line);
                    return {
                      ...vasc,
                      active: true,
                      source: "kb-mapping-table",
                      reason: line.slice(0, 300),
                    };
                  })
                  .filter((candidate) => candidate.vascCode || candidate.vascName);

                return {
                  candidateSeed,
                  mappingEvidence: {
                    matched: candidateSeed.length > 0,
                    source: "kb-mapping-table",
                    missingEvidence: candidateSeed.length > 0 ? [] : ["exception_to_vasc_mapping"],
                  },
                  recommendationInput,
                  intentGuideKb: asText(params.intentGuideKb),
                  constraintsKb: asText(params.kbVascConstraints),
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("verify-with-mapping")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e instanceof Error ? e.message : "verify-with-mapping failed");
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: recommendationInput
                input:
                    value:
                        path: recommendationInput
                        ref_node: "163006"
              - name: intentGuideKb
                input:
                    value:
                        path: intentGuideKb
                        ref_node: "163006"
              - name: kbMappingTable
                input:
                    value:
                        path: output
                        ref_node: "163007"
              - name: kbVascConstraints
                input:
                    value:
                        path: output
                        ref_node: "163008"
          node_outputs:
              candidateSeed:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              mappingEvidence:
                  type: object
                  value: null
              recommendationInput:
                  type: object
                  value: null
              intentGuideKb:
                  type: string
                  value: null
              constraintsKb:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163010"
      type: code
      title: filter-by-constraints
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 1800
          y: 310
      parameters:
          code: |-
              /**
               * 节点：filter-by-constraints — 过滤不可作为可下单推荐的 VASC 候选。
               * FaaS 单文件闭环，无外部 import。
               */

              function asRecord(value: unknown): Record<string, unknown> {
                return value && typeof value === "object" && !Array.isArray(value)
                  ? (value as Record<string, unknown>)
                  : {};
              }

              function asText(value: unknown): string {
                return typeof value === "string" ? value.trim() : "";
              }

              function asCandidateArray(value: unknown): Record<string, unknown>[] {
                return Array.isArray(value) ? value.map(asRecord) : [];
              }

              function isInactive(candidate: Record<string, unknown>): boolean {
                const status = String(candidate.status ?? candidate.activeStatus ?? "").toLowerCase();
                return candidate.active === false || status === "inactive" || status === "disabled";
              }

              function normalizedIntent(recommendationInput: Record<string, unknown>): string {
                return [
                  recommendationInput.customerActionIntent,
                  recommendationInput.customerActionNormalized,
                  recommendationInput.customerIntent,
                  recommendationInput.query,
                ]
                  .map(asText)
                  .filter(Boolean)
                  .join(" ")
                  .toUpperCase();
              }

              function isSubmittedOrderStatusQuery(intent: string): boolean {
                const compact = intent.replace(/[\s_-]+/g, "");
                return (
                  compact.includes("QUERYSUBMITTEDVALUEADDSTATUS") ||
                  compact.includes("VALUEADDORDERSTATUS") ||
                  compact.includes("VASORDERSTATUS") ||
                  compact.includes("VAORDERSTATUS") ||
                  intent === "ORDER_STATUS" ||
                  intent.includes("增值单状态") ||
                  (intent.includes("已提交") && intent.includes("增值单")) ||
                  ((intent.includes("处理到哪") || intent.includes("没处理完")) && intent.includes("增值单")) ||
                  (/VALUE[-_\s]*ADD/.test(intent) && /ORDER/.test(intent) && /STATUS/.test(intent))
                );
              }

              function candidateText(candidate: Record<string, unknown>): string {
                return [
                  candidate.vascCode,
                  candidate.vascName,
                  candidate.reason,
                  candidate.source,
                ]
                  .map(asText)
                  .join(" ")
                  .toUpperCase();
              }

              function wantsNewInboundOrder(intent: string): boolean {
                return (
                  intent.includes("USE_NEW_INBOUND_ORDER") ||
                  intent.includes("新单上架") ||
                  intent.includes("新建入库单") ||
                  intent.includes("新入库单") ||
                  intent.includes("重新下一单") ||
                  intent.includes("创建新单")
                );
              }

              function wantsOriginInboundOrder(intent: string): boolean {
                return (
                  intent.includes("USE_ORIGIN_INBOUND_ORDER") ||
                  intent.includes("原单上架") ||
                  intent.includes("原入库单") ||
                  intent.includes("继续使用原单") ||
                  intent.includes("关联原单")
                );
              }

              function isAmbiguousActionIntent(intent: string): boolean {
                if (wantsNewInboundOrder(intent) || wantsOriginInboundOrder(intent)) return false;
                return (
                  intent.includes("意图缺失") ||
                  intent.includes("处理方式") ||
                  intent.includes("怎么处理") ||
                  intent.includes("如何处理") ||
                  intent.includes("处理方向") ||
                  intent.includes("异常明确但")
                );
              }

              function hasBothShelvingDirections(candidates: Record<string, unknown>[]): boolean {
                const labels = candidates.map(candidateText);
                const hasOrigin = labels.some((text) => text.includes("VASC202407031503503") || text.includes("原单"));
                const hasNew = labels.some((text) => text.includes("VASC202407161056217") || text.includes("新单"));
                return hasOrigin && hasNew;
              }

              function scoreCandidate(candidate: Record<string, unknown>, intent: string): number {
                const text = candidateText(candidate);
                let score = 0;
                if (wantsNewInboundOrder(intent)) {
                  if (text.includes("VASC202407161056217") || text.includes("新单") || text.includes("NEW")) score += 100;
                  if (text.includes("原单")) score -= 20;
                }
                if (wantsOriginInboundOrder(intent)) {
                  if (text.includes("VASC202407031503503") || text.includes("原单") || text.includes("ORIGIN")) score += 100;
                  if (text.includes("新单")) score -= 20;
                }
                if (intent.includes("DESTROY")) {
                  if (text.includes("VASC202409121753076") || text.includes("DESTROY") || text.includes("销毁")) score += 100;
                  if (text.includes("REPACK") || text.includes("包装加固") || text.includes("重新包装")) score -= 30;
                }
                if (intent.includes("PHOTO") || intent.includes("MEASURE") || intent.includes("VIDEO") || intent.includes("拍照") || intent.includes("视频")) {
                  if (text.includes("VASC202411271721537") || text.includes("拍照") || text.includes("视频") || text.includes("PHOTO")) score += 100;
                }
                return score;
              }

              function intentSeedCandidates(intent: string): Record<string, unknown>[] {
                if (intent.includes("PHOTO") || intent.includes("MEASURE") || intent.includes("VIDEO") || intent.includes("拍照") || intent.includes("视频")) {
                  return [
                    {
                      vascCode: "VASC202411271721537",
                      vascName: "入库非标拍照或提供视频",
                      active: true,
                      source: "intent_seed",
                      reason: "客户明确提出拍照、视频或调查诉求，按意图补充拍照/视频方向候选。",
                    },
                  ];
                }
                return [];
              }

              function mergeCandidates(candidates: Record<string, unknown>[], seededCandidates: Record<string, unknown>[]): Record<string, unknown>[] {
                const seen = new Set<string>();
                const merged: Record<string, unknown>[] = [];
                for (const candidate of [...candidates, ...seededCandidates]) {
                  const key = asText(candidate.vascCode) || `${asText(candidate.vascName)}:${asText(candidate.source)}`;
                  if (!key || seen.has(key)) continue;
                  seen.add(key);
                  merged.push(candidate);
                }
                return merged;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const recommendationInput = asRecord(params.recommendationInput);
                const intent = normalizedIntent(recommendationInput);
                const candidates = mergeCandidates(asCandidateArray(params.candidateSeed), intentSeedCandidates(intent));
                if (isSubmittedOrderStatusQuery(intent)) {
                  return {
                    filteredRecommendation: {
                      recommendedVascCandidates: [],
                      primaryRecommendation: null,
                      notRecommendedOptions: [],
                      missingConfirmations: [],
                      outputPath: "handoff_to_order_status",
                      handoffExpertId: "value-add-order-status",
                    },
                    recommendationInput,
                  };
                }

                const recommendedVascCandidates = candidates
                  .filter((candidate) => !isInactive(candidate))
                  .map((candidate, index) => ({ candidate, index, score: scoreCandidate(candidate, intent) }))
                  .sort((a, b) => b.score - a.score || a.index - b.index)
                  .map((item) => item.candidate);
                const notRecommendedOptions = candidates
                  .filter(isInactive)
                  .map((candidate) => ({
                    ...candidate,
                    reason: candidate.reason || "VASC 未启用，不能作为可下单推荐",
                  }));
                const requiresActionConfirmation =
                  isAmbiguousActionIntent(intent) && hasBothShelvingDirections(recommendedVascCandidates);
                const missingConfirmations = requiresActionConfirmation
                  ? [
                      {
                        field: "customerActionIntent",
                        reason: "包裹/商品条码异常存在原单上架与新单上架等多个处理方向，需要客户先确认处理方式",
                        source: "ask_customer",
                        blockingMissing: true,
                      },
                    ]
                  : recommendedVascCandidates.length > 0
                    ? []
                    : [
                        {
                          field: "customerActionIntent",
                          reason: "缺少足够事实，无法给出首选 VASC",
                          source: "ask_customer",
                          blockingMissing: true,
                        },
                      ];

                return {
                  filteredRecommendation: {
                    recommendedVascCandidates,
                    primaryRecommendation: requiresActionConfirmation ? null : (recommendedVascCandidates[0] ?? null),
                    notRecommendedOptions,
                    outputPath: recommendedVascCandidates.length > 0 && !requiresActionConfirmation ? "recommendation_ready" : "needs_confirmation",
                    missingConfirmations,
                  },
                  recommendationInput,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("filter-by-constraints")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e);
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: recommendationInput
                input:
                    value:
                        path: recommendationInput
                        ref_node: "163009"
              - name: candidateSeed
                input:
                    value:
                        path: candidateSeed
                        ref_node: "163009"
          node_outputs:
              filteredRecommendation:
                  type: object
                  value: null
              recommendationInput:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163011"
      type: code
      title: evidence-gate
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 2080
          y: 310
      parameters:
          code: |-
              /**
               * 节点：evidence-gate — 检查候选证据质量并决定推荐路径。
               * FaaS 单文件闭环，无外部 import。
               */

              function asRecord(value: unknown): Record<string, unknown> {
                return value && typeof value === "object" && !Array.isArray(value)
                  ? (value as Record<string, unknown>)
                  : {};
              }

              function asArray(value: unknown): unknown[] {
                return Array.isArray(value) ? value : [];
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const filtered = asRecord(params.filteredRecommendation);
                const missing = asArray(filtered.missingConfirmations);
                const candidates = asArray(filtered.recommendedVascCandidates);
                const presetOutputPath = typeof filtered.outputPath === "string" ? filtered.outputPath : "";
                const outputPath =
                  presetOutputPath === "handoff_to_order_status"
                    ? presetOutputPath
                    : candidates.length > 0 && missing.length === 0
                      ? "recommendation_ready"
                      : "needs_confirmation";

                return {
                  filteredRecommendation: {
                    ...filtered,
                    outputPath,
                    evidenceStatus: outputPath === "recommendation_ready" ? "sufficient" : "conditional",
                    missingConfirmations: missing,
                  },
                  recommendationInput: asRecord(params.recommendationInput),
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("evidence-gate")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e instanceof Error ? e.message : "evidence-gate failed");
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: recommendationInput
                input:
                    value:
                        path: recommendationInput
                        ref_node: "163010"
              - name: filteredRecommendation
                input:
                    value:
                        path: filteredRecommendation
                        ref_node: "163010"
          node_outputs:
              filteredRecommendation:
                  type: object
                  value: null
              recommendationInput:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
