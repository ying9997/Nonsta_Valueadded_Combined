                        ```json
                        {{recommendationInput}}
                        ```

                        - **flowContextKb**（load-flow-context 输出）：

                        ```text
                        {{flowContextKb}}
                        ```

                        - **inputContext**（参考）：

                        ```json
                        {{inputContext}}
                        ```

                        ## 输出格式

                        ```json
                        {
                          "classificationResult": {
                            "structured": {
                              "blockedStage": "S1|S2|S3|unknown",
                              "blockedStageName": "",
                              "exceptionCategory": "",
