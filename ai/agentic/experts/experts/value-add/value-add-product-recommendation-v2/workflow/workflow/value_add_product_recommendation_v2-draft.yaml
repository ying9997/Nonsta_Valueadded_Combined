                        | VASC202407161056217 | 新单上架（客户创建入库单） | 标准 | 客户新建入库单，将异常货物挂到新单下上架 |
                        | VASC202409121753076 | 上架前销毁 | 标准 | 客户不要该批货物，仓库安排销毁 |
