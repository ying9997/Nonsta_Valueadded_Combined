                        来源：`_workflow/20260720_增值预配置和客户引导助手规划/module_异常单增值客户引导/deliverables/test_prompt_B0102E23.json.enrichedContext.inferenceRules`

                        ## 使用原则

                        - AI 从客户描述中主动推断处理方式，帮客户选，不列选项让客户自己选。
                        - 推断结果只能在 `systemScopedVascList` 内选择产品。
                        - 如推断出的产品不在 `systemScopedVascList`，不得推荐，需改为追问或转人工。
                        - 如字段、产品或原子缺少接口证据，标记为 `pending`。

                        ## 规则表

                        | 规则ID | 关键词 | 推断处理方式 | 推荐产品 / 后续动作 | 附加条件 | 来源状态 |
                        |--------|--------|--------------|---------------------|----------|----------|
                        | IR-B0102E23-001 | 拍照、确认状态、看看有没有问题 | 先拍照 | 入库非标拍照或提供视频 | 标准拍照产品若在 `forbiddenProducts` 中，不得推荐 | copied_from_test_prompt |
                        | IR-B0102E23-002 | 换包装、换纸箱、换箱子 | 原单上架 | 原单上架 | 客户未提新建入库单，且异常单有关联入库单 | copied_from_test_prompt |
                        | IR-B0102E23-003 | 新建入库单、重新创建、换一个入库单 | 新单上架 | 必须追问：请提供新的上架入库单号 | 新入库单需校验同仓 | copied_from_test_prompt |
                        | IR-B0102E23-004 | 销毁、不要了、报废 | 销毁 | 上架前销毁 | 只能在系统候选内推荐 | copied_from_test_prompt |
                        | IR-B0102E23-005 | 取回、自提、拿走 | 自提 | 上架前自提 | 只能在系统候选内推荐 | copied_from_test_prompt |
                        | IR-B0102E23-006 | 空 / 无稳定线索 | 无法推断 | 追问：您希望怎么处理这批货？ | 不得直接推荐唯一产品 | copied_from_test_prompt |

                        ## B03E03 最小补充规则

                        来源：映射矩阵定稿 §4.1 / §4.2，仅用于本步 MVP 的 B03E03 意图路由，不扩展字段枚举。

                        | 规则ID | 关键词 | 推断处理方式 | 推荐产品 / 后续动作 | 附加条件 | 来源状态 |
                        |--------|--------|--------------|---------------------|----------|----------|
                        | IR-B03E03-001 | 订单外商品、计划外商品、多货 | 先判断描述是否已明确实物归属和处理方向 | 描述已明确则推断；描述模糊才追问“实物条码正确还是错误？用原单还是新单？” | 多标准方案下不得忽略明确描述，也不得在意图不清时直接推荐 | structured_from_matrix_acceptance_fix |
                        | IR-B03E03-002 | 新单、重新下单、下新入库单、换新单上架 | 新单上架 | 新单上架（客户创建入库单）或新单上架（直接上架） | 具体产品以 `systemScopedVascList` 为准；需新入库单号 | structured_from_matrix |
                        | IR-B03E03-003 | 销毁、不要、报废 | 销毁 | 上架前销毁 | 只能在系统候选内推荐 | structured_from_matrix |
                        | IR-B03E03-004 | 自提、取回、拿走 | 自提 | 上架前自提 | 只能在系统候选内推荐 | structured_from_matrix |

                        ## 禁止事项

                        - 禁止把关键词命中当作越过系统候选的依据。
                        - 禁止在多标准方案且客户意图不清时直接输出唯一推荐。
                        - 禁止输出未查证字段枚举。
