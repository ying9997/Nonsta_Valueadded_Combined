                          - 用原单还是新单？
                        - 旧 inbound 参考中 `EXTRA_ITEM | 订单外商品 | 下换新单上架`，只作为历史业务参考，不替代系统候选。

                        ## 系统候选边界

                        本文件只描述意图路由。可推荐产品必须来自运行时 `systemScopedVascList`。

                        ## 场景级候选证据

                        来源：映射矩阵 §3.2。

