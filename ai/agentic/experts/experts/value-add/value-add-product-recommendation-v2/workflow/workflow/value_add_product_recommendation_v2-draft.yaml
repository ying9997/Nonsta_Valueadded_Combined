              - name: kbIntentRoutingB0102E23
                input:
                    value:
                        path: output
                        ref_node: "163008"
              - name: kbIntentRoutingB03E03
                input:
                    value:
                        path: output
                        ref_node: "163009"
              - name: kbForbiddenProducts
                input:
                    value:
                        path: output
                        ref_node: "163010"
              - name: kbHRules
                input:
                    value:
                        path: output
                        ref_node: "163011"
