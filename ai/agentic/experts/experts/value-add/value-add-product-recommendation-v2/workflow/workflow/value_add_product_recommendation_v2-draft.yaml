                input:
                    type: string
                    value: ，
              - name: allArrayItemConcatChars
                input:
                    type: list
                    items:
                        type: object
                        value: null
                    value:
                        - isDefault: true
                          label: 换行
                          value: |+
                              
                        - isDefault: true
                          label: 制表符
                          value: "\t"
                        - isDefault: true
