                        | 上架前销毁 | 可用 | VASC202409121753076 | pending_pms | 客户明确销毁时考虑 |
                        | 上架前自提 | 可用 | VASC202411192240522 | pending_pms | 客户明确取回时考虑 |
                        | 入库非标增值（特批） | 可用 | VASC202411192246131 | pending_pms | 标准覆盖不了或特殊处理时考虑 |

                        ## 意图确认

                        | 问题 | 目的 | 影响 |
                        |------|------|------|
                        | 实物条码是正确还是错误？ | 判断是否需要贴码 / 换码 / 归属确认 | 决定是否能走直接上架或需补标签/非标 |
                        | 您希望用原单还是新单处理？ | 判断上架承接方式 | 原单直接上架在矩阵中为不可用，不得默认推荐 |
                        | 如果走新单，请提供新的上架入库单号 | 收集新单上架必填项 | 新入库单需校验同仓 |
                        | 是否要销毁或自提？ | 判断非上架方向 | 对应上架前销毁 / 上架前自提 |

                        ## 意图三元组

                        | 客户需求描述 | 推荐方向 | 推荐产品 | vascCode | 服务项 | 来源状态 |
                        |--------------|----------|----------|----------|--------|----------|
                        | 实物条码正确，客户要求使用新入库单上架 | 新单上架 | 新单上架（客户创建入库单）或新单上架（WINIT创建入库单） | pending | 入库-补贴包裹条码 | structured_from_matrix_pending_code |
                        | 实物条码正确，客户要求使用新入库单上架 | 新单直接上架 | 新单上架（直接上架） | VASC202505282347101 | 直接上架 | structured_from_matrix |
                        | 实物条码错误，要求补贴原入库单内的商品条码上架 | 原单上架 / 换码 | 原单上架 | pending | 入库-更换新商品条码 | structured_from_matrix_pending_code |
                        | 客户明确不要该异常实物 | 销毁 | 上架前销毁 | VASC202409121753076 | 销毁相关原子 | structured_from_matrix_pending_atom |
                        | 客户要取回异常实物 | 自提 | 上架前自提 | VASC202411192240522 | 自提相关原子 | structured_from_matrix_pending_atom |
                        | 标准产品覆盖不了客户处理要求 | 特批 / 非标 | 入库非标增值（特批） | VASC202411192246131 | 入库其他服务需求（非标） | structured_from_matrix_pending_atom |

                        ## 推荐约束

                        - 多产品可选时，若客户描述已明确实物条码正确/错误、原单/新单、销毁/自提等处理方向，则按描述推断；只有描述模糊时才追问，不得为了追问而忽略明确描述。
                        - 客户未说明实物条码正确/错误、原单/新单时，必须先追问，不得直接给唯一推荐。
                        - `VASC202407031507376 入库商品拍照` 是产品级全局禁推；B03E03 不得推荐该产品。
