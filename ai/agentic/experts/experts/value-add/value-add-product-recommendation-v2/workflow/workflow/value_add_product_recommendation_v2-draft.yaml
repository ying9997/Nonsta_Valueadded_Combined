                        | H11 | B02E04《单品包装不符合要求》备注“实际未产生异常” | manual | Sheet1 B02E04 备注 | §3.3.2 B02E04 |
                        | H12 | B01E1387《商品已到禁售/失效时间-中转》备注“实际未产生异常” | manual | Sheet1 B01E1387 备注 | §3.3.2 B01E1387 |
                        | H13 | B01E1435《货品查验与注册不符》备注“实际未产生异常” | manual | Sheet1 B01E1435 备注 | §3.3.2 B01E1435 |
                        | H14 | B01E1614《包裹多条码》备注“实际未生效” | manual | Sheet1 B01E1614 备注 | §3.3.2 B01E1614 |
                        | H15 | 入库《单品包装不符合要求》要求拍照暂存，且备注“标准增值已失效，只有非标增值” | downgrade | Sheet2+3 入库 行6 客服备注 | 无 |
