    - id: "163012"
      type: code
      title: merge-winit-outbound-plugin-batch
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 620
          y: 120
      parameters:
          code: |-
              /**
               * 合并 `queryOutboundOrderList` 批处理结果，直接产出 rawOrderData
               * 约定：
               * - WO 主单动作（outboundOrderNum）优先级最高
               * - 模糊单号动作顺序：trackingNo 命中优先，sellerOrderNo 兜底
               */

              function mergeParseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function mergeCoerceListPayload(parsed: unknown): { list?: Array<Record<string, unknown>> } {
                if (parsed == null) {
                  return { list: [] };
                }
                if (typeof parsed !== "object") {
                  return { list: [] };
                }
                const o = parsed as Record<string, unknown>;

                if (o.output != null && typeof o.output === "object") {
                  return mergeCoerceListPayload(o.output);
                }

                if (o.code === "0" || o.code === 0) {
                  const inner = o.data;
                  if (inner != null && typeof inner === "string") {
                    try {
                      return mergeCoerceListPayload(JSON.parse(inner) as unknown);
                    } catch {
                      return { list: [] };
                    }
                  }
                  if (inner != null && typeof inner === "object") {
                    return mergeCoerceListPayload(inner);
                  }
                  return { list: [] };
                }

                if (Array.isArray(o.list)) {
                  return { list: o.list as Array<Record<string, unknown>> };
                }

                if (o.outboundOrderNum != null || o.outboundOrderNo != null) {
                  return { list: [o as Record<string, unknown>] };
                }

                return { list: [] };
              }

              function mergeNormalizeWoMainOrderNum(raw: string): string {
                const s = raw.trim();
                if (!s) return s;
                const m = /^WO(\d+)[A-Za-z]*$/i.exec(s);
                if (m) return `WO${m[1]}`;
                return s;
              }

              function mergeNormalizeTokens(nos: string[]): string[] {
                const seen = new Set<string>();
                const out: string[] = [];
                for (const n of nos) {
                  const raw = String(n).trim();
                  if (!raw) continue;
                  const c = /^WO\d+/i.test(raw) ? mergeNormalizeWoMainOrderNum(raw) : raw;
                  if (!c || seen.has(c)) continue;
                  seen.add(c);
                  out.push(c);
                }
                return out;
              }

              function mergeOrderKeyFromRow(row: Record<string, unknown>): string {
                return mergeNormalizeWoMainOrderNum(String(row.outboundOrderNum ?? row.documentNo ?? "").trim());
              }

              function mergeNormalizeOrderAliases(order: Record<string, unknown>): Record<string, unknown> {
                const doc = order.documentNo;
                const hasOut =
                  order.outboundOrderNum != null && String(order.outboundOrderNum).trim() !== "";
                if (!hasOut && doc != null && String(doc).trim() !== "") {
                  return { ...order, outboundOrderNum: String(doc).trim() };
                }
                return order;
              }

              function asOutputList(raw: unknown): Array<{ data?: unknown }> {
                if (raw == null) return [];
                if (!Array.isArray(raw)) return [];
                return raw as Array<{ data?: unknown }>;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const rawNos = ((params.outboundOrderNos as string[]) ?? []).filter((o) => o?.trim());
                const requested = mergeNormalizeTokens(rawNos);

                type ActionPlan = {
                  inputToken: string;
                  queryBy: "outboundOrderNum" | "trackingNo" | "sellerOrderNo";
                };
                const actionPlans = (Array.isArray(params.actionPlans) ? params.actionPlans : []) as ActionPlan[];
                const outputList = asOutputList(params.winitPluginOutputList);

                const priority = (q: ActionPlan["queryBy"]): number => {
                  if (q === "outboundOrderNum") return 3;
                  if (q === "trackingNo") return 2;
                  return 1;
                };

                const bestByToken = new Map<
                  string,
                  {
                    priority: number;
                    rowsByKey: Map<string, Record<string, unknown>>;
                  }
                >();

                for (let i = 0; i < outputList.length; i++) {
                  const item = outputList[i];
                  const plan = actionPlans[i];
                  if (!plan) continue;

                  const token = plan.inputToken?.trim();
                  if (!token) continue;

                  const slot = item?.data;
                  if (slot == null) continue;
                  const str = String(slot).trim();
                  if (!str) continue;

                  const parsed = mergeParseCozeWorkflowDataField(slot);
                  const chunk = mergeCoerceListPayload(parsed);
                  const rows = (chunk.list ?? []).filter((r) => r && typeof r === "object") as Record<string, unknown>[];
                  if (rows.length === 0) continue;

                  const p = priority(plan.queryBy);
                  const prev = bestByToken.get(token);
                  if (!prev || p > prev.priority) {
                    bestByToken.set(token, { priority: p, rowsByKey: new Map<string, Record<string, unknown>>() });
                  } else if (p < prev.priority) {
                    continue;
                  }

                  const holder = bestByToken.get(token)!;
                  for (const row of rows) {
                    const aliased = mergeNormalizeOrderAliases(row);
                    const key = mergeOrderKeyFromRow(aliased);
                    if (!key) continue;
                    if (!holder.rowsByKey.has(key)) holder.rowsByKey.set(key, aliased);
                  }
                }

                const outList: Record<string, unknown>[] = [];
                const globalKeys = new Set<string>();
                for (const token of requested) {
                  const entry = bestByToken.get(token);
                  if (!entry) continue;
                  for (const [k, row] of entry.rowsByKey.entries()) {
                    if (globalKeys.has(k)) continue;
                    globalKeys.add(k);
                    outList.push(row);
                  }
                }

                return {
                  rawOrderData: {
                    list: outList,
                    total: outList.length,
                    currentPageNum: 1,
                    currentPageSize: outList.length,
                    _fetchMeta: {
                      strategy: "list-only",
                      batchPluginMerged: true,
                      requestedTokenCount: requested.length,
                      actionPlanCount: actionPlans.length,
                      pluginBatchOutputCount: outputList.length,
                      resolvedCount: outList.length,
                    },
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("merge-winit-outbound-plugin-batch")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: outboundOrderNos
                input:
                    value:
                        path: outboundOrderNos
                        ref_node: "163010"
              - name: actionPlans
                input:
                    value:
                        path: actionPlans
                        ref_node: "163011"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163014"
              - name: winitPluginBatchActionsCount
                input:
                    value:
                        path: winitPluginBatchActionsCount
                        ref_node: "163011"
          node_outputs:
              rawOrderData:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163013"
      type: code
      title: build-outbound-timing-detail
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 800
          y: 40
      parameters:
          code: |-
              /**
               * 在发货/出库时效或包裹实际尺寸重量意图下，为每个匹配子单构造
               * `wh.outbound.getPackageDetail` 动作。
               * 跟踪号输入精确匹配 packageList；主单/卖家单输入覆盖该订单全部子单。
               */

              const DETAIL_BATCH_MAX_ACTIONS = 100;

              type OrderRow = Record<string, unknown>;

              type TimingActionPlan = {
                inputTokens: string[];
                outboundOrderNum: string;
                shippingNo: string;
                trackingNos: string[];
              };

              function timingText(value: unknown): string {
                return String(value ?? "").trim();
              }

              function normalizeMainOrderNo(value: unknown): string {
                const text = timingText(value);
                const match = /^WO(\d+)[A-Za-z]*$/i.exec(text);
                return match ? `WO${match[1]}` : text;
              }

              function isTimingIntent(query: unknown, customerIntent: unknown): boolean {
                const text = `${timingText(query)} ${timingText(customerIntent)}`.toLowerCase();
                if (!text.trim()) return false;
                return (
                  /(什么时候|何时|多久|预计|预估|应|承诺|截止|超时|延误|还没|尚未|未).{0,12}(发货|出库)/i.test(text) ||
                  /(发货|出库).{0,12}(时间|日期|什么时候|何时|多久|预计|预估|应|承诺|截止|超时|延误)/i.test(text) ||
                  /(when|expected|estimated|overdue|delay|deadline).{0,24}(ship|dispatch|outbound)/i.test(text) ||
                  /(ship|dispatch|outbound).{0,24}(time|date|when|expected|estimated|overdue|delay|deadline)/i.test(text)
                );
              }

              function isMeasurementIntent(query: unknown, customerIntent: unknown): boolean {
                const text = `${timingText(query)} ${timingText(customerIntent)}`.toLowerCase();
                if (!text.trim()) return false;
                const measurement = /(尺寸|长宽高|长[×x*]?宽[×x*]?高|重量|体积|称重|测量|实重|材积|dimension|size|length|width|height|weight|volume)/i;
                const packageContext = /(实际|实测|打包后|出库后|包裹|货物|箱|票|运单|物流|actual|measured|parcel|package|shipment)/i;
                return measurement.test(text) && packageContext.test(text);
              }

              function orderList(raw: unknown): OrderRow[] {
                if (!raw || typeof raw !== "object" || Array.isArray(raw)) return [];
                const list = (raw as Record<string, unknown>).list;
                return Array.isArray(list)
                  ? list.filter((item): item is OrderRow => Boolean(item && typeof item === "object" && !Array.isArray(item)))
                  : [];
              }

              function stringList(raw: unknown): string[] {
                if (!Array.isArray(raw)) return [];
                return raw.map(timingText).filter(Boolean);
              }

              function packageTrackingNos(pkg: OrderRow): string[] {
                const values = [
                  ...stringList(pkg.trackingNos),
                  timingText(pkg.trackingNo),
                  timingText(pkg.trackingNum),
                ].filter(Boolean);
                return Array.from(new Set(values));
              }

              function requestedTokens(raw: unknown): string[] {
                return Array.isArray(raw) ? Array.from(new Set(raw.map(timingText).filter(Boolean))) : [];
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const timingIntentMatched = isTimingIntent(params.query, params.customerIntent);
                const measurementIntentMatched = isMeasurementIntent(params.query, params.customerIntent);
                const detailIntentMatched = timingIntentMatched || measurementIntentMatched;
                if (!detailIntentMatched) {
                  return {
                    actions: [],
                    actionPlans: [],
                    timingDetailActionsCount: 0,
                    detailActionsCount: 0,
                    timingIntentMatched: false,
                    measurementIntentMatched: false,
                    detailIntentMatched: false,
                    requiresNarrowing: false,
                    candidateActionsCount: 0,
                  };
                }

                const tokens = requestedTokens(params.outboundOrderNos);
                const tokenKeys = new Set(tokens.map((item) => item.toUpperCase()));
                const plans: TimingActionPlan[] = [];
                const seen = new Set<string>();

                for (const order of orderList(params.rawOrderData)) {
                  const outboundOrderNum = normalizeMainOrderNo(
                    order.outboundOrderNum ?? order.documentNo ?? order.orderNo
                  );
                  if (!/^WO\d+$/i.test(outboundOrderNum)) continue;
                  const packages = Array.isArray(order.packageList)
                    ? order.packageList.filter(
                        (item): item is OrderRow => Boolean(item && typeof item === "object" && !Array.isArray(item))
                      )
                    : [];
                  const mainOrSellerMatched = [
                    outboundOrderNum,
                    timingText(order.sellerOrderNo),
                    timingText(order.customerOrderNo),
                  ].some((value) => value && tokenKeys.has(value.toUpperCase()));
                  const trackingMatchedPackages = packages.filter((pkg) =>
                    packageTrackingNos(pkg).some((trackingNo) => tokenKeys.has(trackingNo.toUpperCase()))
                  );
                  const selected = trackingMatchedPackages.length > 0 && !mainOrSellerMatched
                    ? trackingMatchedPackages
                    : packages;

                  for (const pkg of selected) {
                    const shippingNo = timingText(pkg.packageNum ?? pkg.shippingNo ?? pkg.packageNo);
                    if (!shippingNo) continue;
                    const key = `${outboundOrderNum.toUpperCase()}|${shippingNo.toUpperCase()}`;
                    if (seen.has(key)) continue;
                    seen.add(key);
                    plans.push({
                      inputTokens: tokens,
                      outboundOrderNum,
                      shippingNo,
                      trackingNos: packageTrackingNos(pkg),
                    });
                  }
                }

                if (plans.length > DETAIL_BATCH_MAX_ACTIONS) {
                  return {
                    actions: [],
                    actionPlans: [],
                    timingDetailActionsCount: 0,
                    detailActionsCount: 0,
                    timingIntentMatched,
                    measurementIntentMatched,
                    detailIntentMatched: true,
                    requiresNarrowing: true,
                    candidateActionsCount: plans.length,
                  };
                }

                const actions = plans.map((plan) => ({
                  action: "wh.outbound.getPackageDetail",
                  data: JSON.stringify({
                    shippingNo: plan.shippingNo,
                    orderNo: plan.outboundOrderNum,
                    containerSerno: "",
                  }),
                }));

                return {
                  actions,
                  actionPlans: plans,
                  timingDetailActionsCount: actions.length,
                  detailActionsCount: actions.length,
                  timingIntentMatched,
                  measurementIntentMatched,
                  detailIntentMatched: true,
                  requiresNarrowing: false,
                  candidateActionsCount: plans.length,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("build-outbound-timing-detail")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((result) => process.stdout.write(JSON.stringify(result)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163012"
              - name: outboundOrderNos
                input:
                    value:
                        path: outboundOrderNos
                        ref_node: "163010"
              - name: query
                input:
                    value:
                        path: query
                        ref_node: "100001"
              - name: customerIntent
                input:
                    value:
                        path: customerIntent
                        ref_node: "100001"
          node_outputs:
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              actionPlans:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          inputTokens:
                              type: list
                              items:
                                  type: string
                                  value: null
                              value: null
                          outboundOrderNum:
                              type: string
                              value: null
                          shippingNo:
                              type: string
                              value: null
                          trackingNos:
                              type: list
                              items:
                                  type: string
                                  value: null
                              value: null
                  value: null
              timingDetailActionsCount:
                  type: integer
                  value: null
              detailActionsCount:
                  type: integer
                  value: null
              timingIntentMatched:
                  type: boolean
                  value: null
              measurementIntentMatched:
                  type: boolean
                  value: null
              detailIntentMatched:
                  type: boolean
                  value: null
              requiresNarrowing:
                  type: boolean
                  value: null
              candidateActionsCount:
                  type: integer
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
