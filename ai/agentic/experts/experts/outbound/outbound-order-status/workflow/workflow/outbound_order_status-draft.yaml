    - id: "163019"
      type: code
      title: merge-outbound-timing-detail
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 1160
          y: 40
      parameters:
          code: |-
              /**
               * 归一化 `wh.outbound.getPackageDetail` 批处理结果，分别产出发货时间事实和
               * 包裹实际尺寸重量事实；不以预估值冒充实际值。
               * transport/business success、空数据和业务失败分别标记。
               */

              type TimingActionPlan = {
                inputTokens?: string[];
                outboundOrderNum: string;
                shippingNo: string;
                trackingNos?: string[];
              };

              type FetchStatus = "success" | "no_data" | "service_error";

              type SlaFact = {
                slaName?: string;
                serviceStandardTime?: number;
                serviceCompletionTime?: number;
                status?: string;
              };

              type OutboundTimingFact = {
                outboundOrderNum: string;
                shippingNo: string;
                trackingNos: string[];
                status?: string;
                orderTime?: string;
                estimateOutWhTimeLocal?: string;
                estimateOutWhTime?: string;
                expectedOutboundTime?: string;
                expectedOutboundTimeBasis?: "system" | "warehouse_local";
                outWhTime?: string;
                warehouseCode?: string;
                warehouseName?: string;
                slaList?: SlaFact[];
                fetchStatus: FetchStatus;
                businessCode: string;
                source: "wh.outbound.getPackageDetail";
              };

              type ActualContainerMeasurement = {
                containerNo?: string;
                lengthCm?: number;
                widthCm?: number;
                heightCm?: number;
                weightKg?: number;
                volumeM3?: number;
              };

              type PackageMeasurementFact = {
                outboundOrderNum: string;
                shippingNo: string;
                trackingNos: string[];
                actualWeightKg?: number;
                actualVolumeM3?: number;
                actualContainers: ActualContainerMeasurement[];
                fetchStatus: FetchStatus;
                businessCode: string;
                source: "wh.outbound.getPackageDetail";
              };

              function parseJsonLayers(raw: unknown, maxDepth = 8): unknown {
                let current = raw;
                for (let depth = 0; depth < maxDepth && typeof current === "string"; depth++) {
                  const text = current.trim();
                  if (!text) return "";
                  try {
                    current = JSON.parse(text) as unknown;
                  } catch {
                    return current;
                  }
                }
                return current;
              }

              function unwrapDetail(raw: unknown): Record<string, unknown> | null {
                let current = parseJsonLayers(raw);
                for (let depth = 0; depth < 8; depth++) {
                  if (!current || typeof current !== "object" || Array.isArray(current)) return null;
                  const object = current as Record<string, unknown>;
                  if (
                    object.orderNo != null ||
                    object.shippingNo != null ||
                    object.estimateOutWhTimeLocal != null ||
                    object.estimateOutWhTime != null ||
                    object.outWhTime != null
                  ) {
                    return object;
                  }
                  if (object.data != null) {
                    current = parseJsonLayers(object.data);
                    continue;
                  }
                  if (object.output != null) {
                    current = parseJsonLayers(object.output);
                    continue;
                  }
                  if (object.Output != null) {
                    current = parseJsonLayers(object.Output);
                    continue;
                  }
                  return null;
                }
                return null;
              }

              function textValue(raw: unknown): string | undefined {
                const text = String(raw ?? "").trim();
                return text || undefined;
              }

              function numberValue(raw: unknown): number | undefined {
                if (raw === null || raw === undefined || raw === "") return undefined;
                const number = Number(raw);
                return Number.isFinite(number) ? number : undefined;
              }

              function normalizeSlaList(raw: unknown): SlaFact[] | undefined {
                if (!Array.isArray(raw)) return undefined;
                const facts = raw
                  .filter(
                    (item): item is Record<string, unknown> => Boolean(item && typeof item === "object" && !Array.isArray(item))
                  )
                  .map((item) => {
                    const fact: SlaFact = {};
                    const slaName = textValue(item.slaName);
                    const serviceStandardTime = numberValue(item.serviceStandardTime);
                    const serviceCompletionTime = numberValue(item.serviceCompletionTime);
                    const status = textValue(item.status);
                    if (slaName) fact.slaName = slaName;
                    if (serviceStandardTime !== undefined) fact.serviceStandardTime = serviceStandardTime;
                    if (serviceCompletionTime !== undefined) fact.serviceCompletionTime = serviceCompletionTime;
                    if (status) fact.status = status;
                    return fact;
                  })
                  .filter((item) => Object.keys(item).length > 0);
                return facts.length > 0 ? facts : undefined;
              }

              function normalizeActualContainers(raw: unknown): ActualContainerMeasurement[] {
                if (!Array.isArray(raw)) return [];
                return raw
                  .filter(
                    (item): item is Record<string, unknown> => Boolean(item && typeof item === "object" && !Array.isArray(item))
                  )
                  .map((item) => {
                    const measurement: ActualContainerMeasurement = {};
                    const containerNo = textValue(
                      item.containerSerno ?? item.containerNo ?? item.packageNo ?? item.packageNum
                    );
                    const lengthCm = numberValue(item.packageLength);
                    const widthCm = numberValue(item.packageWidth);
                    const heightCm = numberValue(item.packageHeight);
                    const weightKg = numberValue(item.packageWeight);
                    const volumeM3 = numberValue(item.packageVolume);
                    if (containerNo) measurement.containerNo = containerNo;
                    if (lengthCm !== undefined) measurement.lengthCm = lengthCm;
                    if (widthCm !== undefined) measurement.widthCm = widthCm;
                    if (heightCm !== undefined) measurement.heightCm = heightCm;
                    if (weightKg !== undefined) measurement.weightKg = weightKg;
                    if (volumeM3 !== undefined) measurement.volumeM3 = volumeM3;
                    return measurement;
                  })
                  .filter((item) => Object.keys(item).length > 0);
              }

              function outputItem(raw: unknown, index: number): Record<string, unknown> | null {
                if (!Array.isArray(raw)) return null;
                const item = raw[index];
                return item && typeof item === "object" && !Array.isArray(item)
                  ? (item as Record<string, unknown>)
                  : null;
              }

              function baseFact(plan: TimingActionPlan, code: string, fetchStatus: FetchStatus): OutboundTimingFact {
                return {
                  outboundOrderNum: String(plan.outboundOrderNum ?? "").trim(),
                  shippingNo: String(plan.shippingNo ?? "").trim(),
                  trackingNos: Array.isArray(plan.trackingNos)
                    ? plan.trackingNos.map((item) => String(item ?? "").trim()).filter(Boolean)
                    : [],
                  fetchStatus,
                  businessCode: code,
                  source: "wh.outbound.getPackageDetail",
                };
              }

              function baseMeasurementFact(
                plan: TimingActionPlan,
                code: string,
                fetchStatus: FetchStatus
              ): PackageMeasurementFact {
                return {
                  outboundOrderNum: String(plan.outboundOrderNum ?? "").trim(),
                  shippingNo: String(plan.shippingNo ?? "").trim(),
                  trackingNos: Array.isArray(plan.trackingNos)
                    ? plan.trackingNos.map((item) => String(item ?? "").trim()).filter(Boolean)
                    : [],
                  actualContainers: [],
                  fetchStatus,
                  businessCode: code,
                  source: "wh.outbound.getPackageDetail",
                };
              }

              function measurementFact(
                plan: TimingActionPlan,
                code: string,
                detail: Record<string, unknown>
              ): PackageMeasurementFact {
                const actualWeightKg = numberValue(detail.actualWeight);
                const actualVolumeM3 = numberValue(detail.actualVolume);
                const actualContainers = normalizeActualContainers(detail.actualContainerList);
                const hasActualData =
                  actualWeightKg !== undefined || actualVolumeM3 !== undefined || actualContainers.length > 0;
                const fact = baseMeasurementFact(plan, code, hasActualData ? "success" : "no_data");
                if (actualWeightKg !== undefined) fact.actualWeightKg = actualWeightKg;
                if (actualVolumeM3 !== undefined) fact.actualVolumeM3 = actualVolumeM3;
                fact.actualContainers = actualContainers;
                return fact;
              }

              function successFact(
                plan: TimingActionPlan,
                code: string,
                detail: Record<string, unknown>
              ): OutboundTimingFact {
                const fact = baseFact(plan, code, "success");
                const fields: Array<[keyof OutboundTimingFact, unknown]> = [
                  ["status", detail.status],
                  ["orderTime", detail.orderTime],
                  ["estimateOutWhTimeLocal", detail.estimateOutWhTimeLocal],
                  ["estimateOutWhTime", detail.estimateOutWhTime],
                  ["outWhTime", detail.outWhTime],
                  ["warehouseCode", detail.warehouseCode],
                  ["warehouseName", detail.warehouseName],
                ];
                for (const [key, raw] of fields) {
                  const value = textValue(raw);
                  if (value) (fact as Record<string, unknown>)[key] = value;
                }
                const systemExpected = textValue(detail.estimateOutWhTime);
                const localExpected = textValue(detail.estimateOutWhTimeLocal);
                if (systemExpected) {
                  fact.expectedOutboundTime = systemExpected;
                  fact.expectedOutboundTimeBasis = "system";
                } else if (localExpected) {
                  fact.expectedOutboundTime = localExpected;
                  fact.expectedOutboundTimeBasis = "warehouse_local";
                }
                const slaList = normalizeSlaList(detail.slaList);
                if (slaList) fact.slaList = slaList;
                return fact;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const actionPlans = (Array.isArray(params.actionPlans) ? params.actionPlans : []) as TimingActionPlan[];
                const outboundTimingFacts: OutboundTimingFact[] = [];
                const packageMeasurementFacts: PackageMeasurementFact[] = [];

                for (let index = 0; index < actionPlans.length; index++) {
                  const plan = actionPlans[index];
                  const item = outputItem(params.winitPluginOutputList, index);
                  const code = String(item?.code ?? "missing");
                  if (!item || (code !== "0" && code !== "0.0")) {
                    outboundTimingFacts.push(baseFact(plan, code, "service_error"));
                    packageMeasurementFacts.push(baseMeasurementFact(plan, code, "service_error"));
                    continue;
                  }
                  const rawData = item.data;
                  if (rawData === null || rawData === undefined || String(rawData).trim() === "") {
                    outboundTimingFacts.push(baseFact(plan, code, "no_data"));
                    packageMeasurementFacts.push(baseMeasurementFact(plan, code, "no_data"));
                    continue;
                  }
                  const detail = unwrapDetail(rawData);
                  if (!detail) {
                    outboundTimingFacts.push(baseFact(plan, code, "no_data"));
                    packageMeasurementFacts.push(baseMeasurementFact(plan, code, "no_data"));
                    continue;
                  }
                  const actualOrderNo = textValue(detail.orderNo);
                  const actualShippingNo = textValue(detail.shippingNo);
                  if (
                    (actualOrderNo && actualOrderNo.toUpperCase() !== plan.outboundOrderNum.toUpperCase()) ||
                    (actualShippingNo && actualShippingNo.toUpperCase() !== plan.shippingNo.toUpperCase())
                  ) {
                    outboundTimingFacts.push(baseFact(plan, code, "service_error"));
                    packageMeasurementFacts.push(baseMeasurementFact(plan, code, "service_error"));
                    continue;
                  }
                  outboundTimingFacts.push(successFact(plan, code, detail));
                  packageMeasurementFacts.push(measurementFact(plan, code, detail));
                }

                return {
                  outboundTimingFacts,
                  packageMeasurementFacts,
                  requiresNarrowing: params.requiresNarrowing === true,
                  timingDetailResolvedCount: outboundTimingFacts.filter((item) => item.fetchStatus === "success").length,
                  timingDetailNoDataCount: outboundTimingFacts.filter((item) => item.fetchStatus === "no_data").length,
                  timingDetailFailedCount: outboundTimingFacts.filter((item) => item.fetchStatus === "service_error").length,
                  measurementResolvedCount: packageMeasurementFacts.filter((item) => item.fetchStatus === "success").length,
                  measurementNoDataCount: packageMeasurementFacts.filter((item) => item.fetchStatus === "no_data").length,
                  measurementFailedCount: packageMeasurementFacts.filter((item) => item.fetchStatus === "service_error").length,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("merge-outbound-timing-detail")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((result) => process.stdout.write(JSON.stringify(result)));
              }
          language: 5
          node_inputs:
              - name: actionPlans
                input:
                    value:
                        path: actionPlans
                        ref_node: "163013"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163018"
              - name: requiresNarrowing
                input:
                    value:
                        path: requiresNarrowing
                        ref_node: "163013"
          node_outputs:
              outboundTimingFacts:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              packageMeasurementFacts:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              requiresNarrowing:
                  type: boolean
                  value: null
              timingDetailResolvedCount:
                  type: integer
                  value: null
              timingDetailNoDataCount:
                  type: integer
                  value: null
              timingDetailFailedCount:
                  type: integer
                  value: null
              measurementResolvedCount:
                  type: integer
                  value: null
              measurementNoDataCount:
                  type: integer
                  value: null
              measurementFailedCount:
                  type: integer
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163015"
      type: code
      title: build-carrier-detail-winit
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 800
          y: 200
      parameters:
          code: |-
              /**
               * 节点：在 id/54 已定位订单后，按需为 id/55 `queryOutboundOrder` 生成批处理动作。
               *
               * 【输入】rawOrderData、query、customerIntent
               * 【输出】actions、actionPlans、carrierDetailActionsCount
               */

              type CarrierDetailActionPlan = {
                outboundOrderNum: string;
              };

              function normalizeWoMainOrderNum(raw: string): string {
                const value = raw.trim();
                if (!value) return "";
                const match = /^WO(\d+)[A-Za-z]*$/i.exec(value);
                return match ? `WO${match[1]}` : value;
              }

              function asOrderList(raw: unknown): Array<Record<string, unknown>> {
                if (!raw || typeof raw !== "object" || Array.isArray(raw)) return [];
                const list = (raw as Record<string, unknown>).list;
                return Array.isArray(list)
                  ? list.filter((item): item is Record<string, unknown> => Boolean(item && typeof item === "object"))
                  : [];
              }

              function hasActualCarrier(order: Record<string, unknown>): boolean {
                if (String(order.carrier ?? "").trim()) return true;
                const packages = Array.isArray(order.packageList) ? order.packageList : [];
                return packages.some(
                  (item) => item && typeof item === "object" && String((item as Record<string, unknown>).carrier ?? "").trim()
                );
              }

              function isCarrierIntent(query: unknown, customerIntent: unknown): boolean {
                const text = `${String(query ?? "")} ${String(customerIntent ?? "")}`.toLowerCase();
                return /(承运商|派送商|渠道商|快递公司|物流商|carrier|courier|delivery provider)/i.test(text);
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const orders = asOrderList(params.rawOrderData);
                const explicitCarrierIntent = isCarrierIntent(params.query, params.customerIntent);
                const seen = new Set<string>();
                const actionPlans: CarrierDetailActionPlan[] = [];

                for (const order of orders) {
                  if (!explicitCarrierIntent && hasActualCarrier(order)) continue;
                  const rawOrderNo = String(order.outboundOrderNum ?? order.documentNo ?? order.orderNo ?? "");
                  const outboundOrderNum = normalizeWoMainOrderNum(rawOrderNo);
                  if (!/^WO\d+$/i.test(outboundOrderNum)) continue;
                  const key = outboundOrderNum.toUpperCase();
                  if (seen.has(key)) continue;
                  seen.add(key);
                  actionPlans.push({ outboundOrderNum });
                }

                const actions = actionPlans.map(({ outboundOrderNum }) => ({
                  action: "queryOutboundOrder",
                  data: JSON.stringify({ outboundOrderNum }),
                }));

                return {
                  actions,
                  actionPlans,
                  carrierDetailActionsCount: actions.length,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("build-carrier-detail-winit")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((result) => process.stdout.write(JSON.stringify(result)))
                  .catch((error) => {
                    console.error(error);
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163012"
              - name: query
                input:
                    value:
                        path: query
                        ref_node: "100001"
              - name: customerIntent
                input:
                    value:
                        path: customerIntent
                        ref_node: "100001"
          node_outputs:
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              actionPlans:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          outboundOrderNum:
                              type: string
                              value: null
                  value: null
              carrierDetailActionsCount:
                  type: integer
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163020"
      type: code
      title: build-outbound-return-detail
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 800
          y: 360
      parameters:
          code: |-
              /**
               * 节点：识别“派送失败退回 / 关联退货单”事实查询意图，并按出库单生成退货单查询动作。
               * FaaS 单文件闭环，无 import。
               */

              type ReturnActionPlan = {
                outboundOrderNo: string;
              };

              type ReturnLookupMeta = {
                intentMatched: boolean;
                candidateOrderCount: number;
                missingOutboundOrderNo: boolean;
                requiresNarrowing: boolean;
              };

              const RETURN_BATCH_MAX = 100;

              function returnText(value: unknown): string {
                return String(value ?? "").trim();
              }

              function normalizeReturnOutboundOrderNo(value: unknown): string {
                const text = returnText(value);
                const match = /^WO(\d+)[A-Za-z]*$/i.exec(text);
                return match ? `WO${match[1]}` : "";
              }

              function isReturnFactIntent(query: unknown, customerIntent: unknown): boolean {
                const text = `${returnText(query)} ${returnText(customerIntent)}`.toLowerCase();
                if (!text.trim()) return false;

                const explicitFact =
                  /(关联|绑定|对应|是否|有没有|哪一|哪个|查询|查看|查到|状态|进度|原因|单号|到仓|入仓|收货|完成|退到|退回).{0,16}(退货单|退回单|退件单|退货|退回|退仓)/i.test(text) ||
                  /(退货单|退回单|退件单|退货|退回|退仓).{0,16}(关联|绑定|对应|是否|有没有|哪一|哪个|查询|查看|查到|状态|进度|原因|单号|到仓|入仓|收货|完成)/i.test(text) ||
                  /(派送失败|投递失败|妥投失败|拒收|无法派送|delivery failed|undeliverable).{0,20}(退回|退货|退仓|return)/i.test(text) ||
                  /(退回|退货|退仓|return).{0,20}(派送失败|投递失败|妥投失败|拒收|无法派送|delivery failed|undeliverable)/i.test(text) ||
                  /(return order|return status|returned to (the )?warehouse|return(ed)? reason)/i.test(text);
                if (explicitFact) return true;

                const processOnly =
                  /(如何|怎么|怎样|流程|政策|规则|申请|创建|下单|办理|操作).{0,12}(退货|退回|退货单)/i.test(text) ||
                  /(退货|退回|退货单).{0,12}(如何|怎么|怎样|流程|政策|规则|申请|创建|下单|办理|操作)/i.test(text);
                if (processOnly) return false;

                return /(退货单|退回单|退件单|退仓|已退货|returned package)/i.test(text);
              }

              function orderRows(raw: unknown): Record<string, unknown>[] {
                if (!raw || typeof raw !== "object" || Array.isArray(raw)) return [];
                const list = (raw as Record<string, unknown>).list;
                return Array.isArray(list)
                  ? list.filter(
                      (item): item is Record<string, unknown> =>
                        Boolean(item) && typeof item === "object" && !Array.isArray(item)
                    )
                  : [];
              }

              function collectOutboundOrderNos(rawOrderData: unknown, outboundOrderNos: unknown): string[] {
                const values: string[] = [];
                if (Array.isArray(outboundOrderNos)) {
                  for (const value of outboundOrderNos) {
                    const normalized = normalizeReturnOutboundOrderNo(value);
                    if (normalized) values.push(normalized);
                  }
                }
                for (const row of orderRows(rawOrderData)) {
                  const normalized = normalizeReturnOutboundOrderNo(
                    row.outboundOrderNum ?? row.documentNo ?? row.orderNo
                  );
                  if (normalized) values.push(normalized);
                }
                return Array.from(new Set(values.map((value) => value.toUpperCase())));
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const intentMatched = isReturnFactIntent(params.query, params.customerIntent);
                const outboundOrderNos = collectOutboundOrderNos(
                  params.rawOrderData,
                  params.outboundOrderNos
                );
                const requiresNarrowing = intentMatched && outboundOrderNos.length > RETURN_BATCH_MAX;
                const lookupMeta: ReturnLookupMeta = {
                  intentMatched,
                  candidateOrderCount: outboundOrderNos.length,
                  missingOutboundOrderNo: intentMatched && outboundOrderNos.length === 0,
                  requiresNarrowing,
                };

                if (!intentMatched || outboundOrderNos.length === 0 || requiresNarrowing) {
                  return { actions: [], actionPlans: [], returnLookupMeta: lookupMeta };
                }

                const actionPlans: ReturnActionPlan[] = outboundOrderNos.map((outboundOrderNo) => ({
                  outboundOrderNo,
                }));
                const actions = actionPlans.map((plan) => ({
                  action: "rma.returnGoodsOrder.queryReturnOderList",
                  data: JSON.stringify({
                    outboundOrderNo: plan.outboundOrderNo,
                    pageParams: { pageNo: 1, pageSize: 50 },
                  }),
                }));

                return { actions, actionPlans, returnLookupMeta: lookupMeta };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("build-outbound-return-detail")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((result) => process.stdout.write(JSON.stringify(result)));
              }
          language: 5
          node_inputs:
              - name: rawOrderData
                input:
                    value:
                        path: rawOrderData
                        ref_node: "163012"
              - name: outboundOrderNos
                input:
                    value:
                        path: outboundOrderNos
                        ref_node: "163010"
              - name: query
                input:
                    value:
                        path: query
                        ref_node: "100001"
              - name: customerIntent
                input:
                    value:
                        path: customerIntent
                        ref_node: "100001"
          node_outputs:
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              actionPlans:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          outboundOrderNo:
                              type: string
                              value: null
                  value: null
              returnLookupMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
