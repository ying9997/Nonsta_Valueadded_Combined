# 本地专家 → Coze 工作流导出（见根目录 COZE-WORKFLOW.md）
yamlBasename: outbound_order_status-draft.yaml
packageMainName: outbound_order_status
packageDescription: 出库单状态解读（id/54 定位 → 按意图补时效、承运商和关联退货单事实）
icon: plugin_icon/workflow.png

endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext

# 与 e_sample_batch 一致：单插件 `parameters.batch` + `actions` 列表；batchSize 须与 build 中 COZE_WINIT_PLUGIN_BATCH_MAX（默认 100）对齐
winitOpenapiPlugins:
  - insertBefore: merge-winit-outbound-plugin-batch
    logicalId: winit_outbound_primary_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-outbound-primary-winit
        path: actions
  - insertBefore: merge-carrier-detail
    logicalId: winit_outbound_carrier_detail_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-carrier-detail-winit
        path: actions
  - insertBefore: merge-outbound-timing-detail
    logicalId: winit_outbound_timing_detail_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-outbound-timing-detail
        path: actions
  - insertBefore: merge-outbound-return-detail
    logicalId: winit_outbound_return_detail_batch
    pluginBatch:
      enabled: true
      batchSize: 100
      concurrentSize: 10
      actionsFrom:
        logicalId: build-outbound-return-detail
        path: actions

