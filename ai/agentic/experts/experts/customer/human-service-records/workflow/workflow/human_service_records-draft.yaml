schema_version: 1.0.0
name: human_service_records
id: 7806284243145084154
description: 人工客服历史沟通摘要（身份校验 → 时间范围 → 消息级证据 → LLM 问题回答 → 引用校验）
mode: workflow
icon: plugin_icon/workflow.png
nodes:
    - id: "100001"
      type: start
      title: 开始
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Start-v2.jpg
      description: 工作流的起始节点，用于设定启动工作流需要的信息
      position:
          x: -180
          y: 160
      parameters:
          node_outputs:
              query:
                  type: string
                  value: null
                  description: 上游 Agent 委托本专家需要完成的具体任务说明
              customerIntent:
                  type: string
                  value: null
                  description: 当前正在为客户解决的业务问题或诉求摘要
              inputContext:
                  type: object
                  value: null
                  description: 链式上下文：跨专家编排时由调用方在 JSON 中传入；单专家可省略。常见键（不在 Coze 展开子类型，避免 previousOutput 多态与平台校验冲突）：sourceExpertId 上一环节专家 id；chainId 调用链；previousOutput 为上一专家 result（JSON 对象）或整段序列化字符串。见 design-spec.md §5。
              inputs:
                  type: object
                  value: null
                  description: 本专家业务入参（与 manifest.inputSchema 一致）；上游拼装 LLM 通常只需填充此对象。
                  properties:
                      timeRangeText:
                          type: string
                          value: null
                          description: 用户表达的时间范围，例如昨天、上周、上上周、上月、两个月前、上次、之前、2026-07-11；今天的记录需次日才能查询
                      timeStart:
                          type: string
                          value: null
                          description: 可选，明确开始时间，格式 YYYY-MM-DD 或 YYYY-MM-DD HH:mm:ss，按 Asia/Shanghai 解释
                      timeEnd:
                          type: string
                          value: null
                          description: 可选，明确结束时间，格式 YYYY-MM-DD 或 YYYY-MM-DD HH:mm:ss，按 Asia/Shanghai 解释
                      keywords:
                          type: list
                          items:
                              type: string
                              value: null
                          value: null
                          description: 可选，用户要确认的订单号、问题关键词或客服曾提到的内容
              customerCode:
                  type: string
                  value: null
                  description: 客户编码（租户/账号上下文；审计、日志及可选万邑通调用；可为空）
              customerName:
                  type: string
                  value: null
                  description: 客户名称（租户展示上下文；可为空）
              username:
                  type: string
                  value: null
                  description: 操作者用户名（审计上下文；可为空）
                  required: true
              language:
                  type: string
                  value: null
                  description: 语言/区域偏好（如 zh_CN；可为空）
