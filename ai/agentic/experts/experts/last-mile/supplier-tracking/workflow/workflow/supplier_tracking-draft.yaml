                        ## 德国 DHL - International Paket — 目的国本地查询（文字步骤）

                        1. DHL International Paket 可在 DHL 站点通过 **「shipment tracking in foreign countries」** 跳转至目的国本地查询页。  
                        2. 轨迹中可能同时存在德国段单号与目的国邮政单号；需在目的国页面使用对应单号。  
                        3. 示例（法国 La Poste）：`https://www.laposte.fr/outils/suivre-vos-envois?code=` + 实际单号（勿照抄历史示例单号）。  
                        4. 详细点击路径见仓库 `docs/experts/last-mile/supplier-tracking/carrier-portals/` 配图。

                        ---

                        ## 德国 DHL - International — 目的国站点轨迹查询入口（摘录）

                        - 示例形态：`https://clientesparcel.dhl.es/LiveTracking/ModifyMyShipment/` + 订单片段（以实际为准）；帮助中心入口见 [DHL Parcel ES Customer Service](https://www.dhlparcel.es/en/private-customers/customer-service.html)。  
                        - **热线电话**不在本专家展开，请路由 **carrier-contact** 或内部 SOP。

                        ---

                        ## 美国 DHL - Express Worldwide

                        - 轨迹查询主入口见上表 **US DHL - Express Worldwide** 链接。帮助中心路径见飞书 SOP 截图（仓库 `docs/experts/last-mile/supplier-tracking/carrier-portals/` 配图目录）。

                        ---

                        ## Shipping with Amazon（Amazon Logistics）— 多源对照

                        - **官网（实时）**：https://track.amazon.com/  
                        - **万邑通轨迹平台**（异步，约一日 4 次抓取，可能延迟）：https://track.winit.com.cn/tracking/index.php?s=/Index/result  
                        - **17TRACK**：https://www.17track.net/zh-cn — 承运商选择 **「Amazon Shipping + Amazon MCF」**。

                        ---

                        ## 输出约束（给模型）

                        - **仅可使用**上文已出现的 URL 与域名；组合渠道须按表中顺序说明（如 AU Mix：先 CP 再 Fastway）。  
                        - **勿**编造未在 KB 出现的链接；**勿**向客户口述内部飞书文档名。  
                        - UK P2P 为「无」时不得在 `trackingPortalUrls` 中虚构 URL。


                        ## 分支与 `structured.branch`

                        1. **缺定位线索** → `need_info`；`missingFacts` 列出需补充字段；可建议 **`delivery-status`**。  
                        2. **KB 唯一匹配** → `has_portals`；`trackingPortalUrls` 使用 KB 中 URL。  
                        3. **多行可能命中** → `ambiguous`。  
                        4. **冲突或 KB 未覆盖** → `need_human`。

                        ## 输出格式（仅输出一个 JSON 对象，无围栏外文字）

                        ```json
                        {
                          "analysisResult": {
                            "structured": {
                              "fetchStatus": "fallback_links",
                              "branch": "has_portals | need_info | ambiguous | need_human",
                              "country": "",
                              "matchedProductKey": "",
                              "trackingPortalUrls": [],
                              "selfServiceSteps": "",
                              "suggestedNextExperts": [],
                              "missingFacts": [],
                              "events": [],
                              "parseConfidence": "high | medium | low"
                            },
                            "analysis": "对客完整回复"
                          }
                        }
                        ```

                        ## 自检

                        - `structured.branch` 与 `analysis` 一致。  
                        - `structured.fetchStatus` 为 **`fallback_links`**。  
                        - `trackingPortalUrls` 每条可在 **kbMd** 溯源。  
                        - `events` 为 **`[]`**。  
                        - 若意图为查件进度/提交查件，`suggestedNextExperts` 含 `tracking-inquiry`，`analysis` 中引导而非代为处理。
