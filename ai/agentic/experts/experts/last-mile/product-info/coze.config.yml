# 尾程产品信息获取 — Coze 工作流包导出
# 导出：npm run export:coze -- experts/last-mile/product-info
# KB 通过 textNode 注入 load-product-knowledge 代码节点，由其按 kbScope 选择性输出

yamlBasename: product_info-draft.yaml
packageMainName: product_info
packageDescription: 尾程产品信息获取（validate → load-knowledge → LLM → format）

# ── textNodes：KB 索引 + 国家详情 + examples ────────────────────
textNodes:
  # 索引层（3 个）
  - logicalId: kb-psc-index
    title: kb-psc-index
    insertAfter: validate-input
    sourceFile: prompts/kb-psc.md
  - logicalId: kb-wf-index
    title: kb-wf-index
    insertAfter: validate-input
    sourceFile: prompts/kb-wf.md
  - logicalId: kb-pallet-index
    title: kb-pallet-index
    insertAfter: validate-input
    sourceFile: prompts/kb-pallet.md

  # PSC 国家详情（5 个）
  - logicalId: kb-psc-us
    title: kb-psc-us
    insertAfter: validate-input
    sourceFile: prompts/kb-psc-us.md
  - logicalId: kb-psc-uk
    title: kb-psc-uk
    insertAfter: validate-input
    sourceFile: prompts/kb-psc-uk.md
  - logicalId: kb-psc-de
    title: kb-psc-de
    insertAfter: validate-input
    sourceFile: prompts/kb-psc-de.md
  - logicalId: kb-psc-au
    title: kb-psc-au
    insertAfter: validate-input
    sourceFile: prompts/kb-psc-au.md
  - logicalId: kb-psc-ca
    title: kb-psc-ca
    insertAfter: validate-input
    sourceFile: prompts/kb-psc-ca.md

  # WF 国家详情（4 个）
  - logicalId: kb-wf-us
    title: kb-wf-us
    insertAfter: validate-input
    sourceFile: prompts/kb-wf-us.md
  - logicalId: kb-wf-uk
    title: kb-wf-uk
    insertAfter: validate-input
    sourceFile: prompts/kb-wf-uk.md
  - logicalId: kb-wf-de
    title: kb-wf-de
    insertAfter: validate-input
    sourceFile: prompts/kb-wf-de.md
  - logicalId: kb-wf-au
    title: kb-wf-au
    insertAfter: validate-input
    sourceFile: prompts/kb-wf-au.md

  # Pallet 国家详情（2 个）
  - logicalId: kb-pallet-us
    title: kb-pallet-us
    insertAfter: validate-input
    sourceFile: prompts/kb-pallet-us.md
  - logicalId: kb-pallet-de
    title: kb-pallet-de
    insertAfter: validate-input
    sourceFile: prompts/kb-pallet-de.md

  # Few-shot examples
  - logicalId: examples-text
    title: examples
    insertAfter: load-product-knowledge
    sourceFile: prompts/examples.md

# ── inputBindings ──────────────────────────────────────────────
inputBindings:
  # 15 个 KB textNode → load-product-knowledge
  load-product-knowledge:
    kbPscIndex:
      ref: kb-psc-index
      path: output
    kbWfIndex:
      ref: kb-wf-index
      path: output
    kbPalletIndex:
      ref: kb-pallet-index
      path: output
    kbPscUs:
      ref: kb-psc-us
      path: output
    kbPscUk:
      ref: kb-psc-uk
      path: output
    kbPscDe:
      ref: kb-psc-de
      path: output
    kbPscAu:
      ref: kb-psc-au
      path: output
    kbPscCa:
      ref: kb-psc-ca
      path: output
    kbWfUs:
      ref: kb-wf-us
      path: output
    kbWfUk:
      ref: kb-wf-uk
      path: output
    kbWfDe:
      ref: kb-wf-de
      path: output
    kbWfAu:
      ref: kb-wf-au
      path: output
    kbPalletUs:
      ref: kb-pallet-us
      path: output
    kbPalletDe:
      ref: kb-pallet-de
      path: output

  # examples textNode → llm-analyze
  llm-analyze:
    examplesMd:
      ref: examples-text
      path: output

# ── endOutputs ─────────────────────────────────────────────────
# §7.3 固定三个字段：structured、analysis、outputContext
endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext

# ── positions ──────────────────────────────────────────────────
positions:
  __start__:
    x: -150
    y: 230
  __end__:
    x: 1350
    y: 310
  validate-input:
    x: 200
    y: 310
  load-product-knowledge:
    x: 650
    y: 310
  examples-text:
    x: 650
    y: 550
  llm-analyze:
    x: 950
    y: 310
  format-output:
    x: 1150
    y: 310
