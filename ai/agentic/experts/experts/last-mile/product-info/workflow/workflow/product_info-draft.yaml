                        ## 一、德国（DE）— DB SCHENKER Standard Delivery（托盘）

                        ### 1.1 产品规格

                        | 属性 | 说明 |
                        |------|------|
                        | 产品名称 | DB SCHENKER - Standard Delivery (2-8 Business Days) |
                        | 支持发货仓 | DEBR / DEBR2 |
                        | 截单时间 | 当地14点 |
                        | 托盘尺寸 | 标准欧托：1.2m × 0.8m × 0.17m（长×宽×托高） |
                        | 托盘限高 | 托盘高≤2m（含托高度），不允许超托 |
                        | 重量限制 | 无限制（按重量分段计费） |
                        | 配送范围 | 欧盟内 + 欧盟外部分国家 |
                        | 预计物流时效 | 德国：2个工作日；德国除外：2-5个工作日 |
                        | 支持包裹追踪 | √ |
                        | 支持离岸岛屿 | √ |
                        | 支持亚马逊地址 | √ |
                        | 支持Packstation自提柜 | × |
                        | 赔付：超时无上网 | √ |
                        | 赔付：未妥投丢失 | √ |
                        | 赔付：破损 | √ |
                        | 赔付：妥投未收到 | √ |
                        | 增值：仓储增值 | √ |
                        | 增值：尾程签名服务 | 官网可下载 POD，无需额外购买 |
                        | 支持售卖平台 | - |

                        ### 1.2 下单产品与计费标准

                        | 下单产品 | 托盘规格 | 德国最低收费重量 | 德国除外最低收费重量 | 备注 |
                        |---------|---------|----------------|-------------------|------|
                        | DB SCHENKER - Standard Delivery(2-8 Business Days)-1/4托-DE | 1/4托 0.6×0.4m | 50kg | 50kg | 需联系销售经理提供预估货量及申请开通权限 |
                        | DB SCHENKER - Standard Delivery(2-8 Business Days)-1/2托-DE | 1/2托 0.6×0.8m | 50kg | 50kg | 需联系销售经理提供预估货量及申请开通权限 |
                        | DB SCHENKER - Standard Delivery(2-8 Business Days)-DE | 标准欧托 1.2×0.8m | 150kg | 150kg | 默认标准欧托 |

                        **计费重计算规则**：取实重、体积重、托盘最低收费重量的最大值。
                        - 体积重 = 长(m) × 宽(m) × 高(m) × 200 kg/m³
                        - 每CBM最低收费：德国 150kg，德国除外 200kg

                        > **举例**：订单总共2个托盘：托盘1重量=135kg(含托盘重量)，长×宽×高=1.2m×0.8m×2m(含托高度)，托盘2重量=350kg，长×宽×高=1.2m×0.8m×1.5m。托盘1计费重=Max(实重135, 体积重1.2×0.8×2×200, 托盘最低收费150)=384kg；托盘2计费重=Max(实重350, 体积重1.2×0.8×1.5×200, 托盘最低收费150)=350kg；订单计费重=384+350=734kg。

                        ### 1.3 电池政策

                        | 电池类型 | 支持情况 | 备注 |
                        |---------|---------|------|
                        | 内置电池 | √ | 功率≤100wh或锂含量≤2g |
                        | 配套电池 | √ | 功率≤100wh或锂含量≤2g |
                        | 纯电池 | √ | 功率≤100wh或锂含量≤2g |

                        - 危险品手续费 Class 9：支持运输要求的大功率锂电池货物，需收取危险品附加费，收费标准参考《WINIT海外仓锂离子电池DG价格表》。

                        ### 1.4 附加费说明

                        #### 1.4.1 基础附加费

                        | 附加费名称 | 说明 |
                        |-----------|------|
                        | 燃油附加费 | 燃油附加费金额=尾程派送运费×燃油附加费费率，费率以DB SCHENKER官网价格公布为准 |
                        | 打托费 | 按照实际打托情况收取，收费标准见库内增值服务 |
                        | 道路附加费-TOLL | 供应商每单收取，收费标准=运费×13% |
                        | 二次派送费-Redelivery | 最低收费35 EUR/票，最高收费190 EUR/票，线下补收 |
                        | 派送失败退货费 | 退货费用与发货费用相同 |

                        #### 1.4.2 城市派送附加费

                        针对派送去往下列城市/邮编的订单，供应商收取城市派送附加费，收费标准 10 EUR/票：

                        | 国家-城市 | 邮编 |
                        |----------|------|
                        | DE-Berlin | 101xx, 102xx, 104xx, 109xx, 110xx, 14057-14059 |
                        | DE-Frankfurt/M | 6031x, 6032x, 6059x |
                        | DE-Hamburg | 200xx, 201xx, 203xx, 204xx, 227xx |
                        | DE-Cologne | 506xx |
                        | DE-Munich | 8033x, 8079x, 8080x, 816xx |
                        | DE-Stuttgart | 701xx, 75, 77-78, 91-95 |
                        | FR-Paris | 12101-12103, 1215x, 1216x |

                        #### 1.4.3 超长超高附加费

                        触发以下条件将收取50 EUR/票：
                        - **Overheight**：货物高度在2.30m-2.40m之间
                        - **Long goods**：
                          - 毛重≤30kg：长度>2.40m且≤6.00m（最大宽0.40m×高0.40m），限单人搬运，每票最多10件
                          - 毛重>30kg：长度>2.40m且≤3.00m（最大宽1.20m×高2.20m），需工业车辆可从底部两侧接近

                        #### 1.4.4 协助预约派送/指定日期派送费（Fix Day）

                        需供应商协助预约收件方派送时间（电话或邮箱）或下单时提前指定日期派送，供应商将收取费用：

                        | 订单计费重 | 指定日期派送(EUR) | 指定日期+13点前(EUR) | 指定日期+10点前(EUR) | 预约派送时间-电话(EUR) |
                        |-----------|------------------|---------------------|---------------------|---------------------|
                        | ≤300kg | 30 | 44 | 61 | 39 |
                        | ≤500kg | 35 | 62 | 77 | 45 |
                        | ≤1000kg | 47 | 77 | 110 | 55 |
                        | ≤1500kg | 71 | 99 | 143 | 77 |
                        | ≤2500kg | 95 | 143 | 177 | 99 |

                        #### 1.4.5 快捷派送 Premium

                        选择 Premium 服务时供应商承诺派送日期：

                        | 订单计费重 | Premium(EUR) | Premium+13点前(EUR) | Premium+10点前(EUR) |
                        |-----------|-------------|--------------------|--------------------|
                        | ≤300kg | 30 | 44 | 61 |
                        | ≤500kg | 35 | 62 | 77 |
                        | ≤1000kg | 47 | 77 | 110 |
                        | ≤1500kg | 71 | 99 | 143 |
                        | ≤2500kg | 95 | 143 | 177 |

                        ### 1.5 报关服务

                        | 服务 | 费用 | 说明 |
                        |------|------|------|
                        | 出口报关服务费 | 150 EUR/份报关单 | 仅含5个基础HS CODE，超出每个加收7 EUR |
                        | 进口清关服务费 | 80 EUR/份报关单 | 仅含3个基础HS CODE，超出每个加收8 EUR |
                        | 资料要求 | - | 商业发票/装箱单/POA（提前签署报关委托协议） |

                        ### 1.6 保险

                        - 如购买物流保险，按投保金额赔付
                        - 如未购买物流保险，最高赔付3500 EUR/单
                        - 保险费按投保金额阶梯计费

                        ### 1.7 其他说明

                        1. **电话必填**：此服务要求必填正确的收件人电话，如因电话不正确或者未填写电话产生的异常费用，将向客户补收。
                        2. **亚马逊地址**：支持发 Amazon FBA 地址，如发往亚马逊或其它收件方要求预约 Time Slot 的地址将每单加收15 EUR预约派送费。如果收件地址是亚马逊仓库，必须在下单收件人类型选择亚马逊或在地址信息上有Amazon字眼，否则可能导致异常退回。
                        3. **住宅地址**：此服务报价仅支持派送到商业地址，如派送住宅地址将产生额外附加费40 EUR/单，实报实销向客户补收。
                        4. **罗马尼亚流向**：发往罗马尼亚的订单重量超500kg或货值超过2000欧需要提供 UIT 编号，否则将清关失败导致退回。
                        5. **塞浦路斯流向**：发往塞浦路斯的订单如收件人为公司地址，则需要公司的 VAT number；如收件人为私人地址，则需要提供收件人的身份证照片，否则将派送失败导致退回。
                        6. **订单超5托**：需收件方现场具备自卸货能力（必须配有叉车或卸货垛口），否则需拆单每5托一单发货。因收件方现场不具备自卸货能力导致的额外费用实报实销补收。
                        7. **特殊地址**：发往 fairs, harbours and islands 需单独询价额外收费。
                        8. **送货上楼**：供应商标准服务是送货到1楼，如要求送货上楼请买家与送货司机自行协商。
                        9. **马耳他/塞浦路斯**：需要单独询价，请联系客服咨询。
                        10. **非欧盟国家**：请使用 DB SCHENKER 线下打单产品（DB SCHENKER - Standard Delivery (2-8 Business Days)-Invoice-DE），请联系客服提供相关清关资料。
                        11. **订单限制**：每个订单最多不能超过25个托盘，如超过需分开下单。
                        12. **扣费时间**：出库单状态="派送中"时扣费。
                        13. **不可派送邮编（岛屿）**：26757, 26571, 26548, 26579, 26465, 26474, 26486, 18565, 25845, 25849, 25859, 25863, 25869, 25938, 25946, 25980, 25992, 25996, 25997, 25999, 27498。
              - name: arrayItemConcatChar
