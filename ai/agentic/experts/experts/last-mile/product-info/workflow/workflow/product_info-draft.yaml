                                  "weightLimit": "按订单实际重量计费，不足0.5KG按0.5KG",
                                  "dimensionLimit": "托盘长×宽=1.2m×0.8m（标准欧托）",
                                  "deliveryTime": "3-7个工作日妥投"
                                }
                              ],
                              "confidence": "high"
