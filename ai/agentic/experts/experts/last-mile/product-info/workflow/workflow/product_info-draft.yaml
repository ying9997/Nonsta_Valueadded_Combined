                    value:
                        path: output
                        ref_node: "163003"
              - name: kbPscUs
                input:
                    value:
                        path: output
                        ref_node: "163004"
              - name: kbPscUk
                input:
                    value:
                        path: output
                        ref_node: "163005"
              - name: kbPscDe
                input:
                    value:
                        path: output
                        ref_node: "163006"
              - name: kbPscAu
                input:
                    value:
                        path: output
                        ref_node: "163007"
              - name: kbPscCa
                input:
                    value:
                        path: output
                        ref_node: "163008"
              - name: kbWfUs
                input:
                    value:
                        path: output
                        ref_node: "163009"
              - name: kbWfUk
                input:
                    value:
                        path: output
                        ref_node: "163010"
              - name: kbWfDe
                input:
                    value:
                        path: output
                        ref_node: "163011"
              - name: kbWfAu
                input:
                    value:
                        path: output
                        ref_node: "163012"
              - name: kbPalletUs
                input:
                    value:
                        path: output
                        ref_node: "163013"
              - name: kbPalletDe
                input:
                    value:
                        path: output
                        ref_node: "163014"
          node_outputs:
              kbContent:
                  type: string
                  value: null
              kbScope:
                  type: string
                  value: null
              countryResolved:
                  type: string
                  value: null
              productLine:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163016"
      type: text
      title: examples
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 650
          y: 550
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        ## 示例 1：精确产品名匹配（托盘产品）

                        **用户问**：FedEx Freight Economy-US 可以发带电商品吗

                        **输出**：
