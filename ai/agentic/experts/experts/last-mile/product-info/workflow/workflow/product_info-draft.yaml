                        ## 一、美国（US）— FedEx Freight Economy

                        ### 1.1 产品规格

                        | 属性 | 说明 |
                        |------|------|
                        | 产品名称 | FedEx Freight Economy-US (3-7 business days) |
                        | 支持发货仓 | USKY3 / USKY5 / USWC / USWC2 / USWC5 / USTX / USNJ2 / USGA |
                        | 计费标准 | 按订单实际重量计费，不足0.5KG按0.5KG计算。订单重量=托盘总重量之和（托盘重量+商品重量+包材重量） |
                        | 配送范围 | 美国本土48州（商业地址、住宅地址） |
                        | 预计物流时效 | 3-7个工作日妥投 |
                        | 支持包裹追踪 | √ |
                        | 带电限制 | 支持功率≤100wh内置/外置电池；不支持纯电产品；不支持危险品 |
                        | 支持FBA地址 | × |
                        | 支持离岸地址 | ×（不支持 PR/AK/HI/GU/AA/AE/AP） |
                        | 支持军事地址 | ×（不支持 APO/FPO/DPO） |
                        | 赔付：超时无上网 | √ |
                        | 赔付：未妥投丢失 | √ |
                        | 赔付：破损 | √ |
                        | 增值：仓储增值 | √ |
                        | 支持售卖平台 | - |

                        ### 1.2 地址限制

                        1. **不支持 FBA 地址**：此服务不支持发往 Amazon FBA 地址。
                        2. **不支持离岸地址**：PR/AK/HI/GU/AA/AE/AP。
                        3. **不支持军事地址**：APO/FPO/DPO。
                        4. **不支持特殊地址**：教堂/礼拜场所、学校、建筑工地、展会/正在举行活动的场所、监狱/看守所、军事地址、矿场、发电站、机场，或需要邀请函/入场码等地址。如派送此类地址将加收附加费并按 FedEx Freight 公开价 A-I 分区补收运费差额。
                        5. **不支持码头/海湾地址**：具体不可派送邮编包括 58718-58856、60611、78851、79511、79701-79789、79830-79854、88231、88252、98013、98070、98222-98297 等。

                        ### 1.3 附加费说明

                        | 附加费名称 | 收费标准 | 计费单位 | 叠加燃油 | 触发条件 |
                        |-----------|---------|---------|---------|---------|
                        | 燃油附加费 | 每周更新，燃油附加费金额=(尾程派送运费+其他附加费)×燃油附加费费率 | 订单 | - | 默认收取，费率参考 FedEx 官网 |
                        | 住宅地址派送费 | 243 USD | 订单 | 是 | 收件人地址不属于商业地址时 |
                        | 偏远地区附加费 | ZONE1: 32 USD / ZONE2: 64 USD / ZONE3: 102 USD / ZONE4: 318 USD | 订单 | 是 | 收件地址属于偏远地区 |
                        | 地区附加费（California Compliance） | 24 USD | 订单 | 是 | 发货仓在美西仓或收件人州属于加利福尼亚州 |
                        | 特殊地址派送费 | 219 USD + 按公开价 A-I 分区补收运费差额 | 订单 | 是 | 收件地址属于教堂/学校/建筑工地/展会/监狱/军事地址/矿场/发电站/机场等 |
                        | 包裹复核费 | 40 USD + 补收运费差额 | 订单 | 是 | FedEx 复测重量与订单重量差值超50LB（22.68KG） |
                        | 尾板费 | 最低207 USD，最高681 USD | 订单 | 是 | 收件方卸货需要尾板操作 |
                        | 派送失败退货费 | 与正向运费一致 | 订单 | 是 | 派送失败退回万邑通海外仓 |

                        ### 1.4 超长附加费

                        | 托盘长度 | 附加费(USD) | 叠加燃油 |
                        |---------|------------|---------|
                        | >243.84cm（8 feet）且≤365.76cm（12 feet） | 375 | 是 |
                        | >365.76cm（12 feet）且≤457.2cm（15 feet） | 775 | 是 |
                        | >457.2cm（15 feet）且≤548.64cm（18 feet） | 982 | 是 |
                        | >548.64cm（18 feet）且≤609.6cm（20 feet） | 1234 | 是 |
                        | >609.6cm（20 feet） | 1514 | 是 |

                        ### 1.5 其他说明

                        1. **电话必填**：此服务要求必填正确的收件人电话，如因电话不正确或者未填写电话产生的异常费用，将向客户补收。
                        2. **下单限制**：每个订单的托盘数量不得超过7托。如需超出此限制，需单独线下询价。
                        3. **扣费时间**：出库单状态="派送中"时扣费。
                        4. **补收周期**：
                           - 出库当月为M0，Winit有权针对M6内的派送失败退货费发起费用核算和退补，除派送失败退货费外的其他费用在M3内发起核算和退补。
                           - 所有正向费用申诉周期为3个月，即扣费当月为M0，客户有权在M3内针对M0扣费的订单有异议的正向费用发起核算与退费申诉。
                        5. **其他附加费**：若派送过程中产生其它附加费如重派费、等待费、滞仓费、暂存费、改址费、二次派送费等，Winit 将根据 FedEx Freight 官网公开价向客户线下补收。
