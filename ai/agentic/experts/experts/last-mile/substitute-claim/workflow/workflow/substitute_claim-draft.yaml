                        ## 5.1 OpenAPI 列表字段枚举（`afs.customer.compensate.pageList`）

                        万邑联「全部代客索赔」列表接口返回行中的 **`compensateStatus`**、**`compensateType`** 可取下列枚举（与专家 [`design.md` §6](../design.md) 一致）。对客话术可结合 **中文含义** 解释进度；**原始枚举码**仍以事实节点 / `rawRecord` 为准，勿编造未列出的状态。

                        ### compensateStatus（代客索赔状态）

                        | 值 | 含义 |
                        |------|------|
                        | DRAFT | 草稿 |
                        | SUBMITTED | 已提交 |
                        | SUPPLIER_TO_SUBMITTED | 待提交供应商 |
                        | SUBMITTED_SUPPLIER | 已提交供应商 |
                        | SU_CONFIRMS_COMPENSATE | 供应商确认赔付 |
                        | CLAIM_REJECTION_PENDING | 拒赔待确认 |
                        | PENDING_PAYMENT | 待回款 |
                        | RECEIVED_PAYMENT | 已回款 |
                        | REPUDIATION_OF_CLAIMS | 拒绝赔付 |
                        | ALREADY_RECEIVED | 已赔付客户 |
                        | FINISH | 已完成 |
                        | SUBMISSION_FAILED | 提交失败 |

                        ### compensateType（代客索赔类型）

                        | 值 | 含义 |
                        |------|------|
                        | LS | 丢失 |
                        | BK | 破损 |
                        | PLS | 部分妥投 |
                        | NR | 妥投未收到 |
                        | SCM | 供应商多收费用 |

