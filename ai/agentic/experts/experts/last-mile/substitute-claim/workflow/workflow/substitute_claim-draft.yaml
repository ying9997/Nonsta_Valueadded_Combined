    - id: "166002"
      type: code
      title: build-compensate-list-data
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 360
          y: 80
      parameters:
          code: |-
              /**
               * 节点：为万邑通 OpenAPI `afs.customer.compensate.pageList` 拼装请求体 JSON 字符串。
               * 置于 openapi 插件上游；**不作为**专家调用边界顶层字段。
               *
               * 【输入】branch、trackingIds、outboundOrderNos、claimIds
               * 【输出】winitRequestData：JSON.stringify(payload)；非 query 分支为空串
               */

              function joinCsv(arr: string[]): string {
                return arr.filter(Boolean).join(",");
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const branch = String(params.branch ?? "").trim();
                if (branch !== "query") {
                  return { winitRequestData: "" };
                }

                const trackingIds = Array.isArray(params.trackingIds)
                  ? (params.trackingIds as unknown[]).map((x) => String(x ?? "").trim()).filter(Boolean)
                  : [];
                const outboundOrderNos = Array.isArray(params.outboundOrderNos)
                  ? (params.outboundOrderNos as unknown[]).map((x) => String(x ?? "").trim()).filter(Boolean)
                  : [];
                const claimIds = Array.isArray(params.claimIds)
                  ? (params.claimIds as unknown[]).map((x) => String(x ?? "").trim()).filter(Boolean)
                  : [];

                const payload = {
                  pageVo: { page: 1, pageSize: 20 },
                  source: "CUSTOMER",
                  compensateStatus: "",
                  compensateApplyNos: joinCsv(claimIds),
                  businessNos: joinCsv(outboundOrderNos),
                  trackingNos: joinCsv(trackingIds),
                  warehouseCodes: "",
                  deliveryMethods: "",
                  applyStartDate: "",
                  applyEndDate: "",
                  acceptStartDate: "",
                  acceptEndDate: "",
                  claimEndStartDate: "",
                  claimEndEndDate: "",
                  isHaveToSupMaterial: "",
                };

                return { winitRequestData: JSON.stringify(payload) };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("build-compensate-list-data")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e);
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: branch
                input:
                    type: string
                    value:
                        path: branch
                        ref_node: "166000"
              - name: trackingIds
                input:
                    type: list
                    items:
                        type: string
                        value: null
                    value:
                        path: trackingIds
                        ref_node: "166000"
              - name: outboundOrderNos
                input:
                    type: list
                    items:
                        type: string
                        value: null
                    value:
                        path: outboundOrderNos
                        ref_node: "166000"
              - name: claimIds
                input:
                    type: list
                    items:
                        type: string
                        value: null
                    value:
                        path: claimIds
                        ref_node: "166000"
          node_outputs:
              winitRequestData:
                  type: string
                  value: null
                  description: JSON.stringify 后的 afs.customer.compensate.pageList 请求体
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
