yamlBasename: shipping_label-draft.yaml
packageMainName: shipping_label
packageDescription: 尾程面单查询（订单标识定位 → 脱敏面单批量查询 → 确定性输出）
icon: plugin_icon/workflow.png

endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext

winitOpenapiPlugins:
  - insertBefore: merge-order-resolution
    logicalId: winit_shipping_label_resolution_batch
    pluginBatch:
      enabled: true
      batchSize: 20
      concurrentSize: 10
      actionsFrom:
        logicalId: build-order-resolution-actions
        path: actions
  - insertBefore: merge-label-results
    logicalId: winit_shipping_label_fetch_batch
    pluginBatch:
      enabled: true
      batchSize: 20
      concurrentSize: 10
      actionsFrom:
        logicalId: build-label-actions
        path: actions

nodeIds:
  validate-input: "176010"
  build-order-resolution-actions: "176011"
  winit_shipping_label_resolution_batch: "176012"
  merge-order-resolution: "176013"
  build-label-actions: "176014"
  winit_shipping_label_fetch_batch: "176015"
  merge-label-results: "176016"
  format-output: "176017"

inputBindings:
  build-order-resolution-actions:
    valid:
      ref: validate-input
      path: valid
    orderIdentifiers:
      ref: validate-input
      path: orderIdentifiers
  merge-order-resolution:
    requestedIdentifiers:
      ref: build-order-resolution-actions
      path: requestedIdentifiers
    directOrders:
      ref: build-order-resolution-actions
      path: directOrders
    actionPlans:
      ref: build-order-resolution-actions
      path: actionPlans
    resolutionPluginOutputList:
      ref: winit_shipping_label_resolution_batch
      path: outputList
  build-label-actions:
    valid:
      ref: validate-input
      path: valid
    customerCode:
      ref: validate-input
      path: customerCode
    resolution:
      ref: merge-order-resolution
      path: resolution
  merge-label-results:
    resolution:
      ref: merge-order-resolution
      path: resolution
    actionPlans:
      ref: build-label-actions
      path: actionPlans
    labelPluginOutputList:
      ref: winit_shipping_label_fetch_batch
      path: outputList
  format-output:
    valid:
      ref: validate-input
      path: valid
    errorCode:
      ref: validate-input
      path: errorCode
    errorMessage:
      ref: validate-input
      path: errorMessage
    requestedIdentifiers:
      ref: validate-input
      path: requestedIdentifiers
    resolution:
      ref: merge-order-resolution
      path: resolution
    orderResults:
      ref: merge-label-results
      path: orderResults
    unresolvedIdentifiers:
      ref: merge-label-results
      path: unresolvedIdentifiers
    inputContext:
      ref: __start__
      path: inputContext

positions:
  __start__: { x: -160, y: 260 }
  validate-input: { x: 40, y: 260 }
  build-order-resolution-actions: { x: 260, y: 180 }
  winit_shipping_label_resolution_batch: { x: 500, y: 180 }
  merge-order-resolution: { x: 740, y: 180 }
  build-label-actions: { x: 960, y: 180 }
  winit_shipping_label_fetch_batch: { x: 1180, y: 180 }
  merge-label-results: { x: 1400, y: 180 }
  format-output: { x: 1620, y: 260 }
  __end__: { x: 1840, y: 260 }

