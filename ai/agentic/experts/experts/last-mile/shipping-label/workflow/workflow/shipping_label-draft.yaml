    - id: "176010"
      type: code
      title: validate-input
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 40
          y: 260
      parameters:
          code: |-
              /** 校验并规范化尾程面单查询输入。 */

              const SHIPPING_LABEL_MAX_INPUTS = 10;

              function shippingLabelStringList(raw: unknown): string[] {
                const values = Array.isArray(raw) ? raw : raw == null ? [] : [raw];
                const seen = new Set<string>();
                const out: string[] = [];
                for (const value of values) {
                  const normalized = String(value ?? "").trim();
                  if (!normalized || seen.has(normalized)) continue;
                  seen.add(normalized);
                  out.push(normalized);
                }
                return out;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const rawIdentifierValues = Array.isArray(params.orderIdentifiers)
                  ? params.orderIdentifiers as unknown[]
                  : params.orderIdentifiers == null
                    ? []
                    : [params.orderIdentifiers];
                const rawIdentifierCount = rawIdentifierValues.filter((value) => String(value ?? "").trim()).length;
                const orderIdentifiers = shippingLabelStringList(params.orderIdentifiers);
                const customerCode = String(params.customerCode ?? "").trim();
                const username = String(params.username ?? "").trim();

                let valid = true;
                let errorCode = "";
                let errorMessage = "";

                if (orderIdentifiers.length === 0) {
                  valid = false;
                  errorCode = "need_input";
                  errorMessage = "请提供出库单号、包裹号、trackingNo 或卖家订单号。";
                } else if (rawIdentifierCount > SHIPPING_LABEL_MAX_INPUTS) {
                  valid = false;
                  errorCode = "too_many_inputs";
                  errorMessage = `单次最多查询 ${SHIPPING_LABEL_MAX_INPUTS} 个标识，请分批提交。`;
                } else if (!customerCode || !username) {
                  valid = false;
                  errorCode = "missing_account_context";
                  errorMessage = "当前登录信息不完整，无法确认订单归属；请重新登录后再查询。";
                }

                return {
                  valid,
                  errorCode,
                  errorMessage,
                  orderIdentifiers,
                  requestedIdentifiers: orderIdentifiers,
                  customerCode,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("validate-input")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((result) => process.stdout.write(JSON.stringify(result)));
              }
          language: 5
          node_inputs:
              - name: orderIdentifiers
                input:
                    value:
                        path: inputs.orderIdentifiers
                        ref_node: "100001"
              - name: customerCode
                input:
                    value:
                        path: customerCode
                        ref_node: "100001"
              - name: username
                input:
                    value:
                        path: username
                        ref_node: "100001"
          node_outputs:
              valid:
                  type: boolean
                  value: null
              errorCode:
                  type: string
                  value: null
              errorMessage:
                  type: string
                  value: null
              orderIdentifiers:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              requestedIdentifiers:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              customerCode:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "176011"
      type: code
      title: build-order-resolution-actions
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 260
          y: 180
      parameters:
          code: |-
              /** 为非 WO 标识生成 trackingNo + sellerOrderNo 批处理查询。 */

              type ResolutionPlan = {
                inputIdentifier: string;
                queryBy: "trackingNo" | "sellerOrderNo";
              };

              function shippingLabelNormalizeWo(raw: string): string {
                const value = raw.trim();
                const match = /^WO(\d+)[A-Za-z]*$/i.exec(value);
                return match ? `WO${match[1]}` : "";
              }

              function shippingLabelDateRange(): { start: string; end: string } {
                const end = new Date();
                const start = new Date(end);
                start.setUTCFullYear(start.getUTCFullYear() - 1);
                return { start: start.toISOString().slice(0, 10), end: end.toISOString().slice(0, 10) };
              }

              function shippingLabelResolutionData(plan: ResolutionPlan): Record<string, string> {
                const range = shippingLabelDateRange();
                const data: Record<string, string> = {
                  dateOrderedStartDate: range.start,
                  dateOrderedEndDate: range.end,
                  pageSize: "50",
                  pageNum: "1",
                };
                data[plan.queryBy] = plan.inputIdentifier;
                return data;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const valid = params.valid === true;
                const requestedIdentifiers = Array.isArray(params.orderIdentifiers)
                  ? (params.orderIdentifiers as unknown[]).map((value) => String(value).trim()).filter(Boolean)
                  : [];

                const directOrders: Array<{ inputIdentifier: string; orderNo: string }> = [];
                const actionPlans: ResolutionPlan[] = [];

                if (valid) {
                  for (const inputIdentifier of requestedIdentifiers) {
                    const orderNo = shippingLabelNormalizeWo(inputIdentifier);
                    if (orderNo) {
                      directOrders.push({ inputIdentifier, orderNo });
                      continue;
                    }
                    actionPlans.push({ inputIdentifier, queryBy: "trackingNo" });
                    actionPlans.push({ inputIdentifier, queryBy: "sellerOrderNo" });
                  }
                }

                const actions = actionPlans.map((plan) => ({
                  action: "queryOutboundOrderList",
                  data: JSON.stringify(shippingLabelResolutionData(plan)),
                }));

                return {
                  requestedIdentifiers,
                  directOrders,
                  actions,
                  actionPlans,
                  resolutionPluginBatchActionsCount: actions.length,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("build-order-resolution-actions")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((result) => process.stdout.write(JSON.stringify(result)));
              }
          language: 5
          node_inputs:
              - name: valid
                input:
                    value:
                        path: valid
                        ref_node: "176010"
              - name: orderIdentifiers
                input:
                    value:
                        path: orderIdentifiers
                        ref_node: "176010"
          node_outputs:
              requestedIdentifiers:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              directOrders:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              actionPlans:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
                  description: 输入标识及查询字段映射
              resolutionPluginBatchActionsCount:
                  type: integer
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
