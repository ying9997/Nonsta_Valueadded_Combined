# 尾程产品推荐咨询 — Coze 工作流包导出
# 导出：npm run export:coze -- experts/last-mile/product-consult
# KB 通过 textNode 注入 load-knowledge 代码节点，由其按 kbScope 选择性输出

yamlBasename: product_consult-draft.yaml
packageMainName: product_consult
packageDescription: 尾程产品推荐咨询（validate → load-knowledge → LLM → format）

# ── textNodes：5 个国家详情 + examples ──────────────────────────
textNodes:
  - logicalId: kb-delivery-us
    title: kb-delivery-us
    insertAfter: validate-input
    sourceFile: prompts/kb-delivery-us.md
  - logicalId: kb-delivery-uk
    title: kb-delivery-uk
    insertAfter: validate-input
    sourceFile: prompts/kb-delivery-uk.md
  - logicalId: kb-delivery-de
    title: kb-delivery-de
    insertAfter: validate-input
    sourceFile: prompts/kb-delivery-de.md
  - logicalId: kb-delivery-au
    title: kb-delivery-au
    insertAfter: validate-input
    sourceFile: prompts/kb-delivery-au.md
  - logicalId: kb-delivery-ca
    title: kb-delivery-ca
    insertAfter: validate-input
    sourceFile: prompts/kb-delivery-ca.md

  # Few-shot examples
  - logicalId: examples-text
    title: examples
    insertAfter: load-knowledge
    sourceFile: prompts/examples.md

# ── inputBindings ──────────────────────────────────────────────
inputBindings:
  # 5 个 KB textNode → load-knowledge
  load-knowledge:
    kbDeliveryUs:
      ref: kb-delivery-us
      path: output
    kbDeliveryUk:
      ref: kb-delivery-uk
      path: output
    kbDeliveryDe:
      ref: kb-delivery-de
      path: output
    kbDeliveryAu:
      ref: kb-delivery-au
      path: output
    kbDeliveryCa:
      ref: kb-delivery-ca
      path: output

  # examples textNode → llm-analyze
  llm-analyze:
    examplesMd:
      ref: examples-text
      path: output

# ── endOutputs ─────────────────────────────────────────────────
endOutputs:
  structured:
    ref: format-output
    path: structured
  analysis:
    ref: format-output
    path: analysis
  outputContext:
    ref: format-output
    path: outputContext
  enrichedContext:
    ref: format-output
    path: enrichedContext

# ── positions ──────────────────────────────────────────────────
positions:
  __start__:
    x: -150
    y: 230
  __end__:
    x: 1350
    y: 310
  validate-input:
    x: 200
    y: 310
  load-knowledge:
    x: 650
    y: 310
  examples-text:
    x: 650
    y: 550
  llm-analyze:
    x: 950
    y: 310
  format-output:
    x: 1150
    y: 310
