                    value:
                        path: inputs.enrichedContext
                        ref_node: "100001"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "100001"
          node_outputs:
              valid:
                  type: boolean
                  value: null
              error:
                  type: string
                  value: null
              countryResolved:
                  type: string
                  value: null
              countrySource:
                  type: string
                  value: null
              goodsInfo:
                  type: object
                  value: null
              kbScope:
                  type: string
                  value: null
              enrichedContext:
                  type: object
                  value: null
              inputContext:
                  type: object
                  value: null
