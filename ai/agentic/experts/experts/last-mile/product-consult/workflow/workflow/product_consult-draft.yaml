      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # US 尾程产品推荐详情

                        ---

                        ## 一、货型定义参考

                        | 件型 | 长(cm) | 宽(cm) | 高(cm) | 重量(kg) | 体积(m³) |
                        |------|--------|--------|--------|----------|----------|
                        | 小件 | ≤50 | ≤40 | ≤13 | ≤3 | ≤0.01 |
                        | 中件 | ≤70 | ≤40 | ≤25 | ≤10 | ≤0.07 |
                        | 大件 | ≤120 | ≤100 | ≤80 | ≤31.5 | ≤0.96 |
                        | 超大件 | ≤300 | ≤240 | ≤200 | ≤100 | ≤14.4 |

                        > 备注：长、宽、高、重量、体积全部符合的前提下，同时命中多个档位归为最低一档。45kg 以上需方正规则包装，必须自带铲脚或单独码放在托盘上。异形件以凸出部分顶点为测量端点。

                        ---

                        ## 二、2C 包裹推荐矩阵

                        | 件型 | 经济7日达 | 标准5日达 | 快捷3日达 | 快捷隔日达 | 快捷次日达 |
                        |------|----------|----------|----------|----------|----------|
                        | 超大件/异型 | Amazon Delivery | FedEx Ground / UPS Ground | USPS Priority Mail / UPS 3 Day Select | FedEx 2 Day | FedEx Standard Overnight / UPS Next Day Air Saver |
                        | 大件 | Amazon Delivery | FedEx Ground / UPS Ground / OnTrac Ground | USPS Priority Mail / UPS 3 Day Select | FedEx 2 Day | FedEx Standard Overnight / UPS Next Day Air Saver |
                        | 中件 | Amazon Delivery / FedEx Ground Economy / UPS SurePost | OnTrac Ground / USPS Ground Advantage | USPS Priority Mail / UPS 3 Day Select | FedEx 2 Day | FedEx Standard Overnight / UPS Next Day Air Saver |
                        | 小件 | FedEx Ground Economy / UPS SurePost | USPS Ground Advantage | USPS Priority Mail / UPS 3 Day Select | FedEx 2 Day | FedEx Standard Overnight / UPS Next Day Air Saver |

                        ---

                        ## 三、2B 托盘/货运推荐矩阵

                        | 件型 | 经济7日达 | 标准5日达 | 快捷3日达 | 快捷隔日达 | 快捷次日达 |
                        |------|----------|----------|----------|----------|----------|
                        | 单托/木箱 | FedEx Freight Economy | FedEx Freight Economy | FedEx 3 Day Express Freight | FedEx 2 Day Express Freight | FedEx 1 Day Express Freight |
                        | LTL(<6plt) | FedEx Freight Economy | FedEx Freight Economy | FedEx 3 Day Express Freight | FedEx 2 Day Express Freight | FedEx 1 Day Express Freight |
                        | LTL(7-12plt) | 线下单独询价 | 线下单独询价 | 线下单独询价 | 线下单独询价 | 线下单独询价 |
                        | FTL | 线下单独询价 | 线下单独询价 | 线下单独询价 | 线下单独询价 | 线下单独询价 |

                        ---

                        ## 四、中小件 Case 推荐

                        ### Winit Express（快捷）— 全美95%订单1-3日达

                        | 推荐标记 | 渠道 | 运输 | 单仓卖点 | 多仓卖点 |
                        |---------|------|------|---------|---------|
                        | 2C单仓推荐 | FedEx Standard Overnight | 空运 | 【时效】1日达95%达成 【卖价】1LB XUSD起 【优势】1-10LBS急件次日达最优解 | 同单仓 |
                        | — | UPS Next Day Air Saver | 空运 | 次日达，空运 | 同单仓 |
                        | 2C双仓推荐 | FedEx 2 Day | 空运(一票多件) | 【时效】1日达50%, 2日达95% 【卖价】1LB XUSD起 【优势】1-10LBS急件隔日达首选 | 同单仓 |
                        | — | USPS Priority Mail | 空运 | 【时效】全美3-5日达95% 【卖价】1LB XUSD起 【优势】全美+离岸可派 | 【时效】全美3日达95% |
                        | — | UPS 3 Day Select Residential | 陆运 | 3日达，陆运 | 同单仓 |

                        ### Winit Standard（标准）— 全美5日达

                        | 推荐标记 | 渠道 | 运输 | 单仓卖点 | 多仓卖点 |
                        |---------|------|------|---------|---------|
                        | 2C单仓推荐 | USPS Ground Advantage | 陆运 | 【时效】3-5日达95%达成 【卖价】4oz XUSD起, 1LB XUSD起 【优势】全美可派，磅下磅上可选，10磅内标准优选 | 同单仓 |
                        | 2C多仓推荐 | OnTrac Ground | 陆运 | 【时效】2-4日达95%达成 【卖价】1LB XUSD起 【优势】70%人口地区覆盖，多平台认证 | 【时效】2-3日达95%达成 |
                        | 2C双仓推荐 | FedEx Ground / FedEx Ground Multiple | 陆运 | 【时效】3日达95%达成 【卖价】10LBS近区$X+ 远区$X+ 【优势】10-200磅/件，单件超长超重优选 | 【时效】2日达95%达成 |
                        | — | UPS Ground / UPS Ground Multiple | 陆运 | 同FedEx Ground（UPS版本） | 同 |

                        ### Winit Economy（经济）— 全美7日达

                        | 推荐标记 | 渠道 | 运输 | 单仓卖点 | 多仓卖点 |
                        |---------|------|------|---------|---------|
                        | 2C多仓推荐 | Winit Parcel 7日达 | 陆运 | 【时效】3-7日达95%达成 【卖价】1LB XUSD起 【优势】多carrier派送，全美本土可达，平台自适配 | 【时效】3-5日达95%达成 |
                        | 2C多仓推荐 | FedEx Ground Economy | 陆运 | 【时效】3-7日达95%达成 【卖价】1LB XUSD起 【优势】FedEx/UPS经济选择 | 【时效】3-5日达95%达成 |
                        | — | UPS SurePost | 陆运 | 经济型，UPS+USPS联合 | 同单仓 |
                        | — | Amazon Logistics SWA | 陆运 | 【时效】3-7日达95%达成 【优势】Amazon自营物流派送 | 【时效】3-5日达95%达成 |

                        ### 平台面单 / 3PL
                        - **平台面单**（当客户有 TT/Temu 面单时）：非标准服务，平台代交面单
                        - **3PL 代交货**：USPS-3PL、UPS-3PL、FedEx-3PL — WINIT运力代交货，无时效标准/服务优势，统一定价

                        ---

                        ## 五、大件 Case 推荐

                        适用条件：单件 >10 lbs 或尺寸触发超长/超重。

                        ### 尾程渠道（一单一件）— 必选
                        **FedEx Ground (1-5 Business Days)**
                        - 单仓卖点：【时效】3日达95%达成 【卖价】10LBS 近区$X+ 远区$X+ 【优势】10-200磅/件 US本土可派，单件超长/超重/超大优选FedEx
                        - 多仓卖点：【时效】2日达95%达成 【优势】10-200磅/件 US本土可派

                        ### 尾程渠道（一单多件）— 必选
                        **FedEx Ground Multiple (1-5 Business Days)**
                        - 单仓卖点：【时效】3日达95%达成 【优势】MTW合单计费，单包max 68kg，总重min 90kg
                        - 多仓卖点：【时效】2日达95%达成

                        ### 尾程渠道（托盘服务）— 2B推荐
                        **FedEx Freight (2-8 Business Days)**
                        - 单仓卖点：【时效】3-7日达95%达成 【卖价】单拖 XUSD起 【优势】2C收件人小B类配送
                        - 多仓卖点：【时效】3-5日达95%达成

                        ---

                        ## 六、增值服务

                        ### 出库前
                        - 指定装箱/打托
                        - 签收选项（指定本人 / 成人 / 非指定）
                        - 高值保险（追踪守护、物流商保险）

                        ### 出库后
                        - 派送截件
                        - 派送改址
                        - 超时保障
                        - 签收POD
