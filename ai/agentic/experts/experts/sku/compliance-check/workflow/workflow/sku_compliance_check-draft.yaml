    - id: "163012"
      type: code
      title: fetch-compliance-snapshot
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 3347
      parameters:
          code: |-
              /* coze-inline: shared/sku-item-page-list.ts */
              /**
               * winit.item.page.list — 请求组装与响应剪枝映射（SKU 域共享）
               * Coze 导出时由 bundle 内联到代码节点。
               */

              const PAGE_LIST_ACTION = "winit.item.page.list";

              type FetchProfile =
                | "facts_core"
                | "audit_status"
                | "barcode_third"
                | "supplement_third_sku"
                | "facts_compliance"
                | "minimal";

              const VALID_PROFILES = new Set<string>([
                "facts_core",
                "audit_status",
                "barcode_third",
                "supplement_third_sku",
                "facts_compliance",
                "minimal",
              ]);

              function normalizeFetchProfile(v: unknown): FetchProfile {
                const s = typeof v === "string" ? v.trim() : "";
                if (VALID_PROFILES.has(s)) return s as FetchProfile;
                return "facts_core";
              }

              function asText(v: unknown): string {
                return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
              }

              function asRecord(v: unknown): Record<string, unknown> {
                return v && typeof v === "object" && !Array.isArray(v) ? (v as Record<string, unknown>) : {};
              }

              function ynTrue(v: unknown): boolean {
                const s = asText(v).toUpperCase();
                return s === "Y" || s === "TRUE" || s === "1";
              }

              function num(v: unknown): number | null {
                if (v == null || v === "") return null;
                const n = Number(v);
                return Number.isFinite(n) ? n : null;
              }

              function toStatusInt(v: unknown): number | null {
                if (v == null || v === "") return null;
                const n = Number(v);
                return Number.isFinite(n) ? n : null;
              }

              function truncateForLlm(script: string, maxLen = 500): string {
                const s = asText(script);
                if (s.length <= maxLen) return s;
                return `${s.slice(0, maxLen)}…（详见万邑联）`;
              }

              function mapPublishStatus(status: unknown): string {
                const n = toStatusInt(status);
                switch (n) {
                  case 1:
                  case 2:
                    return "draft";
                  case 3:
                    return "auditing";
                  case 4:
                    return "published";
                  case 5:
                    return "returned";
                  case 6:
                    return "inactive";
                  default: {
                    // legacy flat isActive fallback
                    const active = asText(status).toUpperCase();
                    if (active === "Y") return "published";
                    if (active === "N") return "inactive";
                    return "draft";
                  }
                }
              }

              function shouldExposeReturnFields(
                itemStatus: unknown,
                declaration: Record<string, unknown> | null
              ): boolean {
                const item = toStatusInt(itemStatus);
                if (item === 5) return true;
                if (item === 4 && declaration) {
                  const changeStatus = toStatusInt(declaration.changeStatus);
                  return changeStatus === 5;
                }
                return false;
              }

              type AttrRow = {
                attributeName?: unknown;
                attributeValue?: unknown;
                areaCode?: unknown;
              };

              function attrNameKey(name: unknown): string {
                return asText(name).toLowerCase();
              }

              /**
               * 按进口国匹配 attributes：优先精确国别 → ALL → null/空 → 首个同名
               */
              function pickAttr(
                attrs: unknown,
                name: string,
                country?: string
              ): AttrRow | null {
                if (!Array.isArray(attrs)) return null;
                const want = attrNameKey(name);
                const rows = attrs.filter(
                  (a) => a && typeof a === "object" && attrNameKey((a as AttrRow).attributeName) === want
                ) as AttrRow[];
                if (rows.length === 0) return null;
                const c = asText(country).toUpperCase();
                if (c) {
                  const exact = rows.find((r) => asText(r.areaCode).toUpperCase() === c);
                  if (exact) return exact;
                }
                const all = rows.find((r) => asText(r.areaCode).toUpperCase() === "ALL");
                if (all) return all;
                const global = rows.find((r) => !asText(r.areaCode));
                if (global) return global;
                return rows[0] ?? null;
              }

              function pickAttrValue(attrs: unknown, name: string, country?: string): string {
                const row = pickAttr(attrs, name, country);
                return row ? asText(row.attributeValue) : "";
              }

              function pickDeclaration(
                declarations: unknown,
                country?: string
              ): Record<string, unknown> | null {
                if (!Array.isArray(declarations) || declarations.length === 0) return null;
                const rows = declarations.filter((d) => d && typeof d === "object") as Record<string, unknown>[];
                if (rows.length === 0) return null;
                const c = asText(country).toUpperCase();
                if (c) {
                  const exact = rows.find((r) => asText(r.countryCode).toUpperCase() === c);
                  if (exact) return exact;
                }
                return rows[0] ?? null;
              }

              type BuildPageListOpts = {
                skuCodes?: string[];
                importCountryCode?: string;
                fetchProfile?: FetchProfile | string;
                thirdItemCodes?: string[];
                pageNo?: number;
                pageSize?: number;
              };

              function buildPageListData(opts: BuildPageListOpts): Record<string, unknown> {
                const profile = normalizeFetchProfile(opts.fetchProfile);
                const codes = (opts.skuCodes ?? []).map((c) => asText(c)).filter(Boolean);
                const pageNo = opts.pageNo ?? 1;
                let pageSize = opts.pageSize ?? Math.min(Math.max(codes.length, 1), 20);
                if (profile === "supplement_third_sku") {
                  pageSize = Math.min(opts.pageSize ?? 50, 50);
                } else {
                  pageSize = Math.min(pageSize, 20);
                }

                const data: Record<string, unknown> = {
                  pageVo: { pageNo, pageSize },
                  conditionQueryType: "equals",
                };

                const country = asText(opts.importCountryCode);
                if (country) data.importCountryCode = country;

                if (profile === "supplement_third_sku") {
                  data.querySupplementType = "SUPPLEMENT_THRID_SKU";
                  if (codes.length > 0) data.skuCodes = codes;
                  return data;
                }

                if (codes.length > 0) data.skuCodes = codes;

                const thirds = (opts.thirdItemCodes ?? []).map((c) => asText(c)).filter(Boolean);
                if (thirds.length > 0) data.thirdItemCodes = thirds;

                if (profile === "audit_status") {
                  data.queryType = "REGISTERING";
                }

                return data;
              }

              function buildPageListAction(opts: BuildPageListOpts): {
                action: string;
                data: string;
              } {
                return {
                  action: PAGE_LIST_ACTION,
                  data: JSON.stringify(buildPageListData(opts)),
                };
              }

              function mapFirstLegType(
                firstLegType: string
              ): { directShipmentRestriction: string | null; prohibitInboundFromLeg: boolean } {
                const t = firstLegType.toUpperCase();
                if (t === "NS") return { directShipmentRestriction: "seller_direct", prohibitInboundFromLeg: false };
                if (t === "NL") return { directShipmentRestriction: "unlimited", prohibitInboundFromLeg: false };
                if (t === "PI") return { directShipmentRestriction: null, prohibitInboundFromLeg: true };
                return { directShipmentRestriction: null, prohibitInboundFromLeg: false };
              }

              type MapItemOpts = {
                fetchProfile?: FetchProfile | string;
                importCountryCode?: string;
                requestedSkuCode?: string;
              };

              /**
               * 将 page.list 单条 raw item 映射为 profile 契约（按 fetchProfile 裁剪字段）
               */
              function mapItemToProfile(
                raw: Record<string, unknown>,
                opts: MapItemOpts = {}
              ): Record<string, unknown> {
                const profile = normalizeFetchProfile(opts.fetchProfile);
                const country = asText(opts.importCountryCode);
                const requested = asText(opts.requestedSkuCode) || asText(raw.skuCode);
                const attrs = raw.attributes;
                const decl = pickDeclaration(raw.declarations, country);
                const sw = asRecord(raw.sizeWeight);
                const status = raw.status ?? raw.isActive;

                const supervisorMode =
                  pickAttrValue(attrs, "supervisorMode", country) || asText(raw.supervisorMode) || null;
                const packaging =
                  pickAttrValue(attrs, "packaging", country) ||
                  pickAttrValue(attrs, "itemPackaging", country) ||
                  asText(raw.itemPackaging) ||
                  null;

                const firstLegRaw =
                  (decl ? asText(decl.firstLegType) : "") ||
                  pickAttrValue(attrs, "firstLegType", country);
                // attributes.firstLegType 用 NS/NL/PI；declarations.firstLegType 可能是 AIR/SEA — 仅当是限制码时映射
                const firstLegForLimit = /^(NS|NL|PI)$/i.test(firstLegRaw)
                  ? firstLegRaw
                  : pickAttrValue(attrs, "firstLegType", country);
                const leg = mapFirstLegType(firstLegForLimit);

                const prohibitFromDecl = decl ? ynTrue(decl.isProhibitWarehousing) : false;
                const prohibitInbound = prohibitFromDecl || leg.prohibitInboundFromLeg;

                const regLen = num(sw.registerLength ?? raw.registerLength);
                const regWidth = num(sw.registerWidth ?? raw.registerWidth);
                const regHeight = num(sw.registerHeight ?? raw.registerHeight);
                const regWeight = num(sw.registerWeight ?? raw.registerWeight);
                const hasReg = regLen != null || regWidth != null || regHeight != null || regWeight != null;

                const verLen = num(sw.length);
                const verWidth = num(sw.width);
                const verHeight = num(sw.height);
                const verWeight = num(sw.weight);
                const hasVer = verLen != null || verWidth != null || verHeight != null || verWeight != null;

                const battery = ynTrue(pickAttrValue(attrs, "battery", country) || raw.isBattery);
                const liquid = ynTrue(pickAttrValue(attrs, "liquid", country) || raw.isWithLiquid);
                const powder = ynTrue(pickAttrValue(attrs, "powder", country) || raw.isWithPowder);
                const magnetism = ynTrue(pickAttrValue(attrs, "magnetism", country) || raw.isWithMagnetism);
                const food = ynTrue(pickAttrValue(attrs, "food", country) || raw.isFood);
                const dg = ynTrue(pickAttrValue(attrs, "dg", country));
                const fragile = ynTrue(pickAttrValue(attrs, "fragileLabel", country));

                const batchMgmt = ynTrue(
                  pickAttrValue(attrs, "batchManagement", country) || raw.isBatchManager
                );
                const batchType =
                  pickAttrValue(attrs, "batchManagementType", country) || asText(raw.batchManagerType) || null;

                const exposeReturn = shouldExposeReturnFields(raw.status, decl);
                const returnReason = exposeReturn && decl ? asText(decl.returnReason) || null : null;
                const standardScript = exposeReturn && decl ? asText(decl.standardScript) || null : null;

                const estimateAuditDate = pickAttrValue(attrs, "estimateAuditDate", country) || null;
                const isUrgentRaw = pickAttrValue(attrs, "isUrgent", country);
                const isUrgent = isUrgentRaw ? ynTrue(isUrgentRaw) : null;

                const skuCodeThirds = Array.isArray(raw.skuCodeThirds)
                  ? (raw.skuCodeThirds as unknown[]).map((x) => asText(x)).filter(Boolean)
                  : [];
                const isSupportThirdSkuRaw = pickAttrValue(attrs, "isSupportThirdSku", country);
                const isSupportThirdSku = isSupportThirdSkuRaw ? ynTrue(isSupportThirdSkuRaw) : null;

                const hasSuit = ynTrue(pickAttrValue(attrs, "hasSuitBoxItem", country));
                const typeHint = hasSuit ? "SUITE" : null;

                const base: Record<string, unknown> = {
                  skuCode: asText(raw.skuCode) || requested,
                  code: asText(raw.code) || null,
                  specification: asText(raw.specification) || null,
                  isActive: asText(raw.isActive) || null,
                  publishStatus: mapPublishStatus(status),
                  _requestedSkuCode: requested || asText(raw.skuCode),
                  dataSource: "api",
                  confidence: "high",
                };

                if (profile === "minimal") {
                  return base;
                }

                if (profile === "barcode_third") {
                  return {
                    ...base,
                    supervisorMode,
                    skuCodeThirds,
                    isSupportThirdSku,
                    managementMode: { supervisorMode, isBatchManager: false, batchManagerType: null, hasExpiry: false },
                  };
                }

                if (profile === "audit_status") {
                  return {
                    ...base,
                    supervisorMode,
                    rejectReason: returnReason,
                    standardScript,
                    estimateAuditDate: estimateAuditDate || null,
                    isUrgent,
                    prohibitInbound,
                    directShipmentRestriction: leg.directShipmentRestriction,
                  };
                }

                // facts_core / facts_compliance / default
                const out: Record<string, unknown> = {
                  ...base,
                  supervisorMode,
                  type: typeHint,
                  itemPackaging: packaging,
                  prohibitInbound,
                  prohibitOutbound: false,
                  prohibitReason: null,
                  prohibitSource: "unknown",
                  prohibitInboundReason: prohibitInbound ? "isProhibitWarehousing_or_PI" : null,
                  directShipmentRestriction: leg.directShipmentRestriction,
                  restrictionReason: null,
                  rejectReason: returnReason,
                  standardScript,
                  estimateAuditDate: estimateAuditDate || null,
                  isUrgent,
                  itemType: null,
                  registeredDimensions: hasReg
                    ? { length: regLen, width: regWidth, height: regHeight, weight: regWeight, unit: "kg" }
                    : null,
                  verifiedDimensions: hasVer
                    ? { length: verLen, width: verWidth, height: verHeight, weight: verWeight, unit: "kg" }
                    : null,
                  specialFlags: {
                    isBattery: battery,
                    isWithLiquid: liquid,
                    isWithPowder: powder,
                    isWithMagnetism: magnetism,
                    isFood: food,
                    isDangerous: dg,
                    isFragile: fragile,
                  },
                  managementMode: {
                    supervisorMode,
                    isBatchManager: batchMgmt,
                    batchManagerType: batchType,
                    hasExpiry: asText(batchType).toUpperCase().includes("SHELF") || asText(batchType).includes("ED"),
                  },
                  applicableRules: [] as string[],
                  handlingRequirements: [] as string[],
                };

                if (battery) {
                  (out.applicableRules as string[]).push("带电品需填报电池信息");
                }

                if (profile === "facts_compliance") {
                  out.hsCode = decl ? asText(decl.hsCode) || null : null;
                  out.declareName = decl ? asText(decl.declareName) || null : null;
                  out.itemLink = pickAttrValue(attrs, "itemLink", country) || null;
                  out.dg = dg;
                }

                if (skuCodeThirds.length > 0) out.skuCodeThirds = skuCodeThirds;

                return out;
              }

              function buildAuditStatusHint(profile: Record<string, unknown>, skuCode: string): string {
                const parts: string[] = [];
                const code = asText(profile.skuCode) || skuCode;
                parts.push(`SKU ${code}`);
                const ps = asText(profile.publishStatus);
                if (ps) parts.push(`发布态：${ps}`);
                const est = asText(profile.estimateAuditDate);
                if (est) {
                  parts.push(`应维护完成时间：${est}`);
                } else {
                  parts.push("应维护完成时间：暂无（请在万邑联商品维护任务中核实）");
                }
                if (profile.isUrgent === true) parts.push("已加急：是");
                if (profile.isUrgent === false) parts.push("已加急：否");
                const reject = asText(profile.rejectReason);
                const script = truncateForLlm(asText(profile.standardScript), 500);
                if (reject) parts.push(`退回原因：${reject}`);
                if (script) parts.push(`退回说明：${script}`);
                return parts.join("；");
              }

              const DROPPED_SECTIONS = ["outPackaging", "translates", "rawAttributes", "fullDeclarations"];

              /**
               * 从 plugin / workflow 解析出的 payload 中提取 list[]
               */
              function coercePageList(parsed: unknown): {
                list: Record<string, unknown>[];
                totalCount: number | null;
              } {
                if (parsed == null) return { list: [], totalCount: null };
                if (Array.isArray(parsed)) {
                  return {
                    list: parsed.filter((x) => x && typeof x === "object") as Record<string, unknown>[],
                    totalCount: parsed.length,
                  };
                }
                if (typeof parsed !== "object") return { list: [], totalCount: null };
                const o = parsed as Record<string, unknown>;
                if (o.output != null) return coercePageList(o.output);
                if (o.code === "0" || o.code === 0) return coercePageList(o.data);
                if (Array.isArray(o.list)) {
                  return {
                    list: o.list.filter((x) => x && typeof x === "object") as Record<string, unknown>[],
                    totalCount: num(o.totalCount) ?? o.list.length,
                  };
                }
                if (o.skuCode != null || o.code != null) {
                  return { list: [o], totalCount: 1 };
                }
                return { list: [], totalCount: null };
              }

              /* coze-inline: node */
              /**
               * 节点：page.list / profile 快照 → complianceSnapshotText
               */

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
              }

              function asRecord(v: unknown): Record<string, unknown> {
                return v && typeof v === "object" && !Array.isArray(v) ? (v as Record<string, unknown>) : {};
              }

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function formatFromMapped(mapped: Record<string, unknown>, skuCode: string): string {
                const parts: string[] = [];
                const code = str(mapped.skuCode) || skuCode;
                if (code) parts.push(`SKU ${code}`);
                const ps = str(mapped.publishStatus);
                if (ps) parts.push(`发布态：${ps}`);
                if (mapped.prohibitInbound === true) parts.push("禁止入库：是");
                const flags = asRecord(mapped.specialFlags);
                const attrs: string[] = [];
                if (flags.isBattery) attrs.push("带电");
                if (flags.isWithLiquid) attrs.push("液体");
                if (flags.isDangerous) attrs.push("危险品(dg)");
                if (attrs.length) parts.push(`特殊属性：${attrs.join("/")}`);
                if (mapped.dg === true) parts.push("目的国危险品标记：是");
                const hs = str(mapped.hsCode);
                if (hs) parts.push(`HS：${hs}`);
                const declareName = str(mapped.declareName);
                if (declareName) parts.push(`申报名：${declareName}`);
                const src = str(mapped.prohibitSource);
                if (src) parts.push(`禁限来源：${src}`);
                return parts.join("；");
              }

              function fromProfileSnapshot(
                snapshot: Record<string, unknown>,
                skuCode: string
              ): { complianceSnapshot: Record<string, unknown>; complianceSnapshotText: string } {
                const skus = Array.isArray(snapshot.skus) ? snapshot.skus : [];
                const hit =
                  (skus.find((s) => str(asRecord(s).skuCode).toUpperCase() === skuCode.toUpperCase()) as
                    | Record<string, unknown>
                    | undefined) ?? (skus[0] as Record<string, unknown> | undefined);
                if (!hit) {
                  return { complianceSnapshot: {}, complianceSnapshotText: "" };
                }
                const text = formatFromMapped(hit, skuCode);
                return { complianceSnapshot: hit, complianceSnapshotText: text };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const skuCode = str(params.skuCode);
                const importCountryCode = str(params.importCountryCode);
                const skipApi = params.skipApi === true;
                const reuseProfileSnapshot = params.reuseProfileSnapshot === true;
                const profileSnapshot = asRecord(params.profileSnapshot);

                if (reuseProfileSnapshot && skuCode) {
                  const fromSnap = fromProfileSnapshot(profileSnapshot, skuCode);
                  return { ...fromSnap, skipFetch: true, dataSource: "profile_snapshot" };
                }

                if (skipApi || !skuCode) {
                  return {
                    complianceSnapshot: {},
                    complianceSnapshotText: "",
                    skipFetch: true,
                  };
                }

                const outputList = (Array.isArray(params.winitPluginOutputList)
                  ? params.winitPluginOutputList
                  : []) as Array<{ data?: unknown }>;

                let list: Record<string, unknown>[] = [];
                for (const item of outputList) {
                  const { list: rows } = coercePageList(parseCozeWorkflowDataField(item?.data));
                  list.push(...rows);
                }

                const key = skuCode.toUpperCase();
                const raw =
                  list.find((r) => str(r.skuCode).toUpperCase() === key) ?? (list.length === 1 ? list[0] : null);

                if (!raw) {
                  return {
                    complianceSnapshot: { skuCode, missing: true },
                    complianceSnapshotText: `SKU ${skuCode}：未查到合规相关档案字段，请核实编码或转人工。`,
                    skipFetch: false,
                    dataSource: "api_miss",
                    fetchSource: PAGE_LIST_ACTION,
                  };
                }

                const mapped = mapItemToProfile(raw, {
                  fetchProfile: "facts_compliance",
                  importCountryCode: importCountryCode || undefined,
                  requestedSkuCode: skuCode,
                });

                return {
                  complianceSnapshot: mapped,
                  complianceSnapshotText: formatFromMapped(mapped, skuCode),
                  skipFetch: false,
                  dataSource: "api",
                  fetchSource: PAGE_LIST_ACTION,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-compliance-snapshot")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skuCode
                input:
                    value:
                        path: skuCode
                        ref_node: "163009"
              - name: importCountryCode
                input:
                    value:
                        path: importCountryCode
                        ref_node: "163009"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163010"
              - name: reuseProfileSnapshot
                input:
                    value:
                        path: reuseProfileSnapshot
                        ref_node: "163009"
              - name: profileSnapshot
                input:
                    value:
                        path: profileSnapshot
                        ref_node: "163000"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163011"
          node_outputs:
              complianceSnapshot:
                  type: object
                  value: null
              complianceSnapshotText:
                  type: string
                  value: null
              skipFetch:
                  type: boolean
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163013"
      type: code
      title: load-compliance-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 3587
      parameters:
          code: |-
              /**
               * 节点：load-compliance-kb — 按 intentType 选择 KB 切片
               */

              function str(v: unknown): string {
                return typeof v === "string" ? v : "";
              }

              function pickParts(
                intentType: string,
                bags: Record<string, string>
              ): { parts: string[]; scope: string } {
                switch (intentType) {
                  case "carriability_deep":
                    return {
                      parts: [bags.kbCarriabilityDeep, bags.kbRestricted],
                      scope: "carriability_deep",
                    };
                  case "restricted":
                    return { parts: [bags.kbRestricted, bags.kbCertificates], scope: "restricted" };
                  case "certificates":
                    return { parts: [bags.kbCertificates, bags.kbUnbanDeep], scope: "certificates" };
                  case "weee":
                    return { parts: [bags.kbWeee, bags.kbCertificates], scope: "weee" };
                  case "ecommerce":
                    return { parts: [bags.kbEcommerce, bags.kbDeclaration], scope: "ecommerce" };
                  case "brand":
                    return { parts: [bags.kbBrand], scope: "brand" };
                  case "unban_deep":
                    return {
                      parts: [bags.kbUnbanDeep, bags.kbCertificates, bags.kbRestricted],
                      scope: "unban_deep",
                    };
                  case "declaration":
                    return { parts: [bags.kbDeclaration, bags.kbEcommerce], scope: "declaration" };
                  default:
                    return {
                      parts: [
                        bags.kbCarriabilityDeep,
                        bags.kbRestricted,
                        bags.kbCertificates,
                        bags.kbWeee,
                        bags.kbEcommerce,
                        bags.kbBrand,
                        bags.kbUnbanDeep,
                        bags.kbDeclaration,
                      ],
                      scope: "full",
                    };
                }
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const validationOk = params.validationOk === true;
                const intentType = str(params.intentType) || "general";
                const normalizedTopic = str(params.normalizedTopic);
                const needInfoHint = str(params.needInfoHint);

                const bags = {
                  kbCarriabilityDeep: str(params.kbCarriabilityDeep),
                  kbRestricted: str(params.kbRestricted),
                  kbCertificates: str(params.kbCertificates),
                  kbWeee: str(params.kbWeee),
                  kbEcommerce: str(params.kbEcommerce),
                  kbBrand: str(params.kbBrand),
                  kbUnbanDeep: str(params.kbUnbanDeep),
                  kbDeclaration: str(params.kbDeclaration),
                };

                if (!validationOk) {
                  return {
                    kbContent: "",
                    kbScope: "invalid",
                    intentType,
                    normalizedTopic,
                  };
                }

                const { parts, scope } = pickParts(intentType, bags);
                let kbContent = parts.filter(Boolean).join("\n\n---\n\n");
                if (needInfoHint) {
                  kbContent = `【缺参提示】needInfoHint=${needInfoHint}\n\n` + kbContent;
                }

                return {
                  kbContent,
                  kbScope: scope,
                  intentType,
                  normalizedTopic,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-compliance-kb")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e);
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: validationOk
                input:
                    value:
                        path: validationOk
                        ref_node: "163000"
              - name: intentType
                input:
                    value:
                        path: intentType
                        ref_node: "163000"
              - name: normalizedTopic
                input:
                    value:
                        path: normalizedTopic
                        ref_node: "163000"
              - name: needInfoHint
                input:
                    value:
                        path: needInfoHint
                        ref_node: "163000"
              - name: kbCarriabilityDeep
                input:
                    value:
                        path: output
                        ref_node: "163001"
              - name: kbRestricted
                input:
                    value:
                        path: output
                        ref_node: "163002"
              - name: kbCertificates
