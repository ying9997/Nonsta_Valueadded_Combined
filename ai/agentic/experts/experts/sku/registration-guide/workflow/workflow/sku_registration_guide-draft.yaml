                    value:
                        path: output
                        ref_node: "163007"
              - name: kbUnban
                input:
                    value:
                        path: output
                        ref_node: "163008"
          node_outputs:
              kbContent:
                  type: string
                  value: null
              kbScope:
                  type: string
                  value: null
