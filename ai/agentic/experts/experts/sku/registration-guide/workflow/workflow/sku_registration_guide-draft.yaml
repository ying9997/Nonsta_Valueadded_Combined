              }

              function auditProfileFromApi(
                raw: Record<string, unknown>,
                skuCode: string,
                country: string
              ): Record<string, unknown> {
                const status = publishStatus(hasOwn(raw, "status") ? raw.status : raw.isActive);
                const declaration = declarationForCountry(raw.declarations, country);
                const itemStatus = statusNumber(raw.status);
                const returned =
                  itemStatus === 5 ||
                  (itemStatus === 4 && statusNumber(declaration.changeStatus) === 5);
                const estimateAuditDate = attributeValue(raw.attributes, "estimateAuditDate", country);
                const isUrgent = booleanValue(attributeValue(raw.attributes, "isUrgent", country));
                return {
                  skuCode: str(raw.skuCode) || skuCode,
                  publishStatus: status,
                  estimateAuditDate,
                  isUrgent,
                  rejectReason: returned ? str(declaration.returnReason) : "",
                  standardScript: returned ? str(declaration.standardScript) : "",
                };
              }

              function hasAuditFact(profile: Record<string, unknown>): boolean {
                return Boolean(
                  str(profile.publishStatus) ||
                    str(profile.estimateAuditDate) ||
                    typeof profile.isUrgent === "boolean" ||
                    str(profile.rejectReason) ||
                    str(profile.standardScript)
                );
              }

              function scopeCompatible(
                row: Record<string, unknown>,
                customerCode: string,
                country: string
              ): boolean {
                const scope = obj(row.scope);
                const sourceCustomer = str(scope.customerCode).toUpperCase();
                if (!customerCode || sourceCustomer !== customerCode.toUpperCase()) return false;
                const sourceCountry = str(scope.importCountryCode).toUpperCase();
                return country
                  ? sourceCountry === country.toUpperCase() || sourceCountry === "ALL"
                  : !sourceCountry || sourceCountry === "ALL";
              }

              function hasScopeFailure(
                snapshot: Record<string, unknown>,
                row: Record<string, unknown>,
                skuCode: string
              ): boolean {
                const suffix = `:${skuCode.toUpperCase()}`;
                const facts = [
                  ...(Array.isArray(snapshot.missingFacts) ? snapshot.missingFacts : []),
                  ...(Array.isArray(row._missingFacts) ? row._missingFacts : []),
                ].map(str);
                return facts.some((fact) => {
                  const normalized = fact.toUpperCase();
                  return (
                    normalized.endsWith(suffix) &&
                    (normalized.startsWith("SCOPE_MISMATCH:") || normalized.startsWith("SCOPE_UNKNOWN:"))
                  );
                });
              }

              function profileFromSnapshot(
                snapshot: Record<string, unknown>,
                skuCode: string,
                customerCode: string,
                country: string
              ): Record<string, unknown> | null {
                const row = (Array.isArray(snapshot.skus) ? snapshot.skus : [])
                  .map(obj)
                  .find((candidate) => str(candidate.skuCode).toUpperCase() === skuCode.toUpperCase());
                if (
                  !row ||
                  str(row.dataSource).toLowerCase() !== "api" ||
                  hasScopeFailure(snapshot, row, skuCode) ||
                  !scopeCompatible(row, customerCode, country) ||
                  !hasAuditFact(row)
                ) {
                  return null;
                }
                return row;
              }

              function truncate(value: unknown, maxLength: number): string {
                const text = str(value);
                return text.length <= maxLength ? text : `${text.slice(0, maxLength)}…（详见万邑联）`;
              }

              function auditHint(profile: Record<string, unknown>, skuCode: string): string {
                const parts = [`SKU ${str(profile.skuCode) || skuCode}`];
                const status = str(profile.publishStatus);
                if (status) parts.push(`发布态：${status}`);
                const estimate = str(profile.estimateAuditDate);
                parts.push(
                  estimate
                    ? `应维护完成时间：${estimate}`
                    : "应维护完成时间：暂无（请在万邑联商品维护任务中核实）"
                );
                if (profile.isUrgent === true) parts.push("已加急：是");
                if (profile.isUrgent === false) parts.push("已加急：否");
                const rejectReason = str(profile.rejectReason);
                const standardScript = truncate(profile.standardScript, 500);
                if (rejectReason) parts.push(`退回原因：${rejectReason}`);
                if (standardScript) parts.push(`退回说明：${standardScript}`);
                return parts.join("；");
              }

              function fallbackHint(skuCode: string, country: string): string {
                return country
                  ? `当前未取得实时审核事实。请在万邑联「商品维护任务」中查看 SKU ${skuCode}（进口国 ${country}）的应维护完成时间与状态。`
                  : `当前未取得实时审核事实。请在万邑联「商品维护任务」中查看 SKU ${skuCode} 的应维护完成时间与状态。`;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const skuCode = str(params.skuCode);
                const customerCode = str(params.customerCode);
                const country = str(params.importCountryCode).toUpperCase();

                if (!skuCode) {
                  return {
                    auditStatusHint: "",
                    auditFactStatus: "",
                    rejectReason: "",
                    estimateAuditDate: "",
                    skipAudit: true,
                    dataSource: "skipped",
                    fetchSource: "",
                  };
                }

                if (params.reuseProfileSnapshot === true) {
                  const profile = profileFromSnapshot(
                    obj(params.profileSnapshot),
                    skuCode,
                    customerCode,
                    country
                  );
                  return {
                    auditStatusHint: profile ? auditHint(profile, skuCode) : "",
                    auditFactStatus: profile ? "has_fact" : "not_found",
                    rejectReason: profile ? str(profile.rejectReason) : "",
                    estimateAuditDate: profile ? str(profile.estimateAuditDate) : "",
                    skipAudit: false,
                    dataSource: profile ? "profile_snapshot" : "profile_snapshot_rejected",
                    fetchSource: "profile_snapshot",
                  };
                }

                if (params.skipApi === true) {
                  return {
                    auditStatusHint: "",
                    auditFactStatus: "",
                    rejectReason: "",
                    estimateAuditDate: "",
                    skipAudit: true,
                    dataSource: "skipped",
                    fetchSource: "",
                  };
                }

                const outputList = (Array.isArray(params.winitPluginOutputList)
                  ? params.winitPluginOutputList
                  : []) as Array<{ code?: unknown; data?: unknown; msg?: unknown }>;
                const rows: Record<string, unknown>[] = [];
                for (const item of outputList) {
                  if (pluginPayloadHasError(item)) {
                    return {
                      auditStatusHint: "实时审核接口暂不可用，请稍后重试；如仍失败请联系人工客服核实。",
                      auditFactStatus: "error",
                      rejectReason: "",
                      estimateAuditDate: "",
                      skipAudit: false,
                      dataSource: "api_error",
                      fetchSource: PAGE_LIST_ACTION,
                    };
                  }
                  // Coze plugin batch may return either a wrapper with `data` or the business row itself.
                  rows.push(...coerceList(item));
                }

                const raw = rows.find((row) => str(row.skuCode).toUpperCase() === skuCode.toUpperCase());
                if (!raw) {
                  return {
                    auditStatusHint: fallbackHint(skuCode, country),
                    auditFactStatus: "not_found",
                    rejectReason: "",
                    estimateAuditDate: "",
                    skipAudit: false,
                    dataSource: "fallback_self_serve",
                    fetchSource: PAGE_LIST_ACTION,
                  };
                }

                const profile = auditProfileFromApi(raw, skuCode, country);
                if (!hasAuditFact(profile)) {
                  return {
                    auditStatusHint: fallbackHint(skuCode, country),
                    auditFactStatus: "not_found",
                    rejectReason: "",
                    estimateAuditDate: "",
                    skipAudit: false,
                    dataSource: "fallback_self_serve",
                    fetchSource: PAGE_LIST_ACTION,
                  };
                }

                const rejectReason = str(profile.rejectReason);
                const standardScript = truncate(profile.standardScript, 500);
                return {
                  auditStatusHint: auditHint(profile, skuCode),
                  auditFactStatus: "has_fact",
                  rejectReason: rejectReason || (standardScript ? standardScript.slice(0, 200) : ""),
                  estimateAuditDate: str(profile.estimateAuditDate),
                  skipAudit: false,
                  dataSource: "api",
                  fetchSource: PAGE_LIST_ACTION,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-audit-status")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((result) => process.stdout.write(JSON.stringify(result)))
                  .catch((error) => {
                    console.error(error);
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: customerCode
                input:
                    value:
                        path: customerCode
                        ref_node: "163009"
              - name: skuCode
                input:
                    value:
                        path: skuCode
                        ref_node: "163009"
              - name: importCountryCode
                input:
                    value:
                        path: importCountryCode
                        ref_node: "163009"
              - name: fetchProfile
                input:
                    value:
                        path: fetchProfile
                        ref_node: "163010"
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163010"
              - name: reuseProfileSnapshot
                input:
                    value:
                        path: reuseProfileSnapshot
                        ref_node: "163009"
              - name: profileSnapshot
                input:
                    value:
                        path: profileSnapshot
                        ref_node: "163009"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163011"
          node_outputs:
              auditStatusHint:
                  type: string
                  value: null
              auditFactStatus:
                  type: string
                  value: null
              rejectReason:
                  type: string
                  value: null
              estimateAuditDate:
                  type: string
                  value: null
              skipAudit:
                  type: boolean
                  value: null
              dataSource:
                  type: string
                  value: null
              fetchSource:
                  type: string
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163013"
      type: code
      title: load-sku-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 3587
      parameters:
          code: |-
              /**
               * 节点：load-sku-kb — 按 intentType 选择 KB 切片
               */

              function str(v: unknown): string {
                return typeof v === "string" ? v : "";
              }

              function pickParts(
                intentType: string,
                bags: Record<string, string>
              ): { parts: string[]; scope: string } {
                switch (intentType) {
                  case "expedite":
                  case "audit_status":
                    return { parts: [bags.kbExpedite, bags.kbRegister], scope: "expedite" };
                  case "carriability":
                    return { parts: [bags.kbCarriability, bags.kbRegister], scope: "carriability" };
                  case "resubmit":
                    return { parts: [bags.kbAuditResubmit, bags.kbRegister], scope: "resubmit" };
                  case "direct_shipment":
                    return { parts: [bags.kbDirectShipment], scope: "direct_shipment" };
                  case "attribute_change":
                    return { parts: [bags.kbAttributeChange], scope: "attribute_change" };
                  case "unban":
                    return { parts: [bags.kbUnban, bags.kbInboundBlocked], scope: "unban" };
                  case "blocked_inbound":
                    return { parts: [bags.kbInboundBlocked, bags.kbRegister], scope: "blocked_inbound" };
                  case "register":
                  case "modify":
                  case "inactive":
                    return { parts: [bags.kbRegister, bags.kbAuditResubmit], scope: "register" };
                  default:
                    return {
                      parts: [
                        bags.kbExpedite,
                        bags.kbCarriability,
                        bags.kbRegister,
                        bags.kbAuditResubmit,
                        bags.kbDirectShipment,
                        bags.kbAttributeChange,
                        bags.kbInboundBlocked,
                        bags.kbUnban,
                      ],
                      scope: "full",
                    };
                }
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const validationOk = params.validationOk === true;
                const intentType = str(params.intentType) || "general";
                const normalizedTopic = str(params.normalizedTopic);
                const needInfoHint = str(params.needInfoHint);

                const bags = {
                  kbExpedite: str(params.kbExpedite),
                  kbCarriability: str(params.kbCarriability),
                  kbRegister: str(params.kbRegister),
                  kbAuditResubmit: str(params.kbAuditResubmit),
                  kbDirectShipment: str(params.kbDirectShipment),
                  kbAttributeChange: str(params.kbAttributeChange),
                  kbInboundBlocked: str(params.kbInboundBlocked),
                  kbUnban: str(params.kbUnban),
                };

                if (!validationOk) {
                  return {
                    kbContent: "",
                    kbScope: "invalid",
                    intentType,
                    normalizedTopic,
                  };
                }

                const { parts, scope } = pickParts(intentType, bags);
                let kbContent = parts.filter(Boolean).join("\n\n---\n\n");
                if (needInfoHint) {
                  kbContent = `【缺参提示】needInfoHint=${needInfoHint}\n\n` + kbContent;
                }

                return {
                  kbContent,
                  kbScope: scope,
                  intentType,
                  normalizedTopic,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("load-sku-kb")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e);
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: validationOk
                input:
                    value:
                        path: validationOk
                        ref_node: "163000"
              - name: intentType
                input:
                    value:
                        path: intentType
                        ref_node: "163000"
              - name: normalizedTopic
                input:
                    value:
                        path: normalizedTopic
                        ref_node: "163000"
              - name: needInfoHint
                input:
                    value:
                        path: needInfoHint
                        ref_node: "163000"
              - name: kbExpedite
                input:
                    value:
                        path: output
                        ref_node: "163001"
              - name: kbCarriability
                input:
                    value:
                        path: output
                        ref_node: "163002"
              - name: kbRegister
                input:
                    value:
                        path: output
                        ref_node: "163003"
              - name: kbAuditResubmit
                input:
                    value:
                        path: output
                        ref_node: "163004"
              - name: kbDirectShipment
                input:
                    value:
                        path: output
                        ref_node: "163005"
              - name: kbAttributeChange
                input:
                    value:
                        path: output
                        ref_node: "163006"
              - name: kbInboundBlocked
