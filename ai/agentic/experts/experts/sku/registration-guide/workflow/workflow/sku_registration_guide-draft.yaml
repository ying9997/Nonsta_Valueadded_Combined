                        path: needHumanReason
                        ref_node: "163000"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "163000"
          node_outputs:
              structured:
                  type: object
                  value: null
              analysis:
                  type: string
                  value: null
              outputContext:
                  type: object
                  value: null
