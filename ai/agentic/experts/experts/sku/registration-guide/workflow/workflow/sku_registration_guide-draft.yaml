                        # KB：注册加急 / 审核 SLA

                        > 来源：docs/sku/flows/02 · 咨询量约 61%

                        ## 标准话术

                        您提交的 SKU 已进入审核流程。请在万邑联查看 **商品维护任务** 中的 **应维护完成时间**（对客承诺的审核完成时点）。

                        - 若时效可接受：请耐心等待。
                        - 若需加急：在平台使用 **加急** 功能，并选择原因之一：①急需下入库单 ②急需打印条码标签 ③急需关联退货商品。

                        **专家不代客点击加急、不编造应维护完成时间。**

                        ## 系统路径

                        万邑联 → 商品维护任务列表（维护编号 MT 开头）→ 查看状态、应维护完成时间、子行 SKU / 进口国。

                        ## 分支提示

                        | 条件 | branch |
                        |------|--------|
                        | 问加急/审核多久 | guide_expedite |
                        | 状态为退回待修改 | guide_resubmit |
                        | 待补充证书/WEEE/GPSR | handoff_compliance（转人工说明） |
              - name: arrayItemConcatChar
                input:
                    type: string
                    value: ，
              - name: allArrayItemConcatChars
                input:
                    type: list
                    items:
                        type: object
                        value: null
                    value:
                        - isDefault: true
                          label: 换行
                          value: |+
                              
                        - isDefault: true
                          label: 制表符
                          value: "\t"
                        - isDefault: true
                          label: 句号
                          value: 。
                        - isDefault: true
                          label: 逗号
                          value: ，
