    - id: "163009"
      type: code
      title: resolve-audit-fetch
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2627
      parameters:
          code: |-
              /* coze-inline: shared/sku-registration-profile-reuse.ts */
              /** registration-guide 复用 sku/profile 快照时的统一安全门。 */

              function __coze_shared_sku_registration_profile_reuse_ts_text(value: unknown): string {
                return typeof value === "string" ? value.trim() : value == null ? "" : String(value).trim();
              }

              function __coze_shared_sku_registration_profile_reuse_ts_record(value: unknown): Record<string, unknown> {
                return value && typeof value === "object" && !Array.isArray(value)
                  ? (value as Record<string, unknown>)
                  : {};
              }

              function __coze_shared_sku_registration_profile_reuse_ts_hasOwn(value: Record<string, unknown>, key: string): boolean {
                return Object.prototype.hasOwnProperty.call(value, key);
              }

              const TRUSTED_FACT_FIELDS = new Set([
                "status",
                "publishStatus",
                "estimateAuditDate",
                "isUrgent",
                "rejectReason",
                "standardScript",
                "prohibitInbound",
                "prohibitOutbound",
                "restrictionReason",
                "directShipmentRestriction",
                "prohibitSource",
                "supervisorMode",
                "itemType",
                "type",
                "registeredDimensions",
                "verifiedDimensions",
                "specialFlags",
                "managementMode",
                "applicableRules",
              ]);

              const AUDIT_FACT_FIELDS = new Set([
                "status",
                "publishStatus",
                "estimateAuditDate",
                "isUrgent",
                "rejectReason",
                "standardScript",
              ]);

              function __coze_shared_sku_registration_profile_reuse_ts_isMeaningfulFact(value: unknown): boolean {
                if (typeof value === "boolean") return true;
                if (typeof value === "number") return Number.isFinite(value);
                if (typeof value === "string") {
                  const normalized = value.trim().toLowerCase();
                  return normalized !== "" && !["unknown", "undefined", "null", "未知"].includes(normalized);
                }
                if (Array.isArray(value)) return value.some(__coze_shared_sku_registration_profile_reuse_ts_isMeaningfulFact);
                if (value && typeof value === "object") {
                  return Object.values(__coze_shared_sku_registration_profile_reuse_ts_record(value)).some(__coze_shared_sku_registration_profile_reuse_ts_isMeaningfulFact);
                }
                return false;
              }

              function hasTrustedRegistrationFact(
                rowValue: unknown,
                intentTypeValue: unknown = ""
              ): boolean {
                const row = __coze_shared_sku_registration_profile_reuse_ts_record(rowValue);
                const intentType = __coze_shared_sku_registration_profile_reuse_ts_text(intentTypeValue).toLowerCase();
                if (["audit_status", "expedite", "resubmit"].includes(intentType)) {
                  return [...AUDIT_FACT_FIELDS].some((field) => __coze_shared_sku_registration_profile_reuse_ts_isMeaningfulFact(row[field]));
                }
                if (intentType === "blocked_inbound") {
                  const publishStatus = __coze_shared_sku_registration_profile_reuse_ts_text(row.publishStatus).toLowerCase();
                  return Boolean(publishStatus) &&
                    (publishStatus !== "published" || typeof row.prohibitInbound === "boolean");
                }
                return [...TRUSTED_FACT_FIELDS].some((field) => __coze_shared_sku_registration_profile_reuse_ts_isMeaningfulFact(row[field]));
              }

              function isRegistrationProfileScopeCompatible(
                scopeValue: unknown,
                customerCodeValue: unknown,
                importCountryCodeValue: unknown
              ): boolean {
                const scope = __coze_shared_sku_registration_profile_reuse_ts_record(scopeValue);
                const customerCode = __coze_shared_sku_registration_profile_reuse_ts_text(customerCodeValue).toUpperCase();
                const importCountryCode = __coze_shared_sku_registration_profile_reuse_ts_text(importCountryCodeValue).toUpperCase();
                if (!customerCode || !__coze_shared_sku_registration_profile_reuse_ts_hasOwn(scope, "customerCode")) return false;
                const sourceCustomerCode = __coze_shared_sku_registration_profile_reuse_ts_text(scope.customerCode).toUpperCase();
                if (!sourceCustomerCode || sourceCustomerCode !== customerCode) return false;

                if (!__coze_shared_sku_registration_profile_reuse_ts_hasOwn(scope, "importCountryCode")) return false;
                const sourceCountry = __coze_shared_sku_registration_profile_reuse_ts_text(scope.importCountryCode).toUpperCase();
                if (importCountryCode) {
                  return sourceCountry === importCountryCode || sourceCountry === "ALL";
                }
                return sourceCountry === "" || sourceCountry === "ALL";
              }

              function __coze_shared_sku_registration_profile_reuse_ts_hasScopeFailure(
                snapshot: Record<string, unknown>,
                row: Record<string, unknown>,
                skuCode: string
              ): boolean {
                const suffix = `:${skuCode.toUpperCase()}`;
                const facts = [
                  ...(Array.isArray(snapshot.missingFacts) ? snapshot.missingFacts : []),
                  ...(Array.isArray(row._missingFacts) ? row._missingFacts : []),
                ].map(__coze_shared_sku_registration_profile_reuse_ts_text);
                return facts.some((fact) => {
                  const normalized = fact.toUpperCase();
                  return (
                    normalized.endsWith(suffix) &&
                    (normalized.startsWith("SCOPE_MISMATCH:") || normalized.startsWith("SCOPE_UNKNOWN:"))
                  );
                });
              }

              function __coze_shared_sku_registration_profile_reuse_ts_compactFactValue(value: unknown): unknown {
                if (value == null || value === "") return undefined;
                if (Array.isArray(value)) {
                  return value.map(__coze_shared_sku_registration_profile_reuse_ts_compactFactValue).filter((item) => item !== undefined);
                }
                if (typeof value === "object") {
                  const compacted: Record<string, unknown> = {};
                  for (const [key, nested] of Object.entries(__coze_shared_sku_registration_profile_reuse_ts_record(value))) {
                    const next = __coze_shared_sku_registration_profile_reuse_ts_compactFactValue(nested);
                    if (next !== undefined) compacted[key] = next;
                  }
                  return compacted;
                }
                return value;
              }

              function findTrustedRegistrationProfileRow(
                snapshotValue: unknown,
                skuCodeValue: unknown,
                customerCodeValue: unknown,
                importCountryCodeValue: unknown,
                intentTypeValue: unknown = ""
              ): Record<string, unknown> | null {
                const snapshot = __coze_shared_sku_registration_profile_reuse_ts_record(snapshotValue);
                const skuCode = __coze_shared_sku_registration_profile_reuse_ts_text(skuCodeValue);
                const skus = Array.isArray(snapshot.skus) ? snapshot.skus : [];
                const row = skus
                  .map(__coze_shared_sku_registration_profile_reuse_ts_record)
                  .find((candidate) => __coze_shared_sku_registration_profile_reuse_ts_text(candidate.skuCode).toUpperCase() === skuCode.toUpperCase());
                if (
                  !skuCode ||
                  !row ||
                  __coze_shared_sku_registration_profile_reuse_ts_text(row.dataSource).toLowerCase() !== "api" ||
                  __coze_shared_sku_registration_profile_reuse_ts_hasScopeFailure(snapshot, row, skuCode) ||
