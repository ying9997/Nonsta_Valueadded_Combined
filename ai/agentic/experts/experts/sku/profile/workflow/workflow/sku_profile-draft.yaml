    - id: "163003"
      type: code
      title: fetch-sku-profile
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1187
      parameters:
          code: |-
              /**
               * 节点：合并 winit.item.page.list 插件输出为 rawItems（尚未剪枝）
               */
              const PAGE_LIST_ACTION = "winit.item.page.list";

              type CozeWinitLocalEnv = {
                apiToken: string;
                workflowId: string;
                customerCode: string;
                customerName: string;
                username: string;
                language: string;
              };

              function parseCozeWorkflowDataField(data: unknown): unknown {
                if (data == null) return null;
                if (typeof data !== "string") return data;
                try {
                  const once = JSON.parse(data) as unknown;
                  if (typeof once === "string") {
                    try {
                      return JSON.parse(once) as unknown;
                    } catch {
                      return once;
                    }
                  }
                  return once;
                } catch {
                  return data;
                }
              }

              function asRecord(value: unknown): Record<string, unknown> {
                return value && typeof value === "object" && !Array.isArray(value)
                  ? (value as Record<string, unknown>)
                  : {};
              }

              function asText(value: unknown): string {
                return typeof value === "string" ? value.trim() : value == null ? "" : String(value).trim();
              }

              function hasOwn(record: Record<string, unknown>, key: string): boolean {
                return Object.prototype.hasOwnProperty.call(record, key);
              }

              function asFiniteNumber(value: unknown): number | null {
                if (value == null || value === "") return null;
                const parsed = Number(value);
                return Number.isFinite(parsed) ? parsed : null;
              }

              function coercePageList(parsed: unknown): {
                list: Record<string, unknown>[];
                totalCount: number | null;
              } {
                if (parsed == null) return { list: [], totalCount: null };
                if (Array.isArray(parsed)) {
                  const list = parsed.filter(
                    (value): value is Record<string, unknown> =>
                      value != null && typeof value === "object" && !Array.isArray(value)
                  );
                  return { list, totalCount: parsed.length };
                }
                if (typeof parsed !== "object") return { list: [], totalCount: null };
                const record = parsed as Record<string, unknown>;
                if (record.output != null) return coercePageList(record.output);
                if (record.code === "0" || record.code === 0) return coercePageList(record.data);
                if (Array.isArray(record.list)) {
                  const list = record.list.filter(
                    (value): value is Record<string, unknown> =>
                      value != null && typeof value === "object" && !Array.isArray(value)
                  );
                  return {
                    list,
                    totalCount: asFiniteNumber(record.totalCount) ?? record.list.length,
                  };
                }
                if (record.skuCode != null || record.code != null) return { list: [record], totalCount: 1 };
                return { list: [], totalCount: null };
              }

              function hasPageListShape(value: unknown): boolean {
                const parsed = parseCozeWorkflowDataField(value);
                if (Array.isArray(parsed)) return true;
                const record = asRecord(parsed);
                if (Object.keys(record).length === 0) return false;
                if (hasOwn(record, "output")) return hasPageListShape(record.output);
                if (Array.isArray(record.list)) return true;
                return record.skuCode != null || (record.code != null && !hasOwn(record, "data"));
              }

              function safeResponseMessage(value: unknown): string {
                return asText(value).replace(/\s+/g, " ").slice(0, 120);
              }

              function inspectPageListResponse(
                value: unknown,
                errorPrefix: "plugin_response" | "local_proxy"
              ): { list: Record<string, unknown>[]; error: string | null } {
                const parsed = parseCozeWorkflowDataField(value);
                const record = asRecord(parsed);
                const looksLikeEnvelope =
                  hasOwn(record, "code") &&
                  (hasOwn(record, "data") || hasOwn(record, "msg")) &&
                  !hasOwn(record, "skuCode");

                if (looksLikeEnvelope) {
                  const code = asText(record.code);
                  if (code !== "0") {
                    const message = safeResponseMessage(record.msg);
                    return {
                      list: [],
                      error: `${errorPrefix}_error:${code || "unknown"}${message ? `:${message}` : ""}`,
                    };
                  }
                  const successfulEmptyResult =
                    typeof record.data === "string" && record.data.trim() === "";
                  if (!successfulEmptyResult && !hasPageListShape(record.data)) {
                    return { list: [], error: `${errorPrefix}_invalid_data` };
                  }
                } else if (!hasPageListShape(parsed)) {
                  return { list: [], error: `${errorPrefix}_invalid_data` };
                }

                return { list: coercePageList(parsed).list, error: null };
              }

              async function runCozeWinitWorkflow(
                env: CozeWinitLocalEnv,
                action: string,
                data: Record<string, unknown>
              ): Promise<unknown> {
                const baseUrl = (process.env.COZE_API_BASE_URL ?? "https://api.coze.cn").replace(/\/$/, "");
                const res = await fetch(`${baseUrl}/v1/workflow/run`, {
                  method: "POST",
                  headers: {
                    Authorization: `Bearer ${env.apiToken}`,
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    workflow_id: env.workflowId,
                    parameters: {
                      action,
                      customerCode: env.customerCode,
                      customerName: env.customerName,
                      username: env.username,
                      language: env.language || "zh_CN",
                      data: JSON.stringify(data),
                    },
                  }),
                });
                const text = await res.text();
                const body = JSON.parse(text) as Record<string, unknown>;
                if (!res.ok || (body.code !== 0 && body.code !== "0")) {
                  throw new Error(`Coze workflow failed: ${String(body.msg ?? text).slice(0, 300)}`);
                }
                return parseCozeWorkflowDataField(body.data);
              }

              function getCozeWinitEnv(): CozeWinitLocalEnv | null {
                if (typeof process === "undefined" || !process.env) return null;
                const apiToken = process.env.COZE_API_TOKEN ?? process.env.COZE_WORKFLOW_PAT ?? "";
                const workflowId =
                  process.env.COZE_WINIT_OPENAPI_PROXY_WORKFLOW_ID ?? process.env.COZE_WINIT_WORKFLOW_ID ?? "";
                const customerCode = process.env.COZE_WINIT_CUSTOMER_CODE ?? "";
                const customerName = process.env.COZE_WINIT_CUSTOMER_NAME ?? "";
                const username = process.env.COZE_WINIT_USERNAME ?? "";
                if (!apiToken || !workflowId || !customerCode || !customerName || !username) return null;
                return {
                  apiToken,
                  workflowId,
                  customerCode,
                  customerName,
                  username,
                  language: process.env.COZE_WINIT_LANGUAGE ?? "zh_CN",
                };
              }

              function indexBySku(list: Record<string, unknown>[]): Map<string, Record<string, unknown>> {
                const map = new Map<string, Record<string, unknown>>();
                for (const row of list) {
                  const code = String(row.skuCode ?? "").trim().toUpperCase();
                  if (code && !map.has(code)) map.set(code, row);
                }
                return map;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const requested = ((params.normalizedSkuCodes as string[]) ?? []).filter((c) => c?.trim());
                const fetchProfile =
                  typeof params.fetchProfile === "string" && params.fetchProfile.trim()
                    ? params.fetchProfile.trim()
                    : "facts_core";

                if (params.skipApi === true) {
                  return {
                    rawItems: [],
                    fetchMeta: {
                      requested: requested.length,
                      found: 0,
                      source: "skipped",
                      strategy: "skip",
                      fetchProfile,
                      pruned: false,
                    },
                  };
                }

                type ActionPlan = { inputToken: string; skuCode: string };
                const actionPlans = (Array.isArray(params.actionPlans) ? params.actionPlans : []) as ActionPlan[];
                const outputList = (Array.isArray(params.winitPluginOutputList)
                  ? params.winitPluginOutputList
                  : []) as Array<{ code?: unknown; data?: unknown; msg?: unknown; error?: unknown }>;

                let allRows: Record<string, unknown>[] = [];
                let strategy = "none";
                const fetchErrors: string[] = [];

                if (outputList.length > 0) {
                  strategy = "plugin-batch";
                  for (let i = 0; i < outputList.length; i++) {
                    const item = outputList[i] ?? {};
                    const outer = asRecord(item);
                    const hasOuterFailure =
                      (hasOwn(outer, "code") && asText(outer.code) !== "0") || asText(outer.error) !== "";
                    const directBatchEmpty =
                      !hasOuterFailure && typeof item.data === "string" && item.data.trim() === "";
                    const inspected = directBatchEmpty
                      ? { list: [] as Record<string, unknown>[], error: null as string | null }
                      : inspectPageListResponse(hasOuterFailure ? item : item.data, "plugin_response");
                    const { list, error } = inspected;
                    if (error) fetchErrors.push(error);
                    allRows.push(...list);
                  }
                  if (fetchErrors.length > 0) strategy = "plugin-batch-error";
                } else {
                  const actions = (Array.isArray(params.actions) ? params.actions : []) as Array<{
                    action: string;
                    data: string;
                  }>;
                  const env = getCozeWinitEnv();
                  if (!env) {
                    return {
                      rawItems: [],
                      fetchMeta: {
                        requested: requested.length,
                        found: 0,
                        source: "none",
                        strategy: "no-plugin-no-env",
                        fetchProfile,
                        pruned: false,
                        error: "winit_env_unavailable",
                      },
                    };
                  }
                  strategy = "local-proxy";
                  for (const a of actions) {
                    let data: Record<string, unknown> = {};
                    try {
                      data = JSON.parse(a.data || "{}") as Record<string, unknown>;
                    } catch {
                      data = {};
                    }
                    try {
                      const parsed = await runCozeWinitWorkflow(env, a.action || PAGE_LIST_ACTION, data);
                      const { list, error } = inspectPageListResponse(parsed, "local_proxy");
                      if (error) fetchErrors.push(error);
                      allRows.push(...list);
                    } catch {
                      fetchErrors.push("local_proxy_error");
                    }
                  }
                  if (fetchErrors.length > 0) strategy = "local-proxy-error";
                }

                const bySku = indexBySku(allRows);
                const plans = actionPlans.length > 0 ? actionPlans : requested.map((skuCode) => ({ skuCode, inputToken: skuCode }));
                const rawItems: Record<string, unknown>[] = [];

                for (const plan of plans) {
                  const req = String(plan.skuCode ?? plan.inputToken ?? "").trim();
                  if (!req) continue;
                  const hit = bySku.get(req.toUpperCase());
                  if (hit) {
                    rawItems.push({ ...hit, _requestedSkuCode: req });
                  }
                }

                // supplement / no plans: return all rows with requested tag
                if (plans.length === 0 && allRows.length > 0) {
                  for (const row of allRows) {
                    rawItems.push({ ...row, _requestedSkuCode: String(row.skuCode ?? "") });
                  }
                }

                const fetchMeta: Record<string, unknown> = {
                  requested: requested.length,
                  found: rawItems.length,
                  source: PAGE_LIST_ACTION,
                  strategy,
                  fetchProfile,
                  pruned: false,
                };
                if (fetchErrors.length > 0) {
                  fetchMeta.error = [...new Set(fetchErrors)].join(";");
                }

                return {
                  rawItems,
                  fetchMeta,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("fetch-sku-profile")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e instanceof Error ? e.message : "fetch-sku-profile failed");
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163000"
              - name: normalizedSkuCodes
                input:
                    value:
                        path: normalizedSkuCodes
                        ref_node: "163000"
              - name: actions
                input:
                    value:
                        path: actions
                        ref_node: "163001"
              - name: actionPlans
                input:
                    value:
                        path: actionPlans
                        ref_node: "163001"
              - name: fetchProfile
                input:
                    value:
                        path: fetchProfile
                        ref_node: "163001"
              - name: winitPluginOutputList
                input:
                    value:
                        path: outputList
                        ref_node: "163002"
          node_outputs:
              rawItems:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              fetchMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163004"
      type: code
      title: prune-and-map-item
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1427
      parameters:
          code: |-
              /**
               * 节点：page.list rawItems → 契约 apiProfiles（剪枝映射）
               */
              const DROPPED_SECTIONS = ["outPackaging", "translates", "rawAttributes", "fullDeclarations"];
              const VALID_FETCH_PROFILES = new Set([
                "facts_core",
                "audit_status",
                "barcode_third",
                "supplement_third_sku",
                "facts_compliance",
                "minimal",
              ]);

              function asText(v: unknown): string {
                return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
              }

              function asRecord(v: unknown): Record<string, unknown> {
                return v && typeof v === "object" && !Array.isArray(v) ? (v as Record<string, unknown>) : {};
              }

              function hasOwn(record: Record<string, unknown>, key: string): boolean {
                return Object.prototype.hasOwnProperty.call(record, key);
              }

              function normalizeFetchProfile(v: unknown): string {
                const value = asText(v);
                return VALID_FETCH_PROFILES.has(value) ? value : "facts_core";
              }

              function ynValue(v: unknown): boolean | null {
                const value = asText(v).toUpperCase();
                if (value === "Y" || value === "TRUE" || value === "1") return true;
                if (value === "N" || value === "FALSE" || value === "0") return false;
                return null;
              }

              function num(v: unknown): number | null {
                if (v == null || v === "") return null;
                const value = Number(v);
                return Number.isFinite(value) ? value : null;
              }

              function mapPublishStatus(value: unknown): string | null {
                const status = num(value);
                if (status === 1 || status === 2) return "draft";
                if (status === 3) return "auditing";
                if (status === 4) return "published";
                if (status === 5) return "returned";
                if (status === 6) return "inactive";
                const active = asText(value).toUpperCase();
                if (active === "Y") return "published";
                if (active === "N") return "inactive";
                return null;
              }

              type AttrRow = { attributeName?: unknown; attributeValue?: unknown; areaCode?: unknown };

              function pickAttr(attrs: unknown, name: string, country?: string): AttrRow | null {
                if (!Array.isArray(attrs)) return null;
                const wanted = name.toLowerCase();
                const rows = attrs.filter(
                  (value): value is AttrRow =>
                    value != null &&
                    typeof value === "object" &&
                    asText((value as AttrRow).attributeName).toLowerCase() === wanted
                );
                const requestedCountry = asText(country).toUpperCase();
                if (requestedCountry) {
                  const exact = rows.find((row) => asText(row.areaCode).toUpperCase() === requestedCountry);
                  if (exact) return exact;
                }
                return (
                  rows.find((row) => asText(row.areaCode).toUpperCase() === "ALL") ??
                  rows.find((row) => !asText(row.areaCode)) ??
                  null
                );
              }

              function pickAttrValue(attrs: unknown, name: string, country?: string): string {
                return asText(pickAttr(attrs, name, country)?.attributeValue);
              }

              function pickDeclaration(value: unknown, country?: string): Record<string, unknown> | null {
                if (!Array.isArray(value)) return null;
                const rows = value.filter(
                  (row): row is Record<string, unknown> =>
                    row != null && typeof row === "object" && !Array.isArray(row)
                );
                const requestedCountry = asText(country).toUpperCase();
                if (requestedCountry) {
                  const exact = rows.find((row) => asText(row.countryCode).toUpperCase() === requestedCountry);
                  if (exact) return exact;
                }
                return (
                  rows.find((row) => asText(row.countryCode).toUpperCase() === "ALL") ??
                  rows.find((row) => !asText(row.countryCode)) ??
                  null
                );
              }

              function hasCountrySpecificRows(raw: Record<string, unknown>): boolean {
                const attrs = Array.isArray(raw.attributes) ? raw.attributes : [];
                const declarations = Array.isArray(raw.declarations) ? raw.declarations : [];
                return attrs.some((value) => {
                  const country = asText(asRecord(value).areaCode).toUpperCase();
                  return country !== "" && country !== "ALL";
                }) || declarations.some((value) => {
                  const country = asText(asRecord(value).countryCode).toUpperCase();
                  return country !== "" && country !== "ALL";
                });
              }

              function readBooleanFact(
                attrs: unknown,
                attrNames: string[],
                raw: Record<string, unknown>,
                rawNames: string[],
                country?: string
              ): { value: boolean | null; provenance: "api" | "unknown" } {
                for (const name of attrNames) {
                  const row = pickAttr(attrs, name, country);
                  if (!row) continue;
                  const value = ynValue(row.attributeValue);
                  if (value != null) return { value, provenance: "api" };
                }
                for (const name of rawNames) {
                  if (!hasOwn(raw, name)) continue;
                  const value = ynValue(raw[name]);
                  if (value != null) return { value, provenance: "api" };
                }
                return { value: null, provenance: "unknown" };
              }

              function readRecordBooleanFact(
                record: Record<string, unknown> | null,
                names: string[]
              ): { value: boolean | null; provenance: "api" | "unknown" } {
                if (!record) return { value: null, provenance: "unknown" };
                for (const name of names) {
                  if (!hasOwn(record, name)) continue;
                  const value = ynValue(record[name]);
                  if (value != null) return { value, provenance: "api" };
                }
                return { value: null, provenance: "unknown" };
              }

              function combineBooleanEvidence(values: Array<boolean | null>): boolean | null {
                if (values.some((value) => value === true)) return true;
                if (values.every((value) => value === false)) return false;
                return null;
              }

              function mapItemToProfile(
                raw: Record<string, unknown>,
                opts: { fetchProfile?: unknown; importCountryCode?: string; requestedSkuCode?: string }
              ): Record<string, unknown> {
                const profile = normalizeFetchProfile(opts.fetchProfile);
                const country = asText(opts.importCountryCode);
                const requested = asText(opts.requestedSkuCode) || asText(raw.skuCode);
                const attrs = raw.attributes;
                const declaration = pickDeclaration(raw.declarations, country);
                const sizeWeight = asRecord(raw.sizeWeight);
                const skuCode = asText(raw.skuCode) || requested;
                const publishStatus = hasOwn(raw, "status")
                  ? mapPublishStatus(raw.status)
                  : mapPublishStatus(raw.isActive);
                const supervisorMode =
                  pickAttrValue(attrs, "supervisorMode", country) || asText(raw.supervisorMode) || null;
                const itemPackaging =
                  pickAttrValue(attrs, "packaging", country) ||
                  pickAttrValue(attrs, "itemPackaging", country) ||
                  asText(raw.itemPackaging) ||
                  null;

                const firstLegRaw =
                  (declaration ? asText(declaration.firstLegType) : "") ||
                  pickAttrValue(attrs, "firstLegType", country);
                const firstLegForLimit = /^(NS|NL|PI)$/i.test(firstLegRaw)
                  ? firstLegRaw
                  : pickAttrValue(attrs, "firstLegType", country);
                const firstLeg = firstLegForLimit.toUpperCase();
                const directShipmentRestriction =
                  firstLeg === "NS" ? "seller_direct" : firstLeg === "NL" ? "unlimited" : null;
                const prohibitFromLeg = firstLeg === "PI" ? true : firstLeg === "NS" || firstLeg === "NL" ? false : null;
                const prohibitFromDeclaration = readRecordBooleanFact(declaration, ["isProhibitWarehousing"]);
                const prohibitInbound = combineBooleanEvidence([
                  prohibitFromDeclaration.value,
                  prohibitFromLeg,
                ]);

                const battery = readBooleanFact(attrs, ["battery"], raw, ["isBattery"], country);
                const liquid = readBooleanFact(attrs, ["liquid"], raw, ["isWithLiquid"], country);
                const powder = readBooleanFact(attrs, ["powder"], raw, ["isWithPowder"], country);
                const magnetism = readBooleanFact(attrs, ["magnetism"], raw, ["isWithMagnetism"], country);
                const food = readBooleanFact(attrs, ["food"], raw, ["isFood"], country);
                const dangerous = readBooleanFact(attrs, ["dg"], raw, ["isDangerous", "dg"], country);
                const fragile = readBooleanFact(attrs, ["fragileLabel"], raw, ["isFragile"], country);
                const batchManagement = readBooleanFact(
                  attrs,
                  ["batchManagement"],
                  raw,
                  ["isBatchManager"],
                  country
                );
                const batchManagerType =
                  pickAttrValue(attrs, "batchManagementType", country) || asText(raw.batchManagerType) || null;
                const hasExpiry = batchManagerType != null
                  ? batchManagerType.toUpperCase().includes("SHELF") || batchManagerType.includes("ED")
                  : batchManagement.value === false
                    ? false
                    : null;
                const isUrgentFact = readBooleanFact(attrs, ["isUrgent"], raw, [], country);
                const estimateAuditDate = pickAttrValue(attrs, "estimateAuditDate", country) || null;
                const itemStatus = num(raw.status);
                const declarationStatus = declaration ? num(declaration.changeStatus) : null;
                const exposeReturn = itemStatus === 5 || (itemStatus === 4 && declarationStatus === 5);
                const rejectReason = exposeReturn && declaration ? asText(declaration.returnReason) || null : null;
                const standardScript = exposeReturn && declaration ? asText(declaration.standardScript) || null : null;
                const skuCodeThirds = Array.isArray(raw.skuCodeThirds)
                  ? raw.skuCodeThirds.map(asText).filter(Boolean)
                  : [];
                const isSupportThirdSkuFact = readBooleanFact(attrs, ["isSupportThirdSku"], raw, [], country);

                const fieldProvenance: Record<string, "api" | "unknown"> = {
                  publishStatus: publishStatus == null ? "unknown" : "api",
                };
                const missingFacts: string[] = [];
                if (publishStatus == null) missingFacts.push(`publish_status_unknown:${skuCode}`);
                const scope: Record<string, unknown> = { customerCode: null };
                if (country) scope.importCountryCode = country.toUpperCase();
                else if (!hasCountrySpecificRows(raw)) scope.importCountryCode = null;
                const base: Record<string, unknown> = {
                  skuCode,
                  code: asText(raw.code) || null,
                  specification: asText(raw.specification) || null,
                  isActive: asText(raw.isActive) || null,
                  publishStatus,
                  _requestedSkuCode: requested || asText(raw.skuCode),
                  dataSource: "api",
                  confidence: "high",
                  fieldProvenance,
                  _missingFacts: missingFacts,
                  scope,
                };
                if (profile === "minimal") return base;

                if (profile === "barcode_third") {
                  fieldProvenance.isSupportThirdSku = isSupportThirdSkuFact.provenance;
                  fieldProvenance["managementMode.isBatchManager"] = batchManagement.provenance;
                  fieldProvenance["managementMode.batchManagerType"] = batchManagerType == null ? "unknown" : "api";
                  fieldProvenance["managementMode.hasExpiry"] = hasExpiry == null ? "unknown" : "api";
                  if (isSupportThirdSkuFact.value == null) missingFacts.push(`third_sku_support_unknown:${skuCode}`);
                  if (batchManagement.value == null) missingFacts.push(`management_mode_unknown:isBatchManager:${skuCode}`);
                  if (batchManagerType == null) missingFacts.push(`management_mode_unknown:batchManagerType:${skuCode}`);
                  if (hasExpiry == null) missingFacts.push(`management_mode_unknown:hasExpiry:${skuCode}`);
                  return {
                    ...base,
                    supervisorMode,
                    skuCodeThirds,
                    isSupportThirdSku: isSupportThirdSkuFact.value,
                    managementMode: {
                      supervisorMode,
                      isBatchManager: batchManagement.value,
                      batchManagerType,
                      hasExpiry,
                    },
                  };
                }

                fieldProvenance.prohibitInbound = prohibitInbound == null ? "unknown" : "api";
                fieldProvenance.isUrgent = isUrgentFact.provenance;
                if (prohibitInbound == null) missingFacts.push(`prohibit_inbound_unknown:${skuCode}`);
                if (isUrgentFact.value == null) missingFacts.push(`is_urgent_unknown:${skuCode}`);
                if (profile === "audit_status") {
                  return {
                    ...base,
                    supervisorMode,
                    rejectReason,
                    standardScript,
                    estimateAuditDate,
                    isUrgent: isUrgentFact.value,
                    prohibitInbound,
                    directShipmentRestriction,
                  };
                }

                const specialFacts: Array<[string, { value: boolean | null; provenance: "api" | "unknown" }]> = [
                  ["isBattery", battery],
                  ["isWithLiquid", liquid],
                  ["isWithPowder", powder],
                  ["isWithMagnetism", magnetism],
                  ["isFood", food],
                  ["isDangerous", dangerous],
                  ["isFragile", fragile],
                ];
                fieldProvenance.prohibitOutbound = "unknown";
                for (const [name, fact] of specialFacts) {
                  fieldProvenance[`specialFlags.${name}`] = fact.provenance;
                  if (fact.value == null) missingFacts.push(`special_flag_unknown:${name}:${skuCode}`);
                }
                fieldProvenance["managementMode.isBatchManager"] = batchManagement.provenance;
                fieldProvenance["managementMode.batchManagerType"] = batchManagerType == null ? "unknown" : "api";
                fieldProvenance["managementMode.hasExpiry"] = hasExpiry == null ? "unknown" : "api";
                missingFacts.push(`prohibit_outbound_unknown:${skuCode}`);
                if (batchManagement.value == null) missingFacts.push(`management_mode_unknown:isBatchManager:${skuCode}`);
                if (batchManagerType == null) missingFacts.push(`management_mode_unknown:batchManagerType:${skuCode}`);
                if (hasExpiry == null) missingFacts.push(`management_mode_unknown:hasExpiry:${skuCode}`);

                const registeredDimensions = {
                  length: num(sizeWeight.registerLength ?? raw.registerLength),
                  width: num(sizeWeight.registerWidth ?? raw.registerWidth),
                  height: num(sizeWeight.registerHeight ?? raw.registerHeight),
                  weight: num(sizeWeight.registerWeight ?? raw.registerWeight),
                  unit: "kg",
                };
                const verifiedDimensions = {
                  length: num(sizeWeight.length),
                  width: num(sizeWeight.width),
                  height: num(sizeWeight.height),
                  weight: num(sizeWeight.weight),
                  unit: "kg",
                };
                const hasRegisteredDimensions = Object.values(registeredDimensions).slice(0, 4).some((value) => value != null);
                const hasVerifiedDimensions = Object.values(verifiedDimensions).slice(0, 4).some((value) => value != null);
                const out: Record<string, unknown> = {
                  ...base,
                  supervisorMode,
                  type: ynValue(pickAttrValue(attrs, "hasSuitBoxItem", country)) === true ? "SUITE" : null,
                  itemPackaging,
                  prohibitInbound,
                  prohibitOutbound: null,
                  prohibitReason: null,
                  prohibitSource: "unknown",
                  prohibitInboundReason: prohibitInbound ? "isProhibitWarehousing_or_PI" : null,
                  directShipmentRestriction,
                  restrictionReason: null,
                  rejectReason,
                  standardScript,
                  estimateAuditDate,
                  isUrgent: isUrgentFact.value,
                  itemType: null,
                  registeredDimensions: hasRegisteredDimensions ? registeredDimensions : null,
                  verifiedDimensions: hasVerifiedDimensions ? verifiedDimensions : null,
                  specialFlags: Object.fromEntries(specialFacts.map(([name, fact]) => [name, fact.value])),
                  managementMode: {
                    supervisorMode,
                    isBatchManager: batchManagement.value,
                    batchManagerType,
                    hasExpiry,
                  },
                  applicableRules: battery.value === true ? ["带电品需填报电池信息"] : [],
                  handlingRequirements: [],
                };
                if (profile === "facts_compliance") {
                  out.hsCode = declaration ? asText(declaration.hsCode) || null : null;
                  out.declareName = declaration ? asText(declaration.declareName) || null : null;
                  out.itemLink = pickAttrValue(attrs, "itemLink", country) || null;
                  out.dg = dangerous.value;
                  fieldProvenance.dg = dangerous.provenance;
                }
                if (skuCodeThirds.length > 0) out.skuCodeThirds = skuCodeThirds;
                return out;
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const fetchProfile = normalizeFetchProfile(params.fetchProfile);
                const importCountryCode = asText(params.importCountryCode);
                const rawItems = (Array.isArray(params.rawItems) ? params.rawItems : []) as Record<
                  string,
                  unknown
                >[];
                const prevMeta =
                  params.fetchMeta && typeof params.fetchMeta === "object"
                    ? (params.fetchMeta as Record<string, unknown>)
                    : {};

                const apiProfiles = rawItems.map((raw) =>
                  mapItemToProfile(raw, {
                    fetchProfile,
                    importCountryCode: importCountryCode || undefined,
                    requestedSkuCode: asText(raw._requestedSkuCode) || asText(raw.skuCode),
                  })
                );

                return {
                  apiProfiles,
                  fetchMeta: {
                    ...prevMeta,
                    found: apiProfiles.length,
                    fetchProfile,
                    pruned: true,
                    droppedSections: DROPPED_SECTIONS,
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("prune-and-map-item")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: rawItems
                input:
                    value:
                        path: rawItems
                        ref_node: "163003"
              - name: fetchMeta
                input:
                    value:
                        path: fetchMeta
                        ref_node: "163003"
              - name: fetchProfile
                input:
                    value:
                        path: fetchProfile
                        ref_node: "163001"
              - name: importCountryCode
                input:
                    value:
                        path: importCountryCode
                        ref_node: "163001"
          node_outputs:
              apiProfiles:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              fetchMeta:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163005"
      type: code
      title: derive-from-context
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1667
      parameters:
          code: |-
              /* coze-inline-types: shared/sku-item-page-list.ts */
              type FetchProfile =
                | "facts_core"
                | "audit_status"
                | "barcode_third"
                | "supplement_third_sku"
                | "facts_compliance"
                | "minimal";

              type TriState = boolean | null;

              type ProfileDataSource = "api" | "derived" | "kb" | "missing";

              type ProfileConfidence = "high" | "medium" | "low";

              type ProfileFactSource = "api" | "derived" | "unknown";

              type ProfileScope = {
                /** null 表示显式无租户；来源 scope/属性缺失才表示未知。 */
                customerCode: string | null;
                /** 缺少属性表示国别未知；null 表示显式无国别事实，ALL 表示全局事实。 */
                importCountryCode?: string | null;
              };

              type ProfileFetchMeta = {
                requested?: number;
                found?: number;
                source?: string;
                strategy?: string;
                fetchProfile?: FetchProfile | string;
                pruned?: boolean;
                error?: string;
                [key: string]: unknown;
              };

              type ProfileDimensions = {
                length: number | null;
                width: number | null;
                height: number | null;
                weight: number | null;
                unit: string;
              };

              type ProfileSpecialFlags = {
                isBattery: TriState;
                isWithLiquid: TriState;
                isWithPowder: TriState;
                isWithMagnetism: TriState;
                isFood: TriState;
                isDangerous: TriState;
                isFragile: TriState;
              };

              type ProfileManagementMode = {
                supervisorMode: string | null;
                isBatchManager: TriState;
                batchManagerType: string | null;
                hasExpiry: TriState;
              };

              type ProfileRow = {
                skuCode: string;
                dataSource: ProfileDataSource;
                confidence: ProfileConfidence;
                publishStatus?: string | null;
                isUrgent?: TriState;
                dg?: TriState;
                prohibitInbound?: TriState;
                prohibitOutbound?: TriState;
                itemType?: string | null;
                registeredDimensions?: ProfileDimensions | null;
                verifiedDimensions?: ProfileDimensions | null;
                specialFlags?: ProfileSpecialFlags;
                managementMode?: ProfileManagementMode;
                fieldProvenance?: Record<string, ProfileFactSource>;
                scope?: ProfileScope;
                _missingFacts?: string[];
                _requestedSkuCode?: string;
                [key: string]: unknown;
              };

              /* coze-inline: node */
              /**
               * 节点：合并已映射的 API 档案 + 订单 merchandise 派生降级
               */


              function asText(v: unknown): string {
                return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
              }

              function asRecord(v: unknown): Record<string, unknown> {
                return v && typeof v === "object" && !Array.isArray(v) ? (v as Record<string, unknown>) : {};
              }

              function hasOwn(record: Record<string, unknown>, key: string): boolean {
                return Object.prototype.hasOwnProperty.call(record, key);
              }

              function ynValue(v: unknown): boolean | null {
                const s = asText(v).toUpperCase();
                if (s === "Y" || s === "TRUE" || s === "1") return true;
                if (s === "N" || s === "FALSE" || s === "0") return false;
                return null;
              }

              function num(v: unknown): number | null {
                if (v == null || v === "") return null;
                const n = Number(v);
                return Number.isFinite(n) ? n : null;
              }

              /** 已映射契约行（含 dataSource）直接采用；否则视为未映射 */
              function isMappedProfile(row: ProfileRow): boolean {
                return row.dataSource === "api" || (row.publishStatus != null && row.specialFlags != null);
              }

              type DerivedProvenance = Extract<ProfileFactSource, "derived" | "unknown">;

              const PROFILE_DATA_SOURCES = new Set<ProfileDataSource>(["api", "derived", "kb", "missing"]);

              function toProfileRow(v: unknown): ProfileRow | null {
                const row = asRecord(v);
                const skuCode = asText(row.skuCode);
                const dataSource = asText(row.dataSource) as ProfileDataSource;
                const confidence = asText(row.confidence);
                if (!skuCode || !PROFILE_DATA_SOURCES.has(dataSource)) return null;
                if (confidence !== "high" && confidence !== "medium" && confidence !== "low") return null;
                return row as ProfileRow;
              }

              function currentScope(params: Record<string, unknown>): ProfileScope {
                const scope: ProfileScope = {
                  customerCode: asText(params.customerCode) || null,
                };
                const importCountryCode = asText(params.importCountryCode).toUpperCase();
                if (importCountryCode) scope.importCountryCode = importCountryCode;
                return scope;
              }

              type ParsedScope = {
                customerCode: string | null;
                importCountryCode: string | null;
                hasCustomerCode: boolean;
                hasImportCountryCode: boolean;
              };

              function parseScope(value: unknown): ParsedScope {
                const scope = asRecord(value);
                return {
                  customerCode: hasOwn(scope, "customerCode")
                    ? asText(scope.customerCode).toUpperCase() || null
                    : null,
                  importCountryCode: hasOwn(scope, "importCountryCode")
                    ? asText(scope.importCountryCode).toUpperCase() || null
                    : null,
                  hasCustomerCode: hasOwn(scope, "customerCode"),
                  hasImportCountryCode: hasOwn(scope, "importCountryCode"),
                };
              }

              function scopeForNewRow(current: ProfileScope, sourceValue?: unknown): ProfileScope {
                const scope: ProfileScope = { customerCode: current.customerCode };
                if (hasOwn(asRecord(current), "importCountryCode")) {
                  scope.importCountryCode = current.importCountryCode ?? null;
                  return scope;
                }
                const source = parseScope(sourceValue);
                if (source.hasImportCountryCode) {
                  scope.importCountryCode = source.importCountryCode;
                }
                return scope;
              }

              function checkScope(
                current: ProfileScope,
                sourceValue: unknown,
                skuCode: string
              ): { reusable: boolean; missingFacts: string[] } {
                const source = parseScope(sourceValue);
                const requested = parseScope(current);
                const facts: string[] = [];
                let unknown = false;

                if (!source.hasCustomerCode) {
                  unknown = true;
                } else if (requested.customerCode == null) {
                  if (source.customerCode != null && source.customerCode !== "ALL") {
                    facts.push(`scope_mismatch:customerCode:${skuCode}`);
                  }
                } else if (
                  source.customerCode !== "ALL" &&
                  (source.customerCode == null ||
                    source.customerCode.toUpperCase() !== requested.customerCode.toUpperCase())
                ) {
                  facts.push(`scope_mismatch:customerCode:${skuCode}`);
                }

                if (!source.hasImportCountryCode) {
                  unknown = true;
                } else if (!requested.hasImportCountryCode || requested.importCountryCode == null) {
                  if (source.importCountryCode != null && source.importCountryCode !== "ALL") {
                    facts.push(`scope_mismatch:importCountryCode:${skuCode}`);
                  }
                } else if (
                  source.importCountryCode !== "ALL" &&
                  (source.importCountryCode == null ||
                    source.importCountryCode !== requested.importCountryCode)
                ) {
                  facts.push(`scope_mismatch:importCountryCode:${skuCode}`);
                }

                if (unknown) facts.push(`scope_unknown:${skuCode}`);
                return { reusable: facts.length === 0, missingFacts: facts };
              }

              function factBelongsToSku(fact: string, skuCode: string): boolean {
                return fact.toUpperCase().endsWith(`:${skuCode.toUpperCase()}`);
              }

              function readDerivedBoolean(
                row: Record<string, unknown>,
                names: string[]
              ): { value: boolean | null; provenance: DerivedProvenance } {
                for (const name of names) {
                  if (!hasOwn(row, name)) continue;
                  const value = ynValue(row[name]);
                  if (value != null) return { value, provenance: "derived" };
                }
                return { value: null, provenance: "unknown" };
              }

              function mapMerchandise(m: Record<string, unknown>, skuCode: string): ProfileRow {
                const weight = num(m.weight ?? m.registerWeight);
                const length = num(m.length ?? m.registerLength);
                const width = num(m.width ?? m.registerWidth);
                const height = num(m.height ?? m.registerHeight);
                const hasDims = length != null || width != null || height != null || weight != null;
                const publishStatus = asText(m.publishStatus) || null;
                const prohibitInbound = readDerivedBoolean(m, ["prohibitInbound"]);
                const prohibitOutbound = readDerivedBoolean(m, ["prohibitOutbound"]);
                const battery = readDerivedBoolean(m, ["hasBattery", "isBattery"]);
                const liquid = readDerivedBoolean(m, ["isWithLiquid", "isLiquid"]);
                const powder = readDerivedBoolean(m, ["isWithPowder", "isPowder"]);
                const magnetism = readDerivedBoolean(m, ["isWithMagnetism"]);
                const food = readDerivedBoolean(m, ["isFood"]);
                const dangerous = readDerivedBoolean(m, ["isDangerous"]);
                const fragile = readDerivedBoolean(m, ["isFragile"]);
                const batchManager = readDerivedBoolean(m, ["isBatchManager", "batchManagement"]);
                const batchManagerType = asText(m.batchManagerType ?? m.batchManagementType) || null;
                const explicitExpiry = readDerivedBoolean(m, ["hasExpiry"]);
                const hasExpiry =
                  explicitExpiry.value != null
                    ? explicitExpiry
                    : batchManagerType != null
                      ? {
                          value:
                            batchManagerType.toUpperCase().includes("SHELF") || batchManagerType.includes("ED"),
                          provenance: "derived" as const,
                        }
                      : batchManager.value === false
                        ? { value: false, provenance: "derived" as const }
                        : { value: null, provenance: "unknown" as const };
                const supervisorMode = asText(m.supervisorMode) || null;
                const fieldProvenance: Record<string, DerivedProvenance> = {
                  publishStatus: publishStatus == null ? "unknown" : "derived",
                  prohibitInbound: prohibitInbound.provenance,
                  prohibitOutbound: prohibitOutbound.provenance,
                  "specialFlags.isBattery": battery.provenance,
                  "specialFlags.isWithLiquid": liquid.provenance,
                  "specialFlags.isWithPowder": powder.provenance,
                  "specialFlags.isWithMagnetism": magnetism.provenance,
                  "specialFlags.isFood": food.provenance,
                  "specialFlags.isDangerous": dangerous.provenance,
                  "specialFlags.isFragile": fragile.provenance,
                  "managementMode.isBatchManager": batchManager.provenance,
                  "managementMode.batchManagerType": batchManagerType == null ? "unknown" : "derived",
                  "managementMode.hasExpiry": hasExpiry.provenance,
                };
                const missingFacts: string[] = [];
                if (publishStatus == null) missingFacts.push(`publish_status_unknown:${skuCode}`);
                if (prohibitInbound.value == null) missingFacts.push(`prohibit_inbound_unknown:${skuCode}`);
                if (prohibitOutbound.value == null) missingFacts.push(`prohibit_outbound_unknown:${skuCode}`);
                const specialFacts: Array<[string, boolean | null]> = [
                  ["isBattery", battery.value],
                  ["isWithLiquid", liquid.value],
                  ["isWithPowder", powder.value],
                  ["isWithMagnetism", magnetism.value],
                  ["isFood", food.value],
                  ["isDangerous", dangerous.value],
                  ["isFragile", fragile.value],
                ];
                for (const [name, value] of specialFacts) {
                  if (value == null) missingFacts.push(`special_flag_unknown:${name}:${skuCode}`);
                }
                if (batchManager.value == null) {
                  missingFacts.push(`management_mode_unknown:isBatchManager:${skuCode}`);
                }
                if (batchManagerType == null) {
                  missingFacts.push(`management_mode_unknown:batchManagerType:${skuCode}`);
                }
                if (hasExpiry.value == null) {
                  missingFacts.push(`management_mode_unknown:hasExpiry:${skuCode}`);
                }

                return {
                  skuCode,
                  code: null,
                  specification: null,
                  supervisorMode,
                  type: null,
                  itemPackaging: null,
                  isActive: null,
                  publishStatus,
                  prohibitInbound: prohibitInbound.value,
                  prohibitOutbound: prohibitOutbound.value,
                  prohibitReason: null,
                  prohibitSource: "unknown",
                  prohibitInboundReason: null,
                  directShipmentRestriction: null,
                  restrictionReason: null,
                  rejectReason: null,
                  itemType: null,
                  registeredDimensions: hasDims
                    ? { length, width, height, weight, unit: "kg" }
                    : null,
                  verifiedDimensions: null,
                  specialFlags: {
                    isBattery: battery.value,
                    isWithLiquid: liquid.value,
                    isWithPowder: powder.value,
                    isWithMagnetism: magnetism.value,
                    isFood: food.value,
                    isDangerous: dangerous.value,
                    isFragile: fragile.value,
                  },
                  managementMode: {
                    supervisorMode,
                    isBatchManager: batchManager.value,
                    batchManagerType,
                    hasExpiry: hasExpiry.value,
                  },
                  applicableRules: battery.value === true ? ["带电品需填报电池信息"] : [],
                  handlingRequirements: [],
                  fieldProvenance,
                  _missingFacts: missingFacts,
                  dataSource: "derived",
                  confidence: "medium",
                };
              }

              type ContextCandidates = {
                merchandise: Map<string, Record<string, unknown>>;
                profiles: Map<string, { row: ProfileRow; missingFacts: string[] }>;
              };

              function collectContextCandidates(inputContext: Record<string, unknown>): ContextCandidates {
                const merchandise = new Map<string, Record<string, unknown>>();
                const profiles = new Map<string, { row: ProfileRow; missingFacts: string[] }>();
                const previousOutput = asRecord(inputContext.previousOutput);
                const structured = asRecord(previousOutput.structured);
                const lists: unknown[] = [];
                if (Array.isArray(structured.merchandiseList)) lists.push(...structured.merchandiseList);
                if (Array.isArray(previousOutput.merchandiseList)) lists.push(...previousOutput.merchandiseList);

                const enriched = asRecord(inputContext.enrichedContext);
                for (const v of Object.values(enriched)) {
                  const rec = asRecord(v);
                  const containerMissingFacts = Array.isArray(rec.missingFacts)
                    ? rec.missingFacts.map(String)
                    : [];
                  const containerScope = asRecord(rec.scope);
                  if (Array.isArray(rec.merchandiseList)) lists.push(...rec.merchandiseList);
                  if (Array.isArray(rec.skus)) {
                    for (const s of rec.skus) {
                      const sourceRow = toProfileRow(s);
                      if (sourceRow) {
                        const row: ProfileRow =
                          sourceRow.scope == null && Object.keys(containerScope).length > 0
                            ? { ...sourceRow, scope: containerScope as ProfileScope }
                            : sourceRow;
                        profiles.set(row.skuCode.toUpperCase(), {
                          row,
                          missingFacts: containerMissingFacts.filter((fact) =>
                            factBelongsToSku(fact, row.skuCode)
                          ),
                        });
                      }
                    }
                  }
                }

                for (const item of lists) {
                  const row = asRecord(item);
                  const code = asText(row.skuCode ?? row.merchandiseCode ?? row.productCode);
                  if (code) merchandise.set(code.toUpperCase(), row);
                }
                return { merchandise, profiles };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const requested = ((params.normalizedSkuCodes as string[]) ?? []).map((c) => asText(c)).filter(Boolean);
                const apiProfiles = (Array.isArray(params.apiProfiles) ? params.apiProfiles : [])
                  .map(toProfileRow)
                  .filter((row): row is ProfileRow => row != null);
                const inputContext = asRecord(params.inputContext);
                const context = collectContextCandidates(inputContext);
                const scope = currentScope(params);
                const fetchMeta = asRecord(params.fetchMeta) as ProfileFetchMeta;
                const fetchError = asText(fetchMeta.error);
                const fetchSource = asText(fetchMeta.source).toLowerCase();
                const fetchStrategy = asText(fetchMeta.strategy).toLowerCase();
                const apiUnavailable =
                  fetchError !== "" ||
                  fetchSource === "none" ||
                  fetchSource === "unavailable" ||
                  fetchStrategy === "no-plugin-no-env" ||
                  fetchStrategy === "unavailable";
                const missingFacts: string[] = [];
                const mergedProfiles: ProfileRow[] = [];

                const apiByCode = new Map<string, ProfileRow>();
                for (const row of apiProfiles) {
                  const req = asText(row._requestedSkuCode) || asText(row.skuCode);
                  if (req) apiByCode.set(req.toUpperCase(), row);
                }

                for (const code of requested) {
                  const key = code.toUpperCase();
                  const apiRow = apiByCode.get(key);
                  if (apiRow && isMappedProfile(apiRow)) {
                    const mapped: ProfileRow = { ...apiRow, scope: scopeForNewRow(scope, apiRow.scope) };
                    delete mapped._requestedSkuCode;
                    const mappedMissingFacts = Array.isArray(mapped._missingFacts)
                      ? mapped._missingFacts.map(String)
                      : [];
                    delete mapped._missingFacts;
                    missingFacts.push(...mappedMissingFacts);
                    if (!Array.isArray(mapped.applicableRules)) mapped.applicableRules = [];
                    if (mapped.type == null) {
                      missingFacts.push(`box_suite_type_unknown:${code}`);
                    }
                    if (mapped.prohibitSource === "unknown") {
                      missingFacts.push(`prohibit_source_unknown:${code}`);
                    }
                    mergedProfiles.push(mapped);
                    continue;
                  }

                  if (apiUnavailable) {
                    if (fetchError) missingFacts.push(`profile_fetch_error:${code}`);
                    missingFacts.push(`api_unavailable:${code}`);
                  }

                  const contextProfile = context.profiles.get(key);
                  let contextProfileBlocked = false;
                  if (contextProfile) {
                    const scopeCheck = checkScope(scope, contextProfile.row.scope, code);
                    if (!scopeCheck.reusable) {
                      missingFacts.push(...scopeCheck.missingFacts);
                      contextProfileBlocked = true;
                    } else {
                      const reused: ProfileRow = { ...contextProfile.row, skuCode: code };
                      delete reused._requestedSkuCode;
                      const reusedMissingFacts = Array.isArray(reused._missingFacts)
                        ? reused._missingFacts.map(String)
                        : [];
                      delete reused._missingFacts;
                      const contextMissingFacts = contextProfile.missingFacts.filter(
                        (fact) => !(apiUnavailable && fact === `sku_not_found:${code}`)
                      );
                      missingFacts.push(...reusedMissingFacts, ...contextMissingFacts);
                      if (
                        reused.dataSource === "missing" &&
                        !apiUnavailable &&
                        !contextProfile.missingFacts.some((fact) => fact === `sku_not_found:${code}`)
                      ) {
                        missingFacts.push(`sku_not_found:${code}`);
                      }
                      mergedProfiles.push(reused);
                      continue;
                    }
                  }

                  const merch = contextProfileBlocked ? undefined : context.merchandise.get(key);
                  if (merch) {
                    const derived: ProfileRow = { ...mapMerchandise(merch, code), scope };
                    const derivedMissingFacts = Array.isArray(derived._missingFacts)
                      ? derived._missingFacts.map(String)
                      : [];
                    delete derived._missingFacts;
                    const derivedGaps = apiUnavailable ? [] : [`api_miss_derived:${code}`];
                    if (!asText(derived.supervisorMode)) {
                      derivedGaps.push(`supervisorMode_unknown:${code}`);
                    }
                    if (derived.prohibitInbound == null || derived.prohibitOutbound == null) {
                      derivedGaps.push(`prohibit_fields_unconfirmed:${code}`);
                    }
                    missingFacts.push(...derivedGaps, ...derivedMissingFacts);
                    mergedProfiles.push(derived);
                    continue;
                  }

                  if (!apiUnavailable) missingFacts.push(`sku_not_found:${code}`);
                  mergedProfiles.push({
                    skuCode: code,
                    dataSource: "missing",
                    confidence: "low",
                    scope,
                  });
                }

                return { mergedProfiles, missingFacts: [...new Set(missingFacts)] };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("derive-from-context")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: normalizedSkuCodes
                input:
                    value:
                        path: normalizedSkuCodes
                        ref_node: "163000"
              - name: apiProfiles
                input:
                    value:
                        path: apiProfiles
                        ref_node: "163004"
              - name: fetchMeta
                input:
                    value:
                        path: fetchMeta
                        ref_node: "163004"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "163000"
              - name: customerCode
                input:
                    value:
                        path: customerCode
                        ref_node: "100001"
              - name: importCountryCode
                input:
                    value:
                        path: importCountryCode
                        ref_node: "163000"
          node_outputs:
              mergedProfiles:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              missingFacts:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163006"
      type: code
      title: calc-item-type-from-kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 1907
      parameters:
          code: |-
              /* coze-inline-types: shared/sku-item-page-list.ts */
              type TriState = boolean | null;

              type ProfileDataSource = "api" | "derived" | "kb" | "missing";

              type ProfileConfidence = "high" | "medium" | "low";

              type ProfileFactSource = "api" | "derived" | "unknown";

              type ProfileScope = {
                /** null 表示显式无租户；来源 scope/属性缺失才表示未知。 */
                customerCode: string | null;
                /** 缺少属性表示国别未知；null 表示显式无国别事实，ALL 表示全局事实。 */
                importCountryCode?: string | null;
              };

              type ProfileDimensions = {
                length: number | null;
                width: number | null;
                height: number | null;
                weight: number | null;
                unit: string;
              };

              type ProfileSpecialFlags = {
                isBattery: TriState;
                isWithLiquid: TriState;
                isWithPowder: TriState;
                isWithMagnetism: TriState;
                isFood: TriState;
                isDangerous: TriState;
                isFragile: TriState;
              };

              type ProfileManagementMode = {
                supervisorMode: string | null;
                isBatchManager: TriState;
                batchManagerType: string | null;
                hasExpiry: TriState;
              };

              type ProfileRow = {
                skuCode: string;
                dataSource: ProfileDataSource;
                confidence: ProfileConfidence;
                publishStatus?: string | null;
                isUrgent?: TriState;
                dg?: TriState;
                prohibitInbound?: TriState;
                prohibitOutbound?: TriState;
                itemType?: string | null;
                registeredDimensions?: ProfileDimensions | null;
                verifiedDimensions?: ProfileDimensions | null;
                specialFlags?: ProfileSpecialFlags;
                managementMode?: ProfileManagementMode;
                fieldProvenance?: Record<string, ProfileFactSource>;
                scope?: ProfileScope;
                _missingFacts?: string[];
                _requestedSkuCode?: string;
                [key: string]: unknown;
              };

              /* coze-inline: node */
              /**
               * 节点：按内嵌最小货型阈值补算 itemType（不依赖 gitignore _kb）
               *
               * 启发式（实现期可替换为正式货型标准 textNode）：
               * - small: 最长边 ≤ 45cm 且重量 ≤ 2kg
               * - medium: 最长边 ≤ 60cm 且重量 ≤ 15kg
               * - large: 最长边 ≤ 120cm 且重量 ≤ 30kg
               * - oversized: 其余或无法判断但有尺重时按 oversized；无尺重则保持 null
               */


              function asRecord(v: unknown): Record<string, unknown> {
                return v && typeof v === "object" && !Array.isArray(v) ? (v as Record<string, unknown>) : {};
              }

              function num(v: unknown): number | null {
                if (v == null || v === "") return null;
                const n = Number(v);
                return Number.isFinite(n) ? n : null;
              }

              function calcItemType(dims: ProfileDimensions | null): string | null {
                if (!dims) return null;
                const length = num(dims.length);
                const width = num(dims.width);
                const height = num(dims.height);
                const weight = num(dims.weight);
                if (
                  length == null ||
                  width == null ||
                  height == null ||
                  weight == null ||
                  length <= 0 ||
                  width <= 0 ||
                  height <= 0 ||
                  weight <= 0
                ) {
                  return null;
                }
                const longest = Math.max(length, width, height);
                if (longest <= 45 && weight <= 2) return "small";
                if (longest <= 60 && weight <= 15) return "medium";
                if (longest <= 120 && weight <= 30) return "large";
                return "oversized";
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const merged = (Array.isArray(params.mergedProfiles) ? params.mergedProfiles : []) as ProfileRow[];
                const missingFacts = (Array.isArray(params.missingFacts) ? params.missingFacts : []).map(String);
                const skus: ProfileRow[] = [];

                for (const profile of merged) {
                  const next = { ...profile };
                  const existing = typeof next.itemType === "string" && next.itemType ? next.itemType : null;
                  if (!existing) {
                    const dims = asRecord(next.registeredDimensions) as ProfileDimensions;
                    const dimsOrNull = Object.keys(dims).length ? dims : null;
                    const computed = calcItemType(dimsOrNull);
                    if (computed) {
                      next.itemType = computed;
                      if (next.dataSource === "api") {
                        // itemType 为 KB 计算，保留 api 事实源，但 confidence 不因件型单独下调
                      } else if (next.dataSource === "derived") {
                        next.dataSource = "derived";
                      } else {
                        next.dataSource = next.dataSource || "kb";
                      }
                    } else {
                      missingFacts.push(`itemType_unknown:${String(next.skuCode ?? "")}`);
                    }
                  }
                  skus.push(next);
                }

                return { skus, missingFacts: [...new Set(missingFacts)] };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("calc-item-type-from-kb")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: mergedProfiles
                input:
                    value:
                        path: mergedProfiles
                        ref_node: "163005"
              - name: missingFacts
                input:
                    value:
                        path: missingFacts
                        ref_node: "163005"
          node_outputs:
              skus:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              missingFacts:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163007"
      type: code
      title: format-output
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 2147
      parameters:
          code: |-
              /**
               * 节点：format-output — 组装 structured / analysis / enrichedContext.sku/profile
               */

              function asText(v: unknown): string {
                return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
              }

              function asRecord(v: unknown): Record<string, unknown> {
                return v && typeof v === "object" && !Array.isArray(v) ? (v as Record<string, unknown>) : {};
              }

              function summarizeSkus(skus: Record<string, unknown>[]): string {
                if (skus.length === 0) return "未获取到 SKU 档案。";
                const parts = skus.map((s) => {
                  const code = asText(s.skuCode) || "?";
                  const src = asText(s.dataSource) || "unknown";
                  if (src === "missing") return `${code}：未找到档案（missing）`;
                  const itemType = asText(s.itemType) || "件型未知";
                  const flags = asRecord(s.specialFlags);
                  const flagDefinitions: Array<[string, string]> = [
                    ["isBattery", "带电"],
                    ["isWithLiquid", "液体"],
                    ["isWithPowder", "粉末"],
                    ["isWithMagnetism", "磁性"],
                    ["isFood", "食品"],
                    ["isDangerous", "危险品"],
                    ["isFragile", "易碎"],
                  ];
                  const attrs: string[] = [];
                  let hasUnknownFlag = false;
                  for (const [field, label] of flagDefinitions) {
                    if (flags[field] === true) attrs.push(label);
                    else if (flags[field] !== false) hasUnknownFlag = true;
                  }
                  const attrText = attrs.length
                    ? `${attrs.join("/")}${hasUnknownFlag ? "（其余特殊属性未完整确认）" : ""}`
                    : hasUnknownFlag
                      ? "特殊属性未完整确认"
                      : "无特殊属性标记";
                  const mode = asText(asRecord(s.managementMode).supervisorMode) || asText(s.supervisorMode) || "管理模式未知";
                  return `${code}：${itemType}，${attrText}，${mode}（${src}）`;
                });
                return parts.join("；") + "。禁限来源/直发原因等 Gap 字段见 missingFacts，未编造。";
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const validationError = asText(params.validationError);
                const inputContext = asRecord(params.inputContext);
                const skus = (Array.isArray(params.skus) ? params.skus : []) as Record<string, unknown>[];
                const missingFacts = (Array.isArray(params.missingFacts) ? params.missingFacts : []).map(String);
                const fetchMeta = asRecord(params.fetchMeta);

                if (validationError === "skuCodes_required") {
                  const structured = {
                    skus: [],
                    missingFacts: ["skuCodes_required"],
                    fetchMeta: { requested: 0, found: 0, source: "none", strategy: "none" },
                  };
                  const analysis = "请提供至少一个商品编码 skuCodes（与注册侧 productCode 同义）。";
                  return {
                    structured,
                    analysis,
                    outputContext: {
                      expertId: "sku/profile",
                      resultSummary: analysis.slice(0, 200),
                      chainId: asText(inputContext.chainId),
                    },
                    enrichedContext: {
                      "sku/profile": structured,
                    },
                  };
                }

                const facts = [...missingFacts];
                if (validationError.startsWith("skuCodes_truncated")) {
                  facts.push(validationError);
                }

                const structured = {
                  skus,
                  missingFacts: [...new Set(facts)],
                  fetchMeta: {
                    requested: fetchMeta.requested ?? skus.length,
                    found: fetchMeta.found ?? skus.filter((s) => s.dataSource === "api").length,
                    source: fetchMeta.source ?? "winit.mms.item.list",
                    strategy: asText(fetchMeta.strategy) || "unknown",
                  },
                };

                const analysis = summarizeSkus(skus);

                return {
                  structured,
                  analysis,
                  outputContext: {
                    expertId: "sku/profile",
                    resultSummary: analysis.slice(0, 200),
                    chainId: asText(inputContext.chainId),
                  },
                  enrichedContext: {
                    "sku/profile": {
                      skus,
                      missingFacts: structured.missingFacts,
                      fetchMeta: structured.fetchMeta,
                    },
                  },
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("format-output")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e instanceof Error ? e.message : "format-output failed");
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: skus
                input:
                    value:
                        path: skus
                        ref_node: "163006"
              - name: missingFacts
                input:
                    value:
                        path: missingFacts
                        ref_node: "163006"
              - name: fetchMeta
