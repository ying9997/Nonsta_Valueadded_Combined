    - id: "163000"
      type: code
      title: validate-sku-codes
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 467
      parameters:
          code: |-
              /**
               * 节点：校验并归一化商品编码列表
               * - 支持 productCode 同义（若 skuCodes 为空且有 productCodes 则不用；调用方应把 productCode 放入 skuCodes）
               * - 去重、上限 20
               * - 透传 fetchProfile（非法值回落 facts_core）
               */
              const MAX_SKU_CODES = 20;
              const VALID_FETCH_PROFILES = new Set([
                "facts_core",
                "audit_status",
                "barcode_third",
                "supplement_third_sku",
                "facts_compliance",
                "minimal",
              ]);

              function normalizeFetchProfile(v: unknown): string {
                const value = typeof v === "string" ? v.trim() : "";
                return VALID_FETCH_PROFILES.has(value) ? value : "facts_core";
              }

              function asText(v: unknown): string {
                return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
              }

              function asRecord(v: unknown): Record<string, unknown> {
                return v && typeof v === "object" && !Array.isArray(v) ? (v as Record<string, unknown>) : {};
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const inputContext = asRecord(params.inputContext);
                const warehouseCode = asText(params.warehouseCode);
                const importCountryCode = asText(params.importCountryCode);
                const fetchProfile = normalizeFetchProfile(params.fetchProfile);

                const rawList = Array.isArray(params.skuCodes) ? params.skuCodes : [];
                const seen = new Set<string>();
                const normalizedSkuCodes: string[] = [];
                for (const item of rawList) {
                  const code = asText(item);
                  if (!code) continue;
                  const key = code.toUpperCase();
                  if (seen.has(key)) continue;
                  seen.add(key);
                  normalizedSkuCodes.push(code);
                }

                if (normalizedSkuCodes.length === 0) {
                  return {
                    normalizedSkuCodes: [],
                    warehouseCode,
                    importCountryCode,
                    fetchProfile,
                    skipApi: true,
                    validationError: "skuCodes_required",
                    inputContext,
                  };
                }

                if (normalizedSkuCodes.length > MAX_SKU_CODES) {
                  return {
                    normalizedSkuCodes: normalizedSkuCodes.slice(0, MAX_SKU_CODES),
                    warehouseCode,
                    importCountryCode,
                    fetchProfile,
                    skipApi: false,
                    validationError: `skuCodes_truncated_to_${MAX_SKU_CODES}`,
                    inputContext,
                  };
                }

                return {
                  normalizedSkuCodes,
                  warehouseCode,
                  importCountryCode,
                  fetchProfile,
                  skipApi: false,
                  validationError: "",
                  inputContext,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("validate-sku-codes")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skuCodes
                input:
                    value:
                        path: inputs.skuCodes
                        ref_node: "100001"
              - name: warehouseCode
                input:
                    value:
                        path: inputs.warehouseCode
                        ref_node: "100001"
              - name: importCountryCode
                input:
                    value:
                        path: inputs.importCountryCode
                        ref_node: "100001"
              - name: fetchProfile
                input:
                    value:
                        path: inputs.fetchProfile
                        ref_node: "100001"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "100001"
          node_outputs:
              normalizedSkuCodes:
                  type: list
                  items:
                      type: string
                      value: null
                  value: null
              warehouseCode:
                  type: string
                  value: null
              importCountryCode:
                  type: string
                  value: null
              fetchProfile:
                  type: string
                  value: null
              skipApi:
                  type: boolean
                  value: null
              validationError:
                  type: string
                  value: null
              inputContext:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163001"
      type: code
      title: resolve-fetch-plan
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 707
      parameters:
          code: |-
              /**
               * 节点：按 fetchProfile 组装 winit.item.page.list 单次批量请求
               */
              const PAGE_LIST_ACTION = "winit.item.page.list";
              const VALID_FETCH_PROFILES = new Set([
                "facts_core",
                "audit_status",
                "barcode_third",
                "supplement_third_sku",
                "facts_compliance",
                "minimal",
              ]);

              function asText(value: unknown): string {
                return typeof value === "string" ? value.trim() : value == null ? "" : String(value).trim();
              }

              function normalizeFetchProfile(value: unknown): string {
                const profile = asText(value);
                return VALID_FETCH_PROFILES.has(profile) ? profile : "facts_core";
              }

              function buildPageListAction(opts: {
                skuCodes: string[];
                importCountryCode?: string;
                fetchProfile: string;
              }): { action: string; data: string } {
                const codes = opts.skuCodes.map(asText).filter(Boolean);
                const supplementThirdSku = opts.fetchProfile === "supplement_third_sku";
                const data: Record<string, unknown> = {
                  pageVo: {
                    pageNo: 1,
                    pageSize: supplementThirdSku ? 50 : Math.min(Math.max(codes.length, 1), 20),
                  },
                  conditionQueryType: "equals",
                };
                const country = asText(opts.importCountryCode);
                if (country) data.importCountryCode = country;
                if (codes.length > 0) data.skuCodes = codes;
                if (supplementThirdSku) data.querySupplementType = "SUPPLEMENT_THRID_SKU";
                if (opts.fetchProfile === "audit_status") data.queryType = "REGISTERING";
                return { action: PAGE_LIST_ACTION, data: JSON.stringify(data) };
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const fetchProfile = normalizeFetchProfile(params.fetchProfile);
                const importCountryCode =
                  typeof params.importCountryCode === "string" ? params.importCountryCode.trim() : "";

                if (params.skipApi === true) {
                  return {
                    actions: [],
                    actionPlans: [],
                    winitPluginBatchActionsCount: 0,
                    actionName: PAGE_LIST_ACTION,
                    fetchProfile,
                    importCountryCode,
                    skipApi: true,
                  };
                }

                const codes = ((params.normalizedSkuCodes as string[]) ?? []).filter(
                  (c) => typeof c === "string" && c.trim()
                );
                const action = buildPageListAction({
                  skuCodes: codes,
                  importCountryCode: importCountryCode || undefined,
                  fetchProfile,
                });

                const actionPlans = codes.map((skuCode) => ({ inputToken: skuCode, skuCode }));

                return {
                  actions: [action],
                  actionPlans,
                  winitPluginBatchActionsCount: 1,
                  actionName: PAGE_LIST_ACTION,
                  fetchProfile,
                  importCountryCode,
                  skipApi: false,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("resolve-fetch-plan")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params }).then((r) => process.stdout.write(JSON.stringify(r)));
              }
          language: 5
          node_inputs:
              - name: skipApi
                input:
                    value:
                        path: skipApi
                        ref_node: "163000"
              - name: normalizedSkuCodes
                input:
                    value:
                        path: normalizedSkuCodes
                        ref_node: "163000"
              - name: importCountryCode
                input:
                    value:
                        path: importCountryCode
                        ref_node: "163000"
              - name: fetchProfile
                input:
                    value:
                        path: fetchProfile
                        ref_node: "163000"
          node_outputs:
              actions:
                  type: list
                  items:
                      type: object
                      value: null
                      properties:
                          action:
                              type: string
                              value: null
                          data:
                              type: string
                              value: null
                  value: null
              actionPlans:
                  type: list
                  items:
                      type: object
                      value: null
                  value: null
              winitPluginBatchActionsCount:
                  type: integer
                  value: null
              actionName:
                  type: string
                  value: null
              fetchProfile:
                  type: string
                  value: null
              importCountryCode:
                  type: string
                  value: null
              skipApi:
                  type: boolean
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
