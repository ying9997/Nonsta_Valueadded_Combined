    - id: "163000"
      type: code
      title: validate-intent
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Code-v2.jpg
      description: 编写代码，处理输入变量来生成返回值
      version: v2
      position:
          x: 480
          y: 467
      parameters:
          code: |-
              /**
               * 节点：validate-intent — 归一 intentType / topic；透传条码相关入参
               */

              type IntentType =
                | "print"
                | "third_party_add"
                | "third_party_delete"
                | "third_party_query"
                | "scan_fail"
                | "general";

              type IntentSource = "explicit" | "detected" | "fallback";

              const ALLOWED = new Set<string>([
                "print",
                "third_party_add",
                "third_party_delete",
                "third_party_query",
                "scan_fail",
                "general",
              ]);

              const INTENT_PATTERNS: Array<{ type: IntentType; patterns: RegExp[] }> = [
                {
                  type: "third_party_delete",
                  patterns: [/删除三方|删掉三方|解除绑定|解绑.*码|删除.*条码|删除.*FNSKU|删.*第三方/i],
                },
                {
                  type: "scan_fail",
                  patterns: [/扫不上|扫不到|扫不了|扫描不了|无法扫描|无法识别|扫码失败|扫描失败|仓库.*扫|扫码异常/i],
                },
                {
                  type: "third_party_query",
                  patterns: [/查询三方|查看三方|查.*第三方.*码|单品条码.*状态|有没有绑|是否已绑/i],
                },
                {
                  type: "third_party_add",
                  patterns: [
                    /(?:绑定|绑码|新增|添加|补绑|补充|维护|录入).*(?:第三方|三方|FNSKU|条码|识别码)/i,
                    /(?:第三方|三方|FNSKU|条码|识别码).*(?:绑定|绑码|新增|添加|补|补绑|维护|录入)/i,
                    /(?:怎么|如何|需要|我要|要)\s*(?:绑定|绑|新增|添加|补|补绑|维护|录入)/i,
                  ],
                },
                {
                  type: "print",
                  patterns: [/打印.*条码|打印.*标签|打标|条码标签|怎么打印|重贴标签|重新贴标签|换标|重打标签/i],
                },
              ];

              function str(v: unknown): string {
                return typeof v === "string" ? v.trim() : v == null ? "" : String(v).trim();
              }

              function asRecord(v: unknown): Record<string, unknown> {
                return v && typeof v === "object" && !Array.isArray(v) ? (v as Record<string, unknown>) : {};
              }

              function detectIntent(text: string): IntentType {
                for (const { type, patterns } of INTENT_PATTERNS) {
                  if (patterns.some((p) => p.test(text))) return type;
                }
                return "general";
              }

              function normalizeSupervisorMode(raw: string): string {
                const u = raw.toUpperCase();
                if (u === "SI" || u === "SKU") return u;
                if (/单品/.test(raw)) return "SI";
                if (/商品化|商品管理/.test(raw)) return "SKU";
                return u;
              }

              function detectUnsupportedBoundary(text: string): string {
                const mentionsSCode = /S\s*码/i.test(text);
                const mentionsSku = /SKU|商品编码/i.test(text);
                const compactText = text.replace(/\s+/g, "");
                const sCodeIndex = compactText.search(/S码/i);
                const skuIndex = compactText.search(/SKU|商品编码/i);
                const hasLookupSemantics = /反查|查到|查下|查询|查|找到|哪个|哪一个|什么|确认|对应/i.test(
                  compactText
                );
                const explicitlyUsesSCodeAsKey = /(?:通过|使用|用|拿|凭|仅凭|只凭|根据|从|由|按).*S码/i.test(
                  compactText
                );
                const asksAbstractRelationship =
                  /S码(?:和|与)(?:SKU|商品编码)|(?:SKU|商品编码)(?:和|与)S码/i.test(
                    compactText
                  );
                const sCodePrecedesSku = sCodeIndex >= 0 && skuIndex >= 0 && sCodeIndex < skuIndex;
                if (
                  mentionsSCode &&
                  mentionsSku &&
                  hasLookupSemantics &&
                  !asksAbstractRelationship &&
                  (sCodePrecedesSku || explicitlyUsesSCodeAsKey)
                ) {
                  return "unsupported_s_code_reverse_lookup";
                }
                const mentionsThirdPartyCode = /(?:第三方|三方).*码/i.test(text);
                const mentionsMultiplicity =
                  /多个|多条|多少(?:个)?|几个|一对多|任意数量|(?:两|二|[2-9]\d*)个/i.test(text);
                const mentionsBindingOrRelation = /绑|绑定|添加|新增|设置|维护|有|对应|关联|支持/i.test(text);
                const hasQueryOrViewAction = /查询|查看/i.test(text);
                const hasMultiplicityContext = mentionsThirdPartyCode || /一对多/i.test(text);
                if (
                  hasMultiplicityContext &&
                  mentionsMultiplicity &&
                  mentionsBindingOrRelation &&
                  !hasQueryOrViewAction
                ) {
                  return "unsupported_single_sku_multiple_third_party_codes";
                }
                const mentionsProductNameChange =
                  /(?:修改|更改|变更|重新改|改).*(?:商品名称|商品名)|(?:商品名称|商品名).*(?:修改|更改|变更|重新改|改)|改名/i.test(
                    text
                  );
                const asksBarcodeValueImpact =
                  /(?:条码|码值).*(?:会不会|是否|会|变|变化|改变|影响|一样|相同|不一样|不同)/i.test(
                    text
                  );
                const asksRelabelDecision =
                  /(?:是否|是否需要|需不需要|要不要|还要不要|还要|还需).*(?:贴标|重贴|重新贴|重打|重新打印|再打印|补打|换标)|(?:需要|要).*(?:贴标|重贴|重新贴|重打|重新打印|再打印|补打|换标).*(?:吗|么|\?|？)\s*[。！!]*$/i.test(
                    text
                  );
                if (mentionsProductNameChange && (asksBarcodeValueImpact || asksRelabelDecision)) {
                  return "unsupported_product_name_barcode_change";
                }
                const mentionsRmCode = /(?:^|[^A-Za-z0-9])RM(?=$|[^A-Za-z])/i.test(text);
                const asksRmMeaning = /是什么|什么意思|含义|代表|定义|哪种码|什么码/i.test(text);
                if (mentionsRmCode && asksRmMeaning) {
                  return "unsupported_rm_prefix";
                }
                return "";
              }

              async function main({ params }: { params: Record<string, unknown> }) {
                const topic = str(params.topic);
                const rawIntent = str(params.intentType).toLowerCase();
                const skuCode = str(params.skuCode) || str(params.productCode);
                const skuCodeThird = str(params.skuCodeThird);
                const supervisorMode = normalizeSupervisorMode(str(params.supervisorMode));
                const query = str(params.query);
                const customerIntent = str(params.customerIntent) || query;
                const inputContext = asRecord(params.inputContext);
                const unsupportedBoundary = detectUnsupportedBoundary(`${topic} ${customerIntent} ${query}`);

                let intentType: IntentType = "general";
                let intentSource: IntentSource = "fallback";
                if (rawIntent && ALLOWED.has(rawIntent)) {
                  intentType = rawIntent as IntentType;
                  intentSource = "explicit";
                } else {
                  intentType = detectIntent(`${topic} ${customerIntent} ${query}`);
                  intentSource = intentType === "general" ? "fallback" : "detected";
                }

                const hasTopicOrIntent = topic.length > 0 || (rawIntent.length > 0 && ALLOWED.has(rawIntent));
                const normalizedTopic = topic || customerIntent || intentType;

                let needInfoHint = "";
                if (unsupportedBoundary) {
                  needInfoHint = unsupportedBoundary;
                } else if (!hasTopicOrIntent && !customerIntent && !query) {
                  needInfoHint = "missing_topic_or_intent";
                } else if (
                  (intentType === "third_party_add" || intentType === "third_party_delete") &&
                  !skuCode
                ) {
                  needInfoHint = "prefer_sku_code";
                } else if (intentType === "third_party_add" && skuCode && !skuCodeThird) {
                  needInfoHint = "prefer_sku_code_third";
                } else if (intentType === "scan_fail" && !skuCode) {
                  needInfoHint = "prefer_sku_code";
                }

                const validationOk = hasTopicOrIntent || customerIntent.length > 0 || query.length > 0;

                return {
                  validationOk,
                  intentType,
                  intentSource,
                  normalizedTopic,
                  skuCode,
                  skuCodeThird,
                  supervisorMode,
                  customerIntent,
                  needInfoHint: validationOk ? needInfoHint : "missing_topic_or_intent",
                  inputContext,
                };
              }

              if (typeof process !== "undefined" && process.argv[1]?.includes("validate-intent")) {
                const params = JSON.parse(process.argv[2] || "{}");
                main({ params })
                  .then((r) => process.stdout.write(JSON.stringify(r)))
                  .catch((e) => {
                    console.error(e);
                    process.exit(1);
                  });
              }
          language: 5
          node_inputs:
              - name: topic
                input:
                    value:
                        path: inputs.topic
                        ref_node: "100001"
              - name: intentType
                input:
                    value:
                        path: inputs.intentType
                        ref_node: "100001"
              - name: skuCode
                input:
                    value:
                        path: inputs.skuCode
                        ref_node: "100001"
              - name: skuCodeThird
                input:
                    value:
                        path: inputs.skuCodeThird
                        ref_node: "100001"
              - name: supervisorMode
                input:
                    value:
                        path: inputs.supervisorMode
                        ref_node: "100001"
              - name: query
                input:
                    value:
                        path: query
                        ref_node: "100001"
              - name: customerIntent
                input:
                    value:
                        path: customerIntent
                        ref_node: "100001"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "100001"
          node_outputs:
              validationOk:
                  type: boolean
                  value: null
              intentType:
                  type: string
                  value: null
              intentSource:
                  type: string
                  value: null
              normalizedTopic:
                  type: string
                  value: null
              skuCode:
                  type: string
                  value: null
              skuCodeThird:
                  type: string
                  value: null
              supervisorMode:
                  type: string
                  value: null
              customerIntent:
                  type: string
                  value: null
              needInfoHint:
                  type: string
                  value: null
              inputContext:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
    - id: "163001"
      type: text
      title: kb-print
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 480
          y: 707
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # KB：打印商品条码标签

                        来源压缩：OSWH `05`/`06` 打印商品条码标签。

                        ## 前提

                        - 商品须**已注册并发布**后才可打印标签。
                        - 是否需要打印取决于实物是否已有可被仓库识别的条码：没有可识别条码时，应在入库前打印并张贴 Winit 商品条码；如果使用已正确绑定且可识别的第三方条码，应先核对绑定关系和实际扫描效果，不得无条件要求重复打印。
                        - 对客商品编码 = 打标入参 `productCode`（本专家入参 `skuCode`）。

                        ## 两种打印能力（概念）

                        | 类型 | 能力要点 | 适用 |
                        |------|----------|------|
                        | 带单品信息 | 返回标签 PDF + 单品 S 码列表 | 单品化（SI）管理，需要 S 码 |
                        | 不带单品信息 | 仅返回标签 PDF，不返回 S 码 | 商品化（SKU）或只需贴纸 |

                        对客不暴露 action 名；引导走 **万邑联 → 商品管理 → 打印商品条码**，或客户自有 ERP 对接的打标能力。

                        ## 客户需准备

                        1. 商品编码（`skuCode` / productCode）
                        2. 打印数量（单次建议控制在合理上限，文档限制单商品/合计 <1000）
                        3. 标签尺寸：常见 `100×60` / `70×50` / `60×40`（mm）
                        4. 是否显示产地（Made in China / 不显示）
                        5. 是否打印件型信息（可选）

                        打印数量必须按**实际贴标对象**和**实际单品数量**确定，并结合 SI / SKU 管理模式判断。箱数只代表包装数量，**不得直接按箱数推导打印张数**；信息不足时先询问每箱单品数量及标签贴在商品还是外箱。

                        ## PDF 获取与打印顺序

                        1. 先在打印入口**生成或获取标签 PDF**。
                        2. **下载或保存 PDF** 到本地。
                        3. 核对标签尺寸、数量和内容后**再打印**。

                        是否支持不保存直接打印，**以实际界面能力为准**，不得作确定性承诺。

                        ## 管理模式提示

                        - **SI（单品化）**：通常需要带单品信息的打印结果（含 S 码），便于单品追踪。
                        - **SKU（商品化）**：多数场景打印商品条码贴纸即可。
                        - 不确定时：让客户在万邑联商品详情确认「管理模式」，再选打印方式。

                        ## 本专家边界

                        - **不代客调用**打标接口、不代生成/下发 PDF。
                        - 若客户核心诉求是「审核太慢、急需打印条码」的**加急**，加急入口归 `registration-guide`；本专家仍可补充「发布后如何打印」步骤。
              - name: arrayItemConcatChar
                input:
                    type: string
                    value: ，
              - name: allArrayItemConcatChars
                input:
                    type: list
                    items:
                        type: object
                        value: null
                    value:
                        - isDefault: true
                          label: 换行
                          value: |+
                              
                        - isDefault: true
                          label: 制表符
                          value: "\t"
                        - isDefault: true
                          label: 句号
                          value: 。
                        - isDefault: true
                          label: 逗号
                          value: ，
                        - isDefault: true
                          label: 分号
                          value: ；
                        - isDefault: true
                          label: 空格
                          value: " "
          method: concat
          node_outputs:
              output:
                  type: string
                  value: null
    - id: "163002"
      type: text
      title: kb-third-party-add
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: 用于处理多个字符串类型变量的格式
      position:
          x: 480
          y: 947
      parameters:
          concatParams:
              - name: concatResult
                input:
                    type: string
                    value: |
                        # KB：新增第三方商品/单品条码

                        来源压缩：OSWH `08` 新增第三方商品条码、`09` 新增第三方单品条码。

                        ## 为什么要绑

                        实物上已贴**第三方条码**（如平台 FNSKU、供应商一品一码），到仓扫描若系统未关联，将无法识别商品。需提前把第三方码与系统内商品编码绑定。

                        待办「**缺第三方商品条码**」→ 引导客户补绑，而非改注册加急。

                        ## 两类绑定（概念）

                        ### 1）第三方**商品**条码（一品一码级）

                        - 关联：`skuCode`（商品编码）+ `skuCodeThird`（第三方商品条码）
                        - 可选：规格、国家二字码（开通「国家级第三方商品条码」时必填）、备注
                        - 批量上限概念：单次可批量多条（文档约 200）
                        - 对客路径：**万邑联 → 商品管理 → 第三方条码 / 商品条码维护**（以界面实际菜单为准）

                        ### 2）第三方**单品**条码

                        - 关联：`skuCode` + 单品条码（第三方 SI 码）
                        - 需开通「第三方单品条码管理」权限；未开通则引导联系客服开通
                        - 有规格规则的商品可能需填规格

                        ## 操作前检查

                        1. 商品已存在且状态正常（未发布/不存在 → 先走注册引导）
                        2. 准备好实物扫描到的第三方码字符串
                        3. 确认是「商品级三方码」还是「单品级三方码」（SI 场景）
                        4. 绑错码可再走删除指引（删除能力见 kb-third-party-delete）

                        ## 本专家边界

                        - **不代客调用**绑码写接口；只给自助步骤与字段含义。
                        - 包裹贴错标、作业返工 → 非本 KB，转增值作业（`handoff_value_add`）。
                        - 用户已经明确要绑定第三方码时，即使信息不全，也应先给通用绑定步骤，再补问商品编码、第三方条码完整字符串及商品级/单品级类型；不得只返回缺参。
                        - 单次批量维护多条记录不代表单个商品编码可绑定任意数量的第三方码；当前规则无法确认时收集码类型、实际维护页面和权限状态后 `need_human`。
              - name: arrayItemConcatChar
                input:
                    type: string
                    value: ，
              - name: allArrayItemConcatChars
                input:
                    type: list
                    items:
                        type: object
                        value: null
                    value:
                        - isDefault: true
                          label: 换行
                          value: |+
                              
                        - isDefault: true
                          label: 制表符
                          value: "\t"
                        - isDefault: true
                          label: 句号
                          value: 。
                        - isDefault: true
                          label: 逗号
                          value: ，
                        - isDefault: true
                          label: 分号
                          value: ；
                        - isDefault: true
                          label: 空格
                          value: " "
          method: concat
          node_outputs:
              output:
                  type: string
                  value: null
