                        ref_node: "163000"
              - name: intentSource
                input:
                    value:
                        path: intentSource
                        ref_node: "163000"
              - name: normalizedTopic
                input:
                    value:
                        path: normalizedTopic
                        ref_node: "163000"
              - name: customerIntent
                input:
                    value:
                        path: customerIntent
                        ref_node: "163000"
              - name: needInfoHint
                input:
                    value:
                        path: needInfoHint
                        ref_node: "163000"
              - name: barcodeSnapshot
                input:
                    value:
                        path: barcodeSnapshot
                        ref_node: "163009"
              - name: barcodeSnapshotText
                input:
                    value:
                        path: barcodeSnapshotText
                        ref_node: "163009"
              - name: inputContext
                input:
                    value:
                        path: inputContext
                        ref_node: "163000"
          node_outputs:
              structured:
                  type: object
                  value: null
              analysis:
                  type: string
                  value: null
              outputContext:
                  type: object
                  value: null
              enrichedContext:
                  type: object
                  value: null
          settingOnError:
              processType: 1
              retryTimes: 0
              timeoutMs: 60000
