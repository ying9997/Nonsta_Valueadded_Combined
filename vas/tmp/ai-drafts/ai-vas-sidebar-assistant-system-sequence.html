<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 增值指引侧栏 — 系统交互时序图</title>
<style>
body { margin: 0; padding: 20px; background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
h1 { text-align: center; color: #2c3e50; font-size: 18px; margin-bottom: 6px; }
.subtitle { text-align: center; color: #7f8c8d; font-size: 12.5px; margin-bottom: 6px; }
.legend { text-align:center; color:#7f8c8d; font-size:11.5px; margin-bottom:16px; }
.legend span { display:inline-block; padding:2px 8px; margin:0 4px; border-radius:3px; }
.diagram { max-width: 1080px; margin: 0 auto; background:#fff; border-radius:8px; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
svg { width: 100%; height: auto; }
.actor-box { fill: #2E75B6; stroke: #1a5276; stroke-width: 1.5; rx: 6; }
.actor-new  { fill: #E67E22; stroke: #A04000; }
.actor-text { fill: #fff; font-size: 12px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
.lifeline { stroke: #5B9BD5; stroke-width: 1.5; stroke-dasharray: 6,4; }
.msg-line { stroke: #2c3e50; stroke-width: 1.5; marker-end: url(#arrow); }
.msg-line-dash { stroke: #2c3e50; stroke-width: 1.5; stroke-dasharray: 6,3; marker-end: url(#arrow); }
.msg-line-new { stroke: #E67E22; stroke-width: 1.8; marker-end: url(#arrow-new); }
.msg-line-new-dash { stroke: #E67E22; stroke-width: 1.8; stroke-dasharray: 6,3; marker-end: url(#arrow-new); }
.msg-line-err { stroke: #CC0000; stroke-width: 1.5; stroke-dasharray: 6,3; marker-end: url(#arrow-err); }
.msg-text { font-size: 11px; fill: #2c3e50; }
.msg-text-new { font-size: 11px; fill: #A04000; font-weight:600; }
.msg-text-err { font-size: 11px; fill: #CC0000; }
.msg-detail { font-size: 10px; fill: #7f8c8d; }
.phase-bg { fill: #EBF5FB; stroke: #85C1E9; stroke-width: 1; rx: 4; }
.phase-label { font-size: 12px; fill: #1a5276; font-weight: bold; }
.note-bg { fill: #FFF9E6; stroke: #F0D264; stroke-width: 1; rx: 4; }
.note-text { font-size: 10.5px; fill: #7d6608; }
.activation { fill: #D6EAF8; stroke: #5B9BD5; stroke-width: 1; }
.activation-new { fill: #FDEBD0; stroke: #E67E22; stroke-width: 1; }
</style>
</head>
<body>
<h1>AI 增值指引侧栏 — 系统交互时序图</h1>
<div class="subtitle">客户 → seller 前端 → AI 代理服务（新增）→ Coze → OMS 增值单 → TOM 审核</div>
<div class="legend">
  <span style="background:#2E75B6;color:#fff">现有系统</span>
  <span style="background:#E67E22;color:#fff">新增/改造</span>
  <span style="background:#EBF5FB;color:#1a5276">阶段分组</span>
  <span style="background:#FFF9E6;color:#7d6608">补充说明</span>
  <span style="background:#FDECEA;color:#CC0000">降级/异常</span>
</div>
<div class="diagram">
<svg viewBox="0 0 1080 1260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-new" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#E67E22"/>
    </marker>
    <marker id="arrow-err" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CC0000"/>
    </marker>
  </defs>

  <!-- ========== Actors ========== -->
  <rect x="30" y="15" width="100" height="36" class="actor-box"/>
  <text x="80" y="33" class="actor-text">客户</text>

  <rect x="180" y="15" width="120" height="36" class="actor-box"/>
  <text x="240" y="33" class="actor-text">seller 前端</text>

  <rect x="350" y="15" width="140" height="36" class="actor-box actor-new"/>
  <text x="420" y="33" class="actor-text">AI 代理服务（新增）</text>

  <rect x="540" y="15" width="100" height="36" class="actor-box"/>
  <text x="590" y="33" class="actor-text">Coze</text>

  <rect x="690" y="15" width="140" height="36" class="actor-box"/>
  <text x="760" y="33" class="actor-text">OMS 增值单</text>

  <rect x="880" y="15" width="140" height="36" class="actor-box"/>
  <text x="950" y="33" class="actor-text">TOM 审核端</text>

  <!-- Lifelines -->
  <line x1="80"  y1="51" x2="80"  y2="1240" class="lifeline"/>
  <line x1="240" y1="51" x2="240" y2="1240" class="lifeline"/>
  <line x1="420" y1="51" x2="420" y2="1240" class="lifeline"/>
  <line x1="590" y1="51" x2="590" y2="1240" class="lifeline"/>
  <line x1="760" y1="51" x2="760" y2="1240" class="lifeline"/>
  <line x1="950" y1="51" x2="950" y2="1240" class="lifeline"/>

  <!-- ========== Phase 1: 进入页面 + 自动打开侧栏 ========== -->
  <rect x="15" y="70" width="1050" height="120" class="phase-bg" opacity="0.5"/>
  <text x="30" y="88" class="phase-label">阶段一：进入 4 个入口页面之一 → 自动打开 AI 侧栏</text>

  <!-- 客户 → seller 前端: 进入页面 -->
  <line x1="86" y1="105" x2="234" y2="105" class="msg-line"/>
  <text x="100" y="98" class="msg-text">进入「新增库内/入库增值单」或「异常单处理」或「订单列表继续下单」页面</text>

  <!-- seller 前端 self: 检测入口条件 -->
  <rect x="234" y="118" width="12" height="60" class="activation-new"/>
  <path d="M246,128 C275,128 275,148 246,148" fill="none" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrow-new)"/>
  <text x="282" y="128" class="msg-text-new">读取灰度开关 + 客户关闭记忆</text>
  <text x="282" y="145" class="msg-detail">缓存键 aiChatbotOpenV2_{userId} + 页面级子键</text>
  <path d="M246,158 C275,158 275,172 246,172" fill="none" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrow-new)"/>
  <text x="282" y="167" class="msg-text-new">postMessage OPEN_AI_CHATBOT → 打开侧栏</text>

  <!-- ========== Phase 2: 上下文准备 ========== -->
  <rect x="15" y="196" width="1050" height="100" class="phase-bg" opacity="0.5"/>
  <text x="30" y="214" class="phase-label">阶段二：拉取圈定产品列表 + 组装上下文</text>

  <!-- seller 前端 → OMS: listAllVasc -->
  <line x1="246" y1="235" x2="754" y2="235" class="msg-line"/>
  <text x="270" y="228" class="msg-text">pms.vasc.listAllVasc（现有）</text>
  <text x="270" y="245" class="msg-detail">按 vaSource / warehouse / VASC_SUBMITTER=CUSTOMER 过滤</text>

  <!-- OMS → seller: 返回 vascList -->
  <line x1="754" y1="260" x2="246" y2="260" class="msg-line-dash"/>
  <text x="270" y="273" class="msg-text">返回可选增值产品列表 vascList</text>

  <!-- seller 前端 self: 组装上下文 -->
  <rect x="234" y="278" width="12" height="15" class="activation-new"/>
  <path d="M246,283 C275,283 275,291 246,291" fill="none" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrow-new)"/>
  <text x="282" y="290" class="msg-text-new">组装上下文：客户/仓库/vaSource/vascList/订单快照/eventNo 或 单据号+商品</text>

  <!-- ========== Phase 3: 代发固定话术 ========== -->
  <rect x="15" y="302" width="1050" height="150" class="phase-bg" opacity="0.5"/>
  <text x="30" y="320" class="phase-label">阶段三：代发固定话术 + AI 引导启动</text>

  <!-- seller 前端 → AI 代理: session/init -->
  <line x1="246" y1="342" x2="414" y2="342" class="msg-line-new"/>
  <text x="260" y="335" class="msg-text-new">POST /ai-vas/session/init（新增）</text>
  <text x="260" y="352" class="msg-detail">body: 完整上下文 + entryScene（NEW_INHOUSE / NEW_INBOUND / UNUSUAL_INHOUSE / UNUSUAL_INBOUND / CONTINUE_ORDER）</text>

  <!-- AI 代理 → Coze -->
  <line x1="426" y1="372" x2="584" y2="372" class="msg-line-new"/>
  <text x="440" y="365" class="msg-text-new">Coze conversation.chat（携带 expert 硬分流参数）</text>
  <text x="440" y="382" class="msg-detail">systemScopedVascList = vascList；固定话术模板注入 eventNo/单据号/仓库</text>

  <!-- Coze → AI 代理 -->
  <line x1="584" y1="402" x2="426" y2="402" class="msg-line-new-dash"/>
  <text x="440" y="395" class="msg-text-new">返回 AI 引导话术（首轮追问）</text>

  <!-- AI 代理 → seller 前端 -->
  <line x1="414" y1="422" x2="246" y2="422" class="msg-line-new-dash"/>
  <text x="260" y="415" class="msg-text-new">返回 conversationId + messages</text>

  <!-- seller 前端 → 客户 -->
  <line x1="234" y1="442" x2="86" y2="442" class="msg-line"/>
  <text x="100" y="435" class="msg-text">侧栏渲染 AI 引导话术（含推荐路径判断结果）</text>

  <!-- ========== Phase 4: 多轮对话追问 ========== -->
  <rect x="15" y="458" width="1050" height="150" class="phase-bg" opacity="0.5"/>
  <text x="30" y="476" class="phase-label">阶段四：多轮对话追问（对象/动作/数量/单据号/附件）循环 N 轮</text>

  <!-- 客户 → seller 前端: 回答 -->
  <line x1="86" y1="500" x2="234" y2="500" class="msg-line"/>
  <text x="100" y="493" class="msg-text">客户回答 / 上传附件（图片；Word/Excel 待 Coze 侧确认）</text>

  <!-- seller → AI 代理 -->
  <line x1="246" y1="525" x2="414" y2="525" class="msg-line-new"/>
  <text x="260" y="518" class="msg-text-new">POST /ai-vas/session/message（新增）</text>

  <!-- AI 代理 → Coze -->
  <line x1="426" y1="550" x2="584" y2="550" class="msg-line-new"/>
  <text x="440" y="543" class="msg-text-new">转发消息 + 附件到 Coze</text>

  <!-- Coze → AI 代理 -->
  <line x1="584" y1="575" x2="426" y2="575" class="msg-line-new-dash"/>
  <text x="440" y="568" class="msg-text-new">返回下一轮追问 / 归类未命中时提示人工咨询</text>

  <!-- AI 代理 → seller → 客户 -->
  <line x1="414" y1="597" x2="86" y2="597" class="msg-line-new-dash"/>
  <text x="440" y="590" class="msg-text-new">流式返回消息渲染到侧栏</text>

  <!-- ========== Phase 5: 生成结构化 SOP + 客户确认 ========== -->
  <rect x="15" y="614" width="1050" height="140" class="phase-bg" opacity="0.5"/>
  <text x="30" y="632" class="phase-label">阶段五：生成中英双语 SOP（outputSchema 约束）→ 客户确认</text>

  <!-- Coze → AI 代理 outputSchema -->
  <line x1="584" y1="655" x2="426" y2="655" class="msg-line-new-dash"/>
  <text x="440" y="648" class="msg-text-new">返回结构化 SOP outputSchema</text>
  <text x="440" y="668" class="msg-detail">字段：scene / background / stepsZh / stepsEn / remark / attachmentNote</text>

  <!-- AI 代理 → seller -->
  <line x1="414" y1="688" x2="246" y2="688" class="msg-line-new-dash"/>
  <text x="260" y="681" class="msg-text-new">返回 SOP 卡片 JSON + AI 润色版需求描述</text>

  <!-- seller → 客户 展示 SOP -->
  <line x1="234" y1="710" x2="86" y2="710" class="msg-line-new"/>
  <text x="100" y="703" class="msg-text-new">侧栏展示 SOP 卡片（含「确认」按钮，未确认前禁用一键回填）</text>

  <!-- 客户 → seller: 点确认 -->
  <line x1="86" y1="738" x2="234" y2="738" class="msg-line"/>
  <text x="100" y="731" class="msg-text">客户点「确认」（允许先修正再确认）</text>

  <!-- ========== Phase 6: 一键回填 + 客户可改 ========== -->
  <rect x="15" y="760" width="1050" height="115" class="phase-bg" opacity="0.5"/>
  <text x="30" y="778" class="phase-label">阶段六：一键回填 4 个字段 + 客户可再手动修改</text>

  <!-- seller 前端 self: 回填 -->
  <rect x="234" y="792" width="12" height="60" class="activation-new"/>
  <path d="M246,802 C275,802 275,820 246,820" fill="none" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrow-new)"/>
  <text x="282" y="810" class="msg-text-new">回填 4 字段：增值产品名称 / 增值服务 / 需求背景说明 / 需求描述</text>
  <path d="M246,830 C275,830 275,846 246,846" fill="none" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrow-new)"/>
  <text x="282" y="838" class="msg-text-new">前端本地保存三版：原始版（客户对话首轮）/ AI 版（Coze 输出）/ 最终版（回填后再改）</text>

  <!-- 客户 → seller: 修改 -->
  <line x1="86" y1="866" x2="234" y2="866" class="msg-line"/>
  <text x="100" y="859" class="msg-text">（可选）客户手动修改字段；修改后 AI 不再感知</text>

  <!-- ========== Phase 7: 提交增值单 + 落库 ========== -->
  <rect x="15" y="881" width="1050" height="120" class="phase-bg" opacity="0.5"/>
  <text x="30" y="899" class="phase-label">阶段七：提交增值单 + SOP/双轨字段落库 OMS</text>

  <!-- 客户 → seller: 提交 -->
  <line x1="86" y1="920" x2="234" y2="920" class="msg-line"/>
  <text x="100" y="913" class="msg-text">点「提交」</text>

  <!-- seller → OMS -->
  <line x1="246" y1="946" x2="754" y2="946" class="msg-line-new"/>
  <text x="270" y="939" class="msg-text-new">wh.va.order.submit（现有接口 + 新增字段）</text>
  <text x="270" y="957" class="msg-detail">新增字段：aiScene / aiSopZh / aiSopEn / originalRequirement / aiPolishedRequirement / customerFinalRequirement / aiSessionId</text>

  <!-- OMS self: 保存 -->
  <rect x="754" y="972" width="12" height="20" class="activation-new"/>
  <path d="M766,977 C795,977 795,987 766,987" fill="none" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrow-new)"/>
  <text x="802" y="985" class="msg-text-new">保存增值单 + 新增 AI 字段入 va_order 表（新增列）</text>

  <!-- OMS → seller: 提交成功 -->
  <line x1="754" y1="996" x2="246" y2="996" class="msg-line-dash"/>
  <text x="270" y="1009" class="msg-text">返回增值单号 vaOrderNo，状态 = 待审</text>

  <!-- ========== Phase 8: TOM 审核端读取与修改 ========== -->
  <rect x="15" y="1017" width="1050" height="120" class="phase-bg" opacity="0.5"/>
  <text x="30" y="1035" class="phase-label">阶段八：TOM 审核端读取增值单 → 场景概述 + SOP 显示 → 审核员可修改</text>

  <!-- TOM → OMS: 查详情 -->
  <line x1="944" y1="1058" x2="766" y2="1058" class="msg-line"/>
  <text x="780" y="1051" class="msg-text">增值订单详情查询</text>

  <!-- OMS → TOM: 返回 -->
  <line x1="766" y1="1078" x2="944" y2="1078" class="msg-line-new-dash"/>
  <text x="780" y="1071" class="msg-text-new">返回单据 + AI 场景 + 中英双语 SOP + 双轨需求描述</text>

  <!-- TOM self: 修改 -->
  <rect x="944" y="1090" width="12" height="30" class="activation-new"/>
  <path d="M944,1096 C915,1096 915,1114 944,1114" fill="none" stroke="#E67E22" stroke-width="1.5" marker-end="url(#arrow-new)"/>
  <text x="810" y="1108" class="msg-text-new" text-anchor="end">审核员在「场景概述」+「操作 SOP」字段（复用）上修改</text>

  <!-- TOM → OMS: 保存 -->
  <line x1="944" y1="1128" x2="766" y2="1128" class="msg-line"/>
  <text x="780" y="1121" class="msg-text">保存审核结果 → 增值单进入执行链路</text>

  <!-- ========== Phase 9: 埋点 + 降级 ========== -->
  <rect x="15" y="1145" width="1050" height="95" class="phase-bg" opacity="0.4"/>
  <text x="30" y="1163" class="phase-label" opacity="0.8">异常与降级：Coze 不可用 / 前端埋点</text>

  <!-- 埋点 note -->
  <rect x="30" y="1175" width="430" height="55" class="note-bg"/>
  <text x="40" y="1190" class="note-text">埋点（seller 前端 → 埋点服务）：</text>
  <text x="40" y="1204" class="note-text">① AI 使用率（侧栏打开率、对话完成率）</text>
  <text x="40" y="1218" class="note-text">② 一键回填采纳率　③ 审核回退率（对比一期前基线）</text>

  <!-- Coze 降级 -->
  <line x1="584" y1="1185" x2="426" y2="1185" class="msg-line-err"/>
  <text x="440" y="1178" class="msg-text-err">Coze 超时/失败</text>

  <line x1="414" y1="1207" x2="86" y2="1207" class="msg-line-err"/>
  <text x="440" y="1200" class="msg-text-err">返回降级标记 → 侧栏提示「AI 暂不可用，请自行填写」，不阻断下单</text>

</svg>
</div>
</body>
</html>
