<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 增值指引 - 侧边栏演示（原始线上页面）</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
    }

    /* 演示控制台 */
    .demo-console {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      background: #2d2d2d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .demo-console-title {
      color: #fff;
      font-size: 12px;
      opacity: 0.9;
    }
    .demo-console-actions {
      display: flex;
      gap: 8px;
    }
    .demo-console-actions button {
      background: #4a4a4a;
      color: #fff;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .demo-console-actions button:hover {
      background: #5a5a5a;
      border-color: #888;
    }

    /* 主布局 */
    .workspace {
      position: fixed;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
    }

    .stage-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      transition: width 0.3s ease;
    }
    .workspace.sidebar-open .stage-frame {
      width: calc(100% - 360px);
      flex: 0 0 calc(100% - 360px);
    }

    /* AI 侧边栏 */
    .ai-sidebar {
      position: relative;
      width: 360px;
      height: 100%;
      border-left: 1px solid #dcdcdc;
      background: #fff;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .workspace.sidebar-open .ai-sidebar {
      display: flex;
    }

    .sidebar-header {
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #f0f0f0;
      background: #fff;
    }
    .sidebar-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: rgba(0,0,0,0.88);
    }
    .sidebar-header-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sidebar-header-right label {
      font-size: 11px;
      color: #999;
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .sidebar-close {
      border: 0;
      background: transparent;
      font-size: 20px;
      color: #666;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-close:hover { background: #f5f5f5; }

    .ai-icon-svg { width: 22px; height: 22px; flex: 0 0 22px; }

    /* 对话区 */
    .sidebar-chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      background: linear-gradient(180deg, #fff 0%, #f3f2ff 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg { display: flex; gap: 8px; max-width: 100%; animation: fadeIn 0.3s ease; }
    .msg.ai { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: 0 0 26px; font-size: 11px; }
    .msg.ai .avatar { background: #A0792A; color: #fff; }
    .msg.user .avatar { background: #f0f0f0; color: #666; border: 1px solid #e8e8e8; }

    .bubble { max-width: 280px; padding: 10px 12px; font-size: 13px; line-height: 1.5; word-break: break-word; white-space: pre-line; }
    .msg.ai .bubble { background: #fff; border: 1px solid #f0f0f0; border-radius: 8px 8px 8px 0; color: rgba(0,0,0,0.88); }
    .msg.user .bubble { background: linear-gradient(270deg, #f1e6ff 0%, #dde0ff 100%); border: 1px solid #f0f0f0; border-radius: 8px 8px 0 8px; }
    .bubble.fee-placeholder { border: 1px dashed #d9d9d9; background: #f9f9f9; }

    .sop-card { background: #fff; border: 1px solid #f0e4c0; border-radius: 6px; margin-top: 8px; overflow: hidden; font-size: 12px; max-width: 310px; }
    .sop-title { background: #fffaf3; border-bottom: 1px solid #f0e4c0; color: #8B6914; font-size: 13px; font-weight: 700; padding: 8px 10px; }
    .sop-section { padding: 9px 10px; border-bottom: 1px solid #f7eed6; }
    .sop-section h4 { font-size: 12px; margin-bottom: 6px; }
    .sop-actions { padding: 10px; }
    .sop-actions .btn-fill { width: 100%; padding: 8px; background: linear-gradient(135deg, #A0792A, #C9952E); color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .sop-actions .btn-fill:hover { background: linear-gradient(135deg, #8B6914, #A0792A); }

    .audit-preview-btn { display: inline-block; margin-top: 8px; padding: 6px 12px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fafafa; color: #333; font-size: 12px; cursor: pointer; }
    .audit-preview-btn:hover { border-color: #A0792A; color: #A0792A; }

    .sidebar-footer { flex: 0 0 auto; padding: 10px 12px 12px; border-top: 1px solid #f0f0f0; background: #fff; }
    .sidebar-input-box { min-height: 70px; border: 1px solid #d9d9d9; border-radius: 8px; background: #fff; padding: 8px; display: flex; align-items: flex-end; gap: 8px; }
    .sidebar-input { flex: 1; border: 0; outline: 0; resize: none; font: inherit; font-size: 13px; min-height: 48px; max-height: 96px; line-height: 1.5; }
    .sidebar-send { flex: 0 0 auto; border: 1px solid #A0792A; background: #A0792A; color: #fff; border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; }

    /* 审核模态框 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 10000; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: #fff; border-radius: 8px; width: 750px; max-width: 90vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; background: #f7f8fa; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: space-between; }
    .modal-header h3 { font-size: 15px; font-weight: 600; }
    .modal-body { padding: 20px; }
    .modal-tip { background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 4px; padding: 8px 12px; font-size: 12px; color: #0050b3; margin-bottom: 16px; }
    .modal-form-row { margin-bottom: 16px; }
    .modal-form-row label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #333; }
    .modal-form-row label .req { color: #ff4d4f; }
    .modal-form-row select { width: 100%; height: 36px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 10px; font-size: 13px; background: #f5f5f5; }
    .modal-form-row textarea { width: 100%; min-height: 180px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 10px; font-size: 13px; line-height: 1.6; resize: vertical; }
    .modal-form-row .hint { font-size: 11px; color: #999; margin-bottom: 6px; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid #f0f0f0; display: flex; justify-content: flex-end; }
    .modal-footer button { padding: 8px 20px; border: 1px solid #d9d9d9; border-radius: 4px; background: #fff; font-size: 13px; cursor: pointer; }
    .modal-footer button:hover { border-color: #A0792A; color: #A0792A; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="demo-console">
  <div class="demo-console-title">🎬 原型演示控制台（仅开发/评审可见，非线上真实界面）</div>
  <div class="demo-console-actions">
    <button onclick="runDemo('standard')">标准增值场景</button>
    <button onclick="runDemo('noReview')">非标免审场景</button>
    <button onclick="runDemo('special')">非标特批场景</button>
    <button onclick="resetDemo()">重置</button>
  </div>
</div>

<div class="workspace sidebar-open" id="workspace">
  <iframe class="stage-frame" src="references/线上非标增值页面快照.html" title="线上增值下单页面（非标增值）"></iframe>

  <aside class="ai-sidebar" id="aiSidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-left">
        <svg class="ai-icon-svg" viewBox="0 0 24 24" fill="none">
          <defs><linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C9952E"/><stop offset="100%" stop-color="#8B6914"/>
          </linearGradient></defs>
          <circle cx="12" cy="12" r="10" stroke="url(#aiGrad)" stroke-width="1.5" fill="none"/>
          <path d="M8 12h8M12 8v8M7 7l2 2M15 7l2 2M7 17l2-2M15 17l2-2" stroke="url(#aiGrad)" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        <span>在线咨询</span>
      </div>
      <div class="sidebar-header-right">
        <label><input type="checkbox" id="prefCheckbox" style="width:12px;height:12px;"> 不自动弹出</label>
        <button class="sidebar-close" onclick="toggleSidebar()">×</button>
      </div>
    </div>

    <div class="sidebar-chat" id="chatArea"></div>

    <div class="sidebar-footer">
      <div class="sidebar-input-box">
        <textarea class="sidebar-input" id="userInput" placeholder="描述您的增值需求..."></textarea>
        <button class="sidebar-send" onclick="sendMessage()">发送</button>
      </div>
    </div>
  </aside>
</div>

<div class="modal-overlay" id="auditModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3>审核后台预览 — SOP 已自动回填</h3>
      <button class="sidebar-close" onclick="closeAuditModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-tip">💡 以下内容由 AI 生成并经客户确认，审核人员可在此基础上修改</div>
      <div class="modal-form-row">
        <label><span class="req">*</span> 场景概述</label>
        <select disabled>
          <option selected>【入库】尺重/标签辨识后换标上架</option>
        </select>
      </div>
      <div class="modal-form-row">
        <label><span class="req">*</span> 操作SOP</label>
        <div class="hint">(审核人员填写，请用中英双语、分步骤填写完整的操作SOP，仓库将按照该SOP作业)</div>
        <textarea>1. 从库位取出异常包裹（包裹号：PKG-XXXXX）
2. 使用仓库测量设备重新测量商品实际尺寸和重量
3. 将测量结果与系统登记数据对比，确认差异
4. 根据实际尺重数据打印新的商品标签
5. 移除原有商品标签，粘贴新标签（位置：商品外包装正面）
6. 更新系统中该商品的尺重信息
7. 完成贴标后拍照留存（正面+标签特写）
8. 重新上架到原库位

Steps in English:
1. Retrieve abnormal package from shelf (Package: PKG-XXXXX)
2. Re-measure actual dimensions and weight using warehouse equipment
3. Compare measurements with system records, confirm discrepancy
4. Print new product label based on actual measurements
5. Remove original label, attach new label (position: front of packaging)
6. Update product dimension/weight data in system
7. Take photos after relabeling (front view + label close-up)
8. Re-shelve to original location</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button onclick="closeAuditModal()">关闭预览</button>
    </div>
  </div>
</div>

<script>
function toggleSidebar() { document.getElementById('workspace').classList.toggle('sidebar-open'); }
function closeAuditModal() { document.getElementById('auditModal').classList.remove('show'); }
function openAuditModal() { document.getElementById('auditModal').classList.add('show'); }

function addMsg(role, html, delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const chat = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `<div class="avatar">${role === 'ai' ? 'AI' : '客'}</div><div class="bubble">${html}</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      resolve();
    }, delay || 0);
  });
}

function addSopCard(delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const chat = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'msg ai';
      div.innerHTML = `<div class="avatar">AI</div><div class="bubble" style="max-width:320px;padding:0;border:0;background:transparent;"><div class="sop-card"><div class="sop-title">操作 SOP — 尺重/标签辨识后换标上架</div><div class="sop-section"><h4>操作步骤</h4><ol style="margin-left:16px;font-size:12px;line-height:1.8;"><li>从库位取出异常包裹</li><li>重新测量商品实际尺寸和重量</li><li>对比系统登记数据，确认差异</li><li>根据实际尺重打印新商品标签</li><li>移除原标签，粘贴新标签</li><li>更新系统尺重信息</li><li>拍照留存</li><li>重新上架到原库位</li></ol></div><div class="sop-actions"><button class="btn-fill" onclick="onFillForm()">一键填入表单</button></div></div></div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      resolve();
    }, delay || 0);
  });
}

function addFeePlaceholder(delay) {
  return new Promise(resolve => {
    setTimeout(() => {
      const chat = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'msg ai';
      div.innerHTML = `<div class="avatar">AI</div><div class="bubble fee-placeholder">💰 费用预估（基于 SOP 动作拆解）：\n[待知识库接入] 当前无法自动预估费用。\n\n您提交后，审核人员会给出正式报价。</div>`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      resolve();
    }, delay || 0);
  });
}

function onFillForm() {
  addMsg('ai', '✅ 已成功填入表单。提交后 SOP 将自动同步至审核后台的【操作SOP】字段。\n\n<button class="audit-preview-btn" onclick="openAuditModal()">模拟审核视角 →</button>', 0);
}

function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  addMsg('user', text, 0);
  input.value = '';
}

function resetDemo() {
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('workspace').classList.add('sidebar-open');
}

async function runDemo(scenario) {
  resetDemo();
  await addMsg('ai', '我看到您的异常单 WI46673588 是【商品条码异常(需客户处理)】，当前为有箱单入库。\n\n基于当前场景，建议选择以下增值服务：\n\n📦 上架方向：\n  · 原单上架 - 补贴原商品条码 ⭐推荐\n  · 原单上架 - 更换新商品条码\n  · 原单上架 - 直接上架\n  · 新单上架 - 补贴原商品条码\n\n🗑️ 销毁 · 🚚 自提 · 📷 暂存拍照\n\n如果以上都无法满足，我可以帮您走非标特批流程。\n\n请告诉我您想怎么处理？', 500);

  if (scenario === 'standard') {
    await addMsg('user', '条码扫不了 帮我处理下', 1500);
    await addMsg('ai', '收到。您希望怎么处理这批货？是想继续上架（需要重新贴条码），还是不要了（销毁/自提）？', 1500);
    await addMsg('user', '上架吧 贴回原来那个码就行', 1500);
    await addMsg('ai', '好的，为您推荐【原单上架 - 补贴原商品条码】。\n\n已帮您选中增值产品和服务，请确认后提交。', 1500);
  } else if (scenario === 'noReview') {
    await addMsg('user', '这个货有问题 我想看看里面什么情况', 1500);
    await addMsg('ai', '您是想让仓库开箱拍照确认货物状态吗？还是需要其他处理？', 1500);
    await addMsg('user', '对 拍个照给我看看', 1500);
    await addMsg('ai', '为您推荐【入库-商品开箱拍照】，这是免审服务，提交后仓库会直接执行并上传照片。\n\n已帮您选中。', 1500);
  } else if (scenario === 'special') {
    await addMsg('user', '这批货尺寸跟系统登记的对不上 要重新量一下再换标签上架', 1500);
    await addMsg('ai', '收到。您的意思是需要仓库重新测量尺重，然后根据实际情况更换标签后上架？请确认：\n- 是否需要更换商品标签？\n- 换标后上架到原入库单还是新单？', 1500);
    await addMsg('user', '对 量完换标签 上原单就行', 1500);
    await addMsg('ai', '您的需求是【尺重/标签辨识后换标上架】，这超出当前标准服务范围，需要走非标特批流程。\n\n我来帮您生成操作 SOP：', 1500);
    await addSopCard(1500);
    await addFeePlaceholder(1000);
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const pref = localStorage.getItem('ai-guide-auto-popup');
  if (pref === 'false') { document.getElementById('workspace').classList.remove('sidebar-open'); return; }
  setTimeout(() => {
    addMsg('ai', '我看到您的异常单 WI46673588 是【商品条码异常(需客户处理)】，当前为有箱单入库。\n\n基于当前场景，建议选择以下增值服务：\n\n📦 上架方向：\n  · 原单上架 - 补贴原商品条码 ⭐推荐\n  · 原单上架 - 更换新商品条码\n  · 原单上架 - 直接上架\n\n🗑️ 销毁 · 🚚 自提 · 📷 暂存拍照\n\n请告诉我您想怎么处理？', 0);
  }, 800);
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'prefCheckbox') localStorage.setItem('ai-guide-auto-popup', e.target.checked ? 'false' : 'true');
});
</script>
</body>
</html>
