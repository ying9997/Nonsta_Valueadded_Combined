<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方案1 顶部标题栏内嵌版</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6f8;color:#1f2329;font:14px/1.5 Arial,"Microsoft YaHei",sans-serif}
    .page{width:1180px;margin:0 auto;padding:16px 0 40px}
    .warning{border:1px solid #ffd591;background:#fff7e6;border-radius:4px;padding:8px 12px;margin-bottom:10px}
    .steps{display:flex;gap:8px;margin-bottom:12px}.step{padding:6px 14px;border-radius:16px;background:#e8eaed;color:#646a73}.step.active{background:#8a5a2b;color:#fff}
    .card{background:#fff;border:1px solid #dee0e3;border-radius:6px;margin-bottom:10px}.card-title{padding:10px 12px;border-bottom:1px solid #eff0f1;font-weight:700}
    .ai-inline{margin:10px 12px 0;border:1px solid #8a5a2b;background:#fffaf3;border-radius:4px;padding:10px 12px}
    .ai-row{display:grid;grid-template-columns:1fr 100px 120px 120px 120px;gap:8px;align-items:center}.ai-row textarea{height:34px;resize:none;border:1px solid #c9cdd4;border-radius:4px;padding:6px 8px}
    .ai-result{margin-top:8px;background:#fff;border:1px solid #ead8c4;border-radius:4px;padding:8px}.ai-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .vas-table{width:100%;border-collapse:collapse;table-layout:fixed}.vas-table th{background:#fafafa;border-bottom:1px solid #e5e6eb;text-align:left;padding:8px}.vas-table td{vertical-align:top;border-bottom:1px solid #f0f0f0;padding:10px}
    .service-col{width:220px}.require-col{width:430px}.file-col{width:300px}.price-col{width:130px}
    .service-list label{display:block;margin:0 0 8px}.form-item{display:grid;grid-template-columns:135px 1fr;gap:8px;align-items:start;margin-bottom:8px}.form-item label{font-weight:600;color:#4e5969}
    input,textarea{width:100%;border:1px solid #c9cdd4;border-radius:4px;padding:6px 8px}textarea{min-height:58px;resize:vertical}.upload-btn{display:block;width:100%;border:1px solid #c9cdd4;background:#fff;border-radius:4px;padding:6px;margin-bottom:7px;text-align:left}.file-hint{font-size:12px;color:#d46b08;margin-bottom:8px}.attach-ai{border:1px solid #ffe58f;background:#fffbe6;border-radius:4px;padding:7px;margin:6px 0 8px;font-size:12px}
    .bottom{display:flex;justify-content:center;gap:8px;margin-top:12px}.btn{border:1px solid #c9cdd4;background:#fff;border-radius:4px;padding:6px 12px;cursor:pointer}.btn.primary{background:#8a5a2b;color:#fff;border-color:#8a5a2b}.btn[disabled]{opacity:.45;cursor:not-allowed}.tag{font-size:12px;color:#646a73}
  </style>
</head>
<body>
<main class="page">
  <div class="warning">检测到您的账号未绑定微信账号，为给您提供更便捷的服务，请尽快绑定微信。</div>
  <div class="steps"><span class="step">1 基础信息</span><span class="step active">2 增值产品信息</span><span class="step">3 确认提交</span></div>
  <section class="card">
    <div class="card-title">增值产品信息</div>
    <!-- 新增AI模块：方案1，挂载在大标题正下方。只增量插入，不移动原业务表单DOM。 -->
    <div class="ai-inline" data-guide-point="ai-titlebar-inline">
      <div class="tag">顶部标题栏内嵌版：页面加载自动展示，通栏一行平铺，不遮挡、不挤压表单列宽。</div>
      <div class="ai-row">
        <textarea id="aiUserInput" placeholder="请先描述希望仓库怎么处理，例如按条码对应关系换标后上架。"></textarea>
        <button class="btn primary" data-action="judge">判断</button>
        <button class="btn" data-route="2d">模拟2d</button>
        <button class="btn" data-route="2a">模拟2a</button>
        <button class="btn" data-route="low">低置信</button>
      </div>
      <div id="aiResult" class="ai-result">AI 将基于归一化候选清单的 vascType、matchState、matchConfidence 与 pageActions 判断下一步。</div>
      <div id="aiActions" class="ai-actions"></div>
    </div>
    <table class="vas-table">
      <colgroup><col class="service-col"><col class="require-col"><col class="file-col"><col class="price-col"></colgroup>
      <thead><tr><th>增值服务</th><th>服务要求</th><th>增值文件</th><th>价格(原币)</th></tr></thead>
      <tbody><tr data-row-key="OW01V1602">
        <td><div class="service-list" data-guide-point="service-checkboxes"><label><input type="checkbox" value="OW01V1555"> 包裹串仓异常调拨</label><label><input type="checkbox" value="OW01V1602" checked> 入库其他服务需求</label></div></td>
        <td data-guide-point="original-form-fields">
          <div class="form-item"><label for="vaAtoms_OW01V1602_attributes_PACKAGE_SERNO_attributeValue">包裹条码</label><input id="vaAtoms_OW01V1602_attributes_PACKAGE_SERNO_attributeValue" placeholder="请输入"></div>
          <div class="form-item"><label for="vaAtoms_OW01V1602_attributes_MERCHANDISE_SERNO_attributeValue">商品条码</label><input id="vaAtoms_OW01V1602_attributes_MERCHANDISE_SERNO_attributeValue" placeholder="请输入"></div>
          <div class="form-item"><label for="vaAtoms_OW01V1602_attributes_VAS_ATTR_REL_NWEON_attributeValue">上架入库单号</label><input id="vaAtoms_OW01V1602_attributes_VAS_ATTR_REL_NWEON_attributeValue" placeholder="请输入"></div>
          <div class="form-item"><label for="vaAtoms_OW01V1602_attributes_VAS_ATTR_REL_RD_attributeValue">需求描述</label><textarea id="vaAtoms_OW01V1602_attributes_VAS_ATTR_REL_RD_attributeValue" data-bind-field="description" placeholder="请输入"></textarea></div>
          <div class="form-item"><label for="vaAtoms_OW01V1602_attributes_BEOR_attributeValue">需求背景说明</label><textarea id="vaAtoms_OW01V1602_attributes_BEOR_attributeValue" data-bind-field="background" placeholder="请输入"></textarea></div>
        </td>
        <td data-guide-point="attachment-buttons">
          <button class="upload-btn" id="vaAtoms_OW01V1602_vasFiles_VAS_ATTR_REL_AOOI">操作说明附件</button><div class="file-hint">仅支持.DOC,.DOCX,.PDF,.XLS,.XLSX格式</div>
          <div id="attachmentAiHint" class="attach-ai">AI 附件提示：等待判断后展示。</div>
          <button class="upload-btn" id="vaAtoms_OW01V1602_vasFiles_VAS_ATTR_REL_TCRBCAL">商品和标签的对应关系</button>
          <button class="upload-btn" id="vaAtoms_OW01V1602_vasFiles_TRPP">包裹和标签的对应关系</button>
          <button class="upload-btn" id="vaAtoms_OW01V1602_vasFiles_VAS_ATTR_REL_LF">标签文件</button>
        </td>
        <td>以实际报价为准，审核完成后请确认报价。</td>
      </tr></tbody>
    </table>
  </section>
  <div class="bottom" data-guide-point="bottom-actions"><button class="btn">上一步</button><button class="btn">保存草稿</button><button class="btn primary">提交</button></div>
</main>
<script>
// 本期不做边界：不嵌套二级弹窗、不由前端改阈值、不跨页会话存储、不自动提交、不读取附件内容。
const FALLBACK_THRESHOLD=0.7;
const pageKey=`candidate-normalize-contract:${location.pathname}:EVENT_DEMO_001`;
let currentRoute="2b";
const normalizedCandidates=[
  {vascCode:"VASC_STD_001",vascName:"入库商品换标",vascType:"standard",services:[]},
  {vascCode:"VASC_NONSTD_001",vascName:"入库非标增值（特批）",vascType:"nonstandard",services:[{serviceCode:"OW01V1555",serviceName:"包裹串仓异常调拨"},{serviceCode:"OW01V1602",serviceName:"入库其他服务需求"}]}
];
document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{currentRoute=b.dataset.route;render(makePayload(currentRoute));});
document.querySelector("[data-action='judge']").onclick=()=>render(makePayload(currentRoute));
function makeActions(){return[{action:"fill_field",target:"vaAtoms_OW01V1602_attributes_BEOR_attributeValue",label:"填入需求背景说明",enabled:true},{action:"fill_field",target:"vaAtoms_OW01V1602_attributes_VAS_ATTR_REL_RD_attributeValue",label:"填入需求描述",enabled:true},{action:"copy_text",target:"aiResult",label:"复制建议",enabled:true}];}
function makePayload(route){const score=route==="low"?0.52:0.86,matchState=score<FALLBACK_THRESHOLD?"none":"matched";if(route==="2d")return{route:"2d_standard_redirect",selectedVasc:normalizedCandidates[0],matchState:null,matchConfidence:null,fieldSuggestions:{background:"",description:""},pageActions:[{action:"copy_text",target:"aiResult",label:"复制标准路径建议",enabled:true}]};if(route==="2a")return{route:"2a_named_nonstandard_direct",selectedVasc:normalizedCandidates[1],selectedService:normalizedCandidates[1].services[0],matchState:null,matchConfidence:null,fieldSuggestions:{background:"发现包裹串仓异常，需要仓库按异常单定位并执行调拨处理。",description:"请按包裹串仓异常调拨服务项处理，核对包裹条码、目标入库单和调拨范围后执行。"},pageActions:makeActions()};return{route:"2b_other_service_sop",selectedVasc:normalizedCandidates[1],selectedService:normalizedCandidates[1].services[1],matchState,matchConfidence:score,fieldSuggestions:matchState==="none"?{background:"",description:""}:{background:"到仓商品条码与系统登记信息不一致，需要仓库按客户提供的条码对应关系处理后上架。",description:"请根据附件中的实物条码与新商品条码对应关系补贴标签，并上架到指定新入库单。客户确认不等于审核通过。"},attachmentRequirements:["实物条码与新商品条码对应关系","新商品标签文件","如涉及包裹标签，补充包裹和标签对应关系"],pageActions:matchState==="none"?[{action:"copy_text",target:"aiResult",label:"复制兜底追问",enabled:true}]:makeActions()};}
function render(p){localStorage.setItem(pageKey,JSON.stringify({conversationId:"conv_EVENT_DEMO_001",payload:p,updatedAt:Date.now()}));aiActions.innerHTML="";aiResult.innerHTML=p.route==="2d_standard_redirect"?`2d 标准纠偏：vascType=${p.selectedVasc.vascType}，建议返回标准增值路径，本页不填非标字段。`:p.route==="2a_named_nonstandard_direct"?`2a 命名直选：${p.selectedService.serviceName}，不进入 SOP 长追问。`:`2b SOP：matchState=${p.matchState}，matchConfidence=${p.matchConfidence}。${p.matchConfidence<FALLBACK_THRESHOLD?"低于0.7，触发SOP模板兜底追问。":"可生成字段建议。"}`;attachmentAiHint.innerHTML=(p.attachmentRequirements||["低置信时请先补充场景概述、业务单据、SKU、操作步骤、关键输出和附件要求。"]).map(x=>"· "+x).join("<br>");p.pageActions.forEach(a=>{const b=document.createElement("button");b.className="btn";b.textContent=a.label;b.disabled=!a.enabled;b.onclick=()=>consume(a,p);aiActions.appendChild(b);});}
function consume(a,p){if(a.action==="fill_field"){const el=document.getElementById(a.target);if(el)el.value=a.target.includes("BEOR")?p.fieldSuggestions.background:p.fieldSuggestions.description;}else navigator.clipboard&&navigator.clipboard.writeText(aiResult.textContent);}
render(makePayload("2b"));
</script>
</body>
</html>
