<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 增值指引 — 提交前智能校验</title>
  <style>
    :root {
      --green: #52c41a;
      --red: #ff4d4f;
      --orange: #faad14;
      --blue: #1677ff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --bg: #f5f7fb;
      --panel: #ffffff;
      --soft-blue: #eef5ff;
      --soft-green: #f0fbeb;
      --soft-red: #fff1f0;
      --soft-orange: #fff7e6;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page-shell {
      min-height: 100vh;
      padding: 28px 20px 44px;
      transition: padding-right 300ms ease;
    }

    .page-shell.sidebar-open {
      padding-right: 400px;
    }

    .topbar {
      max-width: 960px;
      margin: 0 auto 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 16px;
      color: #111827;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .scene-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .scene-tab {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #374151;
      transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .scene-tab.active {
      border-color: var(--blue);
      background: var(--soft-blue);
      color: #0958d9;
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.08);
      font-weight: 600;
    }

    .form-card,
    .comparison-table,
    .bottom-note {
      max-width: 720px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .form-card {
      padding: 26px;
    }

    .form-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .form-heading h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .form-status {
      flex: 0 0 auto;
      padding: 4px 10px;
      border-radius: 999px;
      background: #f3f4f6;
      color: var(--muted);
      font-size: 12px;
    }

    .form-section {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #374151;
      font-weight: 600;
    }

    .select-box,
    .service-card {
      min-height: 42px;
      display: flex;
      align-items: center;
      padding: 11px 13px;
      border: 1px solid #c7d2fe;
      border-radius: 6px;
      background: #f8fbff;
      color: #1d4ed8;
    }

    .service-card {
      border-color: #bae6fd;
      background: #f0f9ff;
      color: #075985;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 118px;
      resize: vertical;
      padding: 12px 13px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    #requirementDesc {
      min-height: 230px;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }

    textarea.error {
      border-color: var(--red);
      background: var(--soft-red);
      animation: shake 420ms ease;
    }

    .upload-area {
      display: grid;
      gap: 10px;
    }

    .upload-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .upload-item.missing {
      border-color: var(--red);
      background: var(--soft-red);
      animation: shake 420ms ease;
    }

    .file-title {
      color: #374151;
      font-weight: 600;
    }

    .file-status {
      flex: 0 0 auto;
      color: var(--green);
      font-weight: 700;
    }

    .upload-item.pending .file-status {
      color: #9ca3af;
      font-weight: 600;
    }

    .upload-item.missing .file-status {
      color: var(--red);
    }

    .submit-row {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }

    .submit-btn,
    .btn-primary,
    .chat-input button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      transition: background 160ms ease, transform 160ms ease, opacity 160ms ease;
    }

    .submit-btn {
      width: 100%;
      font-size: 15px;
    }

    .submit-btn:hover,
    .btn-primary:hover,
    .chat-input button:hover {
      background: #0958d9;
    }

    .submit-btn:active,
    .btn-primary:active,
    .chat-input button:active {
      transform: translateY(1px);
    }

    .submit-btn.loading {
      opacity: 0.72;
      pointer-events: none;
    }

    .result-host {
      max-width: 720px;
      margin: 16px auto 0;
    }

    .validation-result {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      animation: slideDown 260ms ease;
    }

    .validation-result.pass {
      border-color: rgba(82, 196, 26, 0.45);
    }

    .validation-result.fail {
      border-color: rgba(255, 77, 79, 0.45);
    }

    .validation-result.warn {
      border-color: rgba(250, 173, 20, 0.55);
    }

    .result-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: #f9fafb;
      font-weight: 700;
    }

    .validation-result.pass .result-header {
      background: var(--soft-green);
      color: #237804;
    }

    .validation-result.fail .result-header {
      background: var(--soft-red);
      color: #a8071a;
    }

    .validation-result.warn .result-header {
      background: var(--soft-orange);
      color: #ad6800;
    }

    .result-body {
      display: grid;
      gap: 10px;
      padding: 16px 18px;
    }

    .check-item {
      padding: 10px 12px;
      border-radius: 6px;
      background: #f9fafb;
    }

    .check-item.pass {
      background: var(--soft-green);
      color: #237804;
    }

    .check-item.fail {
      background: var(--soft-red);
      color: #a8071a;
    }

    .check-item.warn {
      background: var(--soft-orange);
      color: #ad6800;
    }

    .fail-detail,
    .warn-detail {
      display: inline-block;
      margin-top: 5px;
      color: inherit;
      font-size: 13px;
    }

    .result-footer {
      padding: 0 18px 18px;
    }

    .result-summary {
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      text-align: center;
    }

    .result-summary.pass {
      background: var(--soft-green);
      color: #237804;
    }

    .result-summary.warn {
      background: var(--soft-orange);
      color: #ad6800;
    }

    .btn-primary {
      padding: 0 18px;
    }

    .key-point {
      margin-top: 12px;
      padding: 13px 15px;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e40af;
      font-weight: 600;
      animation: slideDown 260ms ease;
    }

    .comparison-table {
      margin-top: 22px;
      padding: 22px;
    }

    .comparison-table h3 {
      margin: 0 0 14px;
      font-size: 17px;
      letter-spacing: 0;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 620px;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f3f4f6;
      color: #374151;
      font-weight: 700;
    }

    tbody tr:nth-child(even) {
      background: #fafafa;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .row-pass.active-row {
      background: var(--soft-green);
      box-shadow: inset 4px 0 0 var(--green);
    }

    .row-fail.active-row {
      background: var(--soft-red);
      box-shadow: inset 4px 0 0 var(--red);
    }

    .row-warn.active-row {
      background: var(--soft-orange);
      box-shadow: inset 4px 0 0 var(--orange);
    }

    .bottom-note {
      margin-top: 22px;
      padding: 15px 18px;
      color: #374151;
      text-align: center;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 40;
      transform: translate(-50%, -24px);
      min-width: 240px;
      padding: 12px 18px;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      box-shadow: var(--shadow);
      text-align: center;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      animation: toastIn 260ms ease forwards, toastOut 360ms ease 2.65s forwards;
    }

    .ai-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 30;
      width: 380px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      background: #fff;
      box-shadow: -12px 0 28px rgba(15, 23, 42, 0.14);
      transform: translateX(100%);
      transition: transform 300ms ease;
    }

    .ai-sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #0f172a;
      color: #fff;
      font-weight: 700;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 16px;
    }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background: #f8fafc;
    }

    .ai-message {
      max-width: 100%;
      padding: 13px 14px;
      border: 1px solid #dbeafe;
      border-radius: 8px;
      background: #fff;
      color: #1e3a8a;
      white-space: pre-line;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
    }

    .chat-input {
      display: flex;
      gap: 8px;
      padding: 14px;
      border-top: 1px solid var(--line);
      background: #fff;
    }

    .chat-input input {
      min-width: 0;
      flex: 1;
      height: 40px;
      padding: 0 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      outline: none;
    }

    .chat-input input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.12);
    }

    .chat-input button {
      padding: 0 14px;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      20%,
      60% {
        transform: translateX(-4px);
      }
      40%,
      80% {
        transform: translateX(4px);
      }
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, -24px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translate(-50%, -14px);
      }
    }

    @media (max-width: 900px) {
      .page-shell.sidebar-open {
        padding-right: 20px;
      }
    }

    @media (max-width: 768px) {
      .page-shell {
        padding: 18px 12px 32px;
      }

      .form-card,
      .comparison-table {
        padding: 18px;
      }

      .form-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .scene-tab {
        flex: 1 1 100%;
      }

      .upload-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .ai-sidebar {
        width: 100%;
        border-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast">✅ 增值单提交成功！</div>

  <main class="page-shell" id="pageShell">
    <header class="topbar">
      <h1>AI 增值指引 — 提交前智能校验</h1>
      <div class="scene-tabs">
        <button class="scene-tab active" onclick="showResult('pass')">结果 1：通过 ✅</button>
        <button class="scene-tab" onclick="showResult('unclear')">结果 2：描述不清 ❌</button>
        <button class="scene-tab" onclick="showResult('missing')">结果 3：附件缺失 ❌</button>
      </div>
    </header>

    <section class="form-card" aria-label="增值下单表单">
      <div class="form-heading">
        <h2>增值下单表单</h2>
        <span class="form-status">已填状态</span>
      </div>

      <div class="form-section">
        <label>增值产品</label>
        <div class="select-box selected">库内非标增值（特批）</div>
      </div>

      <div class="form-section">
        <label>增值服务</label>
        <div class="service-card selected">库内其他服务需求</div>
      </div>

      <div class="form-section">
        <label for="backgroundDesc">需求背景说明</label>
        <textarea id="backgroundDesc"></textarea>
      </div>

      <div class="form-section">
        <label for="requirementDesc">需求描述</label>
        <textarea id="requirementDesc"></textarea>
      </div>

      <div class="form-section" id="uploadSection">
        <label>增值文件</label>
        <div class="upload-area" id="uploadArea"></div>
      </div>

      <div class="submit-row">
        <button class="submit-btn" id="submitBtn" onclick="handleSubmit()">提交增值单</button>
      </div>
    </section>

    <section class="result-host" id="resultHost" aria-live="polite"></section>

    <section class="comparison-table">
      <h3>校验 B 逻辑：两个维度独立判断</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>描述清晰度</th>
              <th>附件完整性</th>
              <th>结果</th>
              <th>处理方式</th>
            </tr>
          </thead>
          <tbody>
            <tr class="row-pass active-row" data-row="pass">
              <td>✅ 清晰</td>
              <td>✅ 完整</td>
              <td>直接提交成功</td>
              <td>无需 AI 对话</td>
            </tr>
            <tr class="row-fail" data-row="unclear">
              <td>❌ 不清晰</td>
              <td>✅ 完整</td>
              <td>拦截</td>
              <td>强制弹 AI 侧栏补充</td>
            </tr>
            <tr class="row-warn" data-row="missing">
              <td>✅ 清晰</td>
              <td>⚠️ 缺失</td>
              <td>拦截</td>
              <td>红框标注，客户自传</td>
            </tr>
            <tr class="row-fail">
              <td>❌ 不清晰</td>
              <td>⚠️ 缺失</td>
              <td>拦截</td>
              <td>弹侧栏 + 红框</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer class="bottom-note">
      校验 B：提交时 AI 校验两个维度（描述清晰度 + 附件完整性），独立判断，独立处理
    </footer>
  </main>

  <aside class="ai-sidebar" id="aiSidebar">
    <div class="sidebar-header">
      <span>AI 增值指引</span>
      <button class="close-btn" onclick="closeSidebar()">✕</button>
    </div>
    <div class="chat-area" id="chatArea"></div>
    <div class="chat-input">
      <input type="text" placeholder="补充您的需求信息..." />
      <button>发送</button>
    </div>
  </aside>

  <script>
    const completeBackground = `客户有一批老货当前存放在 DEBR2 Warehouse，SKU 绑定了第三方条码。后续会有一批亚马逊退仓新货入库，新货使用同一个三方条码，系统里无法用同一个三方条码同时区分两批 SKU。客户希望先把当前在库老货从良品库存转为不良品库存存放，主要是为了区分老货和新退仓货，不是因为商品实际破损。`;

    const completeRequirement = `操作需求：良品转不良品上架

仓库：DEBR2 Warehouse
SKU/数量：SKU-DE-15908221，86 件
新入库单：WI51339338
下架出库单：WO12120399145
转不良品原因：用于区分当前在库老货与后续同三方条码的亚马逊退仓新货

具体要求：
1. 按出库单 WO12120399145 将当前在库老货下架
2. 核对 SKU、数量、三方条码，确认一致
3. 按入库单 WI51339338 重新入库处理
4. 补贴包裹标签
5. 按不良品属性上架至不良品库位
6. 上架完成后反馈处理数量及库位信息`;

    const scenes = {
      pass: {
        background: completeBackground,
        requirement: completeRequirement,
        filesUploaded: true
      },
      unclear: {
        background: '帮我处理下库里那批货',
        requirement: '帮我把那批货转一下不良品',
        filesUploaded: true
      },
      missing: {
        background: completeBackground,
        requirement: completeRequirement,
        filesUploaded: false
      }
    };

    const fileNames = ['操作说明附件', '商品和标签的对应关系', '标签文件'];
    const aiText = `您的需求描述信息不够完整，无法直接提交。请补充以下关键信息：
1. 具体 SKU 编号
2. 处理数量
3. 关联单据号（入库单/出库单）
4. 具体操作要求（仓库需要做什么）

补充完整后我帮您重新整理并回填。`;

    let currentScene = 'pass';
    let loadingTimer = null;
    let typingTimer = null;

    function showResult(sceneKey) {
      currentScene = sceneKey;
      clearTimeout(loadingTimer);
      clearInterval(typingTimer);

      document.querySelectorAll('.scene-tab').forEach((tab) => tab.classList.remove('active'));
      const tabIndex = sceneKey === 'pass' ? 0 : sceneKey === 'unclear' ? 1 : 2;
      document.querySelectorAll('.scene-tab')[tabIndex].classList.add('active');

      document.getElementById('backgroundDesc').value = scenes[sceneKey].background;
      document.getElementById('requirementDesc').value = scenes[sceneKey].requirement;
      document.getElementById('resultHost').innerHTML = '';
      document.getElementById('submitBtn').textContent = '提交增值单';
      document.getElementById('submitBtn').classList.remove('loading');
      document.getElementById('backgroundDesc').classList.remove('error');
      document.getElementById('requirementDesc').classList.remove('error');
      document.getElementById('toast').classList.remove('show');
      closeSidebar();
      renderUploadItems(sceneKey, false);
      highlightComparisonRow(sceneKey);
    }

    function renderUploadItems(sceneKey, forceMissing) {
      const uploadArea = document.getElementById('uploadArea');
      const uploaded = scenes[sceneKey].filesUploaded;
      uploadArea.innerHTML = fileNames.map((name) => {
        const stateClass = uploaded ? 'uploaded' : forceMissing ? 'missing' : 'pending';
        const status = uploaded ? '✅ 已上传' : forceMissing ? '❌ 必须上传' : '未上传';
        return `
          <div class="upload-item ${stateClass}">
            <span class="file-title">${name}</span>
            <span class="file-status">${status}</span>
          </div>
        `;
      }).join('');
    }

    function handleSubmit() {
      clearTimeout(loadingTimer);
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.textContent = 'AI 校验中...';
      submitBtn.classList.add('loading');
      document.getElementById('resultHost').innerHTML = '';
      document.getElementById('backgroundDesc').classList.remove('error');
      document.getElementById('requirementDesc').classList.remove('error');
      renderUploadItems(currentScene, false);
      closeSidebar();

      loadingTimer = setTimeout(() => {
        submitBtn.textContent = '提交增值单';
        submitBtn.classList.remove('loading');
        if (currentScene === 'pass') {
          renderPassResult();
          showToast();
        } else if (currentScene === 'unclear') {
          renderUnclearResult();
          markDescriptionError();
        } else {
          renderMissingResult();
          markMissingFiles();
        }
      }, 1000);
    }

    function renderPassResult() {
      document.getElementById('resultHost').innerHTML = `
        <div class="validation-result pass">
          <div class="result-header">📋 提交前智能校验</div>
          <div class="result-body">
            <div class="check-item pass">✅ 增值产品：已选择</div>
            <div class="check-item pass">✅ 增值服务：已选择</div>
            <div class="check-item pass">✅ 需求描述清晰度：通过 — 包含 SKU、数量、单据号、操作要求</div>
            <div class="check-item pass">✅ 附件完整性：通过 — 3/3 已上传</div>
          </div>
          <div class="result-footer">
            <div class="result-summary pass">🎉 校验全部通过，增值单已提交成功！</div>
          </div>
        </div>
        <div class="key-point">💡 客户没有和 AI 对话，但自己填写得足够清晰、附件完整 → 直接通过，不强制对话。</div>
      `;
    }

    function renderUnclearResult() {
      document.getElementById('resultHost').innerHTML = `
        <div class="validation-result fail">
          <div class="result-header">📋 提交前智能校验</div>
          <div class="result-body">
            <div class="check-item pass">✅ 增值产品：已选择</div>
            <div class="check-item pass">✅ 增值服务：已选择</div>
            <div class="check-item fail">
              ❌ 需求描述清晰度：不通过<br>
              <span class="fail-detail">描述中缺少关键信息：SKU 编号、处理数量、关联单据号、具体操作步骤</span>
            </div>
            <div class="check-item pass">✅ 附件完整性：通过 — 3/3 已上传</div>
          </div>
          <div class="result-footer">
            <button class="btn-primary" onclick="showSidebarForce()">与 AI 对话补充信息</button>
          </div>
        </div>
        <div class="key-point">💡 描述不清晰 → 强制打开 AI 侧栏，客户必须补充信息后才能再次提交。</div>
      `;
    }

    function renderMissingResult() {
      document.getElementById('resultHost').innerHTML = `
        <div class="validation-result warn">
          <div class="result-header">📋 提交前智能校验</div>
          <div class="result-body">
            <div class="check-item pass">✅ 增值产品：已选择</div>
            <div class="check-item pass">✅ 增值服务：已选择</div>
            <div class="check-item pass">✅ 需求描述清晰度：通过 — 包含 SKU、数量、单据号、操作要求</div>
            <div class="check-item warn">
              ⚠️ 附件完整性：未通过<br>
              <span class="warn-detail">缺少：操作说明附件、商品和标签的对应关系、标签文件</span>
            </div>
          </div>
          <div class="result-footer">
            <div class="result-summary warn">请上传缺失附件后重新提交</div>
          </div>
        </div>
        <div class="key-point">💡 附件缺失 → 只标红提示，不强制 AI 对话。客户自己补传即可。</div>
      `;
    }

    function markDescriptionError() {
      restartAnimation(document.getElementById('backgroundDesc'), 'error');
      restartAnimation(document.getElementById('requirementDesc'), 'error');
    }

    function markMissingFiles() {
      renderUploadItems('missing', true);
      document.getElementById('uploadSection').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function restartAnimation(element, className) {
      element.classList.remove(className);
      void element.offsetWidth;
      element.classList.add(className);
    }

    function showSidebarForce() {
      clearInterval(typingTimer);
      const sidebar = document.getElementById('aiSidebar');
      const pageShell = document.getElementById('pageShell');
      const chatArea = document.getElementById('chatArea');
      sidebar.classList.add('open');
      pageShell.classList.add('sidebar-open');
      chatArea.innerHTML = '<div class="ai-message" id="aiMessage"></div>';
      typeAiMessage(aiText);
    }

    function closeSidebar() {
      document.getElementById('aiSidebar').classList.remove('open');
      document.getElementById('pageShell').classList.remove('sidebar-open');
      document.getElementById('chatArea').innerHTML = '';
      clearInterval(typingTimer);
    }

    function typeAiMessage(text) {
      const target = document.getElementById('aiMessage');
      let index = 0;
      typingTimer = setInterval(() => {
        target.textContent = text.slice(0, index);
        index += 1;
        if (index > text.length) {
          clearInterval(typingTimer);
        }
      }, 18);
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.remove('show');
      void toast.offsetWidth;
      toast.classList.add('show');
    }

    function highlightComparisonRow(sceneKey) {
      document.querySelectorAll('[data-row]').forEach((row) => {
        row.classList.toggle('active-row', row.dataset.row === sceneKey);
      });
    }

    showResult('pass');
  </script>
</body>
</html>
