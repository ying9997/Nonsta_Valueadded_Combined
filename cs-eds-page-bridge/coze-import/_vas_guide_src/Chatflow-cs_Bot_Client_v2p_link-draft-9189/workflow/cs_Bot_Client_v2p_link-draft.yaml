                    排除信号: 尺重辨识、批量辨识商品、海运整柜、串仓调拨、自提、质检、换标、补贴标签、无主货、SKU不符
                    必填信息:
                      1. 目标入库单号: 需要明确商品要上架到哪个不良品入库单/预报单（例: 入库单号WI51908492 / 入库单WI50591614 / 新入库单WI51427083）
                      2. 处理对象标识: 需要明确是哪些商品/箱码/SKU需要转不良品，可以是箱码、异常单号、SKU编码等（例: EB0526081332214735 / M010000000008453352 / 61pcs T520QJ20（M010000000011878557））
                      3. 转换原因/背景: 说明为什么要从良品转不良品，如库内破损、误操作上架、质量异常、包装问题等（例: 库内破损异常 / 误操作将库存上架为良品库存，实际产品都判定为不良品 / 库内单品质量异常）
                    可选信息:
                      1. 是否需要补贴标签: 部分情况需要补贴商品条码、包裹标签或SN标签后再上架（例: 需要补贴商品条码上架到不良品 / 补贴包裹标签，标签见附件 / 需要更换一个外箱，采集SN上架到不良品库位）
                      2. 原入库单信息: 当涉及重新上架时，需要说明原来是从哪个入库单上架的（例: 原单WI50048193 / WI50591614这个入库单上架的61pcs / 然后仓库重新用原入库单WI50351073上架）
                      3. 后续处理要求: 转不良品后的进一步操作，如盘亏处理、退回国内、防止混放等（例: 不良品做盘亏L007处理 / 后续需要退回国内 / 为防止同款产品亚马逊移除订单入库后与原库存混放）
                      4. 数量信息: 需要转不良品的具体数量（例: 61pcs / 共计2pcs / 10个箱码）
                      5. 是否需要换标: 少数情况需要更换SKU标签（例: 原sku9345750988194需要换标成9345750052864）

                    ### 场景: 辨识拍照后销毁 (key: instock_identify_photo_then_destroy)
                    类别: 库内
                    识别信号:
                      强信号: 销毁、辨识后销毁、拍照后销毁、辨识拍照销毁、找出后销毁
                      弱信号: 找出库内、辨识、拍照、根据客户要求、L007盘亏
                    排除信号: 换标、补贴标签、重新上架、入库、调拨、质检、暂存、自提、下架
                    必填信息:
                      1. 处理范围: 需要明确处理的商品SKU/包裹号和数量（例: 库内库存39件 / 12件 / 10个产品）
                      2. 辨识标准: 判断商品好坏的具体标准，如检查发霉、变形、包装颜色、彩卡尺码等（例: 检测产品包装是否发霉 / 辨识彩卡，彩卡如附件示例图 / 橙色包装的销毁，蓝色包装的上架）
                      3. 销毁条件: 明确哪些情况下需要销毁，哪些情况可以保留上架（例: 如果眼镜和软盒都发霉，做销毁处理 / 如果彩卡上是其他任何尺码，直接弃置销毁 / 橙色包装的销毁）
                      4. 辨识结果反馈要求: 需要反馈各类情况的数量统计（例: 增值完成需反馈辨识结果和数量 / 只需要告诉我以下类型的数量有多少 / 需要拍照反馈橙色包装有多少）
                    可选信息:
                      1. 拍照要求: 是否需要拍照以及拍照的具体要求（例: 全程不需要拍照 / 需要拍照反馈橙色包装有多少 / 整体拍一张照片即可）
                      2. 良品处理方式: 辨识后良品的具体处理方式，如换包装、贴标、关联入库单等（例: 重新用你们的包材贴标上架 / 用我们库内的1号纸盒装，然后贴原产品标签：TCA5354-L02 / 上架到WI49471112这个入库单）
                      3. 分层辨识逻辑: 需要分多层检查的情况，如外包装、内包装、产品本体的分别判断（例: 查看发霉的产品包装，请确认黑色软盒里的眼镜和黑色软盒是否发霉 / 硬包装盒发霉，软包装是没有发霉的，硬包装丢掉 / 眼镜硬盒和软盒都发霉 但是眼镜没有发霉 这种情况下也做销毁处理）

