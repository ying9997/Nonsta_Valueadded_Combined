                      3. 操作时效要求: 是否有特定的完成时间要求（例: 这批货要周五之前备好 / 麻烦仓库先组装50pcs上架，后续在完成全部组装）
                      4. 操作顺序说明: 是否需要分步骤操作或等待某些物料到位（例: 麻烦仓库先进行组装产品，等卡板套到仓之后再打托上架 / 6/30号卡板套上架之后我们会创建商品下架单同步给仓库打托）
