                      3. 采集后处理动作: 采集完SN码后需要做什么：导入系统绑定、返回给客户、做成表格反馈等（例: 采集后导入系统绑定后重新上架 / 采集后将数据返回国内 / 做成表格反馈）
                      4. 采集原因/背景: 为什么需要采集SN码：发货仓无法提供、包装破损需更换、异常单无法识别等（例: 发货仓出库无法提供完整的SN码表 / 外包装破损，需采购客制包材过来更换上架 / 包裹条码异常需核实箱内sku）
