                      2. 拍照对象范围: 需要说明拍照的具体对象和数量，如随机一件、每箱一个、全部产品等（例: 随机拆开一件单品 / 每箱拆开一个单品 / 拿1套）
                      3. 拍照具体要求: 需要明确拍照的角度、部位、细节等具体要求（例: 看下产品的颜色 / 包的6面图 / 吉他正反面局部图细节）
                    可选信息:
                      1. 拆包程度: 说明需要拆到什么程度，如只拆外包装、拆开彩盒等（例: 只拆外面的快递包装袋 / 拆开彩盒）
                      2. 辨识要求: 是否需要扫码辨识或通过照片辨识SKU（例: 要扫码辨识，然后反馈异常单号分别对应的照片和SKU及数量 / 需要开箱拍照辨识 / 辨识下货物）
                      3. 后续处理: 拍照后是否需要更换包装、重新贴标等额外操作（例: 更换包装，重新贴标入库）

                    ### 场景: 异常商品转不良品上架 (key: instock_exception_to_defective_shelve)
                    类别: 库内
                    识别信号:
                      强信号: 不良品上架、转不良品、盘亏L007、解冻、无箱单预报单、不需要贴商品标签、只收取出库处理费
                      弱信号: 异常商品、下架更换、新入库单、整单上架、良品检查后发现问题
                    排除信号: 换标、补贴条码、拍照、质检、自提、串仓、辨识、SKU不符、关联第三方条码、更换SKU
                    必填信息:
                      1. 异常单号: 需要处理的异常单号（EB开头），可能是单个或多个（例: EB1226051929553915 / EB0526061130339645 / EB0126060129969286等9个异常单）
                      2. 新入库单号: 用于不良品上架的新入库单号（WI开头），必须是无箱单预报单（例: WI49974000 / WI50511367 / WI50271247）
                      3. 异常原因: 导致需要转不良品的具体原因，如破损、条码缺失/无法扫描等（例: 产品破损严重外箱无法扫描SN码 / 货物有部分有破损 / 无商品条码）
                    可选信息:
                      1. 涉及SKU: 异常商品的具体SKU编号（例: M010000000005125352 / M010000000005169112 / M010000000009282066）
                      2. 特殊处理要求: 除标准流程外的额外操作要求，如补贴标签、加快递袋等（例: 需按对应关系补贴商品标签 / 破损商品加快递袋后上架 / 补贴原商品条码）
                      3. 异常数量: 涉及的异常商品具体件数（例: 16pcs产品破损 / 有4件不良品）
                      4. 关联出库单: 如果是因出库拣选发现异常，会提到原出库单号（例: 订单WO11365273924拣选时发现）

                    ### 场景: 良品/不良品检测 (key: instock_good_defective_inspection)
                    类别: 库内
                    识别信号:
                      强信号: 检测、质量检测、发霉检查、损坏检查、判定标准、解冻
                      弱信号: 良品、不良品、下架、冻结、暂存区、物理隔离、实物照片、返回原库位
                    排除信号: 换标、补贴条码、辨识、串仓、自提、预报、上架到不良品、上架不良品、转不良品、入库单号、新到货、收货、质检报告
                    必填信息:
                      1. 检测SKU及数量: 需要检测的SKU代码和对应数量或下架单号（例: M010000000007778989*180 / M010000000010479650 库存数量：1206pcs / T2353G11改制为T2353V11）
                      2. 检测/改制操作步骤: 具体的检测或改制流程，包括拆箱、检查、更换配件、重新封装等详细步骤（例: 1、拆外箱,用刀片划开外纸箱工字型透明胶带；2、拿5张贴纸,对外纸箱编号 / 1、开箱将外箱里面的彩盒倒出，注意彩盒需倒在干净的纸皮上 / 1、拆箱将物料取出保留复用、将基站外PE袋拆开）
                      3. 判定标准或改制目标: 良品/不良品的判定标准，或改制后的目标SKU/状态（例: T2353G11改制为T2353V11 / T2081G11需库内改制成T2081B11发货 / A1681H12改制为T2353V11）
                    可选信息:
                      1. 客户到仓操作: 是否需要客户方人员到仓进行专业检测或操作（例: anker安排专业人员来检测 / anker预计今天、下周2、周三安排5位工作人员到仓做检测处理 / anker需要对商品进行检测（anker安排一位专业人员到仓做检测））
                      2. 场地及设备需求: 需要仓库提供的操作场地面积、工具、设备等（例: 需要仓库配合提供操作场地60平 / 真空机需仓库操作 / 需要winit协助提供一个临时办公桌）
                      3. 仓库人员协助: 是否需要仓库安排人员协助操作（例: 把货物下架、拉运和检测完成拉回上架的 / 另外安排一位winit员工协助拿货拆箱）
                      4. 操作时间要求: 预计到仓时间、操作时长、完成时间等（例: 需求时间：最早是5月份的最后一周 / 预计到仓时间7.23号，预计一天可以完成检测 / anker预计今天、下周2、周三安排5位工作人员到仓做检测处理）
                      5. 配件/物料提供方: 改制所需的新配件、标签等由谁提供（例: 配件、标签客户会提供 / 用最近新到的这个标签 / 将打印好的SKU贴纸（T2353V11）覆盖在原本的彩盒和外箱上）
                      6. SN码核对要求: 是否需要核对产品SN码与包装SN码一致性（例: 需核对彩盒上的SN码与扫地机盒上的SN码是否一致 / 检查墨盒标签和彩盒标签SN码相同 / 注意墨盒从哪个彩盒拿出来,就要放回原彩盒,并核对墨盒SN码与彩盒SN码相同）
                      7. 编号标记要求: 是否需要对外箱或产品进行编号标记以便追溯（例: 拿5张贴纸,对外纸箱编号(123...),一式五份写相同编号,分别贴在纸箱和套装彩盒上 / 拿7张贴纸,与套装编号相同,贴在单支彩盒白色标示位置）

                    ### 场景: 良品转不良品上架 (key: instock_good_to_defective_shelve)
                    类别: 库内
                    识别信号:
                      强信号: 良品转不良品、库存属性改成不良品、单品包装破损异常、库内待复核的非丢失类异常、复核时确认为不良品、不良品存储、上架到不良品、上架不良品
