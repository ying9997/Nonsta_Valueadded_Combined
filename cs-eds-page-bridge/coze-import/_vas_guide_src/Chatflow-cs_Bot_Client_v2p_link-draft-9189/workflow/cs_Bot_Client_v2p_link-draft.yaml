    - id: "230001"
      type: text
      title: scene_kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: "VAS 指引知识库，注入 LLM 系统提示"
      position:
        x: 6720
        y: 1650
      parameters:
        concatParams:
            - name: concatResult
              input:
                type: string
                value: |-
                    # VAS 指引 · 场景知识库（精编）

                    由 `scripts/build-vas-guide-kb-scenes.ts` 从 `internal-review-copilot/knowledge/scenario-cards` 生成。
                    筛选：`status !== retired_dedicated_atom` 且有 `requiredInfoFields`。不要手改本文件，改场景卡后重跑脚本。

                    共 32 张。贴进 Coze Text 节点，变量名 `scene_kb`。

                    匹配时看客户描述中的关键动作词 + 处理对象。优先强信号；命中排除信号则不要选该场景。

                    ### 场景: 尺重/标签辨识后换标上架 (key: inbound_label_identify)
                    类别: 入库
                    识别信号:
                      强信号: 尺重、辨识、换标、更换标签、绿标、露出的SKU、SKU对应、对应的商品条码、商品条码与包裹条码不对应、混SKU、换商品标签
                      弱信号: 贴标、补贴、贴条码、商品标签、包裹标签、SKU标签、上架、新单、新入库单
                    排除信号: 拦截不上架、先放在一边、暂存不上架、直接扫描上架、第三方箱唛已关联、称重拍照且无换标、指定商品拍照暂存、库内拍摄照片/视频、返回照片后再
                    必填信息:
                      1. 异常单号: 需要处理的异常单编号，用于定位待处理货物（例: EB0126050529243448 / EB0326080832091342 / EB0126073031771815）
                      2. 新入库单号: 换标后需要上架到的目标入库单号（例: WI50259337 / WI51678423 / WI49168085）
                      3. 商品条码对应关系: 实物条码/标签与新SKU商品条码的映射关系，用于辨识后换标（例: 0643491732601 → N6Z084BL0M/N6Z084BL1L/N6Z084BL0L / 2127902163343622 → M010000000012699046 / 6975820906631 → M010000000011392253）
                      4. 处理数量: 需要处理的包裹/箱数或件数（例: 254件商品 / 63件货物 / 163个A类包裹）
                      5. 辨识方法: 如何识别实物对应哪个SKU的具体方法，如看内标签、测量尺寸重量、扫描二维码、查看箱序等（例: 根据实际衣服内标签更换商品条码 / 根据操作说明附件内的【辨识方法】表格进行测量包裹的尺寸和重量 / 辨识外箱上的箱序，外箱上都粘贴了装箱单标签）
                    可选信息:
                      1. 包裹条码对应关系: 是否需要更换/补贴新的包裹条码标签，以及新旧包裹条码的对应关系（例: 包裹对应关系见附件 / 箱序1补贴B0400000001441165842这个Winit包裹条码标签 / 补贴新入库单外箱标）
                      2. 包装要求: 是否需要额外包装，如气泡袋等（例: 贴6977512610758商品标签+气泡袋上架 / 贴0199284482531商品标签+气泡袋上架）
                      3. 非标原因说明: 为什么无法走标准流程，需要非标处理的具体原因（例: 客户下了多个入库单，标准无法一起操作 / 异常登记数量只有1个，仓库无法操作上架 / 仓库登记异常备注数量是33件，实际仓库线下反馈过来是63件，数量有差异）
                      4. 时效要求: 是否需要在特定时间节点处理，如到仓前拦截、运输中状态等（例: 走winit头程入库的，还在运输中状态，后续到仓后，先不要上架 / 做上架前拦截）
                      5. 参考附件: 提供的辅助文件，如对应关系表格、标签PDF、辨识方法说明等（例: 包裹对应关系见附件 / 附件是新包裹标签以及商品标签 / 根据操作说明附件内的【辨识方法】表格）

                    ### 场景: 包裹类异常换商品标签上架 (key: inbound_package_exception_relabel_shelving)
                    类别: 入库
                    识别信号:
                      强信号: 包裹类异常、包裹条码正常、商品条码异常、换商品标签
                      弱信号: 补贴包裹标签、补贴商品标签、商品标签、上架、新入库单、关闭异常单
                    排除信号: 拦截不上架、先放在一边、暂存不上架、直接扫描上架、尺重辨识、绿标、指定商品拍照暂存、称重拍照、库内拍摄照片/视频
                    必填信息:
                      1. 处理范围: 需要明确处理的包裹数量、箱数或整单处理（例: 3个SKU需要补贴商品条码 / 35个包裹全部重新补贴商品条码 / 50件货物）
                      2. 新入库单号: 需要上架到的新预报单/入库单号（例: 上架到预报单：WI51519902 / 新单上WI50387161 / 原单WI51095972上架）
                      3. 商品标签数量: 需要补贴的商品标签数量，可能按SKU分别说明（例: 单品数量：30 / A110RH11==82 / 138PCS全部重新贴商品标签）
                    可选信息:
                      1. 包裹标签处理: 是否需要补贴或更换包裹标签（例: 补贴完商品条码后根据新单补贴新单的包裹条码 / 更换新的包裹条码上架货物 / 需要补贴包裹标签以及商品标签）
                      2. SKU对应关系: 多SKU时需要明确每个SKU的数量和对应关系，或说明是否随机贴（例: US1-BKZWJ-B-E15005001830=M010000000011384530=单品数量：30 / EB0126073131782987=A110RH11==82 / 包裹标签和商品标签随机贴就好。没有对应关系）
                      3. SKU识别方式: 如何区分不同SKU（如通过尺寸、SN码等）（例: 箱子测面有尺寸信息，仓库可以看尺寸信息区分SKU / 对应size:W1500*D500*H1830(mm) / 原包裹上有贴sn码，没有任何的winit标签）
                      4. 原单号: 原入库单号或预报单号（例: 原单WI49615681 / 原单WI51095972上架 / WI48841022单剩下没有登记异常的35个包裹）
                      5. 标签覆盖说明: 是否需要覆盖原有错误标签（例: 实物贴的标签是错误的，需要商品标签要覆盖新的 / WI50566982这个的包裹标签覆盖到这里 / 包裹条码被涂改导致难以分辨）

                    ### 场景: 指定商品拍照暂存 (key: inbound_photo_hold)
                    类别: 入库
                    识别信号:
                      强信号: 指定商品、拍照暂存、数字标识、暂存区、客户确认后再处理、客户确认后、返回照片后、拍正、三张实物照片
                      弱信号: 拍照、拍摄、暂存、回传照片、拍照核实、随机抽
                    排除信号: 换标后上架、拦截不上架且无拍照要求、先放在一边且无拍照要求、库内拍摄照片/视频、库存验证拍照、称重拍照、暂存一词单独出现、直接扫描上架
                    必填信息:
                      1. 拍照对象范围: 需明确拍照的包裹/箱子数量，或具体的异常单号、入库单号（例: 一共43件a+包裹 / 总5个托（68件） / EB0326062430682713等6个异常单）
