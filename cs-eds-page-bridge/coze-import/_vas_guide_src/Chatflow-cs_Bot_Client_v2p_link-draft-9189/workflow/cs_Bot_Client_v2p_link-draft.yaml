                    识别信号:
                      强信号: 重新拍照、原拍照问题、拍照不满足要求、按新要求重新拍摄、照片命名、拍照后返回上架
                      弱信号: 库内、异常编号、提交客户确认、下架拍照、原库位
                    排除信号: 入库、换标、补贴标签、辨识、质检、调拨、暂存、自提、预报、串仓
