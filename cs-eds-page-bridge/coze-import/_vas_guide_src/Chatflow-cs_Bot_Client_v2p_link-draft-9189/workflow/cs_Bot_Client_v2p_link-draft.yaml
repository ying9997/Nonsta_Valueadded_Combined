                    排除信号: 换标、更换标签、辨识、质检、拍照、下架、上架前、入库单、预报、异常
                    必填信息:
                      1. SKU编号: 需要贴标的商品SKU编号（M01开头的物料编号）（例: M010000000010703448（4件） / M010000000011875957（6件） / M010000000008149618）
                      2. 处理数量: 需要贴标的商品数量，可以是具体件数或整批库存（例: 4件 / 6件 / 20件）
                      3. 标签来源或内容: 新标签的来源（物料SKU、附件SOP、图片）或标签内容说明（例: 物料标签纸M010000000010703445-70X（1件） / 按照附件SOP操作，更替产品介绍标签 / 换成提供图片的标签）
                      4. 贴标位置或方式: 标签贴在哪里、如何贴、是否覆盖原标签等具体操作说明（例: 把新的标签覆盖原来的upc码 / 看下如图示例位置，在两边补贴贴纸封好 / 箱唛需按对应颜色关系粘贴）
                      5. 关联单号: 涉及的出库单号、入库单号或异常单号（例: 入库上架新单：WI50353745 出库下架单：WO11526888758 / WO11340729120 / EB0526062530740871 EB0526062530740874）
                    可选信息:
                      1. 对应关系规则: 当涉及多个SKU或多个标签时，需要说明一对一的对应关系（例: box1-10的sku是M010000000008149618 描述是灰色 贴 FBA15LNP1BVNU000006 至FBA15LNP1BVNU000015的FBA箱唛（灰色） / box11-15的sku是M010000000008186570描述是蓝色 贴 FBA15LNP1BVNU000001至FBA15LNP1BVNU000005的FBA箱唛（蓝色））
                      2. 标签物料数量不确定: 当标签物料库存被使用过，需要操作后清点剩余数量（例: 因为这个箱产品的库存原先有被使用过，所以不确定里面还有多少件，请按实际数量帮忙操作 / 请帮忙清点标签纸M010000000010703445-70X剩余数量，1个标签为一张，4个标签为一大张）
                      3. 新SKU编号: 贴标后需要按新的SKU编号上架（例: 按新SKU：M010000000010703448 上架）
                      4. 标签规格说明: 标签的物理规格或包装说明（例: 注意：开箱后里面是10张标签纸,标签纸是一样的无区分 / 1个标签为一张，4个标签为一大张）

                    ### 场景: 拆分SKU (key: instock_split_sku)
                    类别: 库内
                    识别信号:
                      强信号: 拆分SKU、拆分后SKU、原SKU、新SKU、拆分商品、重新装箱、补贴新SKU标签
                      弱信号: 下架、新入库单、标签文件、WINIT纸箱、上架、L007盘亏
                    排除信号: 尺重、辨识、串仓、自提、质检、无主货、换标、包裹条码、商品条码、第三方条码
                    必填信息:
                      1. 原SKU信息: 需要拆分的原SKU编码及数量（例: 拆分75件MH1818-2+8-0.5mm-1-HBY / 拆分810件MH1818-2+8-0.5mm-1-HBY / 拆分150件MH1818-2+8-0.5mm-1-HBY）
                      2. 拆分规则: 每个原SKU拆分成哪些新SKU及各自数量（例: 每个MH1818-2+8-0.5mm-1-HBY拆分成1个860014820250和1个MH1796-0.5mm-HBY / 1件199284868908-4pcs pack-----拆分成4件199284868908上架 / 每箱含 3 台带彩盒的机器 + 1 个展示架）
                      3. 新SKU标签要求: 拆分后的新SKU是否需要贴标签、贴什么标签、贴在哪个位置（例: 860014820250需要粘贴亚马逊SKU标签（标签是亚马逊SKU标签和透明计划标签合并标签，每个产品粘贴的标签不一样，要在产品最小面粘贴） / 2153654772570118需要粘贴TKSKU标签（要在产品最小面粘粘贴） / 可以直接扫描产品包装上的UPC码上架，无需贴SKU标签）
                      4. 下架单号: 原SKU从哪个下架单下架（例: 仓内下架单：WO12167537101 / 仓内下架单：WO12222421384 / 下架单号：WO12132426726）
                      5. 上架单号: 拆分后的新SKU上架到哪个入库单（例: 仓内上架单：WI51714906 / 仓内上架单：WI52269573 / 仓内上架单号：WI51450966）
                    可选信息:
                      1. 重新打包要求: 拆分后是否需要重新打包、使用什么包材、如何打包（例: 使用仓库现有合适外箱，将拆出的 3 台带彩盒的机器重新分别打包（每箱 1 台，共 3 箱） / 用仓库核实的外箱单pcs打包 / 把库内的sku拆开原包装，加到另外一个sku原包装里面，不需要额外用到我们的纸箱）
                      2. 产品摆放要求: 拆分后的配件如何摆放到新包装中（例: 同类型的配件一般叠在一起放着，比如弯板和弯板叠在一起，如果没有同类型的可以在原箱找个合适的位置放进去 / 详细可以参考附件操作说明里面的图片）
                      3. 拆分操作指引: 详细的拆分操作步骤或参考文档（例: 详细参考附件操作说明 / 参考操作指引做库内拆分成不同SKU处理 / 按附件示例方法拆分商品）
                      4. 拍照回传要求: 是否需要拍照回传拆分后的产品（例: 同时拆出来的配件产品拍个大合照回传的）
                      5. 异常单处理: 如果涉及异常单，需要关闭异常（例: 处理完成将异常单关闭 / 申请关闭异常 / 将异常EB0526062730797031的货物目前核实有6个完好的以及5个彩盒破损的）
                      6. 原SKU库存处理: 原SKU下架后如何处理库存（如盘亏）（例: 原SKU做L007盘亏）
            - name: arrayItemConcatChar
              input:
                type: string
                value: ""
        method: concat
        node_outputs:
            output:
                type: string
                required: true
                value: null
    - id: "230002"
      type: text
      title: flow_context_kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: "VAS 指引知识库，注入 LLM 系统提示"
      position:
        x: 6980
        y: 1650
      parameters:
        concatParams:
            - name: concatResult
              input:
                type: string
                value: |-
                    # 入库流程语境 · 流程复原推理背景

                    本文件为 `value-add-product-recommendation` 提供推理背景。增值服务处理的是**入库正常流程在某阶段被阻断**的异常 case，推荐 VASC 的本质是选出能**恢复流程继续走完**的增值服务。

                    ---

                    ## Section 1：通用入库阶段（与 PSC 无关）

                    所有入库单在海外仓侧都经过以下核心阶段：

                    | 阶段编号 | 阶段名称 | 正常完成的标志 | PSC 决定是否存在 |
                    |---|---|---|---|
                    | S1 | 卸货到仓 | 包裹/托盘按预约码到仓，系统记录 `PEWC`→`EWC` | 所有 PSC |
                    | S2 | 验货核对 | 开箱点数、SKU 与箱单核对通过 | 仅 OW01031/032 海外验；OW01011 在国内仓已完成；OW01021/022 由客户在发货前完成 |
                    | S3 | 上架入库 | 货物按 SKU 分区上架，状态变 `SHD` | 所有 PSC |

                    **正常流程目标**：货物经过 S1（→S2）→S3，最终完成上架存储，等待后续出库。

                    ---

                    ## Section 2：异常类型与阻断阶段

                    ### 2.1 条码类异常 → 阻断 S3（上架）

                    货物无法上架，仓库将其移至**异常暂存区**，等待客户下发增值指令。

                    | 条码异常场景 | 阻断原因 | 适用 PSC |
                    |---|---|---|
                    | 包裹条码缺失/破损/状态异常/冲突 | 扫描枪无法识别，系统无法匹配入库单 | 全部 |
                    | 商品/SKU 条码无法识别（无条码、不完整、未录入） | 无法完成商品级验收 | 全部 |
                    | 商品条码无法扫描（磨损，人工可读） | 仓库直接补打，属**操作类异常**，不需客户增值 | 全部 |

                    **结论**：条码类异常阻断上架阶段，VASC 的目的是「补/换/贴条码，使货物可重新上架」。

                    ---

                    ### 2.2 数量差异异常 → 阻断 S2 或 S3（PSC 影响责任与路径，见 Section 3）

                    | 数量异常场景 | 阻断原因 |
                    |---|---|
                    | 到货数量与入库单不符 | 无法完成验收确认，或已上架但数量有疑议 |
                    | 货物混仓（送到错误仓库） | 当前仓无对应入库单，无法上架 |

                    ---

                    ### 2.3 包装/质量异常 → 阻断 S3（上架）

                    仓库将货物移至暂存区，等待客户指令。

                    | 包装质量异常场景 | 常见处理方向 |
                    |---|---|
                    | 外包装破损/受潮/未封口 | 包装加固增值 或 销毁增值 |
                    | 商品裸装（无外包装） | 冻结上架；客户选择裸货标签或出库加包装 |
                    | 商品质量明显异常（碎裂等） | 销毁增值 |

                    **结论**：包装质量异常阻断上架阶段，VASC 的目的是「修复或处置货物，使其可上架或安全处置」。

                    ---

                    ### 2.4 尺重异常

                    - 实物尺重与系统不符 → 仓库复测后修改系统，**操作类**，无需客户增值。
                    - SKU 出库超重拦截 → 需申请「库内随机检查商品体积重量」增值服务复测。

                    ---

                    ## Section 3：PSC 差异矩阵

                    PSC 系列决定了**验货发生在哪里**，进而影响**数量差异异常的责任归属**和推荐路径。

                    ### 三条 PSC 轨道

                    | PSC 系列 | 轨道标识 | 验货阶段 | 验货位置 | 对应阶段 |
                    |---|---|---|---|---|
                    | `OW01011*` 标准头程 | `standard_firstleg` | 发货前 | Winit 国内仓 | S2 在国内已完成 |
                    | `OW01021*` / `OW01022*` 客户自验 | `self_inspection` | 发货前 | 客户自行完成（PDA/API/Excel） | S2 由客户完成 |
                    | `OW01031*` / `OW01032*` 海外验 | `overseas_inspection` | 到仓后 | Winit 海外仓开箱 | S2 是海外仓正常工序 |

                    ### 数量差异异常的 PSC 差异

                    | 维度 | `standard_firstleg` OW01011 | `self_inspection` OW01021/022 | `overseas_inspection` OW01031/032 |
                    |---|---|---|---|
                    | 验货责任方 | Winit（国内仓已验） | 客户（已自验发货） | Winit（海外仓正在验） |
                    | 数量差异的第一反应 | 优先核实 Winit 责任，可能无需增值 | 客户已确认数量，差异由客户负责，通常需申请库内盘点增值 | 验货结果即为事实，差异在验货过程中已记录，直接驱动增值或上架 |
                    | 推荐路径 | **先转 `inbound-exception-check` 核实**；如核实后确需增值，再推荐 | 推荐「库内盘点」类 VASC | 视验货结论推荐对应 VASC |
                    | 是否直接给 VASC | 慎重；建议先核实责任 | 是 | 是 |

                    ### 条码/包装异常的 PSC 差异

                    | PSC 轨道 | 条码类异常 | 包装质量异常 |
                    |---|---|---|
                    | `standard_firstleg` | VASC 贴标/换标 | VASC 包装加固/销毁 |
                    | `self_inspection` | 同上 | 同上 |
                    | `overseas_inspection` | 同上（在海外验过程中发现）| 同上 |

                    > 条码类和包装质量异常的推荐路径在三条 PSC 轨道上一致。差异仅影响数量差异异常。

                    ---

                    ## Section 4：流程复原目标速查

                    | 客户意图 | 流程复原目标 | 对应阶段 |
                    |---|---|---|
                    | 原单上架 | 修复异常后，使原入库单的货物完成 S3 上架 | S3 恢复 |
                    | 新单上架 | 原单无法继续操作，重新创建入库单并上架 | S1→S3 重走 |
                    | 销毁 | 货物无上架价值，通过增值服务安全销毁处置 | S3 替代路径 |
                    | 自提 | 客户自行取走货物，不走正常上架流程 | S3 替代路径 |
                    | 拍照/测量/质检 | 对货物做存证或检验，辅助后续决策 | S2/S3 辅助 |
                    | 补/换条码 | 修复条码异常，使货物满足上架扫描要求 | S3 前置修复 |
            - name: arrayItemConcatChar
              input:
                type: string
                value: ""
        method: concat
        node_outputs:
            output:
                type: string
                required: true
                value: null
    - id: "230003"
      type: text
      title: inference_rules_kb
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-StrConcat-v2.jpg
      description: "VAS 指引知识库，注入 LLM 系统提示"
      position:
        x: 7240
        y: 1650
      parameters:
        concatParams:
            - name: concatResult
              input:
                type: string
                value: |-
                    # VAS 指引 · 推断规则（客户侧精简）

                    由 `vas/engine/prompts/kb-inference-rules.md` 与 `kb-decision-system-prompt.md` 合并精简。已去掉产品编码。贴进 Coze Text 节点，变量名 `inference_rules_kb`。

                    ## 使用原则

                    - 从客户描述中主动推断处理方式，帮客户选，不列选项让客户自己选。
                    - 不编造客户没说过的单号、数量、附件。
                    - 不报价、不承诺审核结果、不描述仓库内部操作。
                    - 标准「入库商品拍照」已失效：客户要拍照时，引导到「非标拍照或提供视频 / 指定商品拍照暂存 / 库内拍摄照片视频」等场景卡路径，不要推荐已失效的标准拍照产品。
                    - 「库内商品拍照」实际不支持，不要当标准产品推荐。
                    - 客户意图不清、或多方案冲突时：追问或转人工，不要直接给唯一方案。

                    ## 推断规则

                    | 规则ID | 关键词 | 推断处理方式 | 后续动作 | 附加条件 |
                    |--------|--------|--------------|----------|----------|
                    | IR-B0102E23-001 | 拍照、确认状态、看看有没有问题 | 先拍照 | 入库非标拍照或提供视频；按场景卡追问拍摄要求 | 不要推荐已失效的标准入库商品拍照 |
                    | IR-B0102E23-002 | 换包装、换纸箱、换箱子 | 原单上架 | 若客户未提新建入库单，按原单上架 / 标准换包装理解 | 客户未提新单 |
                    | IR-B0102E23-003 | 新建入库单、重新创建、换一个入库单 | 新单上架 | 必须追问新的上架入库单号 | 新单需同仓（有仓信息时才核） |
                    | IR-B0102E23-004 | 销毁、不要了、报废 | 销毁 | 上架前销毁类路径 | 危化/DG 见下方免审命名服务 |
                    | IR-B0102E23-005 | 取回、自提、拿走 | 自提 | 上架前自提 | — |
                    | IR-B0102E23-006 | 空 / 无稳定线索 | 无法推断 | 追问：您希望怎么处理这批货？ | 不得直接给唯一方案 |
                    | IR-B03E03-001 | 订单外商品、计划外商品、多货 | 先看描述是否已明确实物归属和去向 | 描述已明确则推断；模糊才追问「条码对不对、走原单还是新单」 | 意图不清时不直接推荐 |
                    | IR-B03E03-002 | 新单、重新下单、下新入库单、换新单上架 | 新单上架 | 追问新入库单号 | — |
                    | IR-B03E03-003 | 销毁、不要、报废 | 销毁 | 上架前销毁 | — |
                    | IR-B03E03-004 | 自提、取回、拿走 | 自提 | 上架前自提 | — |

                    ## 客户侧分流（route_category）

                    - 客户描述命中**标准增值**（轻加工、换纸箱/加固、标准贴标、原单直接上架等，且不需要非标特批）→ `route_category="standard"`。告诉客户回页面选对应标准产品，不必生成非标需求描述。
                    - 命中**命名非标免审**（A 类：货权转移、审计盘点、代采购包材、DG 商品销毁；场景卡里同类命名服务一并视为免审）→ `route_category="nonstandard_exempt"`。告知选对应命名产品即可，仍按场景卡检查必填信息。
                    - 命中**有模板的非标场景**（B 类：场景知识库里带必填信息的换标/拍照暂存/批量补贴等）→ `route_category="nonstandard_special"`。信息齐全后生成需求描述和需求背景说明。
                    - **无法匹配 / 无模板 / 查快递运单等超出范围** → `route_category="transfer_human"`，phase="transfer_human"。

                    ## 禁止事项

                    - 禁止把关键词命中当成可以越过场景卡必填检查的依据。
                    - 禁止在多方案且客户意图不清时直接输出唯一推荐。
                    - 禁止输出未在对话中出现的字段值。
                    - 禁止向客户展示内部规则编号或产品编码。
            - name: arrayItemConcatChar
              input:
                type: string
                value: ""
        method: concat
        node_outputs:
            output:
                type: string
                required: true
                value: null
