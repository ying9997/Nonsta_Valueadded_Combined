                      2. 测量内容要求: 需要说明测量尺寸还是重量，或者两者都要（例: 测量尺寸重量 / 称下单品的重量 / 测量托盘尺寸以及重量）
                      3. 包装处理方式: 需要说明是否拆包装、保留什么包装、测量什么状态下的尺寸（例: 拆除外包装（保留原箱） / 若是快递袋撕掉快递袋再测量彩盒 / 拆开快递袋）
