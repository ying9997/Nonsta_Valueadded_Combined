                      1. 包装层级关系: 说明包中包的具体结构，如大箱-中箱-单品的层级关系（例: 包中包场景，需明确拆哪个包 / 大箱内还有中箱 / 外箱没有包裹条码，里面的产品每个SKU都用袋子单独装起来了）
                      2. 拆箱原因: 说明为什么需要拆箱：标签无法扫描、包装破损、出库需按单品出、工厂合并打包等（例: 彩盒上有缠膜，标签无法扫描 / 快件破损，原包裹规格6个装，包裹破损丢失1个产品 / 被工厂合并打包了）
                      3. 拆后垃圾处理: 拆除的包装材料如何处理：销毁、压平收集等（例: 如果有盒子的都销毁掉外面的盒子 / 拆除另外一边的地脚找一个和柜子底面积差不多的托盘放上去）
                      4. 操作后拍照反馈: 要求操作完成后拍照确认（例: 操作完成后选3pcs拍照反馈 / 对应重新打托前拍个照片返回的）
                      5. 异常单处理: 涉及异常单时需要关闭异常或变更状态（例: 将异常单状态变更为仓库已完成，关闭异常单 / 上架完成后关闭异常 / 关闭异常单）

                    ### 场景: 商品拆箱加/减配件 (key: instock_add_remove_accessories)
                    类别: 库内
                    识别信号:
                      强信号: 拆箱、加配件、减配件、还原包装、在库SKU、封箱
                      弱信号: 下架、上架原库位、工时费、销毁费
                    排除信号: 入库预报、到货、换标、补贴标签、质检、串仓、辨识、拍照、自提、调拨
                    必填信息:
                      1. 处理数量: 需要明确处理多少件/套产品（例: 总1028件产品需要返工处理 / P010018508BUK 47个 P010018408BUK 77个 / 50套错误的产品）
                      2. 加减配件操作说明: 需要说明具体加什么配件、减什么配件、如何操作（例: 拆开包裹，取出里面的充电器，并弃置该充电器；将USB线（SKU：P060044701）放进包裹中 / 把其中错误的2个零件替换掉 / 更替产品介绍标签）
                      3. 原SKU信息: 需要明确原来的SKU或M码（例: P010018508BUK 47个 P010018408BUK 77个 / X004XH2041对应M码：M010000000011757224 / M010000000009973294（100件））
                      4. 新SKU信息: 操作完成后按什么SKU上架（例: P010018508BUK 对应导出 P010018508B 条形码 / 更换为新产品标签：X0054Z3TB9 / 按新SKU：M010000000011875957 上架）
                      5. 配件来源: 需要说明加的配件从哪里来（仓库已有、客户寄送等）（例: 正确的零件已经在USKY3仓库了【商品编码：YBD832-PJ001 对应M码：M010000000010678378】 / 物料标签纸M010000000010703445-70X （1件，注意：开箱后里面是136张标签纸，只需要用100张） / 工具以及新的螺丝已经寄到仓库）
                      6. 减配件处理方式: 拆下来的配件如何处理（销毁、上架、退回等）（例: 换下来的错误零件直接弃置 / 操作完成后A齿轮可销毁 / 拆下来的配件如要贴标上架则按贴标0.35USD/件收取）
                    可选信息:
                      1. 操作SOP文档: 提供详细的操作步骤文档或视频（例: 更换配件可以看提供excel表格，里面有详细步骤，也可以看上传的视频 / 按照附件SOP操作 / 操作sop见附件）
                      2. 标签更换要求: 是否需要更换产品标签、标签格式、贴法等（例: 换标操作：系统导出对应新SKU的产品标签并换标 / 标签已上传，标签格式60*40mm / 补贴两张标签）
                      3. 外箱标签要求: 是否需要更换外箱标签、箱唛（例: 外箱标签需要将50套产品全部更换好配件和标签后给我装箱的数量和尺寸、重量；我再提供外箱标签 / 附件有上传新单箱唛PDF，麻烦新单上加）
                      4. 操作时间要求: 是否有操作时效要求（例: 返工计划7个工作日内完成）
                      5. 场地/工具需求: 是否需要仓库提供场地、桌子等辅助资源（例: 需要仓库提供3张桌子，以及（200平）场地，返工使用工具包自备）
                      6. 剩余物料处理: 操作后剩余的物料如何处理（例: 标签纸M010000000010703445-70X 剩下（36张）1件，与更替产品介绍标签的货物M010000000011875957（100件），新单上架 / 标签纸M010000000010703445-70X 剩下（10张）1件）

                    ### 场景: A+包裹更换标签上架 (key: instock_aplus_parcel_relabel_shelve)
                    类别: 库内
                    识别信号:
                      强信号: A+包裹、更换标签、B040、补贴商品标签
                      弱信号: 标签异常、条码更换、入库单、包裹条码、新入库单、箱产品、按箱产品、重新装箱、整箱出库、误下为A包裹
                    排除信号: 尺重、辨识、串仓、调拨、自提、质检、拍照、暂存、下架、无主货、错装
                    必填信息:
                      1. 新入库单号: 需要上架到的目标入库单号（WI开头）（例: WI50817546 / WI52192112 / WI49560098）
                      2. 原单据号: 原退货单号、原入库单号或异常单号，用于定位需要处理的包裹（例: RT16000300942691CN / WI51878253 / EB0126042429047371）
                      3. 处理范围: 需要处理的包裹数量或SKU信息（例: 4个sku / 8个包裹都是同个sku / 里面有产品CLY206数量1,CLY141数量3）
                    可选信息:
                      1. 是否需要补贴商品标签: 明确是否需要在更换A+包裹标签后补贴商品条码标签（例: 单品条码重新补贴上架 / 补贴A+包裹条码标签 / 需重新补贴A+包裹条码）
                      2. 标签对应关系: 当有多个SKU时，如何对应粘贴标签（例: 参考实物上的M码对应粘贴即可）
                      3. 拆箱/重新装箱要求: 是否需要拆箱分别上架或重新装箱（例: 拆箱上架到新入库单号 / 需要重新装箱到5号箱，空出部分需要装填气泡填充物）
                      4. 异常原因说明: 为什么需要更换标签的背景原因（例: 下单误下为A包裹，实际是需要整箱出库的 / A+包裹条码错误贴成A包裹条码 / 库内丢失了2pcs）
                      5. 关闭异常单要求: 完成后是否需要关闭相关异常单（例: 上架完成后关闭异常单EB0126042429047371）

                    ### 场景: 商品外观辨识+贴标上架 (key: instock_appearance_identify_label)
                    类别: 库内
                    识别信号:
                      强信号: 外观辨识、条码辨识、开箱辨识、辨识方法、辨识结果、库内商品、确认商品身份、辨识后贴标
                      弱信号: 示例图片、实物照片、型号特征、颜色尺寸、吊牌标签、比对、左边、右边、分别贴、漏气、不漏气、加快递袋、错装、按实际SKU
                    排除信号: 入库预报、到货、收货、串仓、调拨、整柜、尺重、无主货、第三方条码、换入库单
                    必填信息:
                      1. 辨识对象范围: 需要明确辨识哪些商品，通过SKU/商品条码/包裹码/入库单号等方式指定（例: M010000000005116232 单品化管理，共计27个 / M010000000010461098，M010000000010461100 / 入库单：WI49579205 包裹码：B0400000001405265238...）
                      2. 辨识方法/依据: 如何识别商品身份，包括外观特征、条码位置、标签信息、示例图片等（例: 正确商品为：1个插口，错误商品为2个插口 如示例图片 / M010000000010461098该sku的货物彩盒背面写着Blue字样 / 通过外箱是否有商品条码辨识包裹为A包还是A+包）
                      3. 辨识后处理动作: 辨识完成后对不同结果的商品如何处理（换标/上架/盘亏/弃置等）（例: 1个插口正确商品正常返仓上架，2个插口错误商品数量盘亏并更换产品标签 / sku信息正确则上架回原sku，sku错误则更换标签后上架 / 如是B07PYNHJSW，粘贴M010000000006335546的A+包裹条码标签返架）
                      4. 新入库单号: 辨识后商品需要上架到的目标入库单号（例: 入库单：WI49853198 上架 / 上架到新入库单：WI49359694 / 新入库仓内上架单：WI50004608）
                      5. SKU对应关系: 辨识结果与正确SKU/商品条码的对应关系（例: 更换产品标签为：TX1-4602863AB-9+3PIN-1 M010000000005116220 / 左侧大孔对应sku：D2.QCLMZQ46.H-LH - M010000000006719869 / M010000000006335546对应的正确FNSKU条码应为B07PYNHJSW）
                    可选信息:
                      1. 是否开箱: 是否需要拆开外箱或包裹进行辨识（例: 拆箱拍产品实物照 / 需打开B0400000001420000672、B0400000001420000685、B0400000001420000690三只A包 / 找包裹并拆包辨识）
                      2. 拍照要求: 是否需要拍摄实物照片及具体拍照要求（例: 每款商品至少拍摄 1 张实物照片 / 拍外箱标签+箱内产品实物照：两款SKU产品每箱都要拍这两种照片 / 每箱拍一张照片，证明混装即可）
                      3. 异常处理方式: 辨识过程中发现异常如何处理（例: 不一致的场景下直接登记库内异常商品错装 / 辨识到错装的仓库就登记错装异常，客户根据异常单处理 / 若发现存在屏幕破损、脱落等影响产品正常销售的情况，则将破损商品替换）
                      4. 包装加固要求: 辨识后是否需要对商品进行特殊包装处理（例: 将其中完好的产品使用气泡膜等软性填充物把屏幕顶部填充满，防止屏幕受到伤害）
                      5. 辨识结果反馈要求: 需要反馈哪些辨识结果信息（例: 反馈正确和错误商品数量 / 登记具体的商品明细（每个SKU分别是什么均有多少件）反馈到异常群 / 增值完成需反馈辨识结果和数量）
                      6. 下架单号: 如需先下架再辨识，提供的下架出库单号（例: 下架出库单号（单号：WO12168077473） / 出库下架单：WO11454159870 / 出库下架单：WO11454918423）

                    ### 场景: 异常重新拍照 (key: instock_exception_rephoto)
