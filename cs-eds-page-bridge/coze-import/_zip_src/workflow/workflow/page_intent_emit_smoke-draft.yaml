      title: 结束
      icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-End-v2.jpg
      description: 工作流的最终节点，用于返回工作流运行后的结果信息
      position:
        x: 960
        y: 0
      parameters:
        terminatePlan: returnVariables
        node_inputs:
            - name: should_send
              input:
                type: boolean
                value:
                    path: should_send
                    ref_node: "110001"
            - name: function_name
              input:
                type: string
                value:
                    path: function_name
                    ref_node: "110001"
            - name: arguments
              input:
                type: string
                value:
                    path: arguments
                    ref_node: "110001"
            - name: skip_reason
              input:
                type: string
                value:
                    path: skip_reason
                    ref_node: "110001"
            - name: sidecar_intact
              input:
                type: boolean
                value:
                    path: sidecar_intact
                    ref_node: "110001"
            - name: turn_kind
              input:
                type: string
                value:
                    path: turn_kind
                    ref_node: "110001"
