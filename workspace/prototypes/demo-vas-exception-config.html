      }
      html += `<td class="scene-desc">${scene.desc} <button class="scene-edit-btn" onclick="openConditionModal(${ei},${si})">编辑条件</button></td>`;
      html += `<td><button class="link-btn" onclick="openPlanModal(${ei},${si})">处理方案</button></td>`;
      html += '</tr>';
    });
  });
  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;
}

function openConditionModal(ei, si) {
  const scene = EXCEPTIONS[ei].scenes[si];
  document.getElementById('condDesc').value = scene.desc;
  let tbody = '';
  if (scene.conditions.length === 0) {
    tbody = '<tr><td colspan="6" style="text-align:center;color:#999;padding:16px;">暂无条件配置，点击「新增」添加</td></tr>';
  } else {
    scene.conditions.forEach((c, ci) => {
      tbody += `<tr>
        <td><select style="width:40px;"><option></option></select></td>
        <td><select class="cond-table select"><option>${c.field}</option><option>增值单下单入口</option><option>异常单是否关联入库单</option><option>入库单类型</option><option>商品等级</option></select></td>
        <td><select class="cond-table select"><option>${c.op}</option><option>等于</option><option>不等于</option><option>包含</option></select></td>
        <td><span class="val-tag">${c.value} <span class="x">×</span></span></td>
        <td><select class="cond-table select" style="min-width:70px;"><option>${c.rel || ''}</option><option>并且</option><option>或者</option><option></option></select></td>
        <td><span class="del-link">删除</span></td>
      </tr>`;
    });
  }
  document.getElementById('condBody').innerHTML = tbody;
  document.getElementById('condExpr').textContent = scene.expr || '(暂无表达式)';
  document.getElementById('conditionModal').style.display = 'flex';
}

function closeConditionModal() {
  document.getElementById('conditionModal').style.display = 'none';
}

function openPlanModal(ei, si) {
  const exc = EXCEPTIONS[ei];
  const scene = exc.scenes[si];
  document.getElementById('planModalTitle').textContent = `处理方案 - ${exc.name}【${scene.desc}】`;
  let html = '<table class="plan-table"><thead><tr><th>方案</th><th>增值产品</th><th>增值原子</th><th>处理方式</th></tr></thead><tbody>';
  scene.plans.forEach(p => {
    html += `<tr><td class="plan-no">${p.no}</td><td><span class="product-tag ${TAG_CLASSES[p.tag]}">${p.product}</span></td><td>${p.atom}</td><td>${p.method}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('planModalBody').innerHTML = html;
  document.getElementById('planModal').style.display = 'flex';
}

function closePlanModal() {
  document.getElementById('planModal').style.display = 'none';
}

renderTable();
</script>
</body>
</html>
