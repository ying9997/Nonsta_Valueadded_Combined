<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方案二 - 表单右侧伴随式 AI 指引列</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#1f2329;font:14px/1.5 Arial,"Microsoft YaHei",sans-serif}.page{max-width:1280px;margin:0 auto;padding:16px 20px 40px}.notice{background:#fff7e6;border:1px solid #ffd591;padding:8px 12px;border-radius:4px;margin-bottom:10px}.steps{display:flex;gap:8px;margin:8px 0 12px}.step{padding:6px 12px;border-radius:16px;background:#e8eaed;color:#646a73}.step.active{background:#8a5a2b;color:#fff}.card{background:#fff;border:1px solid #dee0e3;border-radius:6px;margin-bottom:10px}.card-h{padding:10px 12px;border-bottom:1px solid #eff0f1;font-weight:700}.card-b{padding:12px}.layout{display:grid;grid-template-columns:minmax(720px,1fr) 330px;gap:12px;align-items:start}.compact-grid{display:grid;grid-template-columns:190px 1fr 230px 100px;gap:8px}.field{display:grid;grid-template-columns:112px 1fr;gap:6px;align-items:start;margin-bottom:7px}.field label{font-weight:600;color:#4e5969}.field input,.field textarea,.ai-panel textarea{width:100%;border:1px solid #c9cdd4;border-radius:4px;padding:6px 8px}.field textarea{min-height:54px;resize:vertical}.service-list label{display:block;margin-bottom:8px}.file-btn{display:block;width:100%;margin-bottom:6px;border:1px solid #c9cdd4;background:#fff;border-radius:4px;padding:6px}.hint{font-size:12px;color:#d46b08}.price{font-size:13px;color:#7b4d24}.ai-panel{border:1px solid #2f6b55;background:#f6fffb;border-radius:6px;padding:12px}.ai-title{font-weight:700;margin-bottom:4px}.meta{font-size:12px;color:#646a73}.btn{border:1px solid #c9cdd4;background:#fff;border-radius:4px;padding:6px 10px;cursor:pointer}.btn.primary{background:#2f6b55;color:#fff;border-color:#2f6b55}.btn[disabled]{opacity:.45}.actions,.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.result{background:#fff;border:1px solid #b7e4cf;border-radius:4px;padding:10px;margin-top:8px}.tag{display:inline-block;background:#e7f8ef;color:#17623f;border-radius:12px;padding:2px 8px;font-size:12px}.requirement{background:#fffbe6;border:1px solid #ffe58f;border-radius:4px;padding:8px;margin-top:6px}.bottom{display:flex;justify-content:center;gap:8px;margin-top:12px}@media(max-width:1100px){.layout,.compact-grid{grid-template-columns:1fr}.field{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="page">
  <div class="notice">检测到您的账号未绑定微信账号，为给您提供更便捷的服务，请尽快绑定微信。</div>
  <div class="steps"><span class="step">1 基础信息</span><span class="step active">2 增值产品信息</span><span class="step">3 确认提交</span></div>
  <div class="layout">
    <section class="card">
      <div class="card-h">增值产品信息</div>
      <div class="card-b compact-grid">
        <div data-guide-point="vasc-selector"><div class="meta">增值产品</div><strong>入库非标增值（特批）</strong><div class="service-list" style="margin-top:10px"><label><input type="checkbox"> 包裹串仓异常调拨</label><label><input type="checkbox" checked> 入库其他服务需求</label></div></div>
        <div data-guide-point="service-requirements"><div class="field"><label>包裹条码</label><input></div><div class="field"><label>商品条码</label><input></div><div class="field"><label>上架入库单号</label><input></div><div class="field"><label>需求描述</label><textarea id="vaAtoms_OW01V1602_attributes_VAS_ATTR_REL_RD_attributeValue" data-bind-field="description"></textarea></div><div class="field"><label>需求背景说明</label><textarea id="vaAtoms_OW01V1602_attributes_BEOR_attributeValue" data-bind-field="background"></textarea></div></div>
        <div data-guide-point="attachment-area"><button class="file-btn" id="vaAtoms_OW01V1602_vasFiles_VAS_ATTR_REL_AOOI">操作说明附件</button><div id="attachmentHint" class="requirement">等待 AI 给出附件要求。</div><button class="file-btn">商品和标签的对应关系</button><button class="file-btn">包裹和标签的对应关系</button><button class="file-btn">标签文件</button><div class="hint">仅支持 DOC、PDF、XLS、XLSX、图片或压缩包等格式。</div></div>
        <div class="price">以实际报价为准。</div>
      </div>
    </section>
    <aside class="ai-panel" data-guide-point="ai-right-companion-column">
      <span class="tag">右侧伴随列</span>
      <div class="ai-title">AI 非标填写助手</div>
      <div class="meta">方案二：同屏右侧列承载指引，不遮挡表单，适合边填边看。</div>
      <textarea id="customerInput" placeholder="描述希望仓库怎么处理"></textarea>
      <div class="chips"><button class="btn" data-sim-route="2d">2d</button><button class="btn" data-sim-route="2a">2a</button><button class="btn" data-sim-route="2b">2b</button><button class="btn" data-sim-route="low">低置信</button><button class="btn" data-sim-route="unknown">unknown</button><button class="btn primary" id="askAi">判断</button></div>
      <div id="aiResult" class="result">默认空态：点击判断后生成 pageActions。</div>
      <div id="actionBar" class="actions"></div>
    </aside>
  </div>
  <div class="bottom" data-guide-point="bottom-actions"><button class="btn">上一步</button><button class="btn">保存草稿</button><button class="btn primary">提交</button></div>
</main>
<script>
// 本期不做：不接真实接口、不跨页面持久化、不自动提交、不做视频 SOP 解析、不做复杂附件内容识别、不估价。
const pageContext={eventNo:"EVENT_DEMO_001",path:location.pathname},storageKey=`nonstandard_ai:${pageContext.path}:${pageContext.eventNo}`,thresholds={matched:.82,partial:.62};let simRoute="2b";
document.querySelectorAll("[data-sim-route]").forEach(b=>b.onclick=()=>{simRoute=b.dataset.simRoute;runAi();});document.getElementById("askAi").onclick=runAi;
function fieldActions(){return[{action:"fill_field",target:"vaAtoms_OW01V1602_attributes_BEOR_attributeValue",label:"填入背景",enabled:true,scope:"phase1",payload:{fieldKey:"background"}},{action:"fill_field",target:"vaAtoms_OW01V1602_attributes_VAS_ATTR_REL_RD_attributeValue",label:"填入描述",enabled:true,scope:"phase1",payload:{fieldKey:"description"}},{action:"copy_text",target:"aiResult",label:"复制建议",enabled:true,scope:"phase1",payload:{}}];}
function makeState(route){const base={conversationId:"conv_"+pageContext.eventNo,lifecycleState:"active",savedAt:Date.now(),path:pageContext.path};if(route==="2d")return{...base,route:"2d_standard_redirect",selectedVasc:{vascCode:"VASC_STD_001",vascName:"入库商品换标",vascType:"standard"},selectedService:{},fieldSuggestions:{background:"",description:""},pageActions:[{action:"show_redirect_notice",target:"aiResult",label:"复制标准建议",enabled:true,scope:"phase1",payload:{value:"建议返回标准增值路径选择入库商品换标。"}}]};if(route==="2a")return{...base,route:"2a_named_nonstandard_direct",selectedVasc:{vascCode:"VASC_NONSTD_001",vascName:"入库非标增值（特批）",vascType:"nonstandard"},selectedService:{serviceCode:"OW01V1555",serviceName:"包裹串仓异常调拨"},fieldSuggestions:{background:"发现包裹串仓异常，需要仓库按异常单定位并执行调拨处理。",description:"请按包裹串仓异常调拨服务项处理，核对包裹条码、目标入库单和调拨范围后执行。"},pageActions:fieldActions()};if(route==="unknown")return{...base,route:"manual_fallback",selectedVasc:{vascCode:"UNKNOWN_VASC",vascName:"未知增值产品",vascType:"unknown"},selectedService:{serviceCode:"UNKNOWN_SERVICE",serviceName:"未知服务项"},sopMatch:null,fieldSuggestions:{background:"",description:""},pageActions:[{action:"show_manual_fallback",target:"aiResult",label:"转人工确认",enabled:true,scope:"phase1",payload:{value:"候选类型无法自动确认（vascType=unknown），请联系客服或人工选择增值产品和服务项。"}}]};const score=route==="low"?.48:.88,matchState=score>=thresholds.matched?"matched":score>=thresholds.partial?"partial":"none";return{...base,route:"2b_other_service_sop",selectedVasc:{vascCode:"VASC_NONSTD_001",vascName:"入库非标增值（特批）",vascType:"nonstandard"},selectedService:{serviceCode:"OW01V1602",serviceName:"入库其他服务需求"},sopMatch:{matchState,matchConfidence:score},fieldSuggestions:matchState==="none"?{background:"",description:""}:{background:"到仓商品条码与系统登记信息不一致，需要仓库按客户提供的条码对应关系处理后上架。",description:"请根据附件中的实物条码与新商品条码对应关系补贴新标签，并上架到指定新入库单。客户确认不等于审核通过。"},attachmentRequirements:["实物条码与新商品条码对应关系文件","新商品标签文件"],pageActions:matchState==="none"?[{action:"show_attachment_check_warning",target:"aiResult",label:"按模板补充",enabled:true,scope:"phase1",payload:{value:"低于阈值，按 SOP 模板继续追问。"}}]:fieldActions()};}
function runAi(){aiResult.textContent="AI 正在判断，预计 3-5 秒。";setTimeout(()=>render(makeState(simRoute)),500)}function render(s){localStorage.setItem(storageKey,JSON.stringify(s));actionBar.innerHTML="";aiResult.innerHTML=s.route==="manual_fallback"?`<b>人工兜底</b><br>vascType=unknown，无法自动分流。请联系客服或人工确认服务项。`:s.route==="2d_standard_redirect"?`<b>标准纠偏</b><br>vascType=${s.selectedVasc.vascType}，建议返回 ${s.selectedVasc.vascName}。`:s.route==="2a_named_nonstandard_direct"?`<b>命名非标直选</b><br>${s.selectedService.serviceName}，不进入 SOP 长追问。`:`<b>${s.sopMatch.matchState==="none"?"低置信兜底":"其他服务需求 + SOP"}</b><br>matchState=${s.sopMatch.matchState}，matchConfidence=${s.sopMatch.matchConfidence}。`;attachmentHint.innerHTML=(s.attachmentRequirements||[]).map(x=>"· "+x).join("<br>")||"等待 AI 给出附件要求。";s.pageActions.forEach(a=>{const b=document.createElement("button");b.className="btn";b.textContent=a.label;b.disabled=!a.enabled;b.onclick=()=>consume(a,s);actionBar.appendChild(b);});}
function consume(a,s){if(a.action==="fill_field"){const el=document.getElementById(a.target);if(el)el.value=s.fieldSuggestions[a.payload.fieldKey]||"";}else navigator.clipboard&&navigator.clipboard.writeText(a.payload.value||JSON.stringify(s.fieldSuggestions));}
</script>
</body>
</html>
