              - name: spCurrentTime
                input:
                    type: boolean
                    value: false
              - name: spAntiLeak
                input:
                    type: boolean
                    value: false
              - name: thinkingType
                input:
                    type: string
                    value: disabled
              - name: responseFormat
                input:
                    type: integer
                    value: "0"
              - name: enableChatHistory
                input:
                    type: boolean
                    value: false
              - name: chatHistoryRound
                input:
                    type: integer
                    value: "3"
